version: 2
# Auto-PRs for the ecosystems Dependabot natively understands. The rest are swept
# manually by the `dependency-update` skill, on purpose:
#   - conda (tools/ml, tools/in_silico): Dependabot has no conda ecosystem; a
#     pip-on-conda shim would fight tools/in_silico/conda-lock.yml (the pin the
#     EBFC paper's DFT ran on) — reproducibility beats auto-bumps there.
#   - firmware submodules (firmware/extern/*): not Dependabot-native; bumped on the
#     firmware bench cadence, gated by host CMSIS / QEMU bit-parity.
# labels: type:deps = the SSOT Integrity Guard's (00_06 §3) sanctioned bypass —
#     a dep bump touching a protected area (contracts/) is not an architecture change.
updates:
- package-ecosystem: bundler
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - "type:deps"
- package-ecosystem: docker       # Dockerfile base image (ruby) — tag + digest
  directory: "/"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - "type:deps"
- package-ecosystem: github-actions
  # Bare "/" only scans .github/workflows — the composite action's pins drift
  # silently without its own directory entry.
  directories:
  - "/"
  - "/.github/actions/setup-rails-test"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - "type:deps"
- package-ecosystem: npm           # contracts/: @openzeppelin/contracts, forge-std
  directory: "/contracts"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - "type:deps"
- package-ecosystem: npm           # subgraph/: @graphprotocol/graph-cli + graph-ts
  # [OPS.35] Заведено 2026-08-27 разом із присудом «прийняти dev-scope-експозицію».
  # 🔴 Ця директорія — НОСІЙ того присуду, а не гігієна. Присуд стоїть на вимірі
  # «upstream не лікує»: `graph-cli@0.98.1` = `latest` у npm, і навіть `0.99.0-alpha`
  # тягне той самий `decompress@^4.2.1`. Підстава такого роду («події ще не сталось»)
  # не помирає нічим, окрім самої події — тобто релізу, що знімає транзитивне дерево.
  # Без цього запису алерти приходили б і далі (security-скан репо-широкий і
  # `directory:` не знає), а КАНАЛ, яким прийде фікс, не існував би — і присуд
  # «прийняти» тихо став би «прийняти назавжди».
  # Прецедент проти тієї самої форми стоїть двома записами вище: `github-actions`
  # дістав власний `directories:`-рядок саме тому, що без нього пін дрейфував мовчки.
  directory: "/subgraph"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - "type:deps"
- package-ecosystem: terraform     # terraform/: google + akash providers
  directory: "/terraform"
  schedule:
    interval: weekly
  open-pull-requests-limit: 10
  labels:
  - "type:deps"
