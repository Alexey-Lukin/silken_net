# Trivy secret-config для `Sec · Image CVE Scan` — воркфлоу передає його через
# `TRIVY_SECRET_CONFIG` (image_cve_scan.yml). ⚠️ Секрет-сканер у тому скані —
# ДЕФОЛТ `scan-type: image`, а не окремий вибір; предмет його там — НАШІ секрети
# в ПУБЛІЧНОМУ образі (INF.2).
#
# allow-rule `registry-gem-sources` — підстава КОНТЕЙНЕРНА й правдива для
# кожного члена (guard-craft #102): у `usr/local/bundle/ruby/<abi>/gems/` лежать
# реєстрові геми ПЛЮС артефакти їх збірки в нашій build-стадії (нативні
# розширення збираються в `gems/<gem>/ext/`; `rbsecp256k1` ще й тягне туди архів
# libsecp256k1 з GitHub під SHA-256) — а `bundle install` біжить БЕЗ жодного
# секрету в оточенні (build-стадія Dockerfile: лише RAILS_ENV і BUNDLE_*), тож
# нашого секрету там бути не може. ⚠️ Першу редакцію цієї підстави («лише байти з
# rubygems.org») спростовано адверсарним ревʼю 2026-09-26; вердикт стоїть на цій.
# ⛔ Вона впаде, щойно `bundle install` дістане секрет (приватне джерело гемів,
# `--mount=type=secret`) — тоді правило звужують або знімають.
# Виміряна історія класу — два геми, нуль справжніх: `aws-sdk-core` (приклади JWT
# у коментарях `aws-sdk-ssooidc/client.rb`; алерт GitHub ключується правилом і
# шляхом, а шлях несе версію гема, тож dismissal не тримається — #348–351,
# створені 08-27 і погашені 09-05, повернулись 2026-09-22 як #361–364 після бампу
# SDK) і `capybara` (тестовий ключ).
# ⛔ Свідомо НЕ дозволено (JWT-контроль у кожному, виміряно 2026-09-26):
# `usr/local/bundle/config` — туди лягають креденшели Bundler; і
# `usr/local/bundle/ruby/<abi>/bundler/gems/` — git-геми (їх зараз нема, але
# джерело не реєстр). Розширюючи шлях, збережи обидва контролі видимими.
# Канон: 06_07 §1a.
allow-rules:
  - id: registry-gem-sources
    description: "Registry gem sources (public on rubygems.org) — never our secret"
    path: '^/?usr/local/bundle/ruby/[^/]+/gems/'
