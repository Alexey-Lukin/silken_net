# PR Auto-Labeler
#
# Applies cluster + module labels to pull requests based on changed file paths.
# Config: .github/labeler.yml
# Doc reference: docs/00_05_GitHub_Projects_and_IaC_Automation.md §2.6.

name: Ops · PR Labeler

on:
  pull_request_target:
    types: [opened, reopened, synchronize]

# Top-level least-privilege floor; the job elevates only pull-requests:write.
permissions: {}

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - uses: actions/labeler@f27b608878404679385c85cfa523b85ccb86e213 # v6
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: true
