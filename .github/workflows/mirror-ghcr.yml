# =============================================================================
# Mirror Docker Image to GitHub Container Registry (GHCR)
# =============================================================================
#
# Resolves INF.2. ⚠️ [OPS.37] The ORIGINAL ground (external compute providers cannot pull
# from a private GCP Artifact Registry) died with that platform — but the mechanism is an
# ASSET, and its ground was re-measured, not assumed:
#   1. terraform/compute.tf runs the Ingress Anchor's `coap-daemon` systemd unit, which does
#      `docker pull ${var.coap_daemon_image}` — default `ghcr.io/alexey-lukin/silken_net:PIN_ME`
#      (terraform/variables.tf). That host sits OUTSIDE the Kamal/WIF auth chain and holds no
#      GCP registry credential; a private AR would need one in a world-readable startup script.
#   2. image_cve_scan.yml scans the PUBLISHED tag daily — a build-time scan goes stale while
#      the image sits public for months.
#   3. SECURITY.md promises `gh attestation verify oci://ghcr.io/...` to anyone.
# ⛔ Do not delete this workflow on the strength of the dead cause alone: it is the only path
# by which the Anchor obtains its image.
#
# Triggers:
#   - After CI passes on main branch (same cadence as Canopy deploy)
#   - On GitHub Release published (same cadence as Production deploy)
#   - Manual dispatch for ad-hoc mirroring
#
# Tags pushed to GHCR:
#   - ghcr.io/alexey-lukin/silken_net:latest       (on main push)
#   - ghcr.io/alexey-lukin/silken_net:sha-<commit>  (always)
#   - ghcr.io/alexey-lukin/silken_net:v1.2.3        (on release)
# =============================================================================

name: Deploy · GHCR Mirror

on:
  workflow_run:
    workflows: ["CI · Code"]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: mirror-ghcr-${{ github.event_name }}
  cancel-in-progress: true

# Top-level least-privilege floor; only the build job elevates packages:write.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Decide whether to (re)build the image
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # Manual dispatch + release always (re)build. A post-CI workflow_run only
          # rebuilds when files that actually affect the image changed — otherwise
          # the cached layers would just be re-pushed under a new sha tag for nothing.
          # The changed-file list comes from the GitHub API (compare, base = last successful
          # mirror — the single-commit `commits/{sha}` read was retired 2026-09-03), NOT a
          # checkout of the event head_sha: a workflow_run runs with a write token, so
          # checking out the (possibly fork-authored) head commit is an untrusted-code
          # vector (Scorecard DangerousWorkflow). On any ambiguity we build — a needless
          # rebuild is cheap & cached, a missed one is not; a manual dispatch forces one.
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 🔴 [2026-09-03, INF.17] The base of the diff is NOT one commit. `commits/${HEAD_SHA}`
          # lists the files of the push's LAST commit only, so a multi-commit push ending in a
          # docs commit reported "No image-relevant files changed" and the commit canopy went
          # live on (6dd6f6e) never got its `sha-` tag — the anchor daemon pin had nothing to
          # point at. Same axis as deploy.yml [INF.9]: the honest base is the head of the newest
          # run whose `Build & Push to GHCR` job succeeded, i.e. what the registry actually holds.
          # Pinned by spec/deploy/mirror_relevance_base_spec.rb.
          BASE=""
          for run in $(gh api "repos/${{ github.repository }}/actions/workflows/mirror-ghcr.yml/runs?status=completed&per_page=30" -q '.workflow_runs[] | "\(.id):\(.head_sha)"' 2>/dev/null); do
            id="${run%%:*}"; sha="${run##*:}"
            if gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs" -q '.jobs[] | select(.name == "Build & Push to GHCR" and .conclusion == "success") | .name' 2>/dev/null | grep -q .; then
              BASE="$sha"; break
            fi
          done
          if [ -z "$BASE" ]; then
            echo "::notice::No previous successful GHCR mirror found — building."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$BASE" = "$HEAD_SHA" ]; then
            echo "::notice::HEAD ${HEAD_SHA} is already mirrored — skipping."
            echo "build=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(gh api "repos/${{ github.repository }}/compare/${BASE}...${HEAD_SHA}" -q '.files[].filename' 2>/dev/null); then
            echo "::warning::Could not diff ${BASE}...${HEAD_SHA} via API — building to be safe."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The compare API caps `.files` at 300; a capped list is an ambiguity, and ambiguity builds.
          if [ "$(printf '%s\n' "$changed" | grep -c .)" -ge 300 ]; then
            echo "::warning::compare returned 300+ files (API cap) — building to be safe."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|Gemfile|Gemfile\.lock|\.ruby-version|Procfile|Rakefile|config\.ru|app/|lib/|config/|bin/|db/|public/|vendor/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No image-relevant files changed — skipping the GHCR rebuild."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  mirror:
    name: Build & Push to GHCR
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write       # push the mirrored image to GHCR
      id-token: write       # OIDC → Fulcio (keyless signing for the build-provenance attestation)
      attestations: write   # upload the SLSA build-provenance attestation
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # BuildKit SLSA provenance + SBOM, attached to the image (build metadata).
          # The cryptographic SIGNATURE is the Sigstore attestation in the next step;
          # the user-facing verify process is homed in SECURITY.md ("Verifying release
          # artifacts"): gh attestation verify oci://… --owner Alexey-Lukin.
          provenance: mode=max
          sbom: true

      - name: Lowercase the image name for the attestation subject
        run: echo "IMAGE_NAME_LC=${IMAGE_NAME,,}" >> "$GITHUB_ENV"

      - name: Attest build provenance (Sigstore keyless → GHCR)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME_LC }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
