# =============================================================================
# Mirror Docker Image to GitHub Container Registry (GHCR)
# =============================================================================
#
# Resolves INF.2 (06_02):
# Akash providers cannot pull images from private GCP Artifact Registry.
# This workflow builds the production Docker image and pushes it to GHCR
# (ghcr.io), which is publicly accessible to Akash providers.
#
# Triggers:
#   - After CI passes on main branch (same cadence as Canopy deploy)
#   - On GitHub Release published (same cadence as Production deploy)
#   - Manual dispatch for ad-hoc mirroring
#
# Tags pushed to GHCR:
#   - ghcr.io/alexey-lukin/silken_net:latest       (on main push)
#   - ghcr.io/alexey-lukin/silken_net:sha-<commit>  (always)
#   - ghcr.io/alexey-lukin/silken_net:v1.2.3        (on release)
# =============================================================================

name: Deploy · GHCR Mirror

on:
  workflow_run:
    workflows: ["CI · Code"]
    types: [completed]
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: mirror-ghcr-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  changes:
    name: Detect image-relevant changes
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'release' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    outputs:
      build: ${{ steps.decide.outputs.build }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout (history for the diff)
        if: github.event_name == 'workflow_run'
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
      - name: Decide whether to (re)build the image
        id: decide
        run: |
          # Manual dispatch + release always (re)build. A post-CI workflow_run only
          # rebuilds when files that actually affect the image changed — otherwise
          # the cached layers would just be re-pushed under a new sha tag for nothing.
          # (Diffs the tip commit; on any ambiguity it builds — a needless rebuild is
          # cheap & cached, a missed one is not. A manual dispatch always forces one.)
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(git diff --name-only HEAD^ HEAD 2>/dev/null); then
            echo "::warning::No parent to diff (shallow/first commit) — building to be safe."
            echo "build=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|Gemfile|Gemfile\.lock|\.ruby-version|Procfile|Rakefile|config\.ru|app/|lib/|config/|bin/|db/|public/|vendor/)'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No image-relevant files changed — skipping the GHCR rebuild."
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  mirror:
    name: Build & Push to GHCR
    needs: changes
    if: ${{ needs.changes.outputs.build == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Log in to GHCR
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=semver,pattern={{version}},enable=${{ github.event_name == 'release' }}
            type=semver,pattern={{major}}.{{minor}},enable=${{ github.event_name == 'release' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # SLSA build provenance + SBOM attestations, pushed alongside the image so
          # an Akash provider (or anyone) can verify origin + contents:
          #   gh attestation verify oci://ghcr.io/alexey-lukin/silken_net:latest --owner Alexey-Lukin
          provenance: mode=max
          sbom: true
