name: Smoke · In-silico L2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Path-filtered so the 3-GB conda env install only triggers on PRs that
# actually touch the in-silico stack. Other PRs use the existing CI matrix
# in `ci.yml`.
on:
  pull_request:
    paths:
      - 'tools/in_silico/**'
      - 'docs/protocols/ebfc/in_silico/**'
      - '.github/workflows/in_silico_smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/in_silico/**'
      - 'docs/protocols/ebfc/in_silico/**'

jobs:
  lock_sync:
    # Fail-fast drift guard: the committed conda-lock.yml must still match
    # environment.yml. Editing env.yml without regenerating the lock would
    # otherwise silently install the OLD pinned env — `smoke` consumes the
    # LOCK, not env.yml. `--check-input-hash` is a local hash compare (no
    # solve) when in sync; on drift conda-lock re-solves → the file changes →
    # `git diff` trips the gate. Regen recipe: tools/in_silico/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Install conda-lock
        run: pipx install conda-lock
      - name: conda-lock.yml in sync with environment.yml (no silent drift)
        run: |
          conda-lock lock --check-input-hash \
            -f tools/in_silico/environment.yml \
            --lockfile tools/in_silico/conda-lock.yml \
            -p linux-64 -p osx-arm64
          git diff --exit-code tools/in_silico/conda-lock.yml \
            || { echo "::error::conda-lock.yml is stale vs environment.yml — regenerate (see tools/in_silico/README.md) and commit"; exit 1; }

  smoke:
    needs: lock_sync
    # Runs 01_smoke_test_water_box.py on the GH-hosted Ubuntu runner.
    # Forces the CPU platform — runners have no GPU drivers and we want
    # deterministic timing for the gate.
    runs-on: ubuntu-latest
    # 40 not 30: the seeded 10 K pre-relaxation (the NaN fix) adds a few minutes
    # on a slow runner, and the slowest observed smoke run already neared 30.
    timeout-minutes: 40

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up silken_md conda env (cached, pinned lock)
        # Installs the EXACT pinned env from the committed conda-lock.yml
        # (multi-platform; micromamba picks the linux-64 subset). setup-micromamba
        # consumes the conda-lock unified format natively given an explicit
        # environment-name. Cache keys on the lock hash, so it changes only when
        # the lock changes → deterministic, and warm runs reuse the ~2.5 GB env
        # in ~30 s instead of installing for ~8 min.
        uses: mamba-org/setup-micromamba@d7c9bd84e824b79d2af72a2d4196c7f4300d3476 # v3
        with:
          environment-file: tools/in_silico/conda-lock.yml
          environment-name: silken_md
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Verify OpenMM platforms (CPU should be present)
        shell: bash -el {0}
        run: python -m openmm.testInstallation

      - name: L2 engine smoke test (CPU-only, small box for CI speed)
        shell: bash -el {0}
        env:
          SILKEN_FORCE_PLATFORM: CPU
          SILKEN_WATER_PADDING: "0.5"
          SILKEN_MIN_ITERATIONS: "500"
          SILKEN_MD_STEPS: "100"
        run: python tools/in_silico/scripts/01_smoke_test_water_box.py
