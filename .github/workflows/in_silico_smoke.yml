name: Smoke · In-silico L2

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# 3-GB conda env installs are heavy, so a `changes` job (dorny/paths-filter) gates
# `lock_sync`/`smoke`/`cache_doc_sync` to PRs that actually touch the in-silico
# stack. Other PRs use the existing CI matrix in `ci.yml`.
#
# Runs on every PR (no pull_request paths-filter): the always-on `in-silico-ok`
# aggregate emits a status on every PR — that's what lets it become a required
# branch-protection check without hanging unrelated PRs ("waiting for status").
# Same shape as docs.yml's docs-ok / ci.yml's ci-ok.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'tools/in_silico/**'
      - 'docs/protocols/ebfc/in_silico/**'
      - 'docs/01_04_CODIT_and_Xylemointegration.md'  # thermal_penetration.json cache↔doc (test_doc_cache_sync)
      - '.github/workflows/in_silico_smoke.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      in_silico: ${{ steps.filter.outputs.in_silico }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect in-silico changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            in_silico:
              - 'tools/in_silico/**'
              - 'docs/protocols/ebfc/in_silico/**'
              - 'docs/01_04_CODIT_and_Xylemointegration.md'
              - '.github/workflows/in_silico_smoke.yml'

  lock_sync:
    needs: changes
    if: ${{ needs.changes.outputs.in_silico == 'true' }}
    # Fail-fast drift guard: the committed conda-lock.yml must still match
    # environment.yml. Editing env.yml without regenerating the lock would
    # otherwise silently install the OLD pinned env — `smoke` consumes the
    # LOCK, not env.yml. `--check-input-hash` is a local hash compare (no
    # solve) when in sync; on drift conda-lock re-solves → the file changes →
    # `git diff` trips the gate. Regen recipe: tools/in_silico/README.md.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install conda-lock (hash-pinned)
        # `pipx install conda-lock` плавав latest без версії й хеша — єдина
        # pip-поверхня поза «hash-pinned CI-тулзи» (06_07 §1a). Лок = `uv pip
        # compile --universal --python-version 3.12` (НЕ pip-compile: той фіксує
        # markers під платформою компіляції — macOS-лок викинув linux-only
        # SecretStorage і цей крок упав; --universal тримає всі marker-гілки).
        run: python3 -m pip install --user --require-hashes -r tools/in_silico/requirements-conda-lock.txt
      - name: conda-lock.yml in sync with environment.yml (no silent drift)
        run: |
          conda-lock lock --check-input-hash \
            -f tools/in_silico/environment.yml \
            --lockfile tools/in_silico/conda-lock.yml \
            -p linux-64 -p osx-arm64
          git diff --exit-code tools/in_silico/conda-lock.yml \
            || { echo "::error::conda-lock.yml is stale vs environment.yml — regenerate (see tools/in_silico/README.md) and commit"; exit 1; }

  smoke:
    needs: [changes, lock_sync]
    # Path-gate AND the original success-dependency on lock_sync — an explicit `if:`
    # replaces the implicit success() default GitHub applies from `needs:` alone, so
    # both conditions must be spelled out or a failed lock_sync would no longer skip
    # this expensive job.
    if: ${{ needs.changes.outputs.in_silico == 'true' && needs.lock_sync.result == 'success' }}
    # Runs 01_smoke_test_water_box.py on the GH-hosted Ubuntu runner.
    # Forces the CPU platform — runners have no GPU drivers and we want
    # deterministic timing for the gate.
    runs-on: ubuntu-latest
    # 40 not 30: the seeded 10 K pre-relaxation (the NaN fix) adds a few minutes
    # on a slow runner, and the slowest observed smoke run already neared 30.
    timeout-minutes: 40

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up silken_md conda env (cached, pinned lock)
        # Installs the EXACT pinned env from the committed conda-lock.yml
        # (multi-platform; micromamba picks the linux-64 subset). setup-micromamba
        # consumes the conda-lock unified format natively given an explicit
        # environment-name. Cache keys on the lock hash, so it changes only when
        # the lock changes → deterministic, and warm runs reuse the ~2.5 GB env
        # in ~30 s instead of installing for ~8 min.
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: tools/in_silico/conda-lock.yml
          environment-name: silken_md
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Verify OpenMM platforms (CPU should be present)
        shell: bash -el {0}
        run: python -m openmm.testInstallation

      - name: L2 engine smoke test (CPU-only, small box for CI speed)
        shell: bash -el {0}
        env:
          SILKEN_FORCE_PLATFORM: CPU
          SILKEN_WATER_PADDING: "0.5"
          SILKEN_MIN_ITERATIONS: "500"
          SILKEN_MD_STEPS: "100"
        run: python tools/in_silico/scripts/01_smoke_test_water_box.py

      - name: Cache-integrity tests (conda env — needs numpy/openmm for lib/ imports)
        shell: bash -el {0}
        run: python -m pytest tools/in_silico/tests/test_cache_integrity.py -q

  cache_doc_sync:
    needs: changes
    if: ${{ needs.changes.outputs.in_silico == 'true' }}
    # Numeric-drift guard — stdlib-only (no conda env → runs fast, in parallel
    # with the heavy L2 smoke, no lock_sync dependency). test_doc_cache_sync pins
    # every headline number in SUMMARY/L3 to its OWNER cache JSON — the
    # self-consistent stale pocket `rg`/graphify cannot see (the 2026-06-19 model
    # swap, the −1.054↔−1.051 provenance mix, the xylem-pH column drift).
    # (test_cache_integrity imports lib/ → needs numpy/openmm → it runs in the
    # `smoke` conda job above, NOT here; this bare-pytest job stays import-free.)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pytest (hash-pinned)
        run: python3 -m pip install --user --require-hashes -r tools/in_silico/requirements-pytest.txt
      - name: Doc↔cache numeric-drift guard
        run: python3 -m pytest tools/in_silico/tests/test_doc_cache_sync.py -q

  in-silico-ok:
    # Single aggregate status check for branch protection — mirrors docs-ok/ci-ok.
    # A skipped `smoke` after a `lock_sync` failure is expected (see the `smoke`
    # if-condition above) — `lock_sync`'s own failure already trips this gate, so
    # there's no double-counting.
    name: In-silico passed
    if: ${{ always() }}
    needs: [changes, lock_sync, smoke, cache_doc_sync]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # [OPS.23] `changes` carries no `if:`, so `success` is its ONLY legal result,
      # while a path-gated job below it may legally be `skipped`. The guard after this
      # one asks only "did anything FAIL?" — so a skipped FILTER would read as an
      # ordinary path-skip, and every skip beneath it happened for a false reason.
      # Same explicit-result form `smoke` already uses on its lock_sync dependency.
      - name: Fail if the change-filter itself did not run
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The change-filter job did not succeed (result: ${{ needs.changes.result }}) — every job below it was skipped for a FALSE reason, so a green aggregate would vouch for nothing. Infrastructure failure, not a code failure: re-run this workflow."
          exit 1
      - name: Fail if an in-silico job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        # [OPS.30] Вердикт мусить називати ЕТАП: `failure` = перевірка виконалась
        # і сказала «ні»; `cancelled` = вона НЕ БІГЛА (стеля `timeout-minutes`
        # або скасування прогону). Один меседж на два світи читається як
        # «впали тести» і жене наступний прохід шукати дефект у власному діфі.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries|map(select(.value.result=="failure").key)|join(", ")' <<<"$NEEDS_JSON")
          stopped=$(jq -r 'to_entries|map(select(.value.result=="cancelled").key)|join(", ")' <<<"$NEEDS_JSON")
          if [ -n "$failed" ]; then
            echo "::error title=ВПАЛО (вердикт є)::${failed} — An in-silico CI job failed — see the job list above."
          fi
          if [ -n "$stopped" ]; then
            echo "::error title=НЕ БІГЛО (вердикту НЕМАЄ)::${stopped} — скасовано: стеля timeout-minutes або скасування прогону. Це не твердження про код."
          fi
          exit 1
      - name: All clear
        run: echo "In-silico jobs that ran passed (path-skipped on a non-in-silico change is OK)."
