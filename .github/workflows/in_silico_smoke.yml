name: In-silico smoke (L2)

permissions:
  contents: read

# Path-filtered so the 3-GB conda env install only triggers on PRs that
# actually touch the in-silico stack. Other PRs use the existing CI matrix
# in `ci.yml`.
on:
  pull_request:
    paths:
      - 'tools/in_silico/**'
      - 'docs/protocols/ebfc/in_silico/**'
      - '.github/workflows/in_silico_smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/in_silico/**'
      - 'docs/protocols/ebfc/in_silico/**'

jobs:
  smoke:
    # Runs 01_smoke_test_water_box.py on the GH-hosted Ubuntu runner.
    # Forces the CPU platform — runners have no GPU drivers and we want
    # deterministic timing for the gate.
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up silken_md conda env (cached)
        # micromamba is much faster than full conda; the action caches the
        # whole env keyed on environment.yml hash, so subsequent runs reuse
        # the ~2.5 GB env in ~30 s instead of installing for ~8 min.
        uses: mamba-org/setup-micromamba@v3
        with:
          environment-file: tools/in_silico/environment.yml
          environment-name: silken_md
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Verify OpenMM platforms (CPU should be present)
        shell: bash -el {0}
        run: python -m openmm.testInstallation

      - name: L2 engine smoke test (CPU-only, small box for CI speed)
        shell: bash -el {0}
        env:
          SILKEN_FORCE_PLATFORM: CPU
          SILKEN_WATER_PADDING: "0.5"
          SILKEN_MIN_ITERATIONS: "500"
          SILKEN_MD_STEPS: "100"
        run: python tools/in_silico/scripts/01_smoke_test_water_box.py
