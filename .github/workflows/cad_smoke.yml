name: Smoke · CAD PicoGK

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Path-filtered to tools/cad. PicoGK is first-party macOS / Win64 only (Linux =
# community Docker) → macOS Apple-Silicon runner. The geometry `verify` step needs a
# display context (Library.Go inits a Metal viewer); macOS runners provide a window
# server. `dotnet build` (compiles the LEAP submodule source vs PicoGK 2.2) is the
# strongest gate. Local-verify (`dotnet run -- verify`) remains the PRIMARY gate
# (00_07 HW.1.PicoGK) — this CI is the safety net.
on:
  pull_request:
    paths:
      - 'tools/cad/**'
      - '.github/workflows/cad_smoke.yml'
  push:
    branches: [ main ]
    paths:
      - 'tools/cad/**'

jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 25

    steps:
      - name: Checkout (with LEAP submodules)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Set up .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build (LEAP source vs PicoGK 2.2 — 0W/0E gate)
        run: dotnet build tools/cad/SilkenCad.sln -c Release

      - name: Verify golden-metrics (Ti-coin + anchor; exit-code gate)
        # best-effort until the macOS runner's Metal/display context is confirmed for
        # Library.Go — `build` above is the hard gate; local-verify is the primary gate.
        continue-on-error: true
        working-directory: tools/cad
        run: |
          dotnet run --project src/SilkenCad -c Release --no-build -- verify cem/ti_coin.json
          dotnet run --project src/SilkenCad -c Release --no-build -- verify cem/anchor_zone1.pine.json
