name: Smoke · CAD (PicoGK · KiCad)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# Two gates split by whether they need a render:
#   • logic  (ubuntu) — the whole xUnit suite is PicoGK-runtime-free (CEM parse, gyroid/mate SDF math,
#     connectivity flood-fill — no Library.Go / display). Cheap + fast → the HARD regression gate.
#   • render (macos) — Library.Go voxelisation needs a display; first-party PicoGK = macOS/Win64. Builds
#     the golden metrics for every CEM (verify exit-code = gate) + publishes metrics/SBOM artifacts.
# Local-verify (`dotnet run -- verify`) stays the PRIMARY developer gate; CI mirrors it.
# Home of that policy: tools/cad/README.md (NOT 00_07 HW.1 — that item is the anchor
# CAD-to-factory route and carries no statement about which gate is primary).
#   • schematic (ubuntu) — the Soldier's schematic written by code (HW.56, tools/pcb/soldier_schematic):
#     the generator's own `--check` inside the official KiCad image — ERC of every severity, pin→net
#     check against KiCad's exported netlist, the 02_03 §5 dividers the generator reads, committed files
#     equal to the generator's output. Same command locally; what it does NOT prove — generator header.
#
# Runs on every PR (no pull_request paths-filter): a `changes` job (dorny/paths-filter) gates
# `logic`/`render` to tools/cad-relevant diffs, and the always-on `cad-ok` aggregate emits a status
# on every PR — that's what lets it become a required branch-protection check without hanging
# unrelated PRs ("waiting for status"). Same shape as docs.yml's docs-ok / ci.yml's ci-ok.
on:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'tools/cad/**'
      - '.github/workflows/cad_smoke.yml'
      # The committed gallery is an OUTPUT of tools/cad pinned by DrawingTests — a gallery-only push
      # (a republished sheet) must run `logic` too, or main stays on the last verdict (2026-09-10).
      - 'docs/images/cad/*.drawing.svg'
      # `schematic` inputs — the same list as the `pcb` filter below.
      - 'tools/pcb/soldier_schematic/**'
      - 'tools/firmware/bq25570_dividers.rb'
      - 'docs/02_03_BQ25570_MPPT_Nano_Power.md'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      cad: ${{ steps.filter.outputs.cad }}
      pcb: ${{ steps.filter.outputs.pcb }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect CAD changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            cad:
              - 'tools/cad/**'
              - '.github/workflows/cad_smoke.yml'
              # The committed gallery is an OUTPUT of tools/cad and is pinned by DrawingTests,
              # so a PR that only reverts or edits a published drawing must still run `logic`.
              - 'docs/images/cad/*.drawing.svg'
            # Every input of `build_schematic.rb --check`, not only its folder: it reads the
            # divider table of 02_03 §5 through the parser in bq25570_dividers.rb, so a canon
            # edit there makes the committed schematic stale — a filter without those two
            # paths would leave the gate running only on somebody else's PR.
            pcb:
              - 'tools/pcb/soldier_schematic/**'
              - 'tools/firmware/bq25570_dividers.rb'
              - 'docs/02_03_BQ25570_MPPT_Nano_Power.md'
              - '.github/workflows/cad_smoke.yml'

  logic:
    needs: changes
    if: ${{ needs.changes.outputs.cad == 'true' }}
    name: logic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout (with LEAP submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        # 🔒 [OPS.21] SDK береться з `tools/cad/global.json` — ЄДИНОГО дому піну,
        # який `dotnet build` читає й локально. Літерал `9.0.x` тут був другим
        # домом того самого факту, ще й ШИРШИМ за нього (будь-який 9.0.*), тож
        # збірка з `TreatWarningsAsErrors` їхала на SDK, якого ніхто не називав:
        # новий аналізатор у свіжому фіча-бенді = червона merge-required смуга
        # `CAD passed` при незмінному дереві.
        # 🔒 СТЕЛЯ, названа поіменно: цей вхід зобовʼязує лише те, що СТАВИТЬ
        # раннер; яку версію обере `dotnet`, вирішує `rollForward` усередині
        # global.json (нині `latestFeature`), тож передвстановлений вищий
        # фіча-бенд усе ще може виграти. Звуження до `latestPatch` — окреме
        # рішення про допустимий дрейф SDK, не побічний ефект цього піну.
        # ⚠️ Бампера немає (Dependabot не читає global.json) — підняття ручне,
        # скіл `dependency-update`.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: tools/cad/global.json

      - name: Build (LEAP source vs PicoGK 2.3 — 0W/0E gate)
        run: dotnet build tools/cad/SilkenCad.sln -c Release

      - name: Test (pure-logic xUnit — CEM / SDF / mate math, PicoGK-runtime-free)
        run: dotnet test tools/cad/SilkenCad.sln -c Release --no-build

  render:
    needs: changes
    if: ${{ needs.changes.outputs.cad == 'true' }}
    name: render
    # macos-15 (arm64): образ macos-14 GitHub знімає до 2026-11-02. Обрано 15, а не
    # `macos-latest` (= 26): ця нога існує, щоб ловити розбіжність збірки PicoGK з
    # дев-машиною засновника, а та — macOS 15; і явна версія замість плаваючого лейбла,
    # як скрізь у репо. ⏳ Наступний перегляд — депрекація macos-15 або апгрейд дев-машини.
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout (with LEAP submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Set up .NET 10
        # 🔒 [OPS.21] SDK береться з `tools/cad/global.json` — ЄДИНОГО дому піну,
        # який `dotnet build` читає й локально. Літерал `9.0.x` тут був другим
        # домом того самого факту, ще й ШИРШИМ за нього (будь-який 9.0.*), тож
        # збірка з `TreatWarningsAsErrors` їхала на SDK, якого ніхто не називав:
        # новий аналізатор у свіжому фіча-бенді = червона merge-required смуга
        # `CAD passed` при незмінному дереві.
        # 🔒 СТЕЛЯ, названа поіменно: цей вхід зобовʼязує лише те, що СТАВИТЬ
        # раннер; яку версію обере `dotnet`, вирішує `rollForward` усередині
        # global.json (нині `latestFeature`), тож передвстановлений вищий
        # фіча-бенд усе ще може виграти. Звуження до `latestPatch` — окреме
        # рішення про допустимий дрейф SDK, не побічний ефект цього піну.
        # ⚠️ Бампера немає (Dependabot не читає global.json) — підняття ручне,
        # скіл `dependency-update`.
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: tools/cad/global.json

      - name: Build
        run: dotnet build tools/cad/SilkenCad.sln -c Release

      - name: Verify golden-metrics (best-effort — coin · anchor · flange · radome · assembly)
        # CONFIRMED 2026-06-20 (this PR): Library.Go SIGSEGVs (exit 139) on headless hosted macos-14 — it
        # inits a Metal viewer and the runner has no window-server/GPU context. So render-verify stays
        # best-effort here; the HARD gates are `logic` (the full PicoGK-runtime-free xUnit suite on Linux)
        # + `Build` above (LEAP source vs PicoGK 2.3 on both OSes). Local `dotnet run -- verify` is the
        # primary metrics gate (home of that policy: tools/cad/README.md); a self-hosted
        # macOS-with-display runner would re-arm it.
        # ⊕ Re-measured 2026-10-16 on macos-15 (run 38967423445): the same exit 139 here, and the build
        # the same 23 warnings / 0 errors as the last macos-14 run — the cause is the missing window
        # server, not the OS version.
        continue-on-error: true
        working-directory: tools/cad
        run: |
          for cem in ti_coin ti_coin.7nb ti_coin.cpti ti_coin.bti ti_coin.ta ti_coin.tizr ti_coin.au anchor_zone1.pine cathode_flange radome anchor_assembly; do
            echo "::group::verify $cem"
            dotnet run --project src/SilkenCad -c Release --no-build -- verify "cem/$cem.json"
            echo "::endgroup::"
          done

      - name: Generate SBOM (CycloneDX — supply-chain provenance, matches the GHCR SBOM)
        # 🔒 [OPS.21] Свідомо БЕЗ `--version`, і підстава вимірна, а не смакова:
        # крок `continue-on-error`, тож він НЕ здатен зачервонити смугу — пін
        # тут не купує нічого з того класу, заради якого пінять начинку
        # («апстрім кладе merge-required гейт»). ⚠️ Названа ціна відмови:
        # зламана версія тихо лишить збірку БЕЗ SBOM-артефакта, і помітити це
        # можна лише за його відсутністю — це інший клас (мовчазний артефакт),
        # не клас піна, і лікується він детектором порожнього виходу.
        continue-on-error: true
        working-directory: tools/cad
        run: |
          dotnet tool install --global CycloneDX
          dotnet CycloneDX SilkenCad.sln -o sbom -fn cad.sbom.json

      - name: Upload artifacts (golden metrics + SBOM)
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: cad-golden-metrics
          path: |
            tools/cad/out/*.metrics.json
            tools/cad/sbom/
          if-no-files-found: warn
          retention-days: 14

  schematic:
    needs: changes
    if: ${{ needs.changes.outputs.pcb == 'true' }}
    name: schematic
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # 🔒 [HW.56] KiCad — офіційний образ, пін за digest. Версія несуча, не смакова: схема вбудовує
      # копії стокових символів із бібліотек тієї версії KiCad, що її згенерувала, тож `--check` тут
      # судить закомічені файли лише за тієї самої версії, що на дев-машині. Підняття — одним
      # комітом: перегенерувати схему новим KiCad локально І переставити digest тут.
      # ⚠️ Бампера немає: Dependabot `docker` скоупнутий на `/` (Dockerfile) і образу в `run:` не
      # бачить — підняття ручне, скіл `dependency-update`.
      KICAD_IMAGE: kicad/kicad:10.0.6@sha256:18693567392b80da435f9fa952ce3a3e534c66eb5a6033f5b9c80aa3b19dd3ec
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Pull KiCad image (pinned digest)
        timeout-minutes: 5
        run: docker pull "$KICAD_IMAGE"

      - name: Schematic — ERC · pins vs KiCad netlist · 02_03 §5 dividers · committed files fresh
        # Контейнер кличеться з хоста, тож джоба лишається звичайною Linux-джобою (harden-runner
        # першим кроком, як скрізь). Ruby — з apt образу (Debian trixie): генератор stdlib-only,
        # без bundle. ⚠️ Стеля: цей Ruby не пінований (патчі trixie), а `.ruby-version` репо тут не діє.
        timeout-minutes: 5
        run: |
          docker run --rm --user root -v "$GITHUB_WORKSPACE:/w" -w /w "$KICAD_IMAGE" bash -c '
            set -e
            export DEBIAN_FRONTEND=noninteractive
            apt-get update -qq
            apt-get install -y -qq --no-install-recommends ruby > /dev/null
            ruby tools/pcb/soldier_schematic/build_schematic.rb --check'

  cad-ok:
    # Single aggregate status check for branch protection — mirrors docs-ok/ci-ok.
    # `render`'s best-effort steps (headless Metal SIGSEGV, by design) already use
    # continue-on-error: true, so a flaky verify/SBOM step there does NOT flip the
    # `render` JOB's own result to failure — this aggregate only trips on a real
    # `logic`, `render`-build or `schematic` failure, never on the known-flaky verify step.
    name: CAD passed
    if: ${{ always() }}
    needs: [changes, logic, render, schematic]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # [OPS.23] `changes` carries no `if:`, so `success` is its ONLY legal result,
      # while a path-gated job below it may legally be `skipped`. The guard after this
      # one asks only "did anything FAIL?" — so a skipped FILTER would read as an
      # ordinary path-skip, and every skip beneath it happened for a false reason.
      - name: Fail if the change-filter itself did not run
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The change-filter job did not succeed (result: ${{ needs.changes.result }}) — every job below it was skipped for a FALSE reason, so a green aggregate would vouch for nothing. Infrastructure failure, not a code failure: re-run this workflow."
          exit 1
      - name: Fail if a CAD job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        # [OPS.30] Вердикт мусить називати ЕТАП: `failure` = перевірка виконалась
        # і сказала «ні»; `cancelled` = вона НЕ БІГЛА (стеля `timeout-minutes`
        # або скасування прогону). Один меседж на два світи читається як
        # «впали тести» і жене наступний прохід шукати дефект у власному діфі.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries|map(select(.value.result=="failure").key)|join(", ")' <<<"$NEEDS_JSON")
          stopped=$(jq -r 'to_entries|map(select(.value.result=="cancelled").key)|join(", ")' <<<"$NEEDS_JSON")
          if [ -n "$failed" ]; then
            echo "::error title=ВПАЛО (вердикт є)::${failed} — A CAD CI job failed — see the job list above."
          fi
          if [ -n "$stopped" ]; then
            echo "::error title=НЕ БІГЛО (вердикту НЕМАЄ)::${stopped} — скасовано: стеля timeout-minutes або скасування прогону. Це не твердження про код."
          fi
          exit 1
      - name: All clear
        run: echo "CAD jobs that ran passed (path-skipped on a non-CAD change is OK)."
