name: Sec · IaC Scan

# Trivy config (misconfiguration) scan of the Infrastructure-as-Code surface —
# Terraform (terraform/**) + the Dockerfile. Catches IaC misconfigurations
# (public buckets, permissive firewall/IAM, missing encryption, unpinned base
# images…) at PR/push time, BEFORE the first live deploy — the cheapest moment
# to fix them. Static: reads files only, no cloud creds (contrast: terraform_drift,
# which plans against LIVE state and authenticates keyless via WIF).
#
# Findings → SARIF in the Security tab (coexists with CodeQL default-setup /
# Scorecard / Aderyn — distinct `category`). HARD gate (exit-code 1 on any
# finding): the initial soft-fail baseline triaged to 0 open findings, so a new
# misconfiguration now fails the build, not just the SARIF report. Tool choice =
# Trivy `config` (not tfsec — aquasecurity folded tfsec into Trivy; Trivy covers
# terraform AND Dockerfile in one pass).
# Canon: IaC-scan policy = 06_07 §1a (SHA-pinned scan-tool), inventory = 06_07 §1.
# Tracker: INF.22 (docs/00_07 §06).
#
# Runs on every PR (no pull_request paths-filter): a `changes` job (dorny/paths-filter)
# gates `scan` to IaC-relevant diffs, and the always-on `iac-ok` aggregate emits a
# status on every PR — that's what lets it become a required branch-protection check
# without hanging unrelated PRs ("waiting for status"). Same shape as docs.yml's
# docs-ok / ci.yml's ci-ok.
#
# `scan`'s if-condition also ORs in `github.event_name == 'workflow_dispatch'`: unlike
# docs.yml/ci.yml, this workflow keeps a manual-dispatch trigger, and a dispatch run on
# `main` itself diffs against its own merge-base (0 changed files) — paths-filter would
# report the output false and silently no-op the scan. The OR makes a manual dispatch
# always run it, same as before this path-gate conversion.

on:
  pull_request:
  push:
    branches: [ main ]
    # [DOC-T.64] The filter is keyed on FILE CLASS, not on directory, because the
    # scanner below runs with `scan-ref: .` — the whole repo. A directory-shaped
    # filter (`terraform/**` + a single root `Dockerfile`) is narrower than what the
    # job actually inspects, so an IaC file created anywhere else would never wake
    # the guard that is meant to inspect it: «стереже X, але не прокидається на
    # НОВИЙ X». Dormant when written — zero such files existed — but it opens by
    # itself the moment one appears, which is exactly the wrong time to notice.
    # ⚠️ Ceiling: Trivy's config scanner also reads Kubernetes/Helm/CloudFormation
    # manifests, which are plain `*.yaml`; those are deliberately NOT listed, since
    # that pattern would wake this job on every locale and workflow edit. Adding the
    # first such manifest means adding its pattern here in the same commit.
    paths:
      - '**/*.tf'
      - '**/*.tfvars'
      - '**/Dockerfile'
      - '**/Dockerfile.*'
      - '**/*.dockerfile'
      - 'terraform/**'
      - '.github/workflows/iac_scan.yml'
  workflow_dispatch:

# Least-privilege floor; the scan job elevates only the SARIF-upload write.
permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      iac: ${{ steps.filter.outputs.iac }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect IaC changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            iac:
              - 'terraform/**'
              - 'Dockerfile'
              - '.github/workflows/iac_scan.yml'

  scan:
    needs: changes
    if: ${{ needs.changes.outputs.iac == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Trivy IaC misconfig
    runs-on: ubuntu-latest
    permissions:
      contents: read           # checkout
      security-events: write   # upload the SARIF result to code-scanning (Security tab)
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Verdict boundary — setup complete
        run: echo "setup complete — every step below carries the verdict (OPS.47)"

      # SHA-pinned action + explicit `version:` binary pin (06_07 §1a ruff
      # precedent). skip-dirs excludes non-target noise: deploy/grafana (dashboards are not
      # a k8s manifest), deploy/grafana (alert-provisioning YAML), firmware/extern
      # (vendored third-party Dockerfiles we can't fix). config/*.yml (Rails) carry
      # no apiVersion/kind so Trivy's k8s parser ignores them; .github/workflows
      # has no Trivy config scanner — both are already silent, no skip needed.
      - name: Trivy config scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          version: v0.76.1
          format: sarif
          output: trivy-iac.sarif
          skip-dirs: deploy/grafana,firmware/extern
          exit-code: '1' # HARD gate — baseline triaged to 0 open findings.

      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4
        with:
          sarif_file: trivy-iac.sarif
          category: trivy-iac

  iac-ok:
    # Single aggregate status check for branch protection — mirrors docs-ok/ci-ok.
    name: IaC passed
    if: ${{ always() }}
    needs: [changes, scan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit
      # [OPS.23] `changes` carries no `if:`, so `success` is its ONLY legal result,
      # while a path-gated job below it may legally be `skipped`. The guard after this
      # one asks only "did anything FAIL?" — so a skipped FILTER would read as an
      # ordinary path-skip, and every skip beneath it happened for a false reason.
      - name: Fail if the change-filter itself did not run
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The change-filter job did not succeed (result: ${{ needs.changes.result }}) — every job below it was skipped for a FALSE reason, so a green aggregate would vouch for nothing. Infrastructure failure, not a code failure: re-run this workflow."
          exit 1
      - name: Fail if the Trivy IaC scan failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        # [OPS.30 · OPS.47] Вердикт мусить називати ЕТАП. `cancelled` = перевірка НЕ БІГЛА
        # (стеля `timeout-minutes` або скасування прогону). А `failure` НЕ означає «перевірка
        # сказала „ні“»: так само падають крок налаштування й джоба, що не стартувала, — етап
        # кожної джоби називає крок «Name the stage of each failed job» нижче — з API запуску й межі.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries|map(select(.value.result=="failure").key)|join(", ")' <<<"$NEEDS_JSON")
          stopped=$(jq -r 'to_entries|map(select(.value.result=="cancelled").key)|join(", ")' <<<"$NEEDS_JSON")
          if [ -n "$failed" ]; then
            echo "::error title=ВПАЛО (етап — у кроці «Name the stage of each failed job»)::${failed} — The Trivy IaC config scan failed — see the job list above."
          fi
          if [ -n "$stopped" ]; then
            echo "::error title=НЕ БІГЛО (вердикту НЕМАЄ)::${stopped} — скасовано: стеля timeout-minutes або скасування прогону. Це не твердження про код."
          fi
          exit 1
      # [OPS.47] `failure` несе три світи — впала перевірка · впало налаштування · джоба не
      # стартувала, — і `needs.*.result` їх не розрізняє. Етап читається з API запуску, не
      # виводиться: кроки — з API, етап — за межею «Verdict boundary — setup complete» у кожній гейтованій джобі (06_07 §2).
      # Обидва кроки стоять ПІСЛЯ кроку вердикту й лише друкують: exit 1 агрегату вже поставлено вище.
      - name: Checkout the verdict-stage classifier
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        continue-on-error: true
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          sparse-checkout: scripts/ci_verdict_stage.rb
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Name the stage of each failed job
        if: ${{ always() && contains(needs.*.result, 'failure') }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/attempts/${GITHUB_RUN_ATTEMPT}/jobs?per_page=100" > "${RUNNER_TEMP}/jobs.json" || echo '{}' > "${RUNNER_TEMP}/jobs.json"
          ruby scripts/ci_verdict_stage.rb "${RUNNER_TEMP}/jobs.json"
      - name: All clear
        run: echo "IaC scan passed (path-skipped on a non-IaC change is OK)."
