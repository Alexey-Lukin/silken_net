name: Ops · Release

# release-please reads the Conventional Commit history (chore/fix/feat/…, which
# this repo already uses) and keeps an open "release PR": it bumps the version in
# .release-please-manifest.json, updates CHANGELOG.md, and — when that PR is merged
# (gated by `CI passed`) — creates tag vX.Y.Z + a GitHub Release. ⚠️ That release does
# NOT fan out to Deploy · Production / Deploy · GHCR Mirror: GITHUB_TOKEN events trigger
# no other workflow (06_07 §1, 00_07 DEPLOY-1).
#
# Hourly, not on every push (⚖️ founder 2026-10-24, 00_07 OPS.44): each pass backfills the
# file list commit-by-commit since the last tag, on the installation-wide API budget, so
# push-triggered passes at a ~1780-commit distance starved every `changes` job in the repo
# for an hour. The schedule bounds how OFTEN a pass runs, not how LONG one is (06_07 §1).

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

# Top-level least-privilege floor; the job elevates the writes release-please needs.
permissions: {}

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # tag + CHANGELOG commit
      pull-requests: write   # the standing release PR
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
