# Labels Sync (IaC)
#
# Synchronises the repository labels with the SSOT defined in
# `.github/labels.yml`. delete-other-labels is FALSE so ephemeral bot
# labels (Dependabot/Snyk/Renovate) and GitHub defaults are NOT wiped on sync.
#
# Doc reference: docs/06_07_CICD_and_Runbook_Index.md §1

name: Ops · Labels Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/labels_sync.yml'
  workflow_dispatch:

# Top-level least-privilege floor; the job elevates only issues:write.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Sync labels from .github/labels.yml
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
          token: ${{ secrets.GITHUB_TOKEN }}
