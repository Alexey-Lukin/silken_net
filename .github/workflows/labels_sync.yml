# Labels Sync (IaC)
#
# Synchronises the repository labels with the SSOT defined in
# `.github/labels.yml`. delete-other-labels is FALSE (OPS.9) so ephemeral bot
# labels (Dependabot/Snyk/Renovate) and GitHub defaults are NOT wiped on sync.
#
# Doc reference: docs/00_05_GitHub_Projects_and_IaC_Automation.md §2.5.

name: Ops · Labels Sync

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/labels_sync.yml'
  workflow_dispatch:

# Top-level least-privilege floor; the job elevates only issues:write.
permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Sync labels from .github/labels.yml
        uses: EndBug/label-sync@52074158190acb45f3077f9099fea818aa43f97a # v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
          token: ${{ secrets.GITHUB_TOKEN }}
