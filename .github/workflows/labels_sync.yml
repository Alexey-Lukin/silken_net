# Labels Sync (IaC)
#
# Synchronises the repository labels with the SSOT defined in
# `.github/labels.yml`. delete-other-labels is FALSE (OPS.9) so ephemeral bot
# labels (Dependabot/Snyk/Renovate) and GitHub defaults are NOT wiped on sync.
#
# Doc reference: docs/00_05_GitHub_Projects_and_IaC_Automation.md §2.5.

name: Labels Sync (IaC)

on:
  push:
    branches: [main]
    paths:
      - '.github/labels.yml'
      - '.github/workflows/labels_sync.yml'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Sync labels from .github/labels.yml
        uses: EndBug/label-sync@v2
        with:
          config-file: .github/labels.yml
          delete-other-labels: false
          token: ${{ secrets.GITHUB_TOKEN }}
