name: Smoke · ML log-mel

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

# The conda env install is heavy, so a `changes` job (dorny/paths-filter) gates the
# `smoke` job to PRs that actually touch the ML stack. Everything else uses the
# lighter `ci.yml` firmware job (which checks the committed tables with pure
# stdlib — no conda). Pattern mirrors `in_silico_smoke.yml`. This job is where the
# HEAVY librosa ≡ stdlib parity lives.
#
# Runs on every PR (no pull_request paths-filter): the always-on `ml-ok` aggregate
# emits a status on every PR — that's what lets it become a required branch-
# protection check without hanging unrelated PRs ("waiting for status"). Same
# shape as docs.yml's docs-ok / ci.yml's ci-ok.
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'tools/ml/**'
      - 'firmware/common/logmel_*.h'
      - '.github/workflows/ml_smoke.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      ml: ${{ steps.filter.outputs.ml }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect ML changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ml:
              - 'tools/ml/**'
              - 'firmware/common/logmel_*.h'
              - '.github/workflows/ml_smoke.yml'

  smoke:
    needs: changes
    if: ${{ needs.changes.outputs.ml == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up silken_ml conda env (cached)
        # micromamba caches the whole env keyed on environment.yml hash, so reruns
        # reuse it in ~30 s instead of resolving + downloading each time.
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          environment-file: tools/ml/environment.yml
          environment-name: silken_ml
          cache-environment: true
          cache-downloads: true
          init-shell: bash

      - name: Install silken_ml (editable)
        shell: bash -el {0}
        run: pip install -e tools/ml

      - name: Pytest — incl. librosa ≡ stdlib parity (tol 1e-6)
        shell: bash -el {0}
        run: pytest tools/ml/tests -q

      - name: Firmware tables match the contract (canonical regen)
        shell: bash -el {0}
        run: python -m silken_ml.codegen.emit_c --check

  ml-ok:
    # Single aggregate status check for branch protection — mirrors docs-ok/ci-ok.
    # Because `smoke` is path-gated (skipped on a non-ML PR), it can't be a required
    # check on its own (a skipped required check blocks the merge forever). This job
    # depends on it and fails ONLY if it actually ran and failed/was cancelled.
    name: ML passed
    if: ${{ always() }}
    needs: [changes, smoke]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # [OPS.23] `changes` carries no `if:`, so `success` is its ONLY legal result,
      # while a path-gated job below it may legally be `skipped`. The guard after this
      # one asks only "did anything FAIL?" — so a skipped FILTER would read as an
      # ordinary path-skip, and every skip beneath it happened for a false reason.
      - name: Fail if the change-filter itself did not run
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The change-filter job did not succeed (result: ${{ needs.changes.result }}) — every job below it was skipped for a FALSE reason, so a green aggregate would vouch for nothing. Infrastructure failure, not a code failure: re-run this workflow."
          exit 1
      - name: Fail if the ML smoke job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::The ML smoke job failed or was cancelled — see the job list above."
          exit 1
      - name: All clear
        run: echo "ML smoke passed (path-skipped on a non-ML change is OK)."
