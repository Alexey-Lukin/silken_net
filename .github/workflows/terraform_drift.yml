name: Ops · TF Drift

# Scheduled drift detector: `terraform plan` the GCP root module against LIVE
# state and fail loudly if the deployed infrastructure diverged from committed
# IaC (someone hand-edited a resource in the GCP console, an out-of-band change,
# a half-applied config). A red scheduled run → GitHub notification to the owner
# — honester than a calendar reminder (same pattern as Sec · Image CVE Scan).
#
# Config-half now, value post-deploy: on TRL-3 no `apply` has run yet, so there
# is no state to drift from. The job SKIPS CLEANLY (green) until the WIF provider
# Variable is set (mirrors deploy.yml verify-secrets skip-clean) — it activates the
# moment the first apply lands. Read-only: `plan -lock=false` never takes the
# state lock, so it can never block a real apply.
#
# ⚠️ After setting the WIF Variables + GCP_PROJECT_ID / POSTGRES_PASSWORD secrets,
# VALIDATE immediately via `workflow_dispatch` — do NOT wait for the weekly cron. That's
# the only way to first confirm `plan` runs clean (not just skip-clean-green).
#
# Canon: 06_01 (terraform apply chain) / 06_07 §1 (workflow inventory).
# Tracker: INF.22 (docs/00_07 §06).

on:
  schedule:
    - cron: '43 6 * * 2'   # Tue 06:43 UTC, weekly (unique slot — infra rarely changes)
  workflow_dispatch:

# Least-privilege floor: no untrusted checkout. id-token:write is required for keyless
# WIF auth (INF.22); contents:read for checkout — no other write scopes.
permissions:
  contents: read
  id-token: write

jobs:
  drift:
    name: Terraform plan (drift detect)
    runs-on: ubuntu-latest
    # Required (no-default) terraform vars — this workflow is the LAST holder of a
    # TF_VAR block ([INF.22] removed the `terraform` job, and its vars, from both
    # deploy workflows; ⚠️ "mirror deploy.yml's TF_VAR env" stood here until
    # 2026-08-31, pointing at a referent that no longer exists). The vars must still
    # match what the FOUNDER-LOCAL `apply` passes, or `plan` flags PHANTOM drift —
    # e.g. the OPS.11 billing-budget count-guard collapsing to 0. project_id +
    # db_password are hard-required; billing_account_id keeps the budget in-plan.
    env:
      TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
      TF_VAR_db_password: ${{ secrets.POSTGRES_PASSWORD }}
      TF_VAR_billing_account_id: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
    defaults:
      run:
        working-directory: terraform
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      # Skip cleanly without GCP creds — no red noise before provisioning.
      # `working-directory: .` (not the job-default `terraform`) — checkout has
      # not run yet, so the terraform dir does not exist; overriding avoids a
      # hard-fail that would break the skip-clean design.
      - name: Guard — GCP creds present?
        id: guard
        working-directory: .
        env:
          # [INF.22] Keyless CI: WIF provider + SA email are non-secret repo Variables
          # (auth), GCP_PROJECT_ID / POSTGRES_PASSWORD stay secrets (TF_VARs).
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          # `plan` needs auth (WIF provider + SA, keyless) + GCP_PROJECT_ID
          # (TF_VAR_project_id, regex-validated) + POSTGRES_PASSWORD (TF_VAR_db_password,
          # len≥16). Gating on the provider alone would pass a partially-provisioned repo
          # → plan dies on var validation → red — the exact noise this guard prevents.
          # Mirrors deploy.yml verify-secrets' missing-loop.
          missing=""
          for v in GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID POSTGRES_PASSWORD; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          # GCP_BILLING_ACCOUNT_ID is deliberately NOT gated here — a repo provisioned
          # without billing still gets core-resource drift detection. BUT once a
          # google_billing_budget is in live state, this secret MUST be set (it feeds
          # TF_VAR_billing_account_id above): an empty value collapses the billing
          # module count-guard, so plan wants to DESTROY the budget → exit 2 → red
          # every run. Set it whenever billing is applied (deploy.yml passes it too).
          if [ -n "$missing" ]; then
            echo "::notice::drift check skipped — missing secrets:$missing (config-half ready, activates once fully provisioned + first apply lands)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout code
        if: steps.guard.outputs.configured == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Authenticate to Google Cloud (WIF, keyless)
        if: steps.guard.outputs.configured == 'true'
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Terraform
        if: steps.guard.outputs.configured == 'true'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          # [OPS.21] Той самий точний пін, що валідує `ci.yml`: детектор дрейфу
          # мусить порівнювати стан тим самим бінарником, що його й записав,
          # інакше зміна плану самого Terraform читається як дрейф інфри.
          terraform_version: "1.15.9"
          # terraform_wrapper: false is LOAD-BEARING — the default wrapper's own
          # process exits 0 for BOTH "no diff" AND "diff present", collapsing
          # `plan -detailed-exitcode`'s exit 2 → real drift would read green
          # (setup-terraform#328). Disabling it makes `$?` the real terraform code.
          terraform_wrapper: false

      # -detailed-exitcode: 0 = no drift, 2 = drift (expected alert), 1 = error.
      # -lock=false keeps this read-only so it never blocks a concurrent apply.
      - name: Terraform plan (detailed-exitcode)
        id: plan
        if: steps.guard.outputs.configured == 'true'
        run: |
          terraform init -input=false
          set +e
          terraform plan -detailed-exitcode -lock=false -input=false
          code=$?
          set -e
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then
            echo "::error::terraform plan errored (exit 1) — see log above."
            exit 1
          fi

      - name: Flag drift
        if: steps.guard.outputs.configured == 'true' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::Terraform drift detected — live GCP state diverged from committed IaC (plan exit 2). Review the plan above and reconcile (apply the code, or import the manual change)."
          exit 1
