# CI · Docs — the SINGLE home for the SSOT structural gates (tracker:check /
# docs:check_refs / linter-specs / model_doc_sync / protocols_ref_check). The
# duplicate steps were removed from ci.yml's i18n_check (2026-06-02), so a mixed
# code+docs PR no longer double-runs them.
#
# Runs on EVERY PR/push (no trigger paths-filter): a `changes` job gates the
# heavy `docs_check` to doc-relevant diffs, and the always-on `docs-ok` aggregate
# emits a status on every PR — that one is REQUIRED on `main` (branch-protection).
# A path-filtered required check would block unrelated PRs forever ("waiting for
# status"); `docs-ok` (if: always()) never skips, so it gates docs HARD without
# that trap. Local fast path (no Rails boot, ~0.3s): `ruby scripts/docs_check.rb`.

name: CI · Docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
      - name: Detect doc-relevant changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4
        id: filter
        with:
          filters: |
            docs:
              # Source trees are doc-relevant on purpose: two gates scan them
              # tree-wide — external doc-path drift (stale docs/NN_NN refs in
              # code comments) + code_tracker_id_check (phantom tracker-IDs) —
              # and the canonical-pin/model-sync/FIELDS gates read specific
              # files inside them. A gate whose input is outside this filter
              # is decorative (the bio_contract.rb hole, DOC-T.40 CHECK D).
              - 'docs/**'
              - '**.md'
              - 'app/**'
              - 'bin/**'
              - 'config/**'
              - 'contracts/**'
              - 'db/**'
              - 'firmware/**'
              - 'lib/**'
              - 'scripts/**'
              - 'spec/**'
              - 'tools/**'
              - '.github/**'
              - '.claude/**'  # skills/prompts/hooks carry tracker-IDs → code_tracker_id_check scans them (else decorative)
              # ruby_version_sync mirrors (OPS.13) — guard_registry_sync CHECK D
              # asserts this coverage, so a mirror added there must be added here.
              - 'Gemfile'
              - '.rvmrc'
              - 'Dockerfile'
              - '.ruby-version'

  docs_check:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@d45b1a4e94b71acab930e56e79c6aa188764e7f9 # v1
        with:
          bundler-cache: true

      - name: Lint 00_08 tracker (DRY — duplicate IDs, meta-line, canon-ref resolution)
        run: bin/rails tracker:check

      - name: Lint docs cross-references (SSOT anti-drift — links, TRL, ToC sync, RTC reg-map)
        run: bin/rails docs:check_refs

      - name: Unit-test the doc linters (engine + ToC)
        # Pure-function specs (spec_helper, no Rails/DB). COVERAGE=0 skips the
        # whole-suite minimum_coverage gate — a 2-file subset measures ≈0% overall.
        run: COVERAGE=0 bin/rspec spec/lib/docs_linter_spec.rb spec/lib/docs_toc_spec.rb

      - name: 04_01 model↔code sync (replaces the §12 manual drift-register invariants)
        # Pure Ruby, no Rails — model files ⟷ `### `Model`` headings, concerns,
        # PARTITIONED_TABLES. Catches a model added in code but absent from 04_01.
        run: ruby scripts/model_doc_sync.rb

      - name: docs/protocols/ canon-ref resolution (DOC-T.26 — relative-href blind spot)
        # Pure Ruby, no Rails — the protocols/ subtree refs canon by relative path,
        # which the top-level gates never see; verifies every such ref resolves.
        run: ruby scripts/protocols_ref_check.rb

      - name: Queen energy-budget deploy-gate (HW.39)
        # Pure Ruby, no Rails — параметрична модель = SSOT енерго-чисел 02_05 §4;
        # Phase 1/2.5 winter-balance ≥ margin, Phase 3 warn-only до Starlink bring-up.
        run: ruby tools/firmware/queen_energy_budget.rb --assert

      - name: SCC-rate model guard (E.63)
        # Pure Ruby — SCC-generation rate self-consistency + anti-over-mint стеля;
        # виводить packets×GP з ОДНОГО delta_t → ловить несумісні-числа drift
        # (adversarial 2026-07-14: 24 пакети × 50 GP були фізично несумісні).
        run: ruby tools/firmware/scc_rate.rb --assert

      - name: CEM↔canon geometry guard (HW.33 — shipped cem/*.json ↔ 01_01/01_02/01_04)
        # Pure Ruby stdlib (json) — pins shipped cem geometry to its canon owner;
        # catches what the C# xUnit (validates record-defaults, even locks off-spec
        # 0.8×0.6) + prose-only anchor_dimension_drift both miss (bell_radius=5.0 had
        # no assert anywhere). §01a vilize 2026-07-14.
        run: ruby scripts/cem_canon_sync.rb

      - name: Guard-registry ⟷ code sync (DOC-T.40 — 00_06 §3 rots one-way)
        # Pure Ruby, no Rails — every docs_check run-step / docs.rake failed-label /
        # tracker.rake guard maps to a 00_06 §3 row; files cited in §3 exist;
        # ssot_guard paths↔mappings parity; pinned sources ⊆ this changes-filter.
        run: ruby scripts/guard_registry_sync.rb

      - name: Gate-perimeter meta-guard (OPS.14 — required-check perimeter ⟷ PR-workflows)
        # Pure Ruby, no Rails — classifies EVERY pull_request-triggered workflow
        # (:required / :advisory_by_design / :flip_pending) in a curated PERIMETER
        # SSOT. A NEW deterministic PR-gate born outside the required set → RED
        # "classify it" (the class that let the money-path Solidity audit stay
        # merge-advisory while canon claimed "all gating"). OPS.15/16 landed
        # 2026-07-19 — seven PR-gates required; ONE entry stays flip-pending:
        # dco.yml → UNI.20 (its aggregate is in place, the branch-protection flip
        # is a founder action). Input `.github/**` already in the changes-filter,
        # so the gate is not decorative.
        run: ruby scripts/workflow_gate_perimeter.rb

      - name: FIELDS ⟷ canon sync (OPS.6 — Projects V2 schema vs 00_05 §1.1)
        # Pure Ruby, no Rails — row-scoped GithubBootstrap::FIELDS vs the §1.1
        # table + Module vs the labels.yml closed nine + Semester/Cycle prefix.
        # The Cross-cluster option survived its own retirement 37 days here.
        run: ruby scripts/field_canon_sync.rb

      - name: Governance-key sync (GOV.2 — ProtocolParameters.sol ⟷ ParameterSyncWorker)
        # Pure Ruby, no Rails — the on-chain↔backend bridge rests entirely on
        # keccak256(param_key) string equality. Economic and Lorenz sets are
        # compared SEPARATELY: a Lorenz key MOVED into PARAMETER_MAP leaves the
        # union unchanged, and that move hands governance the lever to break
        # FW.7 device↔server parity.
        run: ruby scripts/governance_key_sync.rb

      - name: Governance-bounds sync (GOV.3 — db/seeds.rb ⟷ PARAMETER_MAP)
        # Pure Ruby, no Rails — sibling of GOV.2 on the OTHER axis of the same
        # worker mirror: the bounds/value_type/category the 9 governance-synced
        # keys write must match their db/seeds.rb defaults (canon 05_06 §7
        # "One-Home меж = PARAMETER_MAP ↔ db/seeds.rb"). Directional — every
        # PARAMETER_MAP key needs a seed with identical config. Closes the E.64
        # drift review caught by hand (stress floor 0.5 seed vs 0.65 map).
        run: ruby scripts/governance_bounds_sync.rb

      - name: Ruby-version parity across дзеркала (OPS.13)
        # Pure Ruby, no Rails — .ruby-version = SSOT; Gemfile hard-pin / .rvmrc /
        # Dockerfile FROM-tag / CLAUDE·AGENTS·copilot / 06_01 Docker-stage мусять
        # нести те саме значення. Клас PR #463: Dependabot бампає лише Dockerfile
        # → образ 4.0.6 vs Gemfile 4.0.5, а на PR образ не збирається взагалі.
        # Сіблінг-half = docker_smoke у ci.yml (повний build без push).
        run: ruby scripts/ruby_version_sync.rb

      - name: Phantom tracker-ID gate (code ⟷ 00_07 ID-set)
        # Pure Ruby, no Rails — every tracker-ID cited in code/workflow text
        # must resolve against 00_07 (items + archive + verbatim facet tags).
        # Proof-case: main.c cited a phantom "-Q2Q" facet on ARCH.35 (real home
        # ARCH.10) and nothing blinked.
        run: ruby scripts/code_tracker_id_check.rb

      - name: Offering-lexicon gate (BIZ.22 — investment wording on customer-facing surfaces)
        # Pure Ruby, no Rails. HARD on the storefront (locale VALUES, manifest,
        # README) — the surfaces the 2026-07-25 sweep cleaned and nothing kept
        # clean; ADVISORY (never fatal) on the response layer still awaiting the
        # securities verdict. Its inputs — config/**, app/**, **.md — are all
        # inside this workflow's `changes` filter, so the gate is not decorative.
        run: ruby scripts/offering_lexicon_check.rb

  docs-ok:
    # Single required status check for the SSOT gates on `main`. Always runs so a
    # code-only PR — where docs_check is path-skipped — still emits a green status;
    # fails only if docs_check actually RAN and failed/was cancelled.
    name: Docs passed
    if: ${{ always() }}
    needs: [changes, docs_check]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Fail if the doc gates failed or were cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          echo "::error::An SSOT doc gate failed (docs:check_refs / tracker:check / linter-specs / model-sync / protocols-ref)."
          exit 1
      - name: All clear
        run: echo "SSOT doc gates passed (path-skipped on a non-docs change is OK)."
