# CI · Docs — the SINGLE home for the SSOT structural gates (tracker:check /
# docs:check_refs / linter-specs / model_doc_sync / protocols_ref_check). The
# duplicate steps were removed from ci.yml's i18n_check (2026-06-02), so a mixed
# code+docs PR no longer double-runs them.
#
# Runs on EVERY PR/push (no trigger paths-filter): a `changes` job gates the
# heavy `docs_check` to doc-relevant diffs, and the always-on `docs-ok` aggregate
# emits a status on every PR — that one is REQUIRED on `main` (branch-protection).
# A path-filtered required check would block unrelated PRs forever ("waiting for
# status"); `docs-ok` (if: always()) never skips, so it gates docs HARD without
# that trap. Local fast path (no Rails boot, ~0.3s): `ruby scripts/docs_check.rb`
# — but that is TWO of this job's steps, not the lane; the whole lane locally is
# `ruby scripts/docs_band.rb`, which reads the step list out of THIS file (OPS.25).

name: CI · Docs

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect doc-relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            docs:
              # Source trees are doc-relevant on purpose: two gates scan them
              # tree-wide — external doc-path drift (stale docs/NN_NN refs in
              # code comments) + code_tracker_id_check (phantom tracker-IDs) —
              # and the canonical-pin/model-sync/FIELDS gates read specific
              # files inside them. A gate whose input is outside this filter
              # is decorative (the bio_contract.rb hole, DOC-T.40 CHECK D).
              - 'docs/**'
              - '**.md'
              - 'app/**'
              - 'bin/**'
              - 'config/**'
              - 'contracts/**'
              - 'db/**'
              - 'firmware/**'
              - 'lib/**'
              - 'scripts/**'
              - 'spec/**'
              - 'tools/**'
              - '.github/**'
              - '.claude/**'  # skills/prompts/hooks carry tracker-IDs → code_tracker_id_check scans them (else decorative)
              # ruby_version_sync mirrors (OPS.13) — guard_registry_sync CHECK D
              # asserts this coverage, so a mirror added there must be added here.
              - 'Gemfile'
              - '.rvmrc'
              - 'Dockerfile'
              - '.ruby-version'
              # SPDX-header gate (UNI.3) scopes these three too. Without them a PR that
              # touches ONLY terraform/subgraph/deploy would skip docs_check entirely —
              # i.e. the gate would sleep on exactly the diffs most able to add an
              # untagged file there. Same decorative-guard class as the bio_contract.rb hole.
              - 'terraform/**'
              - 'subgraph/**'
              - 'deploy/**'
              # Vendored third-party bytes we actually redistribute (UNI.3). Neither
              # instrument saw them before: the inventory is built from MANIFESTS and
              # there is no root package.json, while spdx_headers deliberately
              # DENY-lists vendor/ (we must not stamp OUR SPDX on someone else's file).
              - 'vendor/**'
              - 'THIRD_PARTY_NOTICES'
              - 'NOTICE'

  docs_check:
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Lint 00_07 tracker (DRY — duplicate IDs, meta-line, canon-ref resolution)
        run: bin/rails tracker:check

      - name: Lint docs cross-references (SSOT anti-drift — links, TRL, ToC sync, RTC reg-map)
        run: bin/rails docs:check_refs

      - name: Design-token compliance in shared primitives (UI.1)
        # 04_04 §3.5 forbids raw Tailwind colours in app/views/shared/** and
        # explicitly ALLOWS them in domain page-components. The task's default
        # perimeter used to be the permissive tree, so it policed where the rule
        # is soft and never looked where it is hard; flipped 2026-08-07, and the
        # strict surface measured clean, which is what makes this gateable now.
        run: bin/rails gaia:lint_tokens

      - name: Unit-test the doc linters (engine + ToC)
        # Pure-function specs (spec_helper, no Rails/DB). COVERAGE=0 skips the
        # whole-suite minimum_coverage gate — a 2-file subset measures ≈0% overall.
        run: COVERAGE=0 bin/rspec spec/lib/docs_linter_spec.rb spec/lib/docs_toc_spec.rb

      - name: Cross-tree gates (specs whose INPUT lives outside app/lib/spec)
        # [DOC-T.75, присуд founder 2026-08-14 · розширено DOC-T.76 2026-08-15]
        # Спеки читають `.github/**`, `.claude/**`, `terraform/**`,
        # `deploy/**` — і жодне з цих дерев не входить
        # у `changes`-фільтр `ci.yml` (`ruby || ci`), де вони жили в джобі `test`.
        # Тобто вони не бігли на змінах того, що стережуть, і працювали лише як
        # побічний ефект чужого діфу (§Guard-craft #1 — декоративний за ВХОДОМ).
        # Фільтр ЦЬОГО workflow покриває всі чотири дерева й був розширений саме
        # проти цього класу («a PR that touches ONLY terraform/subgraph/deploy
        # would skip docs_check entirely»), тож дім гейтів — тут.
        #
        # Rails тут НЕМАЄ за побудовою (жоден крок цієї джоби не тягне
        # `:environment`), тому спеки переведені з `rails_helper` на `spec_helper`,
        # а `Rails.root` замінено на `spec/support/repo_root.rb` — корінь виводиться
        # з розташування самого файлу. COVERAGE=0 — субсет-прогін, як і сусід вище.
        #
        # 🔴 [DOC-T.76] Сусіди мали рівно ту саму ваду й лишились у `test`:
        # `alloy_scrape_topology`, `anchor_coap_env`, `database_dr_posture`,
        # `grafana_alerts`. Тобто PR, що ламає scrape-топологію Alloy, свого
        # гейта НЕ запускав. Клас закривали один раз — на половині його населення; периметр
        # питають переліком КАТАЛОГІВ, а не переліком уже перевіреного.
        # ⚠️ `grafana_alerts` додатково вантажить `config/initializers/prometheus.rb`
        # ЛІНИВО й під гардом: реєстр метрик не має Rails-вільного дому, а Rails
        # вантажить той файл через `load`, який не пише в `$LOADED_FEATURES`.
        # 🔴 [INF.26, 2026-08-29] `metric_registry_doc_sync` приїхав сюди з ТІЄЇ Ж
        # причини, і його випадок гостріший за сусідів: доти він жив лише в джобі
        # `test`, чий фільтр (`ruby`) не містить ані `deploy/**`, ані `docs/**` —
        # тобто PR, що ВИДАЛЯЄ alert-правило (єдиного споживача метрики), не
        # запускав рівно той гейт, який це стереже. Гейт був би зелений не тому,
        # що дерево здорове, а тому, що він не біг.
        run: COVERAGE=0 bin/rspec spec/quality/claude_prose_path_refs_spec.rb spec/quality/skill_gotcha_numbering_spec.rb spec/quality/structure_sql_pg_portability_spec.rb spec/quality/no_future_dated_claims_spec.rb spec/lib/workflow_gate_perimeter_spec.rb spec/deploy/terraform_workflow_var_parity_spec.rb spec/deploy/coap_host_consistency_spec.rb spec/deploy/env_fetch_declaration_spec.rb spec/deploy/alloy_scrape_topology_spec.rb spec/deploy/anchor_coap_env_spec.rb spec/deploy/database_dr_posture_spec.rb spec/deploy/grafana_alerts_spec.rb spec/quality/metric_registry_doc_sync_spec.rb spec/quality/mint_prefix_parity_spec.rb spec/quality/subgraph_abi_parity_spec.rb spec/quality/subgraph_entity_completeness_spec.rb spec/quality/vendored_component_inventory_spec.rb

      - name: 04_01 model↔code sync (replaces the §12 manual drift-register invariants)
        # Pure Ruby, no Rails — model files ⟷ `### `Model`` headings, concerns,
        # PARTITIONED_TABLES. Catches a model added in code but absent from 04_01.
        run: ruby scripts/model_doc_sync.rb

      - name: 04_04 component↔code sync (UI.12 — the last registry with no gate)
        # Pure Ruby, no Rails — app/views/components/** ⟷ §6.4 rows, shared/{ui,iot,
        # web3} ⟷ §6.1–6.3, namespace dirs ⟷ the §1 hierarchy tree. The registry
        # writes a component in THREE row forms; a parser that knows one reports a
        # drift ~7× the real one, which is how this gate's own item was mis-sized.
        run: ruby scripts/component_doc_sync.rb

      - name: docs/protocols/ canon-ref resolution (DOC-T.26 — relative-href blind spot)
        # Pure Ruby, no Rails — the protocols/ subtree refs canon by relative path,
        # which the top-level gates never see; verifies every such ref resolves.
        run: ruby scripts/protocols_ref_check.rb

      - name: Queen energy-budget deploy-gate (HW.39)
        # Pure Ruby, no Rails — параметрична модель = SSOT енерго-чисел 02_05 §4;
        # Phase 1/2.5 winter-balance ≥ margin, Phase 3 warn-only до Starlink bring-up.
        run: ruby tools/firmware/queen_energy_budget.rb --assert

      - name: SCC-rate model guard (E.63)
        # Pure Ruby — SCC-generation rate self-consistency + anti-over-mint стеля;
        # виводить packets×GP з ОДНОГО delta_t → ловить несумісні-числа drift
        # (adversarial 2026-07-14: 24 пакети × 50 GP були фізично несумісні).
        run: ruby tools/firmware/scc_rate.rb --assert

      - name: Supply-stress model guard (E.67)
        # Pure Ruby — ВІДТВОРЮЄ канон-деривацію 05_03 MAX_SUPPLY чисельно
        # (2M дерев × 50 SCC/рік = 10 років). Той ланцюг живе прозою в одному
        # рядку канону, тож зміна MAX_SUPPLY чи emission_threshold лишає його
        # правдоподібним і хибним. Плюс ловить змішування балів із монетами
        # (курс 10 000:1) і burn повз positive-A гейт [SLASH-1].
        run: ruby tools/tokenomics/supply_stress.rb --assert

      - name: GUM uncertainty-budget (STK.5)
        # Pure Ruby — бюджет невизначеності тракту delta_t→GP→SCC. Пінить, що
        # EMA-редукція відтворює канон-цифри 03_01 з ТОГО САМОГО α, що прошитий
        # у firmware (доми різні, тож розходяться тихо), що квадратура GUM
        # порахована правильно, і що ланцюг ЗУПИНЕНО на SCC — крок SCC→tCO₂ є
        # обліковою конвенцією, і приписати їй інструментальну невизначеність
        # означало б видати домовленість за вимірювану величину.
        run: ruby tools/firmware/uncertainty_budget.rb --assert

      - name: Verdict-denominator sensitivity (SLASH-1)
        # Pure Ruby — будує ПОПУЛЯЦІЮ кластера й проганяє гілку СМЕРТІ вироку через
        # три політики знаменника. Сусідній supply_stress бере damage_ratio екзогенним
        # випадковим кидком, тобто на питання «чи мовчання робить дерево вибулим для
        # РОЗМІРУ вироку» відповісти не здатен за побудовою. Інваріанти пінять обидва
        # роги: недокарання суцільної вирубки, що прийшла тишею (чинна політика), і
        # вироджений край, де виключення тиші дає 1/1 = 100% на здоровому кластері.
        run: ruby tools/tokenomics/verdict_sensitivity.rb --assert

      - name: CEM↔canon geometry guard (HW.33 — shipped cem/*.json ↔ 01_01/01_02/01_04)
        # Pure Ruby stdlib (json) — pins shipped cem geometry to its canon owner;
        # catches what the C# xUnit (validates record-defaults, even locks off-spec
        # 0.8×0.6) + prose-only anchor_dimension_drift both miss (bell_radius=5.0 had
        # no assert anywhere). §01a vilize 2026-07-14.
        run: ruby scripts/cem_canon_sync.rb

      - name: Guard-registry ⟷ code sync (DOC-T.40 — 00_06 §3 rots one-way)
        # Pure Ruby, no Rails — every docs_check run-step / docs.rake failed-label /
        # tracker.rake guard maps to a 00_06 §3 row; files cited in §3 exist;
        # ssot_guard paths↔mappings parity; pinned sources ⊆ this changes-filter.
        run: ruby scripts/guard_registry_sync.rb

      - name: Gate-perimeter meta-guard (OPS.14 — required-check perimeter ⟷ PR-workflows)
        # Pure Ruby, no Rails — classifies EVERY pull_request-triggered workflow
        # (:required / :advisory_by_design / :flip_pending) in a curated PERIMETER
        # SSOT. A NEW deterministic PR-gate born outside the required set → RED
        # "classify it" (the class that let the money-path Solidity audit stay
        # merge-advisory while canon claimed "all gating"). The required set is
        # eight PR-gates and the flip-pending bucket is empty. The script now also
        # cross-checks that claim against every prose home (DOC-T.51) — so this very
        # comment is gated. Input `.github/**` already in the changes-filter,
        # so the gate is not decorative.
        run: ruby scripts/workflow_gate_perimeter.rb

      - name: Governance-key sync (GOV.2 — ProtocolParameters.sol ⟷ ParameterSyncWorker)
        # Pure Ruby, no Rails — the on-chain↔backend bridge rests entirely on
        # keccak256(param_key) string equality. Economic and Lorenz sets are
        # compared SEPARATELY: a Lorenz key MOVED into PARAMETER_MAP leaves the
        # union unchanged, and that move hands governance the lever to break
        # FW.7 device↔server parity.
        run: ruby scripts/governance_key_sync.rb

      - name: Anchor payload sync (ARCH.97 — aggregate_payload ⟷ 5 mirrors + DDL scale)
        # Pure Ruby, no Rails. The L1 state-root payload's field composition is
        # the instruction an EXTERNAL auditor follows to reproduce the hash, and
        # it lives in five mirrors (E.53/E.54 left the NatSpec 3-field for
        # months). Two axes, deliberately separate: composition/order parity,
        # and the SCALE of every decimal column — a column narrower than its
        # `numeric(24,6)` source makes an honest anchor fail its own verify.
        run: ruby scripts/anchor_payload_sync.rb

      - name: Solidity signature arity (DOC-T.89 — contracts/*.sol ⟷ canon restatements)
        # Pure Ruby, no Rails. contracts/*.sol is the code-SSOT of every on-chain
        # signature; 05_03 (the home) and 05_01 (a neighbouring module's summary)
        # restate them, and both mirrors are WANTED — so pin them rather than
        # delete them. E.60 added `bytes32 archiveRoot` to mint/batchMint and to
        # both Minted events; the canon kept the 4-param form in TWENTY places
        # and went on certifying ✅ in its own matrix against a signature neither
        # the contract nor subgraph.yaml uses. No ref-gate can see that (a ref
        # gate judges resolution, never truth), and the canonical-pin engine
        # extracts `NAME = value`, so it is blind to parameter lists. The axis is
        # ARITY only — the one property all four spelling dialects agree on.
        # Inputs `docs/**` + `contracts/**` are already in the changes-filter.
        run: ruby scripts/solidity_signature_arity_check.rb

      - name: On-chain role registry sync (ARCH.112 — кожна роль має вирок про складання)
        # Pure Ruby, no Rails. Ролі роздають окремими комітами, а перелік того, що
        # СКЛАДАЄТЬСЯ, пишуть один раз — тож він старіє тільки в бік НЕПОВНОТИ й
        # нічим не червоніє. Виміряно на собі: `EXECUTOR_ROLE` (відкритий екзекутор
        # — повноваження, яке має весь світ) не існував у каноні зовсім, а
        # `CANCELLER_ROLE` випав із renounce-переліку SEC.1, тобто постійне вето над
        # DAO лишалось не присудом, а пропуском. ⛔ Вісь — КОНСТАНТИ ролей, не виклики
        # `grantRole`: EXECUTOR приходить масивом `executors` у конструкторі
        # TimelockController, тож форма «шукати grantRole» була б сліпа саме на ній.
        # Inputs `contracts/**` + `docs/**` уже в changes-filter.
        run: ruby scripts/onchain_role_registry_sync.rb

      - name: Governance-bounds sync (GOV.3 — db/seeds.rb ⟷ PARAMETER_MAP)
        # Pure Ruby, no Rails — sibling of GOV.2 on the OTHER axis of the same
        # worker mirror: the bounds/value_type/category the 9 governance-synced
        # keys write must match their db/seeds.rb defaults (canon 05_06 §7
        # "One-Home меж = PARAMETER_MAP ↔ db/seeds.rb"). Directional — every
        # PARAMETER_MAP key needs a seed with identical config. Closes the E.64
        # drift review caught by hand (stress floor 0.5 seed vs 0.65 map).
        run: ruby scripts/governance_bounds_sync.rb

      - name: Ruby-version parity across дзеркала (OPS.13)
        # Pure Ruby, no Rails — .ruby-version = SSOT; Gemfile hard-pin / .rvmrc /
        # Dockerfile FROM-tag / CLAUDE·AGENTS·copilot / 06_01 Docker-stage мусять
        # нести те саме значення. Клас PR #463: Dependabot бампає лише Dockerfile
        # → образ 4.0.6 vs Gemfile 4.0.5, а на PR образ не збирається взагалі.
        # Сіблінг-half = docker_smoke у ci.yml (повний build без push).
        run: ruby scripts/ruby_version_sync.rb

      - name: Phantom tracker-ID gate (code ⟷ 00_07 ID-set)
        # Pure Ruby, no Rails — every tracker-ID cited in code/workflow text
        # must resolve against 00_07 (items + archive + verbatim facet tags).
        # Proof-case: main.c cited a phantom "-Q2Q" facet on ARCH.35 (real home
        # ARCH.10) and nothing blinked.
        run: ruby scripts/code_tracker_id_check.rb

      - name: code→doc §-ref resolution (DOC-T.48 — the doc gates never read code comments)
        # Pure Ruby, no Rails. `docs:check_refs` scans docs/** ONLY, so a `NN_NN §X`
        # cited in a code comment or a .claude routing file rots silently through a
        # canon renumber (proof-case: ~18 stale `00_01 §6.x` refs in app/+spec/ after
        # slashing moved to 05_05). Report-only 2026-06-16 → HARD 2026-07-25 on its own
        # stated condition (0 violations across the 926-file scan). Its inputs — app/**,
        # spec/**, lib/**, .claude/** — are all inside this workflow's `changes` filter.
        run: ruby scripts/code_doc_section_refs.rb

      - name: Offering-lexicon gate (BIZ.22 — investment wording on customer-facing surfaces)
        # Pure Ruby, no Rails. HARD on the storefront (locale VALUES, manifest,
        # README) — the surfaces the 2026-07-25 sweep cleaned and nothing kept
        # clean; ADVISORY (never fatal) on the response layer still awaiting the
        # securities verdict. Its inputs — config/**, app/**, **.md — are all
        # inside this workflow's `changes` filter, so the gate is not decorative.
        run: ruby scripts/offering_lexicon_check.rb

      - name: SPDX per-file licence headers (UNI.3 — every in-scope source file tagged)
        # Pure Ruby, no Rails. The SAME engine that performed the rollout, run in
        # --check mode — so the gate cannot drift from what it guards, which is the
        # failure mode every hand-written mirror-gate in this repo has had. Exit 1 on
        # a missing tag, a foreign identifier, or an in-scope file whose language the
        # engine has no comment syntax for. A NEW vendored file carrying somebody
        # else's copyright is reported and never stamped — resolve it by hand, then
        # record the verdict in the script's DENY list.
        run: ruby scripts/spdx_headers.rb --check

      - name: Memory-gate self-test (DOC-T.59 — the gate that guards memory had no tests)
        # Pure bash, no Rails, no access to the real corpus: the battery builds a
        # throwaway fixture in mktemp and points the gate at it via MEMORY_GATE_DIR.
        # Why it is here rather than in spec/: the corpus lives OUTSIDE this repo, so
        # a Rails spec would have nothing to assert against — but the gate itself is
        # in-tree and inside this workflow's `.claude/**` change filter.
        # Proof-case for its existence: this file once shipped an overlap check whose
        # floor sat at 167% of the population maximum — green on every possible corpus
        # state, for weeks, read as "blunt" rather than dead. Case 1 is a HEALTHY
        # fixture that must stay silent, so the battery cannot be satisfied by a gate
        # that fires unconditionally.
        run: bash .claude/hooks/memory_gate.sh --selftest

      - name: Docs · zsh word-splitting scanner self-test
        # `bash_verify_guard.sh` rule C denies a command on this scanner's word,
        # so the scanner is on the critical path of every Bash call — and it is a
        # hand-written parser, which is exactly the thing that rots quietly. The
        # battery pins both directions: five commands that MUST be caught and
        # twelve safe idioms (a $(subst), a zsh array, a glob, an assignment RHS,
        # a paren inside quotes) that must stay silent, because a detector that
        # fires unconditionally would block ordinary shell work.
        run: ruby .claude/hooks/zsh_split_scan.rb --selftest

      - name: Docs · bash-guard hook self-test
        # The PreToolUse hook DENIES real shell work (backtick-in-commit, rg -rn,
        # unsplit scalars, and rule E: a verify-gate laundered past git commit/push
        # with `;` or a pipe — the shape that pushed a red docs band to main twice,
        # 2026-08-16/2026-08-20). A rotten detector is therefore either blocked work
        # or a dark carrier whose silence reads as safety. The battery pins BOTH
        # arms of rule E (5 laundered forms must deny; the clean-&& house idiom and
        # gate names inside heredoc/-m message text must stay silent) plus smoke
        # over the standing deny/warn rules. The two anti-false-positive cases are
        # mutation-calibrated: with the heredoc/-m strips disabled they flip to a
        # false deny — their first drafts did not, i.e. were vacuous, and only the
        # mutants exposed that.
        run: bash .claude/hooks/bash_verify_guard.sh --selftest

      - name: Docs · Generated skill indexes ⇄ their sources
        # One engine, a TABLE of targets (scripts/guard_craft_index.rb TARGETS) — a
        # copy per skill would be the second-home defect the engine exists to prevent.
        # Do NOT restate the target list or its size here: it grew from two to five in
        # a single day (2026-08-22) and this comment did not follow, which is the
        # mirror-half class the engine itself guards against. The current roster and
        # each floor are readable from TARGETS; this step proves them, and `--check`
        # prints them.
        # Why generated at all: a split skill keeps its bodies in a companion file and
        # its SKILL.md carries a GENERATED one-line index, because those skills
        # auto-invoke on most sessions and the bodies do not need to. A hand-edited
        # index would be a second home for every rule — the exact class §Guard-craft
        # #31 describes — so the index is regenerated, never written, and this step is
        # what makes that true rather than intended. Unlike the memory gates it CAN
        # run here: both files are in the repo.
        run: ruby scripts/guard_craft_index.rb --check

  docs-ok:
    # Single required status check for the SSOT gates on `main`. Always runs so a
    # code-only PR — where docs_check is path-skipped — still emits a green status;
    # fails only if docs_check actually RAN and failed/was cancelled.
    name: Docs passed
    if: ${{ always() }}
    needs: [changes, docs_check]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # [OPS.23] `changes` carries no `if:`, so `success` is its ONLY legal result,
      # while a path-gated job below it may legally be `skipped`. The guard after this
      # one asks only "did anything FAIL?" — so a skipped FILTER would read as an
      # ordinary path-skip, and every skip beneath it happened for a false reason.
      - name: Fail if the change-filter itself did not run
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The change-filter job did not succeed (result: ${{ needs.changes.result }}) — every job below it was skipped for a FALSE reason, so a green aggregate would vouch for nothing. Infrastructure failure, not a code failure: re-run this workflow."
          exit 1
      - name: Fail if the doc gates failed or were cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        # [OPS.30] Вердикт мусить називати ЕТАП: `failure` = перевірка виконалась
        # і сказала «ні»; `cancelled` = вона НЕ БІГЛА (стеля `timeout-minutes`
        # або скасування прогону). Один меседж на два світи читається як
        # «впали тести» і жене наступний прохід шукати дефект у власному діфі.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries|map(select(.value.result=="failure").key)|join(", ")' <<<"$NEEDS_JSON")
          stopped=$(jq -r 'to_entries|map(select(.value.result=="cancelled").key)|join(", ")' <<<"$NEEDS_JSON")
          if [ -n "$failed" ]; then
            echo "::error title=ВПАЛО (вердикт є)::${failed} — An SSOT doc gate failed (docs:check_refs / tracker:check / linter-specs / model-sync / protocols-ref)."
          fi
          if [ -n "$stopped" ]; then
            echo "::error title=НЕ БІГЛО (вердикту НЕМАЄ)::${stopped} — скасовано: стеля timeout-minutes або скасування прогону. Це не твердження про код."
          fi
          exit 1
      - name: All clear
        run: echo "SSOT doc gates passed (path-skipped on a non-docs change is OK)."
