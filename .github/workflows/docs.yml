# Docs CI — the SINGLE home for the SSOT structural gates. (2026-06-02: the duplicate
# `docs:check_refs`/`tracker:check` steps were removed from ci.yml's i18n_check, so a
# mixed code+docs PR no longer double-runs them.) ci.yml `paths-ignore`s **.md/docs/**
# and owns only code concerns; this workflow owns the doc gates:
#   - tracker:check    (00_07 DRY: duplicate IDs, meta-line, canon-ref + §-resolution)
#   - docs:check_refs  (anti-drift: dangling links, TRL, ToC sync, conformance, RTC/
#                       Lorenz/rate One-Home, #anchors, xref-form, EXTERNAL doc-path —
#                       lib/docs_linter.rb)
#   - model_doc_sync   (04_01 ⟷ app/models/: model headings, concerns, partitions —
#                       scripts/model_doc_sync.rb; replaces the old §12 manual register)
#   - protocols_ref_check (docs/protocols/ → canon RESOLUTION: relative-href target exists,
#                       §X + #anchor resolve, bare-mention prefix exists — DOC-T.26 blind spot)
#
# Triggers on the docs + the linter engine/specs (so a rule change re-validates the
# corpus) + `.github/**` — the external-doc-path guard scans .github/ + root *.md for
# stale `docs/NN_NN` refs, so it MUST run when those change. Root *.md (README/CLAUDE/
# AGENTS) is covered by `**.md`.
#
# Local fast path (no Rails boot, ~0.3s, no bundle needed): `ruby scripts/docs_check.rb`.
#
# ⚠️ Branch-protection: `main` is currently UNPROTECTED (no required checks). When it
# is enabled, mark `docs_check` required — a docs-only PR skips ci.yml (paths-ignore),
# so ci jobs alone would never gate docs.
name: Docs CI

on:
  pull_request:
    paths:
      - 'docs/**'
      - '**.md'
      - 'lib/docs_linter.rb'
      - 'lib/docs_toc.rb'
      - 'lib/docs_graph.rb'
      - 'lib/tasks/docs.rake'
      - 'lib/tracker/**'
      - 'lib/tasks/tracker.rake'
      - 'spec/lib/docs_linter_spec.rb'
      - 'spec/lib/docs_toc_spec.rb'
      - 'scripts/model_doc_sync.rb'
      - 'scripts/protocols_ref_check.rb'
      - 'app/models/**'
      - 'app/services/**'
      - 'app/workers/**'
      - '.github/**'
  push:
    branches: [ main ]
    paths:
      - 'docs/**'
      - '**.md'
      - 'lib/docs_linter.rb'
      - 'lib/docs_toc.rb'
      - 'lib/docs_graph.rb'
      - 'lib/tasks/docs.rake'
      - 'lib/tracker/**'
      - 'lib/tasks/tracker.rake'
      - 'spec/lib/docs_linter_spec.rb'
      - 'spec/lib/docs_toc_spec.rb'
      - 'scripts/model_doc_sync.rb'
      - 'scripts/protocols_ref_check.rb'
      - 'app/models/**'
      - 'app/services/**'
      - 'app/workers/**'
      - '.github/**'

permissions:
  contents: read

jobs:
  docs_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Lint 00_08 tracker (DRY — duplicate IDs, meta-line, canon-ref resolution)
        run: bin/rails tracker:check

      - name: Lint docs cross-references (SSOT anti-drift — links, TRL, ToC, RTC reg-map)
        run: bin/rails docs:check_refs

      - name: Unit-test the doc linters (engine + ToC)
        # Pure-function specs (spec_helper, no Rails/DB). COVERAGE=0 skips the
        # whole-suite minimum_coverage gate — a 2-file subset measures ≈0% overall.
        run: COVERAGE=0 bin/rspec spec/lib/docs_linter_spec.rb spec/lib/docs_toc_spec.rb

      - name: 04_01 model↔code sync (replaces the §12 manual drift-register invariants)
        # Pure Ruby, no Rails — model files ⟷ `### `Model`` headings, concerns,
        # PARTITIONED_TABLES. Catches a model added in code but absent from 04_01.
        run: ruby scripts/model_doc_sync.rb

      - name: docs/protocols/ canon-ref resolution (DOC-T.26 — relative-href blind spot)
        # Pure Ruby, no Rails — the protocols/ subtree refs canon by relative path, which
        # the top-level gates never see; verifies every such ref resolves (target/§/anchor).
        run: ruby scripts/protocols_ref_check.rb
