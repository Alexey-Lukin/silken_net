name: Deploy · Canopy

on:
  workflow_run:
    workflows: ["CI · Code"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      alloy:
        # [OPS.37, 2026-09-03] `config.alloy` is mounted at accessory BOOT and `boot` skips an
        # existing container, so a scrape-topology change needs a deliberate `reboot`. The
        # laptop path (`kamal accessory reboot alloy`) dies on the deploy-SA posix account
        # (deploy skill gotcha 10); this input runs the same act where the secrets already are.
        description: "Alloy accessory action: boot (idempotent, default) or reboot (re-reads config.alloy)"
        type: choice
        options: [boot, reboot]
        default: boot
      redis:
        # [INF.28, 2026-09-03] The canopy Redis accessory takes its `requirepass` from REDIS_URL at
        # BOOT, and `boot` skips an existing container — so a rotated CANOPY_REDIS_URL needs a
        # deliberate `reboot` here (same reason as Alloy: the laptop `kamal accessory reboot` path
        # dies on the deploy-SA posix account). AOF data survives — it lives in a host directory.
        description: "Canopy Redis accessory action: boot (idempotent, default) or reboot (re-reads REDIS_URL)"
        type: choice
        options: [boot, reboot]
        default: boot

concurrency:
  group: deploy-canopy
  cancel-in-progress: false

permissions:
  contents: read

# ⛔ [INF.22] `TF_VAR_*` тут БІЛЬШЕ НЕМА — вони поїхали разом із джобою `terraform`
# (⚖️ founder 2026-08-29, повна підстава — біля місця, де та джоба стояла). Знімаються
# ТИМ САМИМ рухом свідомо: змінна, яку не читає жоден крок, є не «запасом», а мертвим
# конфігом — і тут вона дорожча за звичайний мертвий рядок, бо `spec/deploy/
# terraform_workflow_var_parity_spec.rb` визначає «terraform-воркфлоу» САМЕ за
# наявністю `TF_VAR_`. Лишити їх означало б тримати гейт зеленим над воркфлоу, який
# terraform більше не запускає, тобто судити фікцію. Дім guarded-змінних після цього —
# `terraform_drift.yml` (єдиний, хто справді біжить проти реальних vars) + локальний
# apply founder'а; `GCP_BILLING_ACCOUNT_ID` став drift-only → `06_04 §1`.
# SSH secrets removed (INF.20 (в)): admin path = IAP tunnel + OS Login; the CI
# kamal leg needs the (б) glue (ssh.proxy_command + SA tunnel role) before it can
# reach the Anchor — until then the kamal step is honestly non-functional.

jobs:
  changes:
    name: Detect deploy-relevant changes [INF.9]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read   # workflow runs + jobs of THIS workflow — the deploy-relevance base
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      # [OPS.36] BLOCK, not audit: the allowlist below is the StepSecurity baseline of this job
      # (1 292 job runs, unchanged over the last 1 248 — recommended policy read 2026-09-02 from
      # runs 33597709126 · 33612548198). The job talks to the GitHub API and nothing else.
      # Production keeps `audit` until ITS first real deploy has produced ITS baseline (06_07 §1a).
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            api.github.com:443
            cafe.github.com:443
      - name: Decide whether the canopy deploy is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # [INF.9] Manual dispatch always deploys. A post-CI workflow_run deploys only
          # when image-relevant (same list as mirror-ghcr — canopy is CONTINUOUS for app
          # code) or infra files changed; firmware/docs/tools/contracts-only commits used
          # to drag the whole kamal chain for nothing.
          # ⛔ [INF.22] `terraform/` вибуло з переліку разом із джобою `terraform`: коміт,
          # що чіпає лише IaC, більше не спричиняє тут ЖОДНОЇ terraform-дії, тож тягнув би
          # kamal-ланцюг рівно за те, проти чого цей фільтр і стоїть. Apply — founder-local.
          # Changed files come from
          # the GitHub API, not a checkout of head_sha (untrusted-code vector — see
          # mirror-ghcr.yml). On any ambiguity we deploy — it is idempotent and cheap.
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # 🔴 [2026-09-02] The base of the diff is NOT the parent commit. `commits/${HEAD_SHA}`
          # lists the files of ONE commit, so a multi-commit push whose last commit is docs-only
          # (push bef5f653..b51e5fc4: three code fixes + one docs commit) reported "No
          # deploy-relevant files changed" and skipped a deploy carrying a secrets-parser fix —
          # green `success`, nothing deployed. The honest base is the SHA canopy is actually
          # RUNNING: the head of the newest run whose `Kamal Deploy (Canopy)` job succeeded. The
          # question this job exists to answer is "did anything deploy-relevant change since what
          # is live", and only that base asks it. Pinned by spec/deploy/deploy_relevance_base_spec.rb.
          BASE=""
          for run in $(gh api "repos/${{ github.repository }}/actions/workflows/deploy.yml/runs?status=completed&per_page=30" -q '.workflow_runs[] | "\(.id):\(.head_sha)"' 2>/dev/null); do
            id="${run%%:*}"; sha="${run##*:}"
            if gh api "repos/${{ github.repository }}/actions/runs/${id}/jobs" -q '.jobs[] | select(.name == "Kamal Deploy (Canopy)" and .conclusion == "success") | .name' 2>/dev/null | grep -q .; then
              BASE="$sha"; break
            fi
          done
          if [ -z "$BASE" ]; then
            echo "::notice::No previous successful canopy deploy found — deploying."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if [ "$BASE" = "$HEAD_SHA" ]; then
            echo "::notice::HEAD ${HEAD_SHA} is what canopy already runs — skipping [INF.9]."
            echo "deploy=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(gh api "repos/${{ github.repository }}/compare/${BASE}...${HEAD_SHA}" -q '.files[].filename' 2>/dev/null); then
            echo "::warning::Could not diff ${BASE}...${HEAD_SHA} via API — deploying to be safe."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          # The compare API caps `.files` at 300; a capped list is an ambiguity, and ambiguity deploys.
          if [ "$(printf '%s\n' "$changed" | grep -c .)" -ge 300 ]; then
            echo "::warning::compare returned 300+ files (API cap) — deploying to be safe."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|Gemfile|Gemfile\.lock|\.ruby-version|Procfile|Rakefile|config\.ru|app/|lib/|config/|bin/|db/|public/|vendor/|\.kamal/|\.github/workflows/deploy\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No deploy-relevant files changed — skipping the canopy deploy [INF.9]."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  verify-secrets:
    name: Verify Required Secrets [SEC.11]
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
      # [OPS.37 review 2026-09-02] Which Kamal roles this deploy may boot: `web` always, `job`
      # only when its eight testnet signer twins exist — the gate is per ROLE, not per slot.
      roles: ${{ steps.check.outputs.roles }}
    steps:
      # [OPS.36] BLOCK with an EMPTY allowlist: this job is pure shell over `${{ secrets }}`, and
      # the StepSecurity baseline recorded zero outbound destinations — the one job in the tree
      # where "no egress at all" is the honest policy, and where an exfiltration would be loudest.
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: ""
      - name: Verify deploy secrets [B1]
        id: check
        env:
          # Boot-critical: empty → container crashes on boot. (Доти рядок казав ще й
          # «or terraform can't apply» — джоби `terraform` тут більше немає, INF.22.)
          # Mirror config/deploy.yml env.secret (the kamal-deploy env: block below)
          # + the infra prerequisites (GCP project). SSH secrets removed — INF.20 (в):
          # IAP tunnel + OS Login, no key material to provision.
          # KAMAL_MASTER_KEY removed — phantom: Kamal 2.x has no such mechanism and
          # nothing in .kamal/ consumes it (plain $VAR secrets file, not encrypted).
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
          # [SEC.22] AR-encryption keys — boot-critical (fail-closed initializer);
          # declared in env.secret + secrets-common → unmapped here = "" injection
          # → crash after a green verify (B1 class).
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
          # [INF.22] Keyless CI: the WIF provider + SA email are non-secret repo
          # VARIABLES, not GCP_SA_KEY. Their presence is the "infra provisioned"
          # deploy-gate signal that GCP_SA_KEY used to carry.
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CANOPY_REDIS_URL: ${{ secrets.CANOPY_REDIS_URL }}
          # 🔴 [INF.4 2026-08-31] Origin-TLS pair — boot-critical since `proxy.ssl` went LIVE,
          # and it is here because the failure is COMPLETELY SILENT. `.kamal/secrets-common`
          # declares both names, so `Kamal::Secrets#[]` does NOT raise "Secret not found" — it
          # returns the EMPTY STRING; and `Kamal::Cli::App::SslCertificates#run` guards with
          # `if cert_content = …`, where "" is truthy in Ruby. So kamal happily uploads an empty
          # cert.pem/key.pem (mode 0644), kamal-proxy cannot serve TLS, and Cloudflare — Full
          # (strict) on both zones — answers 521/525 on every request behind a fully GREEN deploy
          # (and a bare 521 also means the anchor has no HAProxy — measured 2026-09-02).
          # Neither list carried them before, so there was not even a ::warning:: (06_04 §1).
          TLS_ORIGIN_CERT_PEM: ${{ secrets.TLS_ORIGIN_CERT_PEM }}
          TLS_ORIGIN_KEY_PEM: ${{ secrets.TLS_ORIGIN_KEY_PEM }}
          # The PRODUCTION money/signing quintet stays ABSENT (INF.22): environment-scoped
          # to `production`, unreadable here, and never read on this slot. What canopy
          # boots its own `job:` role on is the TESTNET twin set further down [OPS.37].
          HELIUM_WEBHOOK_SECRET: ${{ secrets.HELIUM_WEBHOOK_SECRET }}
          # Runtime (lazy): feature degraded until provisioned, not a boot crash. Warn only.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FILECOIN_API_KEY: ${{ secrets.FILECOIN_API_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          # 🔴 [INF.27 move (3), 2026-09-02] Canopy is a TESTNET slot: the four RPCs it boots on
          # are the CANOPY_* twins, and they are BOOT-CRITICAL here, not RUNTIME. An unset twin
          # resolves to the overlay's loud placeholder (`.kamal/secrets.canopy`), which the chain
          # guard reads as a non-testnet endpoint and REFUSES — so "skip clean" here is the honest
          # form of "not provisioned yet", and the mainnet names are deliberately NOT read on
          # this slot any more (they would only warn about secrets canopy never uses).
          CANOPY_ALCHEMY_POLYGON_RPC_URL: ${{ secrets.CANOPY_ALCHEMY_POLYGON_RPC_URL }}
          CANOPY_ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.CANOPY_ALCHEMY_ETHEREUM_RPC_URL }}
          CANOPY_SOLANA_RPC_URL: ${{ secrets.CANOPY_SOLANA_RPC_URL }}
          CANOPY_CELO_RPC_URL: ${{ secrets.CANOPY_CELO_RPC_URL }}
          # 🔴 [OPS.37 ⚖️ founder 2026-09-02] Canopy carries its own `job:` role, so it needs a
          # TESTNET signer set of its own — the `CANOPY_*` twins below (repo-level; the
          # production quintet stays Environment-scoped and unreadable here). ALL EIGHT are
          # JOB-critical and none is "lazy" — adversarial review 2026-09-02: every twinned name
          # passes through `.kamal/secrets.canopy`, which turns an ABSENT twin into a PRESENT
          # `…_NOT_SET` placeholder, and the guard refuses that at boot even for the anchor/Celo
          # keys production may leave unset (key FORMAT for the EVM four, the `_NOT_SET`
          # tripwire for the Solana set). A missing twin therefore drops the JOB ROLE ONLY
          # (`roles=web`, below) — the web half has no signer and no Solana dependency and keeps
          # deploying — never a boot on the placeholder, never a slot-wide skip for a role's need.
          CANOPY_ORACLE_MINTER_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_MINTER_PRIVATE_KEY }}
          CANOPY_ORACLE_SLASHER_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_SLASHER_PRIVATE_KEY }}
          CANOPY_ETHEREUM_ANCHOR_PRIVATE_KEY: ${{ secrets.CANOPY_ETHEREUM_ANCHOR_PRIVATE_KEY }}
          CANOPY_ORACLE_CELO_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_CELO_PRIVATE_KEY }}
          CANOPY_SOLANA_WALLET_KEYPAIR: ${{ secrets.CANOPY_SOLANA_WALLET_KEYPAIR }}
          CANOPY_SOLANA_FEE_PAYER_PUBKEY: ${{ secrets.CANOPY_SOLANA_FEE_PAYER_PUBKEY }}
          CANOPY_SOLANA_FEE_PAYER_TOKEN_ACCOUNT: ${{ secrets.CANOPY_SOLANA_FEE_PAYER_TOKEN_ACCOUNT }}
          CANOPY_SOLANA_USDC_MINT_ADDRESS: ${{ secrets.CANOPY_SOLANA_USDC_MINT_ADDRESS }}
          CHAINLINK_HMAC_SECRET: ${{ secrets.CHAINLINK_HMAC_SECRET }}
          TURBO_SIGNED_STREAM_KEY: ${{ secrets.TURBO_SIGNED_STREAM_KEY }}
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_REMOTE_WRITE_USERNAME: ${{ secrets.GRAFANA_REMOTE_WRITE_USERNAME }}
          GRAFANA_REMOTE_WRITE_TOKEN: ${{ secrets.GRAFANA_REMOTE_WRITE_TOKEN }}
        run: |
          # B1: gate the FULL boot-critical set, not just PROVISIONING_MASTER_KEY — else the
          # deploy step injects empties for the rest and the container crashes AFTER a green
          # verify (false safety). Boot-critical = crashes boot (master-key decrypt /
          # PROVISIONING guard / oracle KeyError per web3_network_guard) or blocks kamal.
          # Runtime = lazy-fail on first use (warn, don't block). Canon: docs/06_04 §1+§2.
          # The PRODUCTION quintet is EXCLUDED from every set (INF.22 — Environment-scoped,
          # unreadable here). The job role boots on the TESTNET twin set [OPS.37], and that set
          # is a list of its OWN because it gates the ROLE, not the slot: web has no signer and
          # no Solana dependency, so a missing twin must not stop the web deploy (as first
          # shipped it did — the whole slot skipped until a Devnet SPL mint; review 2026-09-02).
          # ⛔ No twinned name is ever RUNTIME here: the overlay turns absence into a present
          # placeholder the guard refuses, so "lazy" would mean "green verify, dead job
          # container" — the exact class BOOT_CRITICAL exists to kill. Membership of all three
          # lists is compared with production's modulo the CANOPY_ prefix by
          # spec/deploy/deploy_workflow_parity_spec.rb.
          BOOT_CRITICAL="SECRET_KEY_BASE PROVISIONING_MASTER_KEY ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID POSTGRES_PASSWORD CANOPY_REDIS_URL TLS_ORIGIN_CERT_PEM TLS_ORIGIN_KEY_PEM CANOPY_ALCHEMY_POLYGON_RPC_URL CANOPY_ALCHEMY_ETHEREUM_RPC_URL CANOPY_SOLANA_RPC_URL CANOPY_CELO_RPC_URL"
          JOB_CRITICAL="CANOPY_ORACLE_MINTER_PRIVATE_KEY CANOPY_ORACLE_SLASHER_PRIVATE_KEY CANOPY_ETHEREUM_ANCHOR_PRIVATE_KEY CANOPY_ORACLE_CELO_PRIVATE_KEY CANOPY_SOLANA_WALLET_KEYPAIR CANOPY_SOLANA_FEE_PAYER_PUBKEY CANOPY_SOLANA_FEE_PAYER_TOKEN_ACCOUNT CANOPY_SOLANA_USDC_MINT_ADDRESS"
          RUNTIME="SENTRY_DSN FILECOIN_API_KEY CARTO_API_KEY CHAINLINK_HMAC_SECRET HELIUM_WEBHOOK_SECRET TURBO_SIGNED_STREAM_KEY GRAFANA_REMOTE_WRITE_URL GRAFANA_REMOTE_WRITE_USERNAME GRAFANA_REMOTE_WRITE_TOKEN"

          missing=""
          for v in $BOOT_CRITICAL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done

          # Absent boot-critical → this repo has no deploy secrets configured. Skip cleanly
          # (configured=false → deploy jobs no-op), no red noise, instead of asserting.
          if [ -n "$missing" ]; then
            # 🔴 This branch is the fail-SAFE of the slot, and it fires exactly when a NEW
            # boot-critical name joins the set before its value does — measured twice: on
            # 2026-09-01 the set completed and every deploy-relevant commit began running a
            # REAL `kamal deploy -d canopy` (the runbook's "Фаза 2t передує Фазі 3" became a
            # property of CI that day); on 2026-09-02 the four CANOPY_* RPC twins joined
            # [INF.27 move (3)], so until they are provisioned canopy skips here again instead
            # of booting on the overlay's placeholder and dying in `web3_network_guard`.
            echo "::notice::Canopy deploy skipped — boot-critical secrets not configured:$missing. See docs/06_04 §1 (SEC.11)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Present-but-malformed is a real misconfig → stay loud (red).
          if [ "${#PROVISIONING_MASTER_KEY}" -lt 64 ]; then
            echo "::error::PROVISIONING_MASTER_KEY too short (${#PROVISIONING_MASTER_KEY} chars; expected >=64 hex). See SEC.11/SEC.9."
            exit 1
          fi

          # Present-but-of-the-wrong-KIND is the misconfig presence cannot see [SEC.11, measured
          # 2026-09-03]: a Grafana token pasted into CANOPY_REDIS_URL passed the presence check,
          # boarded every new container as REDIS_URL and died at /ready (redis: false) for three
          # deploys while the old container kept serving on the previous value. A `*_URL` slot
          # must hold a URL; the check is on the shape, never on the value.
          for v in $BOOT_CRITICAL $JOB_CRITICAL; do
            case "$v" in
              *_URL)
                if [ -n "${!v}" ] && ! printf "%s" "${!v}" | grep -Eq "^[a-z][a-z0-9+.-]*://"; then
                  echo "::error::$v is set but does not look like a URL (scheme://…) — a value of the wrong KIND passed the presence check. See docs/06_04 §1 (SEC.11)."
                  exit 1
                fi
                ;;
            esac
          done

          # Runtime secrets: feature-degraded if absent, but not a boot crash → warn, don't block.
          for v in $RUNTIME; do
            [ -z "${!v}" ] && echo "::warning::$v not set — its Web3/observability feature is degraded until provisioned (docs/06_04 §2.1)."
          done

          # Per-ROLE gate [OPS.37 review 2026-09-02]: a missing signer twin drops the job role
          # from `kamal deploy --roles` and says so; the web role deploys regardless.
          job_missing=""
          for v in $JOB_CRITICAL; do
            [ -z "${!v}" ] && job_missing="$job_missing $v"
          done
          if [ -n "$job_missing" ]; then
            echo "::warning::Canopy JOB role skipped — its testnet signer twins are not configured:$job_missing. The web role still deploys (docs/06_04 §1, OPS.37)."
            echo "roles=web" >> "$GITHUB_OUTPUT"
          else
            echo "roles=web,job" >> "$GITHUB_OUTPUT"
          fi

          echo "All boot-critical deploy secrets present. Proceeding."
          echo "configured=true" >> "$GITHUB_OUTPUT"

  # ⛔ [INF.22] Джоби `terraform` тут БІЛЬШЕ НЕМА — і це присуд, не спрощення.
  # ⚖️ founder 2026-08-29: `terraform apply` лишається founder-local, CI-нога = лише
  # `kamal deploy` (registry push + VM). Підстава — керована альтернатива вимагає видати
  # deploy-SA `workloadIdentityPoolAdmin` + `projectIamAdmin` + `serviceUsageAdmin` +
  # `serviceAccountAdmin`, тобто GCP-root god-credential, тоді як keyless-WIF задумувався
  # рівно як ЗВУЖЕННЯ проти старого `GCP_SA_KEY`.
  #
  # 🔴 Чому саме ЗНЯТТЯ, а не `plan`-only non-blocking (друга розглянута форма): `plan`
  # теж робить refresh, тож він падає тим самим 403 на IAM/WIF-ресурсах — джоба була б
  # ЗАВЖДИ червоною, тобто гейтом, який привчають гортати. Drift по тих ресурсах, до
  # яких SA доступ МАЄ, уже стереже окремий weekly `terraform_drift.yml`.
  #
  # 🔴 І це не косметика: доти `deploy` висів на цій джобі через `needs:`, а deploy-SA
  # жодної з чотирьох адмін-ролей не має (`terraform/iam.tf`). Тобто в день деплою,
  # щойно WIF-Variables заведено, `terraform` діставав би 403 → `needs:` → `kamal deploy`
  # не побіг би ЖОДНОГО разу. Невидиме доти лише тому, що Variables порожні і `if:`
  # знімав джобу. Канон-дім присуду → `06_07 §1`, `06_01 §IAM` (Фаза 0: перший apply — локально).

  deploy:
    name: Kamal Deploy (Canopy)
    needs: verify-secrets
    runs-on: ubuntu-latest
    if: ${{ needs.verify-secrets.outputs.configured == 'true' }}

    # [INF.22] id-token:write for keyless WIF auth (docker push + kamal registry);
    # contents:read for checkout (per-job overrides the top-level).
    permissions:
      contents: read
      id-token: write

    steps:
      # [OPS.36] BLOCK: the allowlist is the StepSecurity baseline of THIS job across its 16 real
      # runs (unchanged over the last 9; recommended policy read 2026-09-02 from runs
      # 33597709126 · 33612548198). Every name is accounted for: checkout + pre-build
      # `git ls-remote` (github), base-image pull (docker.io + its cloudfront), `apt-get` inside
      # the image build (deb.debian.org — plain HTTP, the slim image's sources.list),
      # `bundle install` (rubygems), the WIF exchange (sts + iamcredentials), the OS Login key
      # import (oslogin), the IAP tunnel `kamal` rides (tunnel.cloudproxy.app) and the Artifact
      # Registry push/pull (europe-west1-docker.pkg.dev). A NEW endpoint fails the step that
      # needed it — LOUD by design; the fix is a line here, never a fallback to `audit`.
      # Production stays `audit` until its own first real deploy has produced its baseline.
      - name: Harden runner (egress block)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: block
          allowed-endpoints: >
            auth.docker.io:443
            deb.debian.org:80
            europe-west1-docker.pkg.dev:443
            github.com:443
            iamcredentials.googleapis.com:443
            index.rubygems.org:443
            oslogin.googleapis.com:443
            production.cloudfront.docker.com:443
            registry-1.docker.io:443
            rubygems.org:443
            sts.googleapis.com:443
            tunnel.cloudproxy.app:443
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # access_token feeds `gcloud auth configure-docker` (ADC) AND the kamal
          # registry password (GCP_ARTIFACT_REGISTRY_KEY, username oauth2accesstoken).
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v '~> 2.12.0'

      # [INF.20 move 5] OS Login authenticates by a public key held in the ACCOUNT PROFILE —
      # not by instance metadata (which `enable-oslogin=TRUE` ignores outright). Removing the
      # old SSH-key step got half of this right: dropping the long-lived key was correct
      # (keyless — no SSH secret in the deploy set), dropping the key ENTIRELY was one step
      # too far. `gcloud compute ssh` hides the difference by minting and registering a key
      # on the fly; kamal speaks plain ssh through the ProxyCommand and carries none, so the
      # tunnel opens and authentication then fails —
      # `Net::SSH::AuthenticationFailed for sa_<id>@silken-net-app` (run 33496873447).
      #
      # ⛔ `gcloud compute os-login ssh-keys add` CANNOT do this under WIF, and the reason is
      # not permissions: the CLI derives the target profile from the credential, and a
      # federated one yields `Request for user [None]` (run 33497377281). The REST endpoint
      # takes the user EXPLICITLY, so we address the profile by the SA's numeric unique id —
      # the credential then matches and the call is authorised as itself.
      #
      # 🔑 That id is NOT re-declared here: it is read from `ssh.user` in config/deploy.yml,
      # whose value the same OS Login naming produces (`sa_<unique_id>`). One home, and the
      # pair cannot drift into a state where kamal logs in as one identity and the key was
      # registered for another.
      #
      # ⚠️ Still keyless where it counts: the key is BORN in the run, never stored, and
      # expires on its own — the expiry is the mechanism, not a nicety.
      - name: Register an ephemeral SSH key with OS Login [INF.20 move 5]
        run: |
          set -euo pipefail
          SA_LOGIN=$(ruby -ryaml -e 'print YAML.load_file("config/deploy.yml").dig("ssh", "user").to_s')
          [ -n "$SA_LOGIN" ] || { echo "::error::ssh.user missing from config/deploy.yml - nothing to verify the OS Login profile against."; exit 1; }
          # The API addresses a profile by whatever it CALLS the credential, and for an
          # impersonated service account that is the EMAIL, not the numeric id. Addressing
          # users/<unique_id> returns 403 "Request for user [1007...] does not match the
          # credential for [silken-net-deploy@...]" even though the id is CORRECT - verified
          # against `gcloud iam service-accounts describe`. Measured run 33498256405.
          SA_EMAIL="${{ vars.GCP_SERVICE_ACCOUNT }}"
          [ -n "$SA_EMAIL" ] || { echo "::error::vars.GCP_SERVICE_ACCOUNT is empty - the OS Login profile has no addressee."; exit 1; }
          ssh-keygen -t ed25519 -N '' -C "gha-${{ github.run_id }}" -f "$HOME/.ssh/id_ed25519" -q
          EXPIRY=$(( ($(date +%s) + 1800) * 1000000 ))
          PUBKEY=$(cat "$HOME/.ssh/id_ed25519.pub")
          printf '{"key":"%s","expirationTimeUsec":"%s"}' "$PUBKEY" "$EXPIRY" > /tmp/oslogin-key.json
          # ⚠️ Body goes to the LOG, not only to a file: a 4xx here is the only thing that names
          # the cause, and routing it to a file alone (as the first version did) turns a
          # diagnosable failure into a bare `curl: (22) … 403`.
          HTTP=$(curl -sS -o /tmp/oslogin-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            --data @/tmp/oslogin-key.json \
            "https://oslogin.googleapis.com/v1/users/${SA_EMAIL}:importSshPublicKey?projectId=silkennet")
          echo "OS Login importSshPublicKey -> HTTP ${HTTP}"
          cat /tmp/oslogin-resp.json
          [ "$HTTP" = "200" ] || { echo "::error::OS Login rejected the key (HTTP ${HTTP}) - body above."; exit 1; }
          # The POST returns 200 with an empty posixAccounts list when the profile exists but
          # the project grants no login role — green HTTP, dead SSH. Pin the account, not the code.
          grep -q '"username": *"'"${SA_LOGIN}"'"' /tmp/oslogin-resp.json \
            || { echo "::error::OS Login accepted the key but reports no posix account named ${SA_LOGIN} — check roles/compute.osLogin on the SA."; cat /tmp/oslogin-resp.json; exit 1; }
          echo "OS Login: key registered for ${SA_LOGIN} (expires in 30m)"

      # [INF.20] The `kamal` docker network is created by `kamal setup` — which this project
      # deliberately never runs (`server bootstrap` raises here: the deploy SA has no sudo,
      # so docker is pre-installed by the startup script instead, see terraform/compute.tf).
      # `proxy reboot` runs BEFORE any app boot and therefore meets a host with no network:
      # `docker: Error response from daemon: network kamal not found` (run 33498998910).
      # ⚠️ Idempotent on purpose — the create fails harmlessly once the network exists, and
      # a hard failure here would make every subsequent deploy red for a first-run condition.
      - name: Ensure the kamal docker network exists [INF.20]
        run: |
          kamal server exec -d canopy --roles web "docker network create kamal" \
            || echo "network create returned non-zero — it already exists, or the next step will name the real cause"
        env:
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}

      - name: Release a stale deploy lock [OPS.37]
        # Deploys are serialised by this workflow's concurrency group, so a lock found at the START
        # of a run can only be the corpse of a run that died mid-deploy — measured 2026-09-03: three
        # kamal-proxy health timeouts in a row left one behind, and the next run failed at
        # `proxy reboot` with «Deploy lock found» before deploying anything. Releasing it here is
        # safe by construction; a genuinely concurrent deploy cannot exist on this group.
        run: kamal lock release -d canopy

      - name: Reboot Kamal Proxy
        run: kamal proxy reboot -d canopy -y
        # ⚠️ This step needs the REGISTRY password even though it deploys nothing: `proxy
        # reboot` pulls the kamal-proxy image, and our registry is private, so kamal runs
        # `docker login` on the host first. Without it the login goes out as `-u … -p` with
        # an EMPTY argument and docker exits 125 with `flag needs an argument: 'p' in -p`
        # — measured run 33498607595, the first run that ever authenticated over SSH.
        # 🔑 The env: block below belongs to the NEXT step; a reader scanning for "is the
        # registry key wired" finds it and answers yes for the wrong step. Steps do not
        # inherit each other's env — the gap between two correct steps is where this lived.
        env:
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}

      - name: Kamal Deploy to Canopy
        # `--roles` comes from verify-secrets: `web,job` when the eight testnet signer twins
        # exist, `web` alone otherwise [OPS.37 review 2026-09-02] — the job role's prerequisite
        # must never block the web deploy.
        run: |
          # [INF.28 ⚖️ 2026-09-03] Canopy's own Redis accessory (config/deploy.canopy.yml) — idempotent
          # (kamal 2.12 skips an existing container) and BEFORE the roles, which /ready-probe it at boot.
          # It resolves REDIS_URL through .kamal/secrets.canopy from CANOPY_REDIS_URL in this env.
          kamal accessory ${{ inputs.redis || 'boot' }} redis -d canopy
          kamal deploy -d canopy --roles "${{ needs.verify-secrets.outputs.roles }}"
        # ⚠️ Drift guard: this env: block MUST mirror the GLOBAL config/deploy.yml env.secret
        # (which .kamal/secrets-common reads as $VAR from THIS shell). Any global env.secret
        # entry missing here is injected EMPTY → boot crash (SECRET_KEY_BASE /
        # PROVISIONING_MASTER_KEY guard). The servers.job quintet IS mirrored since 2026-09-02 —
        # canopy has its own job role, fed by CANOPY_* twins [OPS.37]. KREDIS_REDIS_URL is intentionally omitted — Kredis reads
        # REDIS_URL as-is (one logical database, keys separated by prefix [INF.22]);
        # set it only to point Kredis at a separate instance. Canon: docs/06_04 §1 + §2.
        env:
          # [INF.22] Short-lived WIF access token (username oauth2accesstoken in
          # config/deploy.yml registry), not a JSON key.
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}
          # --- Application core ---
          # RAILS_MASTER_KEY dropped 2026-09-02 (SEC.22 Phase-2): the image ships no
          # credentials.yml.enc, so it decrypted nothing in any container; SECRET_KEY_BASE
          # is the boot-critical one (docs/06_04 §5.7).
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          # Component style: same Cloud SQL user/password as production; Canopy isolates
          # via POSTGRES_DATABASE=silken_net_canopy (config/deploy.canopy.yml). REDIS stays separate.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Redis isolation is STRUCTURAL now (.kamal/secrets.canopy remaps
          # REDIS_URL ← $CANOPY_REDIS_URL — deploy_secret_scan invariant B4), so the
          # canopy value is exported under its OWN name; the REDIS_URL line stays to
          # feed secrets-common's lookup, and both resolve to the same canopy secret.
          REDIS_URL: ${{ secrets.CANOPY_REDIS_URL }}
          CANOPY_REDIS_URL: ${{ secrets.CANOPY_REDIS_URL }}
          # --- Observability ---
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          FILECOIN_API_KEY: ${{ secrets.FILECOIN_API_KEY }}
          CARTO_API_KEY: ${{ secrets.CARTO_API_KEY }}
          # --- Origin TLS [INF.4] — consumed by `config/deploy.yml` proxy.ssl, NOT by Rails ---
          # Kamal resolves these two by NAME from .kamal/secrets-common; missing here means
          # kamal-proxy boots with no certificate and Cloudflare's Full (strict) answers 521/525
          # on every request — a silent-origin failure, not a boot crash. Enforced by
          # spec/deploy/env_fetch_declaration_spec.rb, which reads the names out of proxy.ssl.
          TLS_ORIGIN_CERT_PEM: ${{ secrets.TLS_ORIGIN_CERT_PEM }}
          TLS_ORIGIN_KEY_PEM: ${{ secrets.TLS_ORIGIN_KEY_PEM }}
          # --- Hardware provisioning gate (master_key_strength_check.rb — boot-critical) ---
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
          # --- AR-encryption keys (active_record_encryption_keys_check.rb — boot-critical) [SEC.22] ---
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
          # --- SMTP credentials [ARCH.60] — global env.secret, so kamal looks them up on
          #     this leg too and an unmapped entry injects "" (B1). Canopy itself declares
          #     SILKENNET_SKIP_MAIL_TRANSPORT_CHECK=1 (no ESP provisioned yet — ARCH.60; a
          #     deliver_later now reaches its Sidekiq and fails there loudly). ---
          SMTP_USER_NAME: ${{ secrets.SMTP_USER_NAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # --- Telegram bot token [ARCH.60] — optional: transport no-ops when unset
          #     (an unmapped entry injects "", which the format check reads as "off"). ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # --- Turbo signed-stream key [SEC.25 Ф3] ---
          # 🔴 It was present in `verify-secrets` and in RUNTIME, and ABSENT here, on BOTH
          # workflows — i.e. the step that CHECKS the secret had it and the step that
          # DELIVERS it did not. Nothing could redden: `env_fetch_declaration_spec` unions
          # every `env:` block in both files, so the verify-job mapping satisfied the B1
          # chain while the container got "" from secrets-common. And the failure is silent
          # by design — `turbo_stream_verifier.rb` reads `ENV[...].presence` and falls back
          # to deriving from `secret_key_base`, so the app works and the stream-only
          # revocation lever simply does not exist. That initializer names this exact cost
          # ("секрет, який забули завести в проді, дає не падіння, а мовчазну відсутність
          # важеля") and delegates enforcement HERE and to docs/06_04 — both of which had
          # the hole. Gate narrowed the same commit: the B1 chain is now judged at the
          # DEPLOY STEP, per workflow. ---
          TURBO_SIGNED_STREAM_KEY: ${{ secrets.TURBO_SIGNED_STREAM_KEY }}
          # --- Web3 money/signing keys: TESTNET twins [OPS.37 ⚖️ founder 2026-09-02] ---
          # Canopy's `job:` role declares the five quintet NAMES (config/deploy.canopy.yml) and
          # `.kamal/secrets.canopy` remaps each FROM its CANOPY_* twin (B4). Exported under BOTH
          # spellings, exactly like REDIS_URL and the RPC quartet: the twin feeds the overlay,
          # the bare name feeds secrets-common's lookup with the SAME canopy value — so even a
          # run that bypassed the overlay could not hand staging a production key. The
          # production quintet is Environment-scoped and is NOT read on this slot; the RHS of
          # every line below is pinned to `secrets.CANOPY_*` by env_fetch_declaration_spec.
          ORACLE_MINTER_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_MINTER_PRIVATE_KEY }}
          CANOPY_ORACLE_MINTER_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_MINTER_PRIVATE_KEY }}
          ORACLE_SLASHER_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_SLASHER_PRIVATE_KEY }}
          CANOPY_ORACLE_SLASHER_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_SLASHER_PRIVATE_KEY }}
          ETHEREUM_ANCHOR_PRIVATE_KEY: ${{ secrets.CANOPY_ETHEREUM_ANCHOR_PRIVATE_KEY }}
          CANOPY_ETHEREUM_ANCHOR_PRIVATE_KEY: ${{ secrets.CANOPY_ETHEREUM_ANCHOR_PRIVATE_KEY }}
          ORACLE_CELO_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_CELO_PRIVATE_KEY }}
          CANOPY_ORACLE_CELO_PRIVATE_KEY: ${{ secrets.CANOPY_ORACLE_CELO_PRIVATE_KEY }}
          SOLANA_WALLET_KEYPAIR: ${{ secrets.CANOPY_SOLANA_WALLET_KEYPAIR }}
          CANOPY_SOLANA_WALLET_KEYPAIR: ${{ secrets.CANOPY_SOLANA_WALLET_KEYPAIR }}
          # --- RPC endpoints (Web3::RpcConnectionPool; chain-family boot guard) — TESTNET ---
          # 🔴 [INF.27 move (3), 2026-09-02] Canopy declares `WEB3_CHAIN_ENV: testnet`
          # (config/deploy.canopy.yml), so these four resolve to the CANOPY_* twins — under
          # BOTH names, exactly as REDIS_URL/CANOPY_REDIS_URL above: `.kamal/secrets.canopy`
          # remaps the bare name FROM the twin (so the twin must exist in this shell), and the
          # bare name is exported under the SAME canopy value so that even a run that somehow
          # bypassed the overlay could not hand staging a mainnet endpoint. The guard would
          # refuse such a boot anyway — this keeps the refusal from being the only thing
          # between staging and real money. The mainnet secrets are NOT read on this slot.
          ALCHEMY_POLYGON_RPC_URL: ${{ secrets.CANOPY_ALCHEMY_POLYGON_RPC_URL }}
          CANOPY_ALCHEMY_POLYGON_RPC_URL: ${{ secrets.CANOPY_ALCHEMY_POLYGON_RPC_URL }}
          ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.CANOPY_ALCHEMY_ETHEREUM_RPC_URL }}
          CANOPY_ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.CANOPY_ALCHEMY_ETHEREUM_RPC_URL }}
          SOLANA_RPC_URL: ${{ secrets.CANOPY_SOLANA_RPC_URL }}
          CANOPY_SOLANA_RPC_URL: ${{ secrets.CANOPY_SOLANA_RPC_URL }}
          CELO_RPC_URL: ${{ secrets.CANOPY_CELO_RPC_URL }}
          CANOPY_CELO_RPC_URL: ${{ secrets.CANOPY_CELO_RPC_URL }}
          # --- Solana public identifiers of the DEVNET fee-payer — twins, both spellings [OPS.37] ---
          SOLANA_FEE_PAYER_PUBKEY: ${{ secrets.CANOPY_SOLANA_FEE_PAYER_PUBKEY }}
          CANOPY_SOLANA_FEE_PAYER_PUBKEY: ${{ secrets.CANOPY_SOLANA_FEE_PAYER_PUBKEY }}
          SOLANA_FEE_PAYER_TOKEN_ACCOUNT: ${{ secrets.CANOPY_SOLANA_FEE_PAYER_TOKEN_ACCOUNT }}
          CANOPY_SOLANA_FEE_PAYER_TOKEN_ACCOUNT: ${{ secrets.CANOPY_SOLANA_FEE_PAYER_TOKEN_ACCOUNT }}
          SOLANA_USDC_MINT_ADDRESS: ${{ secrets.CANOPY_SOLANA_USDC_MINT_ADDRESS }}
          CANOPY_SOLANA_USDC_MINT_ADDRESS: ${{ secrets.CANOPY_SOLANA_USDC_MINT_ADDRESS }}
          # --- Webhook HMACs (Chainlink callback — dispatch removed ARCH.53; Helium SOS ARCH.34) ---
          CHAINLINK_HMAC_SECRET: ${{ secrets.CHAINLINK_HMAC_SECRET }}
          HELIUM_WEBHOOK_SECRET: ${{ secrets.HELIUM_WEBHOOK_SECRET }}

      # ⚖️ [OPS.37 2026-08-30] `kamal deploy` never boots accessories (Kamal::Cli::App#boot
      # walks KAMAL.roles only) — without this step a green deploy leaves Grafana EMPTY: no
      # series exist, so every P0 alert is silent and the NoData branch cannot save it (it
      # catches "all `up` vanished", not "Alloy never started"). `accessory boot` is
      # idempotent in kamal 2.12 ("Skipping … a container already exists"), so this is a
      # cheap ensure-running on every deploy, NOT a restart; config.alloy changes still need
      # a deliberate reboot — `gh workflow run deploy.yml -f alloy=reboot` (the input above; the
      # laptop `kamal accessory reboot alloy` dies on the deploy-SA posix account). Boots here (first
      # deploy is canopy — DEPLOY-1 Phase 3) so the agent watches production targets from
      # day zero; until the production roles exist their aliases resolve NXDOMAIN and `up=0`
      # tells the truth.
      #
      # 🔴 NO `-d canopy`, and the flag's ABSENCE is the load-bearing part [⚖️ founder
      # 2026-08-31]. There is exactly ONE Alloy container for both slots, verified against
      # kamal 2.12 source: `Kamal::Configuration::Accessory#service_name` is
      # `"#{config.service}-#{name}"`, and `config.service` does NOT carry the destination
      # (`service_and_destination` exists but is used only for the apps DIRECTORY). So both
      # destinations resolve to `silken_net-alloy`, and canopy inherits the base
      # `accessories.alloy.host` because it overrode only `env.clear` — same name, same host.
      # `accessory boot` then SKIPS the second slot ("a container already exists", yellow,
      # exit 0), so whichever slot booted first silently owned the `DEPLOYMENT_SLOT` label.
      # Canopy deploys on every main push and production only on a Release ⇒ canopy would
      # have won, stamping `slot="canopy"` on PRODUCTION series.
      # 🔑 And the mislabel was pure loss, because until 2026-09-03 canopy had NO scrape targets:
      # `config.alloy` scraped the three `silken-*` network-alias names, and canopy's roles
      # carry `canopy-*` aliases that are DISJOINT from them (config/deploy.canopy.yml since
      # 2026-09-02 [OPS.37] — before that, alias-less by the array form; unscraped until 09-03,
      # since then scraped under their own names with `slot` on the target; either way
      # pinned by alloy_scrape_topology_spec). The comment above already said this agent
      # "watches production targets"; the canopy override contradicted it. Dropping the flag
      # makes the label match what is scraped.
      # [OPS.37 review 2026-09-02] Kamal's boot verdict for a NON-proxy role is a 7-second
      # `.State.Status` poll (`Kamal::Cli::Healthcheck::Poller`, `readiness_delay` default) and
      # the image declares no HEALTHCHECK — so a container that raises in `after_initialize`
      # after Rails' ~10-s boot reports "running" twice, the deploy goes GREEN and the role
      # crash-loops under `--restart unless-stopped`. On canopy the job role is scraped since
      # 2026-09-03 (`canopy-job:9394`), but `up` only says «not booted» minutes later — this probe
      # is the boot-window detector, the only one inside the deploy itself.
      # ⚠️ Ceiling: it judges one 45-s uptime window, not correctness; and it watches the job
      # role only — `coap` shares the poller ceiling and is covered by nothing.
      - name: Verify the job role survived its boot [OPS.37]
        if: ${{ contains(needs.verify-secrets.outputs.roles, 'job') }}
        run: |
          sleep 45
          out=$(kamal app details -d canopy -r job 2>&1) || true
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Eq 'Restarting|Exited'; then
            echo "::error::canopy job container restarted or exited after a green boot poll — read its logs (kamal app logs -d canopy -r job)."
            exit 1
          fi
          printf '%s\n' "$out" | grep -Eq 'Up (About a minute|[5-9][0-9] seconds|[0-9]+ minutes?)' \
            || { echo "::error::canopy job container has not been up for the whole 45-s window (crash-loop, or no container) — see output above."; exit 1; }

      - name: Ensure Alloy accessory is running
        # `inputs.alloy` is empty on workflow_run → boot (the idempotent default); reboot only by dispatch.
        run: kamal accessory ${{ inputs.alloy || 'boot' }} alloy
        env:
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}
          # Accessory env.secret trio (.kamal/secrets-common reads $VAR from this shell).
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_REMOTE_WRITE_USERNAME: ${{ secrets.GRAFANA_REMOTE_WRITE_USERNAME }}
          GRAFANA_REMOTE_WRITE_TOKEN: ${{ secrets.GRAFANA_REMOTE_WRITE_TOKEN }}

  # [INF.6] Post-deploy gate: FW.56 freeze-contract probes through the real
  # UDP boundary (Ingress Anchor → coap_listener). HTTP health checks
  # cannot see a dead CoAP path — without this the network goes dark silently.
  # Активація: задати repo Variable CANOPY_COAP_HOST (host Ingress Anchor);
  # поки змінна порожня, job видимо skipped (Брама ще не задеплоєна).
  coap-smoke:
    name: CoAP UDP Smoke [INF.6]
    needs: deploy
    if: ${{ vars.CANOPY_COAP_HOST != '' }}
    uses: ./.github/workflows/coap_smoke.yml
    with:
      host: ${{ vars.CANOPY_COAP_HOST }}
