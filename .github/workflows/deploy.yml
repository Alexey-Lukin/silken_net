name: Deploy · Canopy

on:
  workflow_run:
    workflows: ["CI · Code"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-canopy
  cancel-in-progress: false

permissions:
  contents: read

# ⛔ [INF.22] `TF_VAR_*` тут БІЛЬШЕ НЕМА — вони поїхали разом із джобою `terraform`
# (⚖️ founder 2026-08-29, повна підстава — біля місця, де та джоба стояла). Знімаються
# ТИМ САМИМ рухом свідомо: змінна, яку не читає жоден крок, є не «запасом», а мертвим
# конфігом — і тут вона дорожча за звичайний мертвий рядок, бо `spec/deploy/
# terraform_workflow_var_parity_spec.rb` визначає «terraform-воркфлоу» САМЕ за
# наявністю `TF_VAR_`. Лишити їх означало б тримати гейт зеленим над воркфлоу, який
# terraform більше не запускає, тобто судити фікцію. Дім guarded-змінних після цього —
# `terraform_drift.yml` (єдиний, хто справді біжить проти реальних vars) + локальний
# apply founder'а; `GCP_BILLING_ACCOUNT_ID` став drift-only → `06_04 §1`.
# SSH secrets removed (INF.20 (в)): admin path = IAP tunnel + OS Login; the CI
# kamal leg needs the (б) glue (ssh.proxy_command + SA tunnel role) before it can
# reach the Anchor — until then the kamal step is honestly non-functional.

jobs:
  changes:
    name: Detect deploy-relevant changes [INF.9]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      deploy: ${{ steps.decide.outputs.deploy }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Decide whether the canopy deploy is needed
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          # [INF.9] Manual dispatch always deploys. A post-CI workflow_run deploys only
          # when image-relevant (same list as mirror-ghcr — canopy is CONTINUOUS for app
          # code) or infra files changed; firmware/docs/tools/contracts-only commits used
          # to drag the whole kamal chain for nothing.
          # ⛔ [INF.22] `terraform/` вибуло з переліку разом із джобою `terraform`: коміт,
          # що чіпає лише IaC, більше не спричиняє тут ЖОДНОЇ terraform-дії, тож тягнув би
          # kamal-ланцюг рівно за те, проти чого цей фільтр і стоїть. Apply — founder-local.
          # Changed files come from
          # the GitHub API, not a checkout of head_sha (untrusted-code vector — see
          # mirror-ghcr.yml). On any ambiguity we deploy — it is idempotent and cheap.
          if [ "${{ github.event_name }}" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if ! changed=$(gh api "repos/${{ github.repository }}/commits/${HEAD_SHA}" -q '.files[].filename' 2>/dev/null); then
            echo "::warning::Could not list changed files via API — deploying to be safe."
            echo "deploy=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          if echo "$changed" | grep -qE '^(Dockerfile|\.dockerignore|Gemfile|Gemfile\.lock|\.ruby-version|Procfile|Rakefile|config\.ru|app/|lib/|config/|bin/|db/|public/|vendor/|\.kamal/|\.github/workflows/deploy\.yml)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No deploy-relevant files changed — skipping the canopy deploy [INF.9]."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

  verify-secrets:
    name: Verify Required Secrets [SEC.11]
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ needs.changes.outputs.deploy == 'true' }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Verify deploy secrets [B1]
        id: check
        env:
          # Boot-critical: empty → container crashes on boot. (Доти рядок казав ще й
          # «or terraform can't apply» — джоби `terraform` тут більше немає, INF.22.)
          # Mirror config/deploy.yml env.secret (the kamal-deploy env: block below)
          # + the infra prerequisites (GCP project). SSH secrets removed — INF.20 (в):
          # IAP tunnel + OS Login, no key material to provision.
          # KAMAL_MASTER_KEY removed — phantom: Kamal 2.x has no such mechanism and
          # nothing in .kamal/ consumes it (plain $VAR secrets file, not encrypted).
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
          # [SEC.22] AR-encryption keys — boot-critical (fail-closed initializer);
          # declared in env.secret + secrets-common → unmapped here = "" injection
          # → crash after a green verify (B1 class).
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
          # [INF.22] Keyless CI: the WIF provider + SA email are non-secret repo
          # VARIABLES, not GCP_SA_KEY. Their presence is the "infra provisioned"
          # deploy-gate signal that GCP_SA_KEY used to carry.
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          CANOPY_REDIS_URL: ${{ secrets.CANOPY_REDIS_URL }}
          # 🔴 [INF.4 2026-08-31] Origin-TLS pair — boot-critical since `proxy.ssl` went LIVE,
          # and it is here because the failure is COMPLETELY SILENT. `.kamal/secrets-common`
          # declares both names, so `Kamal::Secrets#[]` does NOT raise "Secret not found" — it
          # returns the EMPTY STRING; and `Kamal::Cli::App::SslCertificates#run` guards with
          # `if cert_content = …`, where "" is truthy in Ruby. So kamal happily uploads an empty
          # cert.pem/key.pem (mode 0644), kamal-proxy cannot serve TLS, and Cloudflare — Full
          # (strict) on both zones — answers 521/525 on every request behind a fully GREEN deploy.
          # Neither list carried them before, so there was not even a ::warning:: (06_04 §1).
          TLS_ORIGIN_CERT_PEM: ${{ secrets.TLS_ORIGIN_CERT_PEM }}
          TLS_ORIGIN_KEY_PEM: ${{ secrets.TLS_ORIGIN_KEY_PEM }}
          # Money/signing keys deliberately ABSENT (INF.22): environment-scoped to
          # `production` (unreadable from this workflow) AND kamal-unused on canopy —
          # the quintet lives in servers.job.env.secret only, and canopy is
          # STRUCTURALLY web-only (array-form `servers:` in deploy.canopy.yml
          # replaces the base hash; an omitted section would be INHERITED via
          # deep_merge), so `kamal deploy -d canopy` never injects them; web boots
          # keyless (Web3NetworkGuard signer_process scope). Gating on them here
          # would skip canopy forever.
          HELIUM_WEBHOOK_SECRET: ${{ secrets.HELIUM_WEBHOOK_SECRET }}
          # Runtime (lazy): feature degraded until provisioned, not a boot crash. Warn only.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ALCHEMY_POLYGON_RPC_URL: ${{ secrets.ALCHEMY_POLYGON_RPC_URL }}
          ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.ALCHEMY_ETHEREUM_RPC_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          SOLANA_FEE_PAYER_PUBKEY: ${{ secrets.SOLANA_FEE_PAYER_PUBKEY }}
          SOLANA_FEE_PAYER_TOKEN_ACCOUNT: ${{ secrets.SOLANA_FEE_PAYER_TOKEN_ACCOUNT }}
          SOLANA_USDC_MINT_ADDRESS: ${{ secrets.SOLANA_USDC_MINT_ADDRESS }}
          CHAINLINK_HMAC_SECRET: ${{ secrets.CHAINLINK_HMAC_SECRET }}
          TURBO_SIGNED_STREAM_KEY: ${{ secrets.TURBO_SIGNED_STREAM_KEY }}
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_REMOTE_WRITE_USERNAME: ${{ secrets.GRAFANA_REMOTE_WRITE_USERNAME }}
          GRAFANA_REMOTE_WRITE_TOKEN: ${{ secrets.GRAFANA_REMOTE_WRITE_TOKEN }}
        run: |
          # B1: gate the FULL boot-critical set, not just PROVISIONING_MASTER_KEY — else the
          # deploy step injects empties for the rest and the container crashes AFTER a green
          # verify (false safety). Boot-critical = crashes boot (master-key decrypt /
          # PROVISIONING guard / oracle KeyError per web3_network_guard) or blocks kamal.
          # Runtime = lazy-fail on first use (warn, don't block). Canon: docs/06_04 §1+§2.
          # Money/signing quintet EXCLUDED from both sets (INF.22): canopy is web-only
          # (keyless boot by design) and the keys are production-environment-scoped —
          # requiring them here would read "" and skip-or-warn canopy forever.
          BOOT_CRITICAL="RAILS_MASTER_KEY PROVISIONING_MASTER_KEY ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID POSTGRES_PASSWORD CANOPY_REDIS_URL TLS_ORIGIN_CERT_PEM TLS_ORIGIN_KEY_PEM"
          RUNTIME="SENTRY_DSN ALCHEMY_POLYGON_RPC_URL ALCHEMY_ETHEREUM_RPC_URL SOLANA_RPC_URL CELO_RPC_URL SOLANA_FEE_PAYER_PUBKEY SOLANA_FEE_PAYER_TOKEN_ACCOUNT SOLANA_USDC_MINT_ADDRESS CHAINLINK_HMAC_SECRET HELIUM_WEBHOOK_SECRET TURBO_SIGNED_STREAM_KEY GRAFANA_REMOTE_WRITE_URL GRAFANA_REMOTE_WRITE_USERNAME GRAFANA_REMOTE_WRITE_TOKEN"

          missing=""
          for v in $BOOT_CRITICAL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done

          # Absent boot-critical → this repo has no deploy secrets configured. Skip cleanly
          # (configured=false → deploy jobs no-op), no red noise, instead of asserting.
          if [ -n "$missing" ]; then
            echo "::notice::Canopy deploy skipped — boot-critical secrets not configured:$missing. See docs/06_04 §1 (SEC.11)."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Present-but-malformed is a real misconfig → stay loud (red).
          if [ "${#PROVISIONING_MASTER_KEY}" -lt 64 ]; then
            echo "::error::PROVISIONING_MASTER_KEY too short (${#PROVISIONING_MASTER_KEY} chars; expected >=64 hex). See SEC.11/SEC.9."
            exit 1
          fi

          # Runtime secrets: feature-degraded if absent, but not a boot crash → warn, don't block.
          for v in $RUNTIME; do
            [ -z "${!v}" ] && echo "::warning::$v not set — its Web3/observability feature is degraded until provisioned (docs/06_04 §2.1)."
          done

          echo "All boot-critical deploy secrets present. Proceeding."
          echo "configured=true" >> "$GITHUB_OUTPUT"

  # ⛔ [INF.22] Джоби `terraform` тут БІЛЬШЕ НЕМА — і це присуд, не спрощення.
  # ⚖️ founder 2026-08-29: `terraform apply` лишається founder-local, CI-нога = лише
  # `kamal deploy` (registry push + VM). Підстава — керована альтернатива вимагає видати
  # deploy-SA `workloadIdentityPoolAdmin` + `projectIamAdmin` + `serviceUsageAdmin` +
  # `serviceAccountAdmin`, тобто GCP-root god-credential, тоді як keyless-WIF задумувався
  # рівно як ЗВУЖЕННЯ проти старого `GCP_SA_KEY`.
  #
  # 🔴 Чому саме ЗНЯТТЯ, а не `plan`-only non-blocking (друга розглянута форма): `plan`
  # теж робить refresh, тож він падає тим самим 403 на IAM/WIF-ресурсах — джоба була б
  # ЗАВЖДИ червоною, тобто гейтом, який привчають гортати. Drift по тих ресурсах, до
  # яких SA доступ МАЄ, уже стереже окремий weekly `terraform_drift.yml`.
  #
  # 🔴 І це не косметика: доти `deploy` висів на цій джобі через `needs:`, а deploy-SA
  # жодної з чотирьох адмін-ролей не має (`terraform/iam.tf`). Тобто в день деплою,
  # щойно WIF-Variables заведено, `terraform` діставав би 403 → `needs:` → `kamal deploy`
  # не побіг би ЖОДНОГО разу. Невидиме доти лише тому, що Variables порожні і `if:`
  # знімав джобу. Канон-дім присуду → `06_07 §1`, `06_01 §IAM` (Фаза 0: перший apply — локально).

  deploy:
    name: Kamal Deploy (Canopy)
    needs: verify-secrets
    runs-on: ubuntu-latest
    if: ${{ needs.verify-secrets.outputs.configured == 'true' }}

    # [INF.22] id-token:write for keyless WIF auth (docker push + kamal registry);
    # contents:read for checkout (per-job overrides the top-level).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # access_token feeds `gcloud auth configure-docker` (ADC) AND the kamal
          # registry password (GCP_ARTIFACT_REGISTRY_KEY, username oauth2accesstoken).
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v '~> 2.12.0'

      # [INF.20 move 5] OS Login authenticates by a public key held in the ACCOUNT PROFILE —
      # not by instance metadata (which `enable-oslogin=TRUE` ignores outright). Removing the
      # old SSH-key step got half of this right: dropping the long-lived key was correct
      # (keyless — no SSH secret in the deploy set), dropping the key ENTIRELY was one step
      # too far. `gcloud compute ssh` hides the difference by minting and registering a key
      # on the fly; kamal speaks plain ssh through the ProxyCommand and carries none, so the
      # tunnel opens and authentication then fails —
      # `Net::SSH::AuthenticationFailed for sa_<id>@silken-net-app` (run 33496873447).
      #
      # ⛔ `gcloud compute os-login ssh-keys add` CANNOT do this under WIF, and the reason is
      # not permissions: the CLI derives the target profile from the credential, and a
      # federated one yields `Request for user [None]` (run 33497377281). The REST endpoint
      # takes the user EXPLICITLY, so we address the profile by the SA's numeric unique id —
      # the credential then matches and the call is authorised as itself.
      #
      # 🔑 That id is NOT re-declared here: it is read from `ssh.user` in config/deploy.yml,
      # whose value the same OS Login naming produces (`sa_<unique_id>`). One home, and the
      # pair cannot drift into a state where kamal logs in as one identity and the key was
      # registered for another.
      #
      # ⚠️ Still keyless where it counts: the key is BORN in the run, never stored, and
      # expires on its own — the expiry is the mechanism, not a nicety.
      - name: Register an ephemeral SSH key with OS Login [INF.20 move 5]
        run: |
          set -euo pipefail
          SA_LOGIN=$(ruby -ryaml -e 'print YAML.load_file("config/deploy.yml").dig("ssh", "user").to_s')
          [ -n "$SA_LOGIN" ] || { echo "::error::ssh.user missing from config/deploy.yml - nothing to verify the OS Login profile against."; exit 1; }
          # The API addresses a profile by whatever it CALLS the credential, and for an
          # impersonated service account that is the EMAIL, not the numeric id. Addressing
          # users/<unique_id> returns 403 "Request for user [1007...] does not match the
          # credential for [silken-net-deploy@...]" even though the id is CORRECT - verified
          # against `gcloud iam service-accounts describe`. Measured run 33498256405.
          SA_EMAIL="${{ vars.GCP_SERVICE_ACCOUNT }}"
          [ -n "$SA_EMAIL" ] || { echo "::error::vars.GCP_SERVICE_ACCOUNT is empty - the OS Login profile has no addressee."; exit 1; }
          ssh-keygen -t ed25519 -N '' -C "gha-${{ github.run_id }}" -f "$HOME/.ssh/id_ed25519" -q
          EXPIRY=$(( ($(date +%s) + 1800) * 1000000 ))
          PUBKEY=$(cat "$HOME/.ssh/id_ed25519.pub")
          printf '{"key":"%s","expirationTimeUsec":"%s"}' "$PUBKEY" "$EXPIRY" > /tmp/oslogin-key.json
          # ⚠️ Body goes to the LOG, not only to a file: a 4xx here is the only thing that names
          # the cause, and routing it to a file alone (as the first version did) turns a
          # diagnosable failure into a bare `curl: (22) … 403`.
          HTTP=$(curl -sS -o /tmp/oslogin-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            --data @/tmp/oslogin-key.json \
            "https://oslogin.googleapis.com/v1/users/${SA_EMAIL}:importSshPublicKey?projectId=silkennet")
          echo "OS Login importSshPublicKey -> HTTP ${HTTP}"
          cat /tmp/oslogin-resp.json
          [ "$HTTP" = "200" ] || { echo "::error::OS Login rejected the key (HTTP ${HTTP}) - body above."; exit 1; }
          # The POST returns 200 with an empty posixAccounts list when the profile exists but
          # the project grants no login role — green HTTP, dead SSH. Pin the account, not the code.
          grep -q '"username": *"'"${SA_LOGIN}"'"' /tmp/oslogin-resp.json \
            || { echo "::error::OS Login accepted the key but reports no posix account named ${SA_LOGIN} — check roles/compute.osLogin on the SA."; cat /tmp/oslogin-resp.json; exit 1; }
          echo "OS Login: key registered for ${SA_LOGIN} (expires in 30m)"

      - name: Reboot Kamal Proxy
        run: kamal proxy reboot -d canopy -y

      - name: Kamal Deploy to Canopy
        run: kamal deploy -d canopy
        # ⚠️ Drift guard: this env: block MUST mirror the GLOBAL config/deploy.yml env.secret
        # (which .kamal/secrets-common reads as $VAR from THIS shell). Any global env.secret
        # entry missing here is injected EMPTY → boot crash (RAILS_MASTER_KEY decrypt /
        # PROVISIONING_MASTER_KEY guard). The servers.job quintet is deliberately NOT mirrored —
        # canopy has no job role. KREDIS_REDIS_URL is intentionally omitted — Kredis reads
        # REDIS_URL as-is (one logical database, keys separated by prefix [INF.22]);
        # set it only to point Kredis at a separate instance. Canon: docs/06_04 §1 + §2.
        env:
          # [INF.22] Short-lived WIF access token (username oauth2accesstoken in
          # config/deploy.yml registry), not a JSON key.
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}
          # --- Application core ---
          RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          # Component style: same Cloud SQL user/password as production; Canopy isolates
          # via POSTGRES_DATABASE=silken_net_canopy (config/deploy.canopy.yml). REDIS stays separate.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          # Redis isolation is STRUCTURAL now (.kamal/secrets.canopy remaps
          # REDIS_URL ← $CANOPY_REDIS_URL — deploy_secret_scan invariant B4), so the
          # canopy value is exported under its OWN name; the REDIS_URL line stays to
          # feed secrets-common's lookup, and both resolve to the same canopy secret.
          REDIS_URL: ${{ secrets.CANOPY_REDIS_URL }}
          CANOPY_REDIS_URL: ${{ secrets.CANOPY_REDIS_URL }}
          RELEASE_VERSION: ${{ github.sha }}
          # --- Observability ---
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # --- Origin TLS [INF.4] — consumed by `config/deploy.yml` proxy.ssl, NOT by Rails ---
          # Kamal resolves these two by NAME from .kamal/secrets-common; missing here means
          # kamal-proxy boots with no certificate and Cloudflare's Full (strict) answers 521/525
          # on every request — a silent-origin failure, not a boot crash. Enforced by
          # spec/deploy/env_fetch_declaration_spec.rb, which reads the names out of proxy.ssl.
          TLS_ORIGIN_CERT_PEM: ${{ secrets.TLS_ORIGIN_CERT_PEM }}
          TLS_ORIGIN_KEY_PEM: ${{ secrets.TLS_ORIGIN_KEY_PEM }}
          # --- Hardware provisioning gate (master_key_strength_check.rb — boot-critical) ---
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
          # --- AR-encryption keys (active_record_encryption_keys_check.rb — boot-critical) [SEC.22] ---
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
          # --- SMTP credentials [ARCH.60] — global env.secret, so kamal looks them up on
          #     this leg too and an unmapped entry injects "" (B1). Canopy itself declares
          #     SILKENNET_SKIP_MAIL_TRANSPORT_CHECK=1 (web-only, no Sidekiq → no delivery). ---
          SMTP_USER_NAME: ${{ secrets.SMTP_USER_NAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # --- Telegram bot token [ARCH.60] — optional: transport no-ops when unset
          #     (an unmapped entry injects "", which the format check reads as "off"). ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # --- Web3 money/signing keys: NOT mapped (INF.22) — the quintet is
          #     servers.job.env.secret-only and canopy is structurally web-only
          #     (array-form servers: in deploy.canopy.yml; an omitted role would be
          #     INHERITED via deep_merge), so kamal never looks these up here; they
          #     are also production-environment-scoped and would interpolate ""
          #     (present-empty → guard raise). ---
          # --- RPC endpoints (Web3::RpcConnectionPool; chain-family boot guard) ---
          # 🔴 [OPS.37] These are MAINNET values, and this block must mirror the global
          # env.secret (drift-guard note above). The day canopy becomes a testnet slot
          # (WEB3_CHAIN_ENV: testnet — the commented block in config/deploy.canopy.yml),
          # these four must be remapped here too, or the declaration and the wiring
          # disagree and the guard refuses the boot. That is move (3) of five.
          ALCHEMY_POLYGON_RPC_URL: ${{ secrets.ALCHEMY_POLYGON_RPC_URL }}
          ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.ALCHEMY_ETHEREUM_RPC_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          # --- Solana public identifiers (signing keypair = job-only quintet, not mapped) ---
          SOLANA_FEE_PAYER_PUBKEY: ${{ secrets.SOLANA_FEE_PAYER_PUBKEY }}
          SOLANA_FEE_PAYER_TOKEN_ACCOUNT: ${{ secrets.SOLANA_FEE_PAYER_TOKEN_ACCOUNT }}
          SOLANA_USDC_MINT_ADDRESS: ${{ secrets.SOLANA_USDC_MINT_ADDRESS }}
          # --- Webhook HMACs (Chainlink callback — dispatch removed ARCH.53; Helium SOS ARCH.34) ---
          CHAINLINK_HMAC_SECRET: ${{ secrets.CHAINLINK_HMAC_SECRET }}
          HELIUM_WEBHOOK_SECRET: ${{ secrets.HELIUM_WEBHOOK_SECRET }}

      # ⚖️ [OPS.37 2026-08-30] `kamal deploy` never boots accessories (Kamal::Cli::App#boot
      # walks KAMAL.roles only) — without this step a green deploy leaves Grafana EMPTY: no
      # series exist, so every P0 alert is silent and the NoData branch cannot save it (it
      # catches "all `up` vanished", not "Alloy never started"). `accessory boot` is
      # idempotent in kamal 2.12 ("Skipping … a container already exists"), so this is a
      # cheap ensure-running on every deploy, NOT a restart; config.alloy changes still need
      # a deliberate `kamal accessory reboot alloy` (runbook 06_01). Boots here (first
      # deploy is canopy — DEPLOY-1 Phase 3) so the agent watches production targets from
      # day zero; until the production roles exist their aliases resolve NXDOMAIN and `up=0`
      # tells the truth.
      #
      # 🔴 NO `-d canopy`, and the flag's ABSENCE is the load-bearing part [⚖️ founder
      # 2026-08-31]. There is exactly ONE Alloy container for both slots, verified against
      # kamal 2.12 source: `Kamal::Configuration::Accessory#service_name` is
      # `"#{config.service}-#{name}"`, and `config.service` does NOT carry the destination
      # (`service_and_destination` exists but is used only for the apps DIRECTORY). So both
      # destinations resolve to `silken_net-alloy`, and canopy inherits the base
      # `accessories.alloy.host` because it overrode only `env.clear` — same name, same host.
      # `accessory boot` then SKIPS the second slot ("a container already exists", yellow,
      # exit 0), so whichever slot booted first silently owned the `DEPLOYMENT_SLOT` label.
      # Canopy deploys on every main push and production only on a Release ⇒ canopy would
      # have won, stamping `slot="canopy"` on PRODUCTION series.
      # 🔑 And the mislabel was pure loss, because canopy has NO scrape targets at all:
      # `config.alloy` scrapes the three `network-alias` names, and canopy is alias-less BY
      # CONSTRUCTION (its array-form `servers:` replaces the base hash — invariant B3). The
      # comment above already said this agent "watches production targets"; the canopy
      # override contradicted it. Dropping the flag makes the label match what is scraped.
      - name: Ensure Alloy accessory is running
        run: kamal accessory boot alloy
        env:
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}
          # Accessory env.secret trio (.kamal/secrets-common reads $VAR from this shell).
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_REMOTE_WRITE_USERNAME: ${{ secrets.GRAFANA_REMOTE_WRITE_USERNAME }}
          GRAFANA_REMOTE_WRITE_TOKEN: ${{ secrets.GRAFANA_REMOTE_WRITE_TOKEN }}

  # [INF.6] Post-deploy gate: FW.56 freeze-contract probes through the real
  # UDP boundary (Ingress Anchor → coap_listener). HTTP health checks
  # cannot see a dead CoAP path — without this the network goes dark silently.
  # Активація: задати repo Variable CANOPY_COAP_HOST (host Ingress Anchor);
  # поки змінна порожня, job видимо skipped (Брама ще не задеплоєна).
  coap-smoke:
    name: CoAP UDP Smoke [INF.6]
    needs: deploy
    if: ${{ vars.CANOPY_COAP_HOST != '' }}
    uses: ./.github/workflows/coap_smoke.yml
    with:
      host: ${{ vars.CANOPY_COAP_HOST }}
