name: Deploy Canopy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-canopy
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_db_password: ${{ secrets.DATABASE_PASSWORD }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  verify-secrets:
    name: Verify Required Secrets [SEC.11]
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - name: Check PROVISIONING_MASTER_KEY
        id: check
        env:
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
        run: |
          # Absent key → not a failure: this repo simply has no deploy secrets
          # configured. Emit configured=false so the deploy jobs skip cleanly
          # (green run, no red noise) instead of asserting and going red.
          if [ -z "$PROVISIONING_MASTER_KEY" ]; then
            echo "::notice::PROVISIONING_MASTER_KEY not set — Canopy deploy skipped" \
                 "(no deploy secrets configured for this repo). See SEC.11 in docs/00_08."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Key IS set → still validate it (a present-but-malformed key is a real
          # misconfiguration and must stay loud).
          KEY_LEN=${#PROVISIONING_MASTER_KEY}
          if [ "$KEY_LEN" -lt 64 ]; then
            echo "::error::PROVISIONING_MASTER_KEY is suspiciously short ($KEY_LEN chars)." \
                 "Expected: >=64 hex characters (256-bit key)."
            exit 1
          fi
          echo "PROVISIONING_MASTER_KEY present (length: $KEY_LEN chars). OK."
          echo "configured=true" >> "$GITHUB_OUTPUT"

  terraform:
    name: Terraform Apply
    needs: verify-secrets
    runs-on: ubuntu-latest
    if: ${{ needs.verify-secrets.outputs.configured == 'true' }}

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Kamal Deploy (Canopy)
    needs: [verify-secrets, terraform]
    runs-on: ubuntu-latest
    if: ${{ needs.verify-secrets.outputs.configured == 'true' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v '~> 2.12.0'

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Reboot Kamal Proxy
        run: kamal proxy reboot -d canopy
        env:
          KAMAL_MASTER_KEY: ${{ secrets.KAMAL_MASTER_KEY }}

      - name: Kamal Deploy to Canopy
        run: kamal deploy -d canopy
        env:
          KAMAL_MASTER_KEY: ${{ secrets.KAMAL_MASTER_KEY }}
          GCP_ARTIFACT_REGISTRY_KEY: ${{ secrets.GCP_SA_KEY }}
          DATABASE_URL: ${{ secrets.CANOPY_DATABASE_URL }}
          REDIS_URL: ${{ secrets.CANOPY_REDIS_URL }}
          RELEASE_VERSION: ${{ github.sha }}

  # [INF.6] Post-deploy gate: FW.56 freeze-contract probes through the real
  # UDP boundary (Ingress Anchor → Akash → coap_listener). HTTP health checks
  # cannot see a dead CoAP path — without this the network goes dark silently.
  # Активація: задати repo Variable CANOPY_COAP_HOST (host Ingress Anchor);
  # поки змінна порожня, job видимо skipped (Брама ще не задеплоєна).
  coap-smoke:
    name: CoAP UDP Smoke [INF.6]
    needs: deploy
    if: ${{ vars.CANOPY_COAP_HOST != '' }}
    uses: ./.github/workflows/coap_smoke.yml
    with:
      host: ${{ vars.CANOPY_COAP_HOST }}
