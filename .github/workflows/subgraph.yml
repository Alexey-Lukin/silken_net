name: CI · Subgraph

# [OPS.34] Субграф — поверхня, з якої ЗОВНІШНІЙ читач (ESG-покупець, ISO/Verra-аудитор)
# бере нашу емісію. До цього воркфлоу її не ВИКОНУВАВ ніхто: пʼять гейтів читали теку
# як ТЕКСТ (SPDX · ref-drift · path-drift), і жоден не компілював — клас
# `ssot-maintenance` §Guard-craft #98. Прецедент, що знімає сумнів у реальності класу:
# закомічений субграф уже одного разу НЕ ЗБИРАВСЯ ВЗАГАЛІ (кожен `@entity` падав на
# відсутньому `immutable`) і був полагоджений очима, не гейтом.
#
# 🔒 Required-контекст (девʼятий): `pull_request` тут ГОЛИЙ свідомо — path-filtered
# required-чек блокує чужі PR назавжди («Expected — waiting for status», воркфлоу без
# збігу шляхів не СТАРТУЄ і check-run не народжується). Тому фільтр живе в джобі
# `changes` (dorny/paths-filter), а `Subgraph passed` (if: always()) емітить статус на
# КОЖНОМУ PR — та сама форма, що docs.yml/ci.yml. Периметр push-тригера містить сам
# файл воркфлоу: без цього правка САМОГО сторожа його не перезапускала б.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# 🔒 [OPS.35] ЦЕЙ РЯДОК І Є МІРОЮ РИЗИКУ dev-дерева `graph-cli`, а не слово «critical»
# в алерті. Дерево виконується НА РАННЕРІ (supply-chain-at-build, ціль — пайплайн, не
# продукт), тож питання не «яка severity», а «що можна винести звідси». Зміряно:
# токен тут `read`, репо-дефолт теж `read`, згадок `secrets.` у цьому воркфлоу НУЛЬ —
# отже максимальний приз від повного RCE в `graph build` це публічний код на тому ж
# коміті, read-only токен і одноразова VM.
# ⛔ Наслідок для правок: додавши сюди БУДЬ-ЯКИЙ `secrets.` чи ширші `permissions`, ти
# скасовуєш підставу, з якою два залишкові ПАКЕТИ (`decompress`, `uuid`) прийнято за
# НЕДОСЯЖНІСТЮ — і їх треба переоцінювати заново (дім механіки — скіл
# `dependency-update` §Subgraph).
# ⚠️ Одиниця тут вирішує, бо розходження ЧИТАЄТЬСЯ як дрейф: пакетів два, а GitHub
# показує ЧОТИРИ алерти — на `decompress` висять три адвізорі (одна critical), на
# `uuid` одна. «4» на вкладці Security і «два залишкові» тут описують ОДИН стан.
# ⚠️ Названо чесно: `harden-runner` тут у `egress-policy: audit`, тобто ексфільтрацію
# ЗАФІКСУЄ, але не спинить; перехід у `block` для ЦЬОГО воркфлоу ВІДХИЛЕНО ⚖️ founder
# 2026-08-29 — block лише на парі deploy-воркфлоу, бо тут секретів НУЛЬ і ексфільтрувати
# нічого (дім присуду й вимір — `06_07 §1a`; провенанс — `00_07` OPS.36 §🗄️).
permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'subgraph/**'
      - '.github/workflows/subgraph.yml'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      subgraph: ${{ steps.filter.outputs.subgraph }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect subgraph-relevant changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            subgraph:
              - 'subgraph/**'
              - '.github/workflows/subgraph.yml'

  build:
    name: graph codegen + build
    needs: changes
    if: ${{ needs.changes.outputs.subgraph == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node береться з раннера — той самий вибір, що для `npm ci` у
      # `solidity_audit.yml`. Стеля названа: РАНТАЙМ не запінено, запінено ІНСТРУМЕНТ
      # (`@graphprotocol/graph-cli` точною версією в `subgraph/package.json` +
      # `package-lock.json`), бо саме CLI визначає, чи приймається наш `apiVersion`.
      - name: Install subgraph toolchain
        working-directory: subgraph
        run: npm ci

      # 🔴 ДВА кроки, і порядок несучий — не зливати в один і не лишати самий `build`.
      # `graph build` компілює мапінг проти `generated/`, тож без свіжого `codegen` він
      # оцінює СТАРИЙ знімок типів, а не дерево: спіймано вживу 2026-08-27 —
      # відкат зламаної схеми лишив стейл-`generated/`, і `build` червонів на вже
      # полагодженому дереві. Клас — §Guard-craft #69 (локально згенерований артефакт
      # ЗАТІНЮЄ файл під тестом). `generated/` і `build/` у `.gitignore`, тож у CI
      # вони завжди свіжі — саме тому крок чесний.
      # [S3.5 → DEPLOY-1 Фаза 2, 2026-09-03] Zero-address fail-fast BEFORE codegen. The script
      # existed since E.45 and its header asked to be wired here — nothing ever called it, so a
      # placeholder address in subgraph.yaml would have compiled green all the way to `graph deploy`.
      # It reads the manifest as text (no toolchain), so it runs first and cheapest.
      - name: validate_addresses.sh (no zero-address dataSource)
        working-directory: subgraph
        run: sh ./validate_addresses.sh

      - name: graph codegen (schema.graphql + ABI → generated/)
        working-directory: subgraph
        run: npx graph codegen

      - name: graph build (AssemblyScript mapping → wasm)
        working-directory: subgraph
        run: npx graph build

      # [OPS.36] Тест-шар мапінгу — третій крок, і він судить те, чого ДВА попередні не
      # бачать за побудовою. `graph build` перевіряє ТИПИ (стеля оголошена в OPS.34), тож
      # `.plus()`→`.minus()`, `load`→`new` чи зріз не тієї довжини компілюються ЗЕЛЕНО.
      # Виміряно мутацією 2026-08-28: знак акумулятора валить 4 приклади з 9, підміна
      # `load` — 2, реверс послідовного зняття префіксів — 1.
      #
      # 🔒 Дві стелі, названі, щоб зелене не читалось ширше:
      #   · branch coverage в AssemblyScript НЕ ІСНУЄ (`-c` дає лише рядки), тож
      #     ratchet-форма сусідніх смуг сюди НЕ переноситься — і не треба вдавати, що є;
      #   · тести юніт-рівня на МОКОВАНИХ подіях: вони нічого не кажуть ані про адресу
      #     dataSource (усі три сьогодні `0x0…0`), ані про поведінку graph-node.
      #
      # ⚠️ CLI сам тягне прибудований бінар matchstick із GitHub-релізів (без ручного
      # Rust-тулчейну) — тобто крок залежить від мережі раннера так само, як `npm ci`.
      - name: graph test (matchstick — семантика мапінгу)
        working-directory: subgraph
        run: npx graph test

  subgraph-ok:
    # Single required status check for the subgraph lane on `main`. Always runs so a
    # non-subgraph PR — where `build` is path-skipped — still emits a green status;
    # fails only if the lane actually RAN and failed/was cancelled.
    name: Subgraph passed
    if: ${{ always() }}
    needs: [changes, build]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      # [OPS.23] `changes` carries no `if:`, so `success` is its ONLY legal result,
      # while the path-gated `build` may legally be `skipped`. The guard after this
      # one asks only "did anything FAIL?" — so a skipped FILTER would read as an
      # ordinary path-skip, and every skip beneath it happened for a false reason.
      - name: Fail if the change-filter itself did not run
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The change-filter job did not succeed (result: ${{ needs.changes.result }}) — every job below it was skipped for a FALSE reason, so a green aggregate would vouch for nothing. Infrastructure failure, not a code failure: re-run this workflow."
          exit 1
      - name: Fail if the subgraph lane failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        # [OPS.30] Вердикт мусить називати ЕТАП: `failure` = перевірка виконалась
        # і сказала «ні»; `cancelled` = вона НЕ БІГЛА (стеля `timeout-minutes`
        # або скасування прогону). Один меседж на два світи читається як
        # «впали тести» і жене наступний прохід шукати дефект у власному діфі.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries|map(select(.value.result=="failure").key)|join(", ")' <<<"$NEEDS_JSON")
          stopped=$(jq -r 'to_entries|map(select(.value.result=="cancelled").key)|join(", ")' <<<"$NEEDS_JSON")
          if [ -n "$failed" ]; then
            echo "::error title=ВПАЛО (вердикт є)::${failed} — the subgraph lane failed (codegen / build / matchstick)."
          fi
          if [ -n "$stopped" ]; then
            echo "::error title=НЕ БІГЛО (вердикту НЕМАЄ)::${stopped} — скасовано: стеля timeout-minutes або скасування прогону. Це не твердження про код."
          fi
          exit 1
      - name: All clear
        run: echo "Subgraph lane passed (path-skipped on a non-subgraph change is OK)."
