# SSOT Integrity Guard (OPS.2)
#
# Blocks PR merges when changes to core code (models, firmware) are not
# accompanied by corresponding documentation updates.
#
# This prevents context drift between implementation and the SSOT docs.
# Ref: docs/00_05_GitHub_Projects_and_IaC_Automation.md

name: CI · SSOT Guard

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  pull_request:
    types: [opened, synchronize, reopened]
    # Only the protected areas this guard checks (the path→doc mappings in the
    # script below). A PR touching only ml/terraform/docs never trips the guard,
    # so don't spin a runner for it. Mixed code+X PRs still match.
    paths:
      - 'app/models/**'
      - 'app/services/**'
      - 'firmware/soldier/**'
      - 'firmware/queen/**'
      - 'firmware/bio_contracts/**'
      - 'contracts/**'

permissions:
  contents: read
  pull-requests: write

jobs:
  ssot_check:
    name: Documentation consistency check
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7
        with:
          fetch-depth: 0

      - name: Check SSOT consistency
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            const { execSync } = require('child_process');

            // Get list of changed files in this PR
            const base = context.payload.pull_request.base.sha;
            const head = context.payload.pull_request.head.sha;
            const diffOutput = execSync(
              `git diff --name-only ${base}...${head}`,
              { encoding: 'utf-8' }
            ).trim();

            if (!diffOutput) {
              core.info('No changed files detected.');
              return;
            }

            const changedFiles = diffOutput.split('\n').filter(Boolean);
            core.info(`Changed files (${changedFiles.length}):\n${changedFiles.join('\n')}`);

            // ── Mapping: source paths → expected doc updates ──────────
            // Each entry: { pattern, description, docPatterns }
            const mappings = [
              {
                pattern: /^app\/models\//,
                description: 'Data models (app/models/)',
                docPatterns: [/^docs\//, /\.md$/],
              },
              {
                pattern: /^firmware\/soldier\//,
                description: 'Soldier firmware (firmware/soldier/)',
                docPatterns: [/^docs\//, /\.md$/],
              },
              {
                pattern: /^firmware\/queen\//,
                description: 'Queen firmware (firmware/queen/)',
                docPatterns: [/^docs\//, /\.md$/],
              },
              {
                pattern: /^firmware\/bio_contracts\//,
                description: 'Bio-contracts (firmware/bio_contracts/)',
                docPatterns: [/^docs\//, /\.md$/],
              },
              {
                pattern: /^contracts\//,
                description: 'Smart contracts (contracts/)',
                docPatterns: [/^docs\//, /\.md$/],
              },
              {
                pattern: /^app\/services\//,
                description: 'Business services (app/services/)',
                docPatterns: [/^docs\//, /\.md$/],
              },
            ];

            // ── Check which protected areas were modified ─────────────
            const triggeredAreas = [];
            for (const mapping of mappings) {
              const matchedFiles = changedFiles.filter(f => mapping.pattern.test(f));
              if (matchedFiles.length > 0) {
                triggeredAreas.push({
                  ...mapping,
                  files: matchedFiles,
                });
              }
            }

            if (triggeredAreas.length === 0) {
              core.info('✅ No protected areas modified — SSOT check passed.');
              return;
            }

            // ── Check if docs were updated too ────────────────────────
            const hasDocUpdate = changedFiles.some(f =>
              f.startsWith('docs/') ||
              f === 'README.md' ||
              f === 'CLAUDE.md'
            );

            // ── Check for semantic type:* bypass labels ───────────────
            // Doc reference: docs/00_05_GitHub_Projects_and_IaC_Automation.md §2.3.
            // Force-function: author must classify the change as non-architectural.
            // Generic skip-label was rejected because it would be abused without
            // forcing classification. Semantic labels are visible in PR title/UI,
            // so a mismatch (e.g. `type:bugfix` on a schema change) is caught by reviewers.
            // [OPS.9] type:refactor & type:bugfix removed from bypass — they
            // change names/paths/logic → context drift. Such PRs must update
            // the relevant docs/ file, or log the open drift in docs/00_07
            // (the One-Home backlog — itself a docs/ change). Only genuinely
            // non-architectural classes may bypass the docs requirement.
            const BYPASS_LABELS = [
              'type:chore',
              'type:deps',
              'type:perf',
              'type:test',
            ];
            const labels = context.payload.pull_request.labels.map(l => l.name);
            const bypassMatch = labels.find(l => BYPASS_LABELS.includes(l));

            if (bypassMatch) {
              core.info(
                `⚠️ SSOT bypass via semantic label "${bypassMatch}" — skipping documentation check.`
              );
              core.warning(
                `PR classified as "${bypassMatch}" (non-architectural). ` +
                `Reviewer: verify the label matches the actual change.`
              );
              return;
            }

            if (hasDocUpdate) {
              core.info('✅ Protected areas modified AND docs updated — SSOT check passed.');
              return;
            }

            // ── Build failure message ─────────────────────────────────
            const areas = triggeredAreas.map(a =>
              `- **${a.description}**: ${a.files.length} file(s) changed`
            ).join('\n');

            const message = [
              '## 🛡️ SSOT Integrity Guard',
              '',
              'This PR modifies protected code areas without updating documentation.',
              '',
              '### Modified areas:',
              areas,
              '',
              '### Required action — pick ONE:',
              '',
              '**(a)** Update relevant SSOT file in `docs/` (or `README.md` / `CLAUDE.md`), OR',
              '',
              '**(b)** Add one of these semantic labels if the PR genuinely does not alter architecture:',
              '   - `type:chore` — build/CI/tooling',
              '   - `type:deps` — dependency bump',
              '   - `type:perf` — performance optimization',
              '   - `type:test` — test-only change',
              '',
              '> `type:refactor` / `type:bugfix` no longer bypass — they change names/paths/logic',
              '> (context drift). Update the relevant `docs/` file, or log the open drift in',
              '> `docs/00_07_Action_Plan_Tracker.md` — the One-Home backlog, itself a `docs/` change.',
              '> Generic skip-label was deliberately rejected — the semantic label forces classification.',
              '> Ref: [00_05 §2.3 SSOT Integrity Guard](../docs/00_05_GitHub_Projects_and_IaC_Automation.md)',
            ].join('\n');

            core.setFailed(message);
