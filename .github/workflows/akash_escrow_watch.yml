name: Ops · Akash Escrow Watch

# [OPS.11] FinOps guard №2 — the Akash lease escrow BURNS DOWN with every block
# and nothing else watches the runway: at zero the lease closes and web+job+coap
# die together, while the scrape-target-down alert lands in a not-yet-configured
# contact point (S2.2). This probe queries the public LCD REST API (curl+jq, no
# akash binary, no keys — read-only chain data) and fails loudly when any active
# deployment's escrow runway drops below the threshold.
#
# Skip-clean pattern (same as coap_smoke): while the repo Variable
# AKASH_OWNER_ADDRESS is unset (no lease yet) the job visibly skips via a
# ::notice — set it right after the first `terraform apply` / lease creation.
#
# Variables (Settings → Variables → Actions):
#   AKASH_OWNER_ADDRESS   — akash1… wallet that owns the deployment (activates the gate)
#   AKASH_MIN_RUNWAY_DAYS — optional, default 14
#   AKASH_LCD_BASE        — optional LCD override, default rest.cosmos.directory/akash
#
# Runway math (validated live against mainnet deployments, 2026-07-05):
#   remaining = escrow funds − (current_height − settled_at) × Σ(active lease price/block)
#   runway    = remaining / (price × blocks/day), block time ≈ 6 s (akashnet-2).
# API versions: market v1beta5 · deployment v1beta4 (older versions answer
# "Not Implemented" on current mainnet).

on:
  schedule:
    - cron: "37 5 * * *" # daily, offset from round hours (GH load spikes)
  workflow_dispatch:
    inputs:
      owner:
        description: "akash1… owner address (default: repo Variable AKASH_OWNER_ADDRESS)"
        required: false
        type: string
      min_days:
        description: "Fail when runway is below this many days"
        required: false
        default: "14"
        type: string

permissions:
  contents: read

jobs:
  escrow-watch:
    name: Escrow runway check
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40 # v2.20.1
        with:
          egress-policy: audit

      - name: Query lease escrow runway
        env:
          AKASH_OWNER: ${{ inputs.owner || vars.AKASH_OWNER_ADDRESS }}
          MIN_DAYS: ${{ inputs.min_days || vars.AKASH_MIN_RUNWAY_DAYS || '14' }}
          LCD: ${{ vars.AKASH_LCD_BASE || 'https://rest.cosmos.directory/akash' }}
          BLOCK_SECONDS: "6"
        run: |
          set -euo pipefail
          if [ -z "${AKASH_OWNER}" ]; then
            echo "::notice::Escrow watch SKIPPED — repo Variable AKASH_OWNER_ADDRESS is not set (no Akash lease yet). Set it after the first lease; this notice is the skip."
            exit 0
          fi
          # The address rides into a URL — pin the shape (also blocks dispatch-input injection).
          if ! [[ "${AKASH_OWNER}" =~ ^akash1[a-z0-9]{38}$ ]]; then
            echo "::error::AKASH_OWNER_ADDRESS '${AKASH_OWNER}' is not a bech32 akash1… address"
            exit 1
          fi

          leases=$(curl -sf --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors "${LCD}/akash/market/v1beta5/leases/list?filters.owner=${AKASH_OWNER}&filters.state=active&pagination.limit=200")
          lease_count=$(jq '.leases | length' <<<"$leases")
          if [ "$lease_count" -eq 0 ]; then
            # An owner with a configured watch but ZERO active leases IS the alarm:
            # the lease most likely closed because the escrow burned out.
            echo "::error::No ACTIVE Akash leases for ${AKASH_OWNER} — deployment closed (escrow exhausted?). Re-deploy + over-fund (06_02)."
            exit 1
          fi

          height=$(curl -sf --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors "${LCD}/cosmos/base/tendermint/v1beta1/blocks/latest" | jq -r '.block.header.height')
          blocks_per_day=$(jq -n "86400 / ${BLOCK_SECONDS}")
          fail=0

          for dseq in $(jq -r '[.leases[].lease.id.dseq] | unique[]' <<<"$leases"); do
            denom=$(jq -r --arg d "$dseq" '[.leases[].lease | select(.id.dseq==$d) | .price.denom][0]' <<<"$leases")
            price=$(jq -r --arg d "$dseq" '[.leases[].lease | select(.id.dseq==$d) | .price.amount | tonumber] | add' <<<"$leases")

            dep=$(curl -sf --max-time 30 --retry 3 --retry-delay 5 --retry-all-errors "${LCD}/akash/deployment/v1beta4/deployments/info?id.owner=${AKASH_OWNER}&id.dseq=${dseq}")
            # state.funds == Σ deposits[].balance (incl. owner-balance deposits) — verified
            # against live mainnet deployments; the old proto's state.balance no longer exists.
            funds=$(jq -r --arg den "$denom" '[.escrow_account.state.funds[]? | select(.denom==$den) | .amount | tonumber] | add // 0' <<<"$dep")
            settled_at=$(jq -r '.escrow_account.state.settled_at // "0"' <<<"$dep")

            # a zero-price lease burns nothing — runway is infinite, skip the math
            if [ "$(jq -n --argjson p "$price" '$p > 0')" != "true" ]; then
              echo "::notice::dseq=${dseq}: lease price is 0 ${denom} — no escrow burn, skipping runway check"
              continue
            fi
            # settled_at 0/absent (just-created deployment) → no accrual yet
            remaining=$(jq -n --argjson f "$funds" --argjson p "$price" --argjson h "$height" --argjson s "$settled_at" \
              '[$f - (if $s > 0 then ($h - $s) else 0 end) * $p, 0] | max')
            runway_days=$(jq -n --argjson r "$remaining" --argjson p "$price" --argjson b "$blocks_per_day" '$r / ($p * $b) | floor')
            remaining_h=$(jq -n --argjson r "$remaining" '($r / 1e6 * 100 | floor) / 100')
            burn_day=$(jq -n --argjson p "$price" --argjson b "$blocks_per_day" '($p * $b / 1e6 * 100 | floor) / 100')

            echo "::notice::dseq=${dseq}: escrow ≈ ${remaining_h} ${denom#u} | burn ≈ ${burn_day} ${denom#u}/day | runway ≈ ${runway_days} days"
            if [ "$(jq -n --argjson d "$runway_days" --argjson m "$MIN_DAYS" '$d < $m')" = "true" ]; then
              echo "::error::dseq=${dseq} runway ${runway_days}d < ${MIN_DAYS}d — top up: akash tx deployment deposit (06_02; OPS.11 calendar minimum = 2× monthly estimate)"
              fail=1
            fi
          done
          exit $fail
