name: Deploy · Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

env:
  TF_VAR_project_id: ${{ secrets.GCP_PROJECT_ID }}
  TF_VAR_db_password: ${{ secrets.DATABASE_PASSWORD }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  verify-secrets:
    name: Verify Required Secrets [SEC.11]
    runs-on: ubuntu-latest
    steps:
      - name: Assert PROVISIONING_MASTER_KEY is present
        env:
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
        run: |
          if [ -z "$PROVISIONING_MASTER_KEY" ]; then
            echo "::error::PROVISIONING_MASTER_KEY secret is missing." \
                 "Production deploy without this ENV would force HardwareKeyService" \
                 "into deterministic-seed fallback (lab-only mode), enabling trivial" \
                 "AES key extraction. Refusing to deploy. See SEC.11 in docs/00_08."
            exit 1
          fi
          KEY_LEN=${#PROVISIONING_MASTER_KEY}
          if [ "$KEY_LEN" -lt 64 ]; then
            echo "::error::PROVISIONING_MASTER_KEY is suspiciously short ($KEY_LEN chars)." \
                 "Expected: >=64 hex characters (256-bit key). See SEC.11 + SEC.9."
            exit 1
          fi
          echo "PROVISIONING_MASTER_KEY present (length: $KEY_LEN chars). OK."

      - name: Assert KAMAL_MASTER_KEY is present
        env:
          KAMAL_MASTER_KEY: ${{ secrets.KAMAL_MASTER_KEY }}
        run: |
          if [ -z "$KAMAL_MASTER_KEY" ]; then
            echo "::error::KAMAL_MASTER_KEY secret is missing - Kamal deploy will fail."
            exit 1
          fi
          echo "KAMAL_MASTER_KEY present. OK."

  terraform:
    name: Terraform Apply
    needs: verify-secrets
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "~> 1.5"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan

  deploy:
    name: Kamal Deploy (Production)
    needs: terraform
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Ruby
        uses: ruby/setup-ruby@9eb537ca036ebaed86729dcb9309076e4c5c3b74 # v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v '~> 2.12.0'

      - name: Set up SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          echo "${{ secrets.SSH_KNOWN_HOSTS }}" >> ~/.ssh/known_hosts

      - name: Reboot Kamal Proxy
        run: kamal proxy reboot
        env:
          KAMAL_MASTER_KEY: ${{ secrets.KAMAL_MASTER_KEY }}

      - name: Kamal Deploy to Production
        run: kamal deploy
        env:
          KAMAL_MASTER_KEY: ${{ secrets.KAMAL_MASTER_KEY }}
          GCP_ARTIFACT_REGISTRY_KEY: ${{ secrets.GCP_SA_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          RELEASE_VERSION: ${{ github.event.release.tag_name || github.sha }}

  # [INF.6] Post-deploy gate: FW.56 freeze-contract probes through the real
  # UDP boundary (Ingress Anchor → Akash → coap_listener). HTTP health checks
  # cannot see a dead CoAP path — without this the network goes dark silently.
  # Активація: задати repo Variable PRODUCTION_COAP_HOST (host Ingress Anchor);
  # поки змінна порожня, job видимо skipped (Брама ще не задеплоєна).
  coap-smoke:
    name: CoAP UDP Smoke [INF.6]
    needs: deploy
    if: ${{ vars.PRODUCTION_COAP_HOST != '' }}
    uses: ./.github/workflows/coap_smoke.yml
    with:
      host: ${{ vars.PRODUCTION_COAP_HOST }}
