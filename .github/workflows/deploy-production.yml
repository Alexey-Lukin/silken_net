name: Deploy · Production

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

# ⛔ [INF.22] `TF_VAR_*` знято разом із джобою `terraform` (⚖️ founder 2026-08-29) —
# підстава й механіка гейта `terraform_workflow_var_parity_spec` описані в
# дзеркальному блоці `deploy.yml`; тут не дублюємо.
# SSH secrets removed (INF.20 (в)): admin path = IAP tunnel + OS Login; the CI
# kamal leg needs the (б) glue (ssh.proxy_command + SA tunnel role) before it can
# reach the Anchor — until then the kamal step is honestly non-functional.

jobs:
  verify-secrets:
    name: Verify Required Secrets [SEC.11]
    runs-on: ubuntu-latest
    # [INF.22] GH Environment `production` scopes the money/signing quintet: those
    # secrets live ONLY at environment level (any other workflow reads ""), and the
    # environment carries a wait-timer (solo-substitute for human approval,
    # bus_factor=1) + ref policy (v* tags + main). Wait-timer fires PER JOB that
    # references the environment — so it gates exactly twice per release: here
    # (before the release is allowed to proceed at all) and at `deploy` (before
    # kamal ships the signing container).
    # ⚠️ [INF.22] Доти цей абзац описував ті самі два стопи через ТРЕТЮ джобу
    # («here — before terraform touches infra … `terraform` runs environment-free
    # in between … no third stop»). Джоби `terraform` більше немає (⚖️ 2026-08-29),
    # тож ЧИСЛО стопів не змінилось, а от що стоїть МІЖ ними — змінилось: між
    # `verify-secrets` і `deploy` тепер нічого. Правиться разом, бо коментар, який
    # орієнтує читача по неіснуючій джобі, — не стиль, а хибна мапа релізу.
    environment: production
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Assert deploy secrets are present [B1]
        env:
          # Boot-critical: empty → container crashes on boot. (Доти рядок казав ще й
          # «or terraform can't apply» — джоби `terraform` тут більше немає, INF.22.)
          # Mirror config/deploy.yml env.secret (the kamal-deploy env: block below)
          # + the infra prerequisites (GCP project). SSH secrets removed — INF.20 (в):
          # IAP tunnel + OS Login, no key material to provision.
          # KAMAL_MASTER_KEY removed — phantom: Kamal 2.x has no such mechanism and
          # nothing in .kamal/ consumes it (plain $VAR secrets file, not encrypted).
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
          # [SEC.22] AR-encryption keys (hardware_keys/identities at-rest) — boot-critical:
          # active_record_encryption_keys_check.rb fail-closes production boot without them.
          # They sit in env.secret + secrets-common, so an unmapped var here injects "" →
          # crash AFTER a green verify (the B1 class this gate exists to kill).
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
          # [INF.22] Keyless CI: the WIF provider + SA email are non-secret repo
          # VARIABLES, not GCP_SA_KEY. Their presence is the "infra provisioned"
          # deploy-gate signal that GCP_SA_KEY used to carry.
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # [OPS.37 review 2026-09-02] Read ONLY to refuse a shared instance: canopy runs a
          # Sidekiq SERVER now, Sidekiq keys carry no namespace by decision (config/initializers/
          # sidekiq.rb), and the second Upstash instance is blocked on the tariff — so the day
          # someone unblocks production by reusing the canopy endpoint, a testnet-keyed worker
          # starts draining the mainnet money queue. Not a deploy input; never mapped below.
          CANOPY_REDIS_URL: ${{ secrets.CANOPY_REDIS_URL }}
          ORACLE_MINTER_PRIVATE_KEY: ${{ secrets.ORACLE_MINTER_PRIVATE_KEY }}
          ORACLE_SLASHER_PRIVATE_KEY: ${{ secrets.ORACLE_SLASHER_PRIVATE_KEY }}
          HELIUM_WEBHOOK_SECRET: ${{ secrets.HELIUM_WEBHOOK_SECRET }}
          # Runtime (lazy): feature degraded until provisioned, not a boot crash. Warn only.
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ETHEREUM_ANCHOR_PRIVATE_KEY: ${{ secrets.ETHEREUM_ANCHOR_PRIVATE_KEY }}
          ALCHEMY_POLYGON_RPC_URL: ${{ secrets.ALCHEMY_POLYGON_RPC_URL }}
          ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.ALCHEMY_ETHEREUM_RPC_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          SOLANA_WALLET_KEYPAIR: ${{ secrets.SOLANA_WALLET_KEYPAIR }}
          SOLANA_FEE_PAYER_PUBKEY: ${{ secrets.SOLANA_FEE_PAYER_PUBKEY }}
          SOLANA_FEE_PAYER_TOKEN_ACCOUNT: ${{ secrets.SOLANA_FEE_PAYER_TOKEN_ACCOUNT }}
          SOLANA_USDC_MINT_ADDRESS: ${{ secrets.SOLANA_USDC_MINT_ADDRESS }}
          ORACLE_CELO_PRIVATE_KEY: ${{ secrets.ORACLE_CELO_PRIVATE_KEY }}
          CHAINLINK_HMAC_SECRET: ${{ secrets.CHAINLINK_HMAC_SECRET }}
          TURBO_SIGNED_STREAM_KEY: ${{ secrets.TURBO_SIGNED_STREAM_KEY }}
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_REMOTE_WRITE_USERNAME: ${{ secrets.GRAFANA_REMOTE_WRITE_USERNAME }}
          GRAFANA_REMOTE_WRITE_TOKEN: ${{ secrets.GRAFANA_REMOTE_WRITE_TOKEN }}
          # 🔴 [INF.4 2026-08-31] Origin-TLS pair — boot-critical since `proxy.ssl` went LIVE,
          # and it is here because the failure is COMPLETELY SILENT. `.kamal/secrets-common`
          # declares both names, so `Kamal::Secrets#[]` does NOT raise "Secret not found" — it
          # returns the EMPTY STRING; and `Kamal::Cli::App::SslCertificates#run` guards with
          # `if cert_content = …`, where "" is truthy in Ruby. So kamal happily uploads an empty
          # cert.pem/key.pem (mode 0644), kamal-proxy cannot serve TLS, and Cloudflare — Full
          # (strict) on both zones — answers 521/525 on every request behind a fully GREEN deploy.
          # Neither list carried them before, so there was not even a ::warning:: (06_04 §1).
          TLS_ORIGIN_CERT_PEM: ${{ secrets.TLS_ORIGIN_CERT_PEM }}
          TLS_ORIGIN_KEY_PEM: ${{ secrets.TLS_ORIGIN_KEY_PEM }}
        run: |
          # B1: production gates the FULL boot-critical set fail-loud — a missing secret here
          # would otherwise inject empty → container crashes AFTER a green verify (the exact
          # false-safety that hid the 4-month deploy block). Boot-critical = crashes boot
          # (master-key decrypt / PROVISIONING guard / oracle KeyError per web3_network_guard)
          # or blocks kamal. Runtime = lazy-fail on use (warn, don't block). Canon: docs/06_04 §1+§2.
          # 🔴 [OPS.37 review 2026-09-02] Membership is what `Web3NetworkGuard` refuses at the
          # JOB boot, not what a read-site raises on first use: the Solana quartet (presence,
          # `solana_violations`) and the silent Polygon RPC (`SILENT_RPC_ENVS`, web+job) were
          # RUNTIME here while the same guard already demanded them — a green verify, then a
          # job container that refuses to boot on a tagged release. Canopy's lists and these are
          # compared modulo the CANOPY_ prefix by spec/deploy/deploy_workflow_parity_spec.rb.
          BOOT_CRITICAL="SECRET_KEY_BASE PROVISIONING_MASTER_KEY ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT GCP_WORKLOAD_IDENTITY_PROVIDER GCP_SERVICE_ACCOUNT GCP_PROJECT_ID POSTGRES_PASSWORD REDIS_URL ORACLE_MINTER_PRIVATE_KEY ORACLE_SLASHER_PRIVATE_KEY TLS_ORIGIN_CERT_PEM TLS_ORIGIN_KEY_PEM ALCHEMY_POLYGON_RPC_URL SOLANA_WALLET_KEYPAIR SOLANA_FEE_PAYER_PUBKEY SOLANA_FEE_PAYER_TOKEN_ACCOUNT SOLANA_USDC_MINT_ADDRESS"
          RUNTIME="SENTRY_DSN ETHEREUM_ANCHOR_PRIVATE_KEY ALCHEMY_ETHEREUM_RPC_URL SOLANA_RPC_URL CELO_RPC_URL ORACLE_CELO_PRIVATE_KEY CHAINLINK_HMAC_SECRET HELIUM_WEBHOOK_SECRET TURBO_SIGNED_STREAM_KEY GRAFANA_REMOTE_WRITE_URL GRAFANA_REMOTE_WRITE_USERNAME GRAFANA_REMOTE_WRITE_TOKEN"

          missing=""
          for v in $BOOT_CRITICAL; do
            [ -z "${!v}" ] && missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Refusing to deploy — boot-critical secrets missing:$missing. The container would crash on boot. See docs/06_04 §1 (SEC.11)."
            exit 1
          fi

          if [ "${#PROVISIONING_MASTER_KEY}" -lt 64 ]; then
            echo "::error::PROVISIONING_MASTER_KEY too short (${#PROVISIONING_MASTER_KEY} chars; expected >=64 hex). See SEC.11 + SEC.9."
            exit 1
          fi

          # Present-but-of-the-wrong-KIND is the misconfig presence cannot see [SEC.11, measured
          # 2026-09-03 on canopy]: a Grafana token pasted into CANOPY_REDIS_URL passed the presence
          # check, boarded every new container as REDIS_URL and died at /ready (redis: false) for
          # three deploys. A `*_URL` slot must hold a URL; the check is on the shape, never the value.
          for v in $BOOT_CRITICAL; do
            case "$v" in
              *_URL)
                if [ -n "${!v}" ] && ! printf "%s" "${!v}" | grep -Eq "^[a-z][a-z0-9+.-]*://"; then
                  echo "::error::$v is set but does not look like a URL (scheme://…) — a value of the wrong KIND passed the presence check. See docs/06_04 §1 (SEC.11)."
                  exit 1
                fi
                ;;
            esac
          done

          # [OPS.37 review 2026-09-02] Two slots, two Sidekiq servers, no key namespace: the
          # Redis instances MUST differ, or the testnet worker drains the mainnet money queue.
          if [ -n "$CANOPY_REDIS_URL" ] && [ "$REDIS_URL" = "$CANOPY_REDIS_URL" ]; then
            echo "::error::REDIS_URL is the canopy instance — two Sidekiq servers on one un-namespaced Redis would cross-dequeue mainnet and testnet jobs. Provision a production instance (docs/06_01 §Upstash, OPS.37)."
            exit 1
          fi

          # [E.49] The guard's CONDITIONAL boot rule: an armed Celo path (key present) with no
          # mainnet RPC refuses the job boot — mirror it here so it never reaches the container.
          if [ -n "$ORACLE_CELO_PRIVATE_KEY" ] && [ -z "$CELO_RPC_URL" ]; then
            echo "::error::ORACLE_CELO_PRIVATE_KEY is set but CELO_RPC_URL is not — Web3NetworkGuard refuses that boot (E.49, no hardcoded fallback). Set a mainnet Celo RPC or unset the key."
            exit 1
          fi

          for v in $RUNTIME; do
            [ -z "${!v}" ] && echo "::warning::$v not set — its Web3/observability feature is degraded until provisioned (docs/06_04 §2.1)."
          done

          echo "All boot-critical deploy secrets present. Proceeding with production deploy."

  # ⛔ [INF.22] Джоби `terraform` тут БІЛЬШЕ НЕМА — присуд ⚖️ founder 2026-08-29:
  # `terraform apply` лишається founder-local, CI-нога = лише `kamal deploy`. Повна
  # підстава й чому саме ЗНЯТТЯ, а не `plan`-only, — у дзеркальному блоці `deploy.yml`
  # (дім присуду → `06_07 §1`; Фаза 0 «перший apply — локально» → `06_01 §IAM`).
  # 🔴 Тут ціна була ВИЩА, ніж у canopy: `verify-secrets` — hard-assert без
  # `if: configured`, тож на першому ж релізі після заведення WIF-Variables джоба
  # `terraform` діставала б 403 (deploy-SA не має жодної з чотирьох IAM/WIF-адмін-ролей,
  # `terraform/iam.tf`), і `needs:` блокував би ВЕСЬ ланцюг до продакшену.

  deploy:
    name: Kamal Deploy (Production)
    needs: verify-secrets
    runs-on: ubuntu-latest
    # [INF.22] Second (and last) environment gate — the quintet is only readable
    # here and in verify-secrets; see the note on verify-secrets.
    environment: production

    # [INF.22] id-token:write for keyless WIF auth (docker push + kamal registry);
    # contents:read for checkout (per-job overrides the top-level).
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
          # access_token feeds `gcloud auth configure-docker` (ADC) AND the kamal
          # registry password (GCP_ARTIFACT_REGISTRY_KEY, username oauth2accesstoken).
          token_format: access_token

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          ruby-version: "3.3"

      - name: Install Kamal
        run: gem install kamal -v '~> 2.12.0'

      # [INF.20 move 5] OS Login authenticates by a public key held in the ACCOUNT PROFILE, not
      # by instance metadata. Removing the old SSH-key step got half of this right: dropping the
      # long-lived key was correct (keyless — no SSH secret in the deploy set), dropping the key
      # ENTIRELY was one step too far. `gcloud compute ssh` hides the difference by minting and
      # registering a key on the fly; kamal speaks plain ssh through the ProxyCommand and carries
      # none — the tunnel opens and authentication then fails.
      # ⛔ `gcloud compute os-login ssh-keys add` CANNOT do this under WIF: the CLI derives the
      # target profile from the credential, and a federated one yields `Request for user [None]`.
      # The REST endpoint takes the user explicitly, and the addressee is the SA EMAIL — the
      # numeric unique_id returns 403 even though it is CORRECT.
      # 🔑 Ported from `deploy.yml` on 2026-09-01, where all of this was measured over nine runs.
      # Production shares the transport, so without these three moves it fails IDENTICALLY —
      # and it would fail on the FIRST release, i.e. the least forgiving moment.
      - name: Register an ephemeral SSH key with OS Login [INF.20 move 5]
        run: |
          set -euo pipefail
          SA_LOGIN=$(ruby -ryaml -e 'print YAML.load_file("config/deploy.yml").dig("ssh", "user").to_s')
          [ -n "$SA_LOGIN" ] || { echo "::error::ssh.user missing from config/deploy.yml - nothing to verify the OS Login profile against."; exit 1; }
          SA_EMAIL="${{ vars.GCP_SERVICE_ACCOUNT }}"
          [ -n "$SA_EMAIL" ] || { echo "::error::vars.GCP_SERVICE_ACCOUNT is empty - the OS Login profile has no addressee."; exit 1; }
          ssh-keygen -t ed25519 -N '' -C "gha-${{ github.run_id }}" -f "$HOME/.ssh/id_ed25519" -q
          EXPIRY=$(( ($(date +%s) + 1800) * 1000000 ))
          PUBKEY=$(cat "$HOME/.ssh/id_ed25519.pub")
          printf '{"key":"%s","expirationTimeUsec":"%s"}' "$PUBKEY" "$EXPIRY" > /tmp/oslogin-key.json
          HTTP=$(curl -sS -o /tmp/oslogin-resp.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $(gcloud auth print-access-token)" \
            -H "Content-Type: application/json" \
            --data @/tmp/oslogin-key.json \
            "https://oslogin.googleapis.com/v1/users/${SA_EMAIL}:importSshPublicKey?projectId=silkennet")
          echo "OS Login importSshPublicKey -> HTTP ${HTTP}"
          cat /tmp/oslogin-resp.json
          [ "$HTTP" = "200" ] || { echo "::error::OS Login rejected the key (HTTP ${HTTP}) - body above."; exit 1; }
          # 200 with an EMPTY posixAccounts list means the profile exists but no login role was
          # granted: green HTTP, dead SSH. Pin the account name, not the status code.
          grep -q '"username": *"'"${SA_LOGIN}"'"' /tmp/oslogin-resp.json \
            || { echo "::error::OS Login accepted the key but reports no posix account named ${SA_LOGIN} - check roles/compute.osLogin on the SA."; cat /tmp/oslogin-resp.json; exit 1; }
          echo "OS Login: key registered for ${SA_LOGIN} (expires in 30m)"

      # [INF.20] The `kamal` network is created by `kamal setup`, which this project deliberately
      # never runs (`server bootstrap` raises here — the deploy SA has no sudo, so docker is
      # pre-installed by the startup script instead). `proxy reboot` runs before any app boot and
      # would meet a host with no network. Idempotent on purpose.
      - name: Ensure the kamal docker network exists [INF.20]
        run: |
          kamal server exec --roles web "docker network create kamal" \
            || echo "network create returned non-zero - it already exists, or the next step will name the real cause"
        env:
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}

      - name: Reboot Kamal Proxy
        run: kamal proxy reboot -y
        # ⚠️ Needs the REGISTRY password though it deploys nothing: `proxy reboot` pulls the
        # kamal-proxy image from our PRIVATE registry, so kamal runs `docker login` on the host
        # first. Without it the login goes out as `-u ... -p` with an EMPTY argument and docker
        # exits 125 (`flag needs an argument: 'p' in -p`). The env: block below belongs to the
        # NEXT step — steps do not inherit each other's env.
        env:
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}


      - name: Kamal Deploy to Production
        run: kamal deploy
        # ⚠️ Drift guard: this env: block MUST mirror config/deploy.yml env.secret — global
        # AND the servers.job quintet (which .kamal/secrets-common reads as $VAR from THIS
        # shell). Any env.secret entry missing here is injected EMPTY → boot crash
        # (SECRET_KEY_BASE / PROVISIONING_MASTER_KEY guard) or web3-strict raise.
        # The quintet values resolve from the `production` environment scope (this job
        # references it). KREDIS_REDIS_URL is intentionally omitted — Kredis reads
        # REDIS_URL as-is (one logical database, keys separated by prefix [INF.22]);
        # set it only to point Kredis at a separate instance. Canon: docs/06_04 §1 + §2.
        env:
          # [INF.22] Short-lived WIF access token (username oauth2accesstoken in
          # config/deploy.yml registry), not a JSON key.
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}
          # --- Application core ---
          # RAILS_MASTER_KEY dropped 2026-09-02 (SEC.22 Phase-2): the image ships no
          # credentials.yml.enc, so it decrypted nothing in any container; SECRET_KEY_BASE
          # is the boot-critical one (docs/06_04 §5.7).
          SECRET_KEY_BASE: ${{ secrets.SECRET_KEY_BASE }}
          # Component style (config/database.yml): only the password is a secret; host/user/
          # database are non-secret env.clear in config/deploy.yml.
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          # --- Observability ---
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          # --- Origin TLS [INF.4] — consumed by `config/deploy.yml` proxy.ssl, NOT by Rails ---
          # Kamal resolves these two by NAME from .kamal/secrets-common; missing here means
          # kamal-proxy boots with no certificate and Cloudflare's Full (strict) answers 521/525
          # on every request — a silent-origin failure, not a boot crash. Enforced by
          # spec/deploy/env_fetch_declaration_spec.rb, which reads the names out of proxy.ssl.
          TLS_ORIGIN_CERT_PEM: ${{ secrets.TLS_ORIGIN_CERT_PEM }}
          TLS_ORIGIN_KEY_PEM: ${{ secrets.TLS_ORIGIN_KEY_PEM }}
          # --- Hardware provisioning gate (master_key_strength_check.rb — boot-critical) ---
          PROVISIONING_MASTER_KEY: ${{ secrets.PROVISIONING_MASTER_KEY }}
          # --- AR-encryption keys (active_record_encryption_keys_check.rb — boot-critical) [SEC.22] ---
          ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY }}
          ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY }}
          ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT: ${{ secrets.ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT }}
          # --- SMTP credentials [ARCH.60]. Not in the BOOT_CRITICAL assert above on purpose:
          #     mail_transport_check.rb demands MAIL_FROM + SMTP_ADDRESS (env.clear), while a
          #     relay that needs no auth is a legitimate setup. A wrong password is a failed
          #     Sidekiq job, which is loud now that a transport exists at all. ---
          SMTP_USER_NAME: ${{ secrets.SMTP_USER_NAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          # --- Telegram bot token [ARCH.60] — optional: transport no-ops when unset. ---
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          # --- Turbo signed-stream key [SEC.25 Ф3] ---
          # Mirror of the canopy fix; the full measurement and why nothing reddened live in
          # the sibling block of `deploy.yml` (One-Home — not restated). Short form: this
          # var was in `verify-secrets` and RUNTIME but never in the deploy step, so the
          # container received "" and silently lost the stream-only revocation lever. ---
          TURBO_SIGNED_STREAM_KEY: ${{ secrets.TURBO_SIGNED_STREAM_KEY }}
          # --- Web3 oracle keys (dual-key split, B-02) — web3_network_guard fail-closes at boot.
          #     ORACLE_PRIVATE_KEY (legacy shared fallback) is RETIRED (INF.22): no code
          #     reads it and the guard refuses a value under that name. ---
          ORACLE_MINTER_PRIVATE_KEY: ${{ secrets.ORACLE_MINTER_PRIVATE_KEY }}
          ORACLE_SLASHER_PRIVATE_KEY: ${{ secrets.ORACLE_SLASHER_PRIVATE_KEY }}
          ETHEREUM_ANCHOR_PRIVATE_KEY: ${{ secrets.ETHEREUM_ANCHOR_PRIVATE_KEY }}
          # --- RPC endpoints (Web3::RpcConnectionPool; testnet-marker boot guard) ---
          ALCHEMY_POLYGON_RPC_URL: ${{ secrets.ALCHEMY_POLYGON_RPC_URL }}
          ALCHEMY_ETHEREUM_RPC_URL: ${{ secrets.ALCHEMY_ETHEREUM_RPC_URL }}
          SOLANA_RPC_URL: ${{ secrets.SOLANA_RPC_URL }}
          CELO_RPC_URL: ${{ secrets.CELO_RPC_URL }}
          # --- Solana minting (Solana::MintingService) ---
          SOLANA_WALLET_KEYPAIR: ${{ secrets.SOLANA_WALLET_KEYPAIR }}
          SOLANA_FEE_PAYER_PUBKEY: ${{ secrets.SOLANA_FEE_PAYER_PUBKEY }}
          SOLANA_FEE_PAYER_TOKEN_ACCOUNT: ${{ secrets.SOLANA_FEE_PAYER_TOKEN_ACCOUNT }}
          SOLANA_USDC_MINT_ADDRESS: ${{ secrets.SOLANA_USDC_MINT_ADDRESS }}
          # --- Celo dedicated signer (ARCH.50; no fallback — legacy retired INF.22) ---
          ORACLE_CELO_PRIVATE_KEY: ${{ secrets.ORACLE_CELO_PRIVATE_KEY }}
          # --- Webhook HMACs (Chainlink callback — dispatch removed ARCH.53; Helium SOS ARCH.34) ---
          CHAINLINK_HMAC_SECRET: ${{ secrets.CHAINLINK_HMAC_SECRET }}
          HELIUM_WEBHOOK_SECRET: ${{ secrets.HELIUM_WEBHOOK_SECRET }}

      # ⚖️ [OPS.37 2026-08-30] `kamal deploy` never boots accessories — mirror of the
      # canopy workflow's step (full rationale there): idempotent ensure-running, so a
      # green deploy can no longer leave Grafana with zero series and silent P0 alerts.
      # [OPS.37 review 2026-09-02] Mirror of the canopy probe — same poller ceiling (a non-proxy
      # role is "healthy" after a 7-s `.State.Status` poll, no image HEALTHCHECK), and this is
      # the MONEY process: a job container that raises in `after_initialize` after Rails' ~10-s
      # boot would leave a green release with no minter. Production IS scraped (`silken-job`),
      # so `sn-alert-scrape-target-down` is the second detector; this is the first, at deploy.
      - name: Verify the job role survived its boot [OPS.37]
        run: |
          sleep 45
          out=$(kamal app details -r job 2>&1) || true
          printf '%s\n' "$out"
          if printf '%s\n' "$out" | grep -Eq 'Restarting|Exited'; then
            echo "::error::production job container restarted or exited after a green boot poll — read its logs (kamal app logs -r job)."
            exit 1
          fi
          printf '%s\n' "$out" | grep -Eq 'Up (About a minute|[5-9][0-9] seconds|[0-9]+ minutes?)' \
            || { echo "::error::production job container has not been up for the whole 45-s window (crash-loop, or no container) — see output above."; exit 1; }

      - name: Ensure Alloy accessory is running
        run: kamal accessory boot alloy
        env:
          GCP_ARTIFACT_REGISTRY_KEY: ${{ steps.auth.outputs.access_token }}
          # Accessory env.secret trio (.kamal/secrets-common reads $VAR from this shell).
          GRAFANA_REMOTE_WRITE_URL: ${{ secrets.GRAFANA_REMOTE_WRITE_URL }}
          GRAFANA_REMOTE_WRITE_USERNAME: ${{ secrets.GRAFANA_REMOTE_WRITE_USERNAME }}
          GRAFANA_REMOTE_WRITE_TOKEN: ${{ secrets.GRAFANA_REMOTE_WRITE_TOKEN }}

  # [INF.6] Post-deploy gate: FW.56 freeze-contract probes through the real
  # UDP boundary (Ingress Anchor → coap_listener). HTTP health checks
  # cannot see a dead CoAP path — without this the network goes dark silently.
  # Активація: задати repo Variable PRODUCTION_COAP_HOST (host Ingress Anchor);
  # поки змінна порожня, job видимо skipped (Брама ще не задеплоєна).
  coap-smoke:
    name: CoAP UDP Smoke [INF.6]
    needs: deploy
    if: ${{ vars.PRODUCTION_COAP_HOST != '' }}
    uses: ./.github/workflows/coap_smoke.yml
    with:
      host: ${{ vars.PRODUCTION_COAP_HOST }}
