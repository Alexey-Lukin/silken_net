# TRL Auto-Advancement Workflow
#
# Automatically synchronizes Technology Readiness Levels in GitHub Project V2.
# When an issue is closed the workflow copies the "Target TRL" value
# into the "Current TRL" field on the corresponding project card.
#
# ─── Prerequisites ───────────────────────────────────────────────────
# 1. A repository secret named PROJECT_PAT must exist.
#    It needs the scopes: repo, project (read:project + write:project).
#
# 2. Set the environment variables below to match your project board.
#    You can obtain them with the GitHub CLI:
#
#      # List your projects and find the number:
#      gh project list --owner <OWNER>
#
#      # Get the Project Node ID and field IDs:
#      gh project field-list <PROJECT_NUMBER> --owner <OWNER> --format json
#
#    Copy the node IDs for "Target TRL" and "Current TRL" fields, as well
#    as the Project node ID (starts with PVT_), and paste them below.
# ─────────────────────────────────────────────────────────────────────

name: Ops · TRL Sync

on:
  issues:
    types: [closed]

# Only the GraphQL token is needed; no checkout required.
permissions: {}

env:
  # ── CONFIGURE THESE VALUES ──────────────────────────────────────────
  # Owner (organization or user) of the GitHub Project V2.
  PROJECT_OWNER: Alexey-Lukin
  # The project number visible in the project URL (e.g. 1).
  PROJECT_NUMBER: "1"
  # ────────────────────────────────────────────────────────────────────

jobs:
  sync_trl:
    name: Copy Target TRL → Current TRL
    runs-on: ubuntu-latest
    if: github.event.issue.state == 'closed'

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
      - name: Sync TRL fields via GraphQL
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          github-token: ${{ secrets.PROJECT_PAT }}
          script: |
            // ── Helper: run a GraphQL query with the PROJECT_PAT ──
            async function gql(query, variables = {}) {
              return github.graphql(query, variables);
            }

            const owner = process.env.PROJECT_OWNER;
            const projectNumber = parseInt(process.env.PROJECT_NUMBER, 10);
            const issueNumber = context.issue.number;
            const repoName = context.repo.repo;
            const repoOwner = context.repo.owner;

            core.info(`Issue #${issueNumber} closed in ${repoOwner}/${repoName}`);
            core.info(`Looking up Project V2 #${projectNumber} owned by "${owner}"…`);

            // ── 1. Resolve Project node ID and field metadata ──────
            const projectQuery = `
              query ($owner: String!, $number: Int!) {
                user(login: $owner) {
                  projectV2(number: $number) {
                    id
                    fields(first: 50) {
                      nodes {
                        ... on ProjectV2SingleSelectField {
                          id
                          name
                          options { id name }
                        }
                      }
                    }
                  }
                }
              }
            `;

            // Try user-owned project first; fall back to organization.
            let projectData;
            try {
              const userResult = await gql(projectQuery, { owner, number: projectNumber });
              projectData = userResult.user?.projectV2;
            } catch {
              core.info('User query failed, trying organization…');
            }

            if (!projectData) {
              const orgQuery = projectQuery.replace('user(login: $owner)', 'organization(login: $owner)');
              const orgResult = await gql(orgQuery, { owner, number: projectNumber });
              projectData = orgResult.organization?.projectV2;
            }

            if (!projectData) {
              core.setFailed(`Project V2 #${projectNumber} not found for owner "${owner}".`);
              return;
            }

            const projectId = projectData.id;
            core.info(`Project node ID: ${projectId}`);

            // ── 2. Locate "Target TRL" and "Current TRL" fields ────
            const fields = projectData.fields.nodes.filter(f => f.name);
            const targetField = fields.find(f => f.name === 'Target TRL');
            const currentField = fields.find(f => f.name === 'Current TRL');
            // [OPS.4] Optional academic-semester field (graceful no-op if absent).
            const semesterField = fields.find(f => f.name === 'Academic Semester');

            if (!targetField) {
              core.setFailed('"Target TRL" single-select field not found in the project.');
              return;
            }
            if (!currentField) {
              core.setFailed('"Current TRL" single-select field not found in the project.');
              return;
            }

            core.info(`Target TRL field ID : ${targetField.id}`);
            core.info(`Current TRL field ID: ${currentField.id}`);
            if (semesterField) {
              core.info(`Academic Semester field ID: ${semesterField.id}`);
            } else {
              core.info('Academic Semester field not configured — skipping semester stamp.');
            }

            // ── 3. Find the project item for this issue ────────────
            const itemQuery = `
              query ($repoOwner: String!, $repoName: String!, $issueNumber: Int!) {
                repository(owner: $repoOwner, name: $repoName) {
                  issue(number: $issueNumber) {
                    projectItems(first: 20) {
                      nodes {
                        id
                        project { id }
                        fieldValueByName(name: "Target TRL") {
                          ... on ProjectV2ItemFieldSingleSelectValue {
                            name
                            optionId
                          }
                        }
                      }
                    }
                  }
                }
              }
            `;

            const itemResult = await gql(itemQuery, {
              repoOwner,
              repoName,
              issueNumber,
            });

            const items = itemResult.repository.issue.projectItems.nodes;
            const item = items.find(i => i.project.id === projectId);

            if (!item) {
              core.warning(
                `Issue #${issueNumber} is not linked to Project V2 #${projectNumber}. Skipping.`
              );
              return;
            }

            core.info(`Project item ID: ${item.id}`);

            // ── 4. Read Target TRL value ───────────────────────────
            const targetValue = item.fieldValueByName;
            if (!targetValue || !targetValue.name) {
              core.warning(
                `Issue #${issueNumber} has no "Target TRL" value set. Skipping.`
              );
              return;
            }

            const targetTrlName = targetValue.name;
            core.info(`Target TRL value: "${targetTrlName}"`);

            // ── 4a. [OPS.9] Architect-approval gate for TRL ≥ 5 ────
            // 00_05 §3: advancing to TRL ≥ 5 requires Architect/DAO approval.
            // Auto-advance only TRL ≤ 4; for ≥ 5 require the `architect-approved`
            // label on the issue, otherwise leave Current TRL untouched.
            const targetTrlNum = parseInt((targetTrlName.match(/\d+/) || ['0'])[0], 10);
            const issueLabels = (context.payload.issue.labels || [])
              .map(l => (typeof l === 'string' ? l : l.name));
            if (targetTrlNum >= 5 && !issueLabels.includes('architect-approved')) {
              core.warning(
                `⛔ Pending Architect Approval: Target TRL "${targetTrlName}" (≥ 5) needs the ` +
                `\`architect-approved\` label before Current TRL advances (00_05 §3). ` +
                `Current TRL left unchanged for issue #${issueNumber}.`
              );
              return;
            }
            if (targetTrlNum >= 5) {
              core.info(`Architect approval present — proceeding with TRL ${targetTrlNum} advance.`);
            }

            // ── 5. Map to Current TRL option ID ────────────────────
            const currentOption = currentField.options.find(o => o.name === targetTrlName);
            if (!currentOption) {
              core.setFailed(
                `"Current TRL" field has no option matching "${targetTrlName}". ` +
                `Available options: ${currentField.options.map(o => o.name).join(', ')}`
              );
              return;
            }

            // ── 6. Update Current TRL ──────────────────────────────
            const mutation = `
              mutation ($projectId: ID!, $itemId: ID!, $fieldId: ID!, $optionId: String!) {
                updateProjectV2ItemFieldValue(input: {
                  projectId: $projectId
                  itemId: $itemId
                  fieldId: $fieldId
                  value: { singleSelectOptionId: $optionId }
                }) {
                  projectV2Item { id }
                }
              }
            `;

            await gql(mutation, {
              projectId,
              itemId: item.id,
              fieldId: currentField.id,
              optionId: currentOption.id,
            });

            core.info(
              `✅ Current TRL updated to "${targetTrlName}" for issue #${issueNumber}.`
            );

            // ── 7. [OPS.4] Optional: stamp Academic Semester ───────
            // The semester is derived from the issue's closed_at timestamp:
            //   Fall   1 Sep — 31 Jan  → "Fall   {Y}-{Y+1}"     (where Y = year of Sep)
            //   Spring 1 Feb — 30 Jun  → "Spring {Y-1}-{Y}"      (academic year of June)
            //   Summer 1 Jul — 31 Aug  → next "Fall {Y}-{Y+1}"   (preparation period)
            //
            // Graceful no-op if the field is absent or the matching option is
            // not yet created — TRL sync must remain the primary invariant.
            if (!semesterField) {
              return;
            }
            if (!semesterField.options || semesterField.options.length === 0) {
              core.warning('"Academic Semester" field has no options configured.');
              return;
            }

            const closedAt = context.payload.issue && context.payload.issue.closed_at
              ? new Date(context.payload.issue.closed_at)
              : new Date();
            const month = closedAt.getUTCMonth() + 1; // 1..12
            const year = closedAt.getUTCFullYear();

            // Academic year base: the calendar year in which the Fall semester
            // *starts*. From it the option label is built uniformly as
            // `Fall {base}-{base+1}` or `Spring {base}-{base+1}` so the same
            // academic year covers both semesters (e.g. June 2026 defenses
            // belong to `Spring 2025-2026`, not `Spring 2026-2027`).
            let semesterKind, academicYearBase;
            if (month >= 9) {
              // Sep–Dec: Fall of current calendar year.
              semesterKind = 'Fall';
              academicYearBase = year;
            } else if (month === 1) {
              // Jan: trailing edge of the previous calendar year's Fall.
              semesterKind = 'Fall';
              academicYearBase = year - 1;
            } else if (month <= 6) {
              // Feb–Jun: Spring; academic year started in the prior September.
              semesterKind = 'Spring';
              academicYearBase = year - 1;
            } else {
              // Jul–Aug summer break rolls into the upcoming Fall.
              semesterKind = 'Fall';
              academicYearBase = year;
            }
            const semesterLabel = `${semesterKind} ${academicYearBase}-${academicYearBase + 1}`;

            core.info(`Computed Academic Semester: "${semesterLabel}" (from ${closedAt.toISOString()})`);

            const semesterOption = semesterField.options.find(o => o.name === semesterLabel);
            if (!semesterOption) {
              core.warning(
                `"Academic Semester" field has no option matching "${semesterLabel}". ` +
                `Create it in the project settings. ` +
                `Available options: ${semesterField.options.map(o => o.name).join(', ') || '(none)'}`
              );
              return;
            }

            await gql(mutation, {
              projectId,
              itemId: item.id,
              fieldId: semesterField.id,
              optionId: semesterOption.id,
            });

            core.info(
              `✅ Academic Semester stamped as "${semesterLabel}" for issue #${issueNumber}.`
            );
