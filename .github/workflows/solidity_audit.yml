name: Solidity Audit

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'contracts/**'
  push:
    branches: [ main ]
    paths:
      - 'contracts/**'

jobs:
  foundry-tests:
    name: Foundry Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install contract dependencies
        run: npm ci

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests with gas report
        run: forge test -vvv --gas-report

      - name: Run coverage (lcov)
        run: forge coverage --report lcov --report summary

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solidity-coverage
          path: contracts/lcov.info
          retention-days: 14

  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install contract dependencies
        run: npm ci --prefix contracts

      - name: Run Slither
        uses: crytic/slither-action@v0.4.0
        with:
          target: contracts/
          node-version: '20'
          solc-version: '0.8.24'
          fail-on: high
