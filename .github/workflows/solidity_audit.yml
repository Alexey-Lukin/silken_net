name: Solidity Audit

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'contracts/**'
  push:
    branches: [ main ]
    paths:
      - 'contracts/**'

jobs:
  foundry-tests:
    name: Foundry Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install contract dependencies
        run: npm ci

      - name: Check formatting (forge fmt --check)
        run: forge fmt --check

      - name: Build contracts
        run: forge build --sizes

      - name: Run tests with gas report
        run: forge test -vvv --gas-report

      - name: Run coverage (lcov)
        # --ir-minimum enables viaIR for stack-too-deep avoidance in coverage.
        # Tests that use getPastVotes must use hardcoded block numbers (not
        # block.number reads) because Yul CSE can cache block.number across
        # vm.roll calls. See test/SilkenForestCoin.t.sol for details.
        run: forge coverage --ir-minimum --report lcov --report summary

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@v7
        with:
          name: solidity-coverage
          path: contracts/lcov.info
          retention-days: 14

  slither:
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable

      - name: Install contract dependencies
        run: npm ci

      # Compile here (deps live in node_modules) so Slither reads Foundry's out/
      # AST via ignore-compile. The action's own installer runs `forge install`,
      # which assumes a lib/ git-submodule layout this project does not use.
      - name: Build contracts with AST
        run: forge build --ast

      - name: Run Slither
        uses: crytic/slither-action@v0.4.2
        with:
          target: contracts/
          ignore-compile: true
          slither-config: contracts/slither.config.json
          fail-on: high
