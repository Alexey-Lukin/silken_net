name: CI · Solidity

# Runs on every PR (no pull_request paths-filter): a `changes` job (dorny/paths-filter)
# gates the 5 audit jobs to contracts-relevant diffs, and the always-on `solidity-ok`
# aggregate emits a status on every PR — that's what lets it become a required
# branch-protection check without hanging unrelated PRs ("waiting for status").
# Same shape as docs.yml's docs-ok / ci.yml's ci-ok.
#
# Every gated job also ORs in `github.event_name == 'workflow_dispatch'`: unlike
# docs.yml/ci.yml, this workflow keeps a manual-dispatch trigger, and a dispatch run
# on `main` itself diffs against its own merge-base (0 changed files) — paths-filter
# would report every output false and silently no-op the whole audit. The OR makes a
# manual dispatch always run everything, same as before this path-gate conversion.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [ main ]
    paths:
      - 'contracts/**'
      - '.github/workflows/solidity_audit.yml'
      # Гейт naming-осі живе поза `contracts/`, тож без цього рядка правка
      # САМОГО сторожа не перезапускала б його: зламаний скрипт лишався б
      # зеленим, поки хтось не торкнеться контрактів (лаг детонації = число
      # не-contracts комітів поспіль, не обмежене нічим).
      - 'scripts/solidity_test_naming_check.rb'
      - 'scripts/solidity_expect_revert_subject_check.rb'

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      sol: ${{ steps.filter.outputs.sol }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect contract changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            sol:
              - 'contracts/**'
              - '.github/workflows/solidity_audit.yml'
              - 'scripts/solidity_test_naming_check.rb'
              - 'scripts/solidity_expect_revert_subject_check.rb'

  foundry-tests:
    needs: changes
    if: ${{ needs.changes.outputs.sol == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Foundry Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
# 🔒 [OPS.21] Пін замість `stable`. SHA-пін тримає ОБГОРТКУ дії, а `stable`
# тягне свіжий `forge` на КОЖЕН прогін — рівно той клас, яким апстрим-реліз
# slither на три дні заблокував мердж money-path контрактів. Периметр тут
# найгустіший: цей вхід стоїть у чотирьох джобах (`foundry-tests` · slither ·
# halmos · medusa), тобто на всьому грошовому шляху.
# v1.7.1 = і поточний `stable`, і версія, що стоїть у дев-середовищі, тож пін
# ЗАКРІПЛЮЄ наявний паритет, а не вводить новий (дзеркало pg17-паритету OPS.27).
# ⊕ Побічно морозить кодоген, від якого дрейфить μ-газ у `.gas-snapshot`.
# ⚠️ Бампера НЕМА: Dependabot читає `uses:`, але не `version:` — підняття є
# ручним кроком рецепту скіла `dependency-update`, і це названо, щоб пін не
# старів мовчки.
          version: v1.7.1

      - name: Install contract dependencies
        run: npm ci

      - name: Check formatting (forge fmt --check)
        run: forge fmt --check

      - name: Build contracts
        run: forge build --sizes

      # Кожен AccessControl-контракт мусить мати парний last-admin тест
      # (CLAUDE.md §8 — обов'язковий інваріант-гейт). Носій стоїть ТУТ, а не в
      # docs-смузі: та не запускається на зміну `contracts/**`, тож був би
      # декоративним рівно тоді, коли зʼявляється новий контракт.
      # Улов на момент написання — 0 (усі чотири вкриті): це батарея, що пінує
      # вже досягнутий інваріант, а не worklist.
      # ⚠️ Патерн навмисно БЕЗ префікса `testRevert_`, хоча CLAUDE.md §8 його
      # приписує: `ProtocolParameters.t.sol` називає свої два last-admin тести
      # `test_adminProtection_*`, і вони СПРАВЖНІ (обидва з `vm.expectRevert`).
      # Гейт стереже ІНВАРІАНТ (тест існує), а не конвенцію імені — змішавши
      # дві осі, він вимагав би перейменування, а імена тестів сидять у
      # `contracts/.gas-snapshot`, тобто косметика імені переписала б baseline
      # грошового шляху. Дрейф конвенції відстежується окремо (00_07 TEST.14) —
      # перепнуто двічі за 2026-08-09, обидва рази не за спорідненістю ID, а
      # тому що ПРЕДМЕТ переїжджав: спершу в DOC-T.63, далі — коли перемір
      # розвів три Foundry-осі з різними коренями — у власний TEST.14, де
      # residual «перейменувати РАЗОМ з `forge snapshot` regen» і стоїть.
      # ⚠️ Периметр гейта не бачить транзитивного успадкування: `grep -q
      # "AccessControl"` не ловить `SilkenTimelock is TimelockController`.
      # Транзитивно-сліпий контракт у дереві РІВНО ОДИН (Governor не вживає
      # AccessControl взагалі — у всьому `@openzeppelin/contracts/governance/`
      # його імпортує лише `TimelockController.sol`), і розширювати периметр
      # на нього СВІДОМО не треба — TEST.14, перемір 2026-08-09.
      # 🔴 Підстава тут доти стояла ХИБНА: «промах benign, бо Timelock
      # самогрантує admin у конструкторі». Самогрант справді є (конструктор
      # `TimelockController` кличе `_grantRole(DEFAULT_ADMIN_ROLE,
      # address(this))`), але він гарантує непорожність лише В
      # МОМЕНТ деплою: ні `revokeRole`, ні `renounceRole` там не
      # перевизначені, а наш власний `script/Deploy.s.sol` робить
      # `renounceRole(DEFAULT_ADMIN_ROLE, deployer)` рутинно — тобто множину
      # адмінів МОЖНА довести до нуля пост-деплойно.
      # Справжня підстава інша й сильніша: для Timelock нуль адмінів — це
      # ЗАДЕКЛАРОВАНИЙ бажаний стан, а не brick (`SilkenTimelock.sol` NatSpec:
      # «Рекомендовано: address(0) для immutable governance»). Тобто
      # `_adminCount`-гвард зламав би саме ту опцію, а last-admin тест на
      # Timelock був би НЕПРАВДИВИМ твердженням про контракт.
      - name: Invariant gate — every AccessControl contract pins last-admin
        run: |
          set -euo pipefail
          # ⚠️ Шляхи ВІДНОСНІ до `contracts/` — цей job має
          # `defaults.run.working-directory: contracts`. Перша редакція писала
          # `contracts/*.sol` (як у локальному прогоні з кореня) і впала з
          # `exit 2` — grep «файлів не знайдено», тобто гейт помер на власному
          # периметрі, а не на інваріанті. Класика: гейт зелений локально й
          # червоний у CI, бо перевіряли його НЕ там, де він біжить.
          missing=""
          for sol in ./*.sol; do
            grep -q "AccessControl" "$sol" || continue
            base="$(basename "$sol" .sol)"
            t="test/${base}.t.sol"
            if [ ! -f "$t" ] || ! grep -q "cannotRemoveLastAdmin" "$t"; then
              missing="${missing}\n  ${base} -> contracts/${t}"
            fi
          done
          # Ліхтар на власний вимір: порожній перелік контрактів дав би зелене
          # мовчання — той самий клас, який цей гейт і ловить.
          # 🔴 Поріг був 3 при фактичних 4 AccessControl-контрактах, тобто один
          # міг тихо випасти зі сканування, а ліхтар не блимнув би (TEST.14,
          # 2026-08-09). Це FLOOR: чесне ДОДАВАННЯ контракту його не червонить
          # (n росте), червонить лише ЗНИКНЕННЯ. ⚠️ Стеля floor'а: він ловить
          # падіння нижче названого числа, не «на один менше, ніж учора» — тож
          # додаючи AccessControl-контракт, підніми поріг ТИМ САМИМ комітом.
          n=$(grep -l "AccessControl" ./*.sol | wc -l | tr -d ' ')
          if [ "$n" -lt 4 ]; then
            echo "::error::AccessControl scan found only $n contracts — the glob is blind, not the tree clean"
            exit 1
          fi
          if [ -n "$missing" ]; then
            echo "::error::AccessControl contract without a last-admin revert test:$(printf "%b" "$missing")"
            echo "Add testRevert_cannotRemoveLastAdmin — an admin set that can reach 0 bricks the contract irreversibly."
            exit 1
          fi
          echo "OK — all $n AccessControl contracts pin the last-admin invariant"

      # TEST.14 · naming-вісь: revert-тест мусить зватись `testRevert_*`.
      # Свідомо ОКРЕМИЙ гейт від last-admin вище: той стереже ІНВАРІАНТ (тест
      # існує) і навмисно грепає підрядок без префікса — злиття двох осей в
      # одну умову вже було відхилене (guard-craft #46). Тут вісь одна — ім'я.
      # ⚠️ `working-directory` тут ЯВНО перебиває дефолт job'а (`contracts`) на
      # корінь — не з естетики: `guard_registry_sync` звіряє §3-рядок із
      # ДОСЛІВНОЮ командою кроку, тож відносний `../scripts/...` читався б як
      # phantom-claim, а сам гейт лишався б поза реєстром. Скрипт резолвить
      # корінь від власного `__dir__`, тож обидва CWD робочі — але канонічною
      # мусить бути та форма, якою його кличуть локально (#45/#46: CI-крок
      # міряють у ТОМУ CWD, де він біжить).
      - name: Naming gate — a revert test is named testRevert_*
        working-directory: ${{ github.workspace }}
        run: ruby scripts/solidity_test_naming_check.rb

      - name: Revert-subject gate — expectRevert() must name its subject
        working-directory: ${{ github.workspace }}
        run: ruby scripts/solidity_expect_revert_subject_check.rb

      - name: Run tests with gas report
        run: forge test -vvv --gas-report

      # CONTRACT.1(8): gas-regression gate vs the committed .gas-snapshot baseline.
      # Only deterministic unit tests belong here: invariant_ (path-dependent) AND
      # testFuzz_ (μ/~ drifts with forge codegen even under the pinned seed — a
      # +3.1% fuzz μ-shift broke main on a docs-only commit) are excluded.
      # Tolerance absorbs forge-version codegen noise on the rest.
      # Refresh baseline: `forge snapshot --no-match-test "invariant_|testFuzz_"`.
      - name: Gas snapshot check
        run: forge snapshot --check --tolerance 3 --no-match-test "invariant_|testFuzz_"

      - name: Run coverage (lcov)
        # --ir-minimum enables viaIR for stack-too-deep avoidance in coverage.
        # Tests that use getPastVotes must use hardcoded block numbers (not
        # block.number reads) because Yul CSE can cache block.number across
        # vm.roll calls. See test/SilkenForestCoin.t.sol for details.
        run: forge coverage --ir-minimum --report lcov --report summary

      # CONTRACT.1(8): coverage floor per deployable contract (the lcov Total is
      # diluted by test harnesses/scripts by design). SilkenTimelock.sol is absent
      # from lcov — constructor-only OZ subclass, no instrumentable lines.
      - name: Coverage floor (deployable contracts ≥ 90% lines)
        run: |
          python3 - <<'EOF'
          import sys
          FLOOR = 90.0
          TARGETS = {"SilkenCarbonCoin.sol", "SilkenForestCoin.sol", "StateRootAnchor.sol",
                     "SilkenGovernor.sol", "ProtocolParameters.sol"}
          seen = {}
          cur = None
          lf = lh = 0
          for line in open("lcov.info"):
              line = line.strip()
              if line.startswith("SF:"):
                  cur = line[3:].split("/")[-1]
                  lf = lh = 0
              elif line.startswith("LF:"):
                  lf = int(line[3:])
              elif line.startswith("LH:"):
                  lh = int(line[3:])
              elif line == "end_of_record" and cur in TARGETS:
                  seen[cur] = (lh, lf)
          failed = False
          for name in sorted(TARGETS):
              if name not in seen:
                  print(f"  FAIL {name}: missing from lcov.info")
                  failed = True
                  continue
              lh, lf = seen[name]
              # [DOC-T.64] `lf == 0` means "nothing was instrumented", which is the
              # absence of a measurement — not a perfect score. Reading it as 100.0
              # let a contract with zero instrumented lines clear a 90% floor while
              # the floor had never looked at it. Today no TARGET is in that state;
              # the shape is what gets closed here.
              if lf == 0:
                  print(f"  FAIL {name}: 0 instrumented lines — coverage was not measured")
                  failed = True
                  continue
              pct = 100.0 * lh / lf
              ok = pct >= FLOOR
              failed |= not ok
              print(f"  {'OK  ' if ok else 'FAIL'} {name}: {pct:.2f}% ({lh}/{lf}) lines")
          sys.exit(1 if failed else 0)
          EOF

      - name: Upload coverage to artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: solidity-coverage
          path: contracts/lcov.info
          retention-days: 14

  slither:
    needs: changes
    if: ${{ needs.changes.outputs.sol == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Slither Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # [DOC-T.64] `fail-on: high` is the GATE; without SARIF the Medium/Low findings on
    # money-path contracts (SCC/SFC/Governor/ProtocolParameters) left no trace anywhere —
    # not the build, not the Security tab, not an artifact — i.e. the run's silence about
    # them was indistinguishable from having none. The Aderyn job below already draws this
    # line correctly: gate on high, keep the rest VISIBLE. Mirrored here.
    permissions:
      contents: read
      security-events: write # upload-sarif → GitHub Security tab

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # 🔒 [OPS.21] пін, не `stable` — підстава при першому вжитку в цьому файлі; бамп ручний
          version: v1.7.1

      - name: Install contract dependencies
        run: npm ci

      # Compile here (deps live in node_modules) and emit build-info: under
      # ignore-compile crytic-compile parses Foundry's hardhat-style build-info
      # JSON (out/build-info), not the per-file out/ artifacts, and reads the AST
      # from it. This also skips the action's own `forge install`, which assumes
      # a lib/ git-submodule layout this project does not use.
      - name: Build contracts (build-info for Slither)
        run: forge build --build-info

      # Версію Slither пінимо явно: SHA-пін тримає обгортку дії, але її образ
      # ставить slither-analyzer з PyPI щоразу свіжим. 0.11.6 підняв нижню межу
      # crytic-compile до >=0.4.2, а той (PR #695, "disable Foundry dynamic test
      # linking") кличе `forge` навіть під ignore-compile — forge же живе на
      # раннері, не всередині контейнера дії, звідки FileNotFoundError: 'forge'.
      # 0.11.5 капає crytic-compile <0.4.0 і повертає відомий-добрий шлях.
      # Стеля: пін відстає від апстріму. Знімати, коли ignore-compile полагодять
      # (перевірити на свіжому slither) → 00_07 OPS.21.
      - name: Run Slither
        uses: crytic/slither-action@b52cc1cbfee9ca3e8722dd5224299d16c9a6b80f # v0.4.2
        with:
          target: contracts/
          ignore-compile: true
          slither-config: contracts/slither.config.json
          fail-on: high
          slither-version: 0.11.5
          sarif: results.sarif

      # `always()` so the report lands even when `fail-on: high` failed the step — a high
      # finding is exactly when the detail is most worth having. The `hashFiles` half is
      # the other direction: if Slither died BEFORE writing the file (compile error), the
      # upload must skip rather than red the job for a reason unrelated to the contracts.
      - name: Upload Slither SARIF to Security tab
        if: always() && hashFiles('results.sarif') != ''
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: results.sarif
          category: slither

  halmos:
    needs: changes
    if: ${{ needs.changes.outputs.sol == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Halmos Symbolic Proofs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # 🔒 [OPS.21] пін, не `stable` — підстава при першому вжитку в цьому файлі; бамп ручний
          version: v1.7.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install contract dependencies
        run: npm ci

      - name: Install Halmos (hash-pinned)
        run: pip install --require-hashes -r requirements-halmos.txt

      - name: Build contracts
        run: forge build

      # Symbolic proof of the money-path invariants (test/symbolic/*, check_-prefixed).
      # --solver-threads 1 → deterministic CI; --loop 3 bounds ERC20Votes/Governor loops.
      - name: Run Halmos symbolic proofs
        run: halmos --function "^check_" --solver-threads 1 --loop 3 --statistics

  aderyn:
    needs: changes
    if: ${{ needs.changes.outputs.sol == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Aderyn Static Analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write # upload-sarif → GitHub Security tab

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # OZ contracts are resolved via foundry.toml remappings → node_modules/@openzeppelin.
      - name: Install contract dependencies
        run: npm ci

      - name: Install Aderyn (release binary + sha256 verify)
        run: |
          ver=aderyn-v0.6.8
          asset=aderyn-x86_64-unknown-linux-gnu.tar.xz
          base=https://github.com/Cyfrin/aderyn/releases/download/$ver
          curl -sSfL "$base/$asset" -o aderyn.tar.xz
          curl -sSfL "$base/$asset.sha256" -o aderyn.sha256
          echo "$(awk '{print $1}' aderyn.sha256)  aderyn.tar.xz" | sha256sum -c -
          tar -xf aderyn.tar.xz
          sudo mv aderyn-x86_64-unknown-linux-gnu/aderyn /usr/local/bin/aderyn
          aderyn --version

      - name: Run Aderyn (JSON gate + SARIF report)
        run: |
          aderyn . --skip-update-check -o aderyn-report.json
          aderyn . --skip-update-check -o aderyn-report.sarif

      # Gate on high-severity only (baseline = 0 high; Low centralization-risk on role gates
      # is by-design and stays visible in the Security tab via SARIF, not a build failure).
      - name: Fail on high-severity findings
        run: |
          python3 -c "import json,sys; r=json.load(open('aderyn-report.json')); n=len(r['high_issues']['issues']); print(f'Aderyn high-severity findings: {n}'); sys.exit(1 if n>0 else 0)"

      - name: Upload Aderyn SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: contracts/aderyn-report.sarif
          category: aderyn

  medusa:
    needs: changes
    if: ${{ needs.changes.outputs.sol == 'true' || github.event_name == 'workflow_dispatch' }}
    name: Medusa Property Fuzzing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: contracts

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@908c540300062bd5a7e473851cdb4282204cee09 # v1
        with:
          # 🔒 [OPS.21] пін, не `stable` — підстава при першому вжитку в цьому файлі; бамп ручний
          version: v1.7.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install contract dependencies
        run: npm ci

      - name: Install crytic-compile (hash-pinned)
        run: pip install --require-hashes -r requirements-crytic.txt

      - name: Install Medusa (release binary + sha256 verify)
        # Реліз medusa .sha256-файл НЕ публікує (лише Sigstore-attestation), тож
        # дзеркалити aderyn-блок не можна — sha256 захардкоджено по-actionlint-івськи
        # (без мережевої довіри й нових тулів; строгіше за aderyn, що тягне .sha256
        # з того ж origin). Значення обчислено з release-асета 2026-07-16 і
        # звірено з digest у medusa-linux-x64.tar.gz.sigstore.json (messageSignature.
        # messageDigest — підпис crytic-CI). Бамп версії → перерахуй обидва
        # (прохід скіла dependency-update). Присуд ⚖️ → 00_07 OPS.10.
        run: |
          ver=v1.5.1
          sha256=ddfe1517ae9028ef9fc331b00f5a6a9d5406f3fcd11a715d60c6b6fb3e4546d3
          curl -sSfL "https://github.com/crytic/medusa/releases/download/$ver/medusa-linux-x64.tar.gz" -o medusa.tar.gz
          echo "$sha256  medusa.tar.gz" | sha256sum -c -
          tar -xzf medusa.tar.gz
          sudo mv medusa /usr/local/bin/medusa
          medusa --version

      # Corpus persists across runs (warm-start → deeper coverage over time); keyed on the
      # contracts so an ABI change invalidates a now-incompatible corpus.
      - name: Restore Medusa corpus (SCC)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/medusa-corpus-scc
          key: medusa-scc-${{ runner.os }}-${{ hashFiles('contracts/**/*.sol') }}
          restore-keys: medusa-scc-${{ runner.os }}-
      - name: Restore Medusa corpus (SFC)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: contracts/medusa-corpus-sfc
          key: medusa-sfc-${{ runner.os }}-${{ hashFiles('contracts/**/*.sol') }}
          restore-keys: medusa-sfc-${{ runner.os }}-

      # Single-file targets keep crytic-compile off forge-std (its LibVariable ABI is
      # unparseable by crytic-compile 0.4.1); the harnesses import only the token + OZ.
      - name: Medusa — SCC properties
        run: medusa fuzz --config medusa-scc.json
      - name: Medusa — SFC properties
        run: medusa fuzz --config medusa-sfc.json

      - name: Upload Medusa coverage
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: medusa-coverage
          path: |
            contracts/medusa-corpus-scc/coverage/
            contracts/medusa-corpus-sfc/coverage/
          retention-days: 14

  solidity-ok:
    # Single aggregate status check for branch protection — mirrors docs-ok/ci-ok.
    # Because the 5 audit jobs above are path-gated (skipped on a non-contracts PR),
    # they can't each be a required check on their own (a skipped required check
    # blocks the merge forever). This job depends on all of them and fails ONLY if
    # one that actually ran failed/was cancelled; skipped + success are both fine.
    # Make THIS the sole required check for the Solidity audit on main.
    name: Solidity passed
    if: ${{ always() }}
    needs: [changes, foundry-tests, slither, halmos, aderyn, medusa]
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      # [OPS.23] `changes` carries no `if:`, so `success` is its ONLY legal result,
      # while a path-gated job below it may legally be `skipped`. The guard after this
      # one asks only "did anything FAIL?" — so a skipped FILTER would read as an
      # ordinary path-skip, and every skip beneath it happened for a false reason.
      - name: Fail if the change-filter itself did not run
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The change-filter job did not succeed (result: ${{ needs.changes.result }}) — every job below it was skipped for a FALSE reason, so a green aggregate would vouch for nothing. Infrastructure failure, not a code failure: re-run this workflow."
          exit 1
      - name: Fail if any Solidity audit job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        # [OPS.30] Вердикт мусить називати ЕТАП: `failure` = перевірка виконалась
        # і сказала «ні»; `cancelled` = вона НЕ БІГЛА (стеля `timeout-minutes`
        # або скасування прогону). Один меседж на два світи читається як
        # «впали тести» і жене наступний прохід шукати дефект у власному діфі.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries|map(select(.value.result=="failure").key)|join(", ")' <<<"$NEEDS_JSON")
          stopped=$(jq -r 'to_entries|map(select(.value.result=="cancelled").key)|join(", ")' <<<"$NEEDS_JSON")
          if [ -n "$failed" ]; then
            echo "::error title=ВПАЛО (вердикт є)::${failed} — A Solidity CI/audit job failed — see the job list above."
          fi
          if [ -n "$stopped" ]; then
            echo "::error title=НЕ БІГЛО (вердикту НЕМАЄ)::${stopped} — скасовано: стеля timeout-minutes або скасування прогону. Це не твердження про код."
          fi
          exit 1
      - name: All clear
        run: echo "All Solidity jobs that ran passed (path-skipped on a non-contracts change is OK)."
