name: Sec · Image CVE Scan

# [OPS.10 §🗄️] CVE-скан ОПУБЛІКОВАНОГО образу GHCR. ⚠️ Доти цей рядок звав скан
# «останнім незакритим 🤖-хвостом supply-chain-гарту» — з 2026-09-05 неправда:
# пункт закрито, і закрито ПРИСУДАМИ, не роботою (нижче). Скан лишається жити. Образ `ghcr.io/alexey-lukin/silken_net` **публічний за
# конструкцією** (INF.2: анкер тягне свій образ поза GCP-ланцюгом авторизації, тож не з приватного
# GCP Artifact Registry), тож його вміст читає будь-хто, а вразливості базового шару
# ніхто не рахував. Дзеркало Slither/Aderyn/Scorecard: знахідки → SARIF у Security-tab
# з власною `category`.
#
# 🔴 ФОРМА ОБРАНА ІНША, НІЖ ПРИПУСКАЛА НОГА, і різниця несуча. Нога казала «скан
# побудованого образу» — тобто крок усередині `mirror-ghcr.yml`. Але CVE-фід
# оновлюється БЕЗ наших комітів: скан на момент збірки правдивий рівно в ту хвилину
# й тихо старіє, а образ лежить публічним місяцями. Тому вісь — ПЛАНОВА, над уже
# опублікованим тегом, і це той самий критерій, за яким щоденний `terraform_drift`
# і Dependabot не прив'язані до наших комітів. ⊕ Побічно це знімає весь ризик
# зв'язування з релізним шляхом: жодна помилка тут не може заблокувати дзеркало.
#
# 🔒 SOFT ЗА КОНСТРУКЦІЄЮ, і це названо, а не мається на увазі: `exit-code: '0'` —
# скан звітує, ніколи не валить. Підстава: `exit-code` рахується з ВЛАСНИХ знахідок
# сканера й про GitHub-dismissal не знає, тож HARD вимагав би CVE-простірного
# `.trivyignore` — другої копії вже ратифікованих dismissal-ів, що розходяться мовчки
# (06_07 §1a).
# ⚫ ПЕРЕХІД У HARD — WON'T-DO ⚖️ founder 2026-09-05, підстава роду КОНСТРУКЦІЯ.
# Доти тут стояло «перехід = окрема нога: тріаж базлайну до нуля, як зробив
# iac_scan». Вимір того дня показав, що ТРІАЖ НЕ Є БЛОКЕРОМ: кожна жива знахідка
# лягає або в документований accept (default-геми образу — застосунок під
# бандлером активує НЕ їх), або чекає на бамп digest базового образу. Знахідок
# із НАШИМ незаблокованим виконавцем — жодної, тож HARD дублював би вердикт
# digest-вахти повільнішим і галасливішим приладом. Повний присуд, ціна відмови
# й смуга, заради якої скан лишається жити (вендорений Go-бінар УСЕРЕДИНІ гема:
# Trivy читає версію Go-МОДУЛЯ, а бампає її лише реліз гема, тож ані
# bundler-audit, ані Dependabot цієї осі не бачать) → 06_07 §1a.
# ⚠️ І `ignore-unfixed: true` нижче несе БІЛЬШЕ, ніж виглядає: на CRITICAL+HIGH
# він глушить переважну більшість знахідок (без апстрім-фіксу дія неможлива).
# Читати кількість алертів як «обсяг роботи» без цієї поправки — помилка
# приладу; співвідношення бери прогоном обома формами, ніколи з памʼяті.
# ⚠️ `.trivyignore` у корені — базлайн IaC-МІСКОНФІГІВ (AVD-*), і для CVE-скану він
# інертний за побудовою (різні простори ID). Якби ця вісь колись пішла в HARD, їй
# був би потрібен ВЛАСНИЙ ignore-файл: злити два базлайни в один означало б, що
# тріаж однієї осі мовчки послаблює другу. Причина тримати це записаним попри
# won't-do вище — саме та пара («різні простори ID»), яку легко переплутати.
#
# Skip-clean (патерн `coap_smoke`): доки образу в GHCR немає,
# джоба видимо пропускається через ::notice, а не падає — свіжий форк не має бути
# червоним через відсутність чужого пакета.
#
# 🔬 ЩО ЦЕЙ СКАН ЗНАХОДИТЬ — розводить не КІЛЬКІСТЬ, а ШАР, і саме шар вирішує, хто
# виконавець. CodeQL дає нуль, тобто наш власний код чистий; усі знахідки з Trivy.
# Розклад шарів (підстави — 06_07 §1a):
#   ОС-пакети Debian    → НАШ виконавець: base-стадійний RUN у Dockerfile — `upgrade`
#                         рухає пакети самої бази, а свіжий `install` ставить поточні
#                         версії того, що тягнуть наші пакети (`libde265` у slim-базі
#                         немає, його приносить `libvips`). RUN ВИКОНУЄТЬСЯ на кожній
#                         опублікованій збірці, бо дзеркало збирає без layer-кешу
#                         (`no-cache: true` у `mirror-ghcr.yml`).
#                         ⛔ Кеш на base-стадії мовчки заморожує весь цей RUN: скан тоді
#                         бачить пакети дня, коли шар зібрали вперше.
#   default-геми Ruby   → виконавця немає: рухає лише патч-реліз Ruby, тож digest.
#                         Обидва advisory-канали до них сліпі за побудовою
#                         (`bundler-audit` парсить ЛОК, Dependabot — маніфести).
#   геми з нашого лока  → `bundle update`; саме їх бачать обидва канали.
#   Go-модуль у гемі    → лише реліз ГЕМА; жоден наш канал версії модуля не бачить,
#                         і це єдина смуга, заради якої цей скан лишається жити.
#   секрети (дефолтний  → НАШ предмет — лише поза реєстровими гемами: allow-rule
#   secret-сканер)        `.github/trivy-secret.yaml` виключає `…/ruby/<abi>/gems/`
#                         (там реєстрові геми й артефакти їх збірки, а `bundle
#                         install` іде без секретів); підстава й контролі — у шапці
#                         того файлу.
# 🔑 Тож плануючи тріаж, питай не «СКІЛЬКИ знахідок», а «з якого ШАРУ» — і чи має
# той шар нашого виконавця СЬОГОДНІ, бо ця відповідь уже одного разу змінилась.
# 🔬 ЧОМУ КІЛЬКІСТЬ АЛЕРТІВ НЕ Є СТАБІЛЬНОЮ МІРОЮ. 2026-09-05 локальний прогін
# «тими самими прапорцями» дав шість результатів, а денний CI завантажив сорок;
# 09-06 розрив списали на різні знімки Trivy-DB («x/crypto у локальній базі
# UNKNOWN, а CI під ТИМ САМИМ фільтром алерти створив»). 🔴 СПРОСТОВАНО 2026-09-26
# кодом самої дії: фільтра в CI НЕ БУЛО — для SARIF trivy-action знімає severity
# (крок нижче), тож локальний `--severity CRITICAL,HIGH` міряв ВУЖЧУ множину, ніж
# завантажує CI. Перерахунок SARIF того прогону 09-05: 40 = 1 CRITICAL · 4 HIGH ·
# 14 MEDIUM · 19 LOW · 2 UNKNOWN, тобто робочий фільтр лишив би 5 проти локальних
# 6 — розрив пояснює фільтр, якого не було, а залишок в одиницю — дрейф бази.
# ⛔ Наслідок, який тут несучий: НЕ порівнюй кількість алертів у часі й не роби з
# неї «обсягу роботи» — порівнюй ПЕРЕЛІК ПАКЕТІВ. Пакет має виконавця, число — ні.
# ⏱️ ЛАТЕНТНІСТЬ ГАСІННЯ, якої не видно з коду: скан дивиться на ОПУБЛІКОВАНИЙ тег, тож
# алерт не гасне на мерджі фіксу — він гасне після перезбірки образу, дзеркалення в GHCR
# і НАСТУПНОГО добового cron. Хто чекає зникнення того ж дня, вирішить, що фікс не подіяв.
# ⊕ Для ОС-шару мерджу немає взагалі: Debian-фікс доїжджає НАСТУПНОЮ опублікованою збіркою
# (image-релевантний коміт · реліз · `workflow_dispatch` дзеркала), не раніше.
#
# Канон: політика scan-тулів = 06_07 §1a (SHA-пін + явний `version:`), інвентар
# воркфлоу = 06_07 §1. Трекер: OPS.10 — заархівовано 2026-09-05, живе рядком
# docs/00_07 §🗄️; цитувати як ПРОВЕНАНС, не як відкриту роботу. ⚠️ Рядок 3 цього ж
# файлу виправили тим самим архів-комітом, а сюди не дочитали — клас «поправка сідає
# в ГОЛОВУ, спростоване лишається в ХВОСТІ тієї самої одиниці» (00_05 §4).

on:
  schedule:
    - cron: "17 4 * * *" # щодня, зсунуто від рівних годин (піки навантаження GH)
  workflow_dispatch:
    inputs:
      image_ref:
        description: "Повний ref образу (default: ghcr.io/<repo>:latest)"
        required: false
        type: string

# Least-privilege floor; джоба піднімає лише SARIF-запис і читання пакета.
permissions:
  contents: read

concurrency:
  group: image-cve-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: Trivy image CVE
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read           # checkout (потрібен для upload-sarif)
      packages: read           # pull образу з GHCR
      security-events: write   # завантаження SARIF у code-scanning
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Skip-clean преflight: образ може ще не існувати (свіжий форк, перший день
      # після включення). Відсутність пакета — НЕ вердикт про наш код, тож джоба
      # видимо пропускає скан замість падати.
      - name: Resolve image ref and check it exists
        id: img
        env:
          OVERRIDE: ${{ inputs.image_ref }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$OVERRIDE" ]; then
            ref="$OVERRIDE"
          else
            ref="ghcr.io/${REPO,,}:latest"
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          if docker manifest inspect "$ref" >/dev/null 2>&1; then
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "::notice::Скануємо $ref"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Образу $ref у GHCR немає — скан пропущено (skip-clean, не вердикт про код)."
          fi

      - name: Trivy image scan
        if: ${{ steps.img.outputs.present == 'true' }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: ${{ steps.img.outputs.ref }}
          version: v0.74.0
          format: sarif
          output: trivy-image.sarif
          ignore-unfixed: true # без апстрім-фіксу дія неможлива — це шум, не робота
          exit-code: '0' # SOFT НАЗАВЖДИ (див. шапку); HARD ⚫ won't-do 2026-09-05
          # ⚠️ `severity:` тут свідомо НЕМАЄ: для `format: sarif` дія знімає його сама
          # (entrypoint.sh: `unset TRIVY_SEVERITY`, доки `limit-severities-for-sarif`
          # ≠ `true`), тож у Security-tab іде все від UNKNOWN до CRITICAL.
          # ⛔ Не повертай його як «фільтр» — він тут інертний — і не вмикай
          # `limit-severities-for-sarif: true` без присуду: смуга Go-модуля в гемі,
          # заради якої скан живе (06_07 §1a), зараз уся Medium (#356/#357), а бувала
          # й HIGH (#340–347) — фільтр гасив би її частково чи цілком, і мовчки.
        env:
          # Секрет-сканер іде ДЕФОЛТОМ `scan-type: image`; реєстрові геми виключено
          # allow-rule — підстава й два свідомо видимі контролі в шапці файлу.
          TRIVY_SECRET_CONFIG: .github/trivy-secret.yaml

      - name: Upload SARIF to code-scanning
        if: ${{ steps.img.outputs.present == 'true' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image
