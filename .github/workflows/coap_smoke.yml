name: Smoke · CoAP UDP

# [INF.6/FW.56] Post-deploy smoke that exercises the end-to-end CoAP UDP
# path: Queen-equivalent client → Ingress Anchor → CoAP daemon
# (`lib/daemons/coap_listener` — PRIMARY runs on the Anchor itself, INF.17;
# fallback = socat relay → Akash coap service).
#
# Without this probe a silent UDP failure (closed firewall, missing
# socat fork, daemon not running, SDL `5683/udp` not exposed) is not
# visible from HTTP-only health checks — gateways simply cannot push
# telemetry and the network goes dark without any error in CI.
#
# The probes are NOT a generic liveness ping: `bin/coap_smoke` replays the
# FW.56 freeze-contract (same golden vectors as firmware/test/test_at_engine.c
# ↔ spec/lib/coap_server_pdu_spec.rb) and asserts exact reply bytes —
# RST on garbage, 4.04 on an unknown route with the 0xFF-MID phantom-delivery
# pin (the legacy server answered 2.04 here), and an honest 2.04-after-enqueue
# batch PUT. Loopback-proven by spec/lib/coap_smoke_spec.rb.
#
# Triggers:
#   - `workflow_dispatch` — manual probe from any branch with custom host.
#   - `workflow_call` — invoked from `deploy.yml` / `deploy-production.yml`
#                       as a post-deploy gate (job `coap-smoke`, needs: deploy).
#                       Host comes from repo Variables CANOPY_COAP_HOST /
#                       PRODUCTION_COAP_HOST; while unset the gate is visibly
#                       skipped (Ingress Anchor not yet deployed). Fails the
#                       parent workflow if the CoAP path is broken.
#   - `schedule` — continuous UDP-liveness probe of the Anchor (S2.4/INF.6):
#                  the Anchor is the telemetry SPOF and otherwise blind
#                  between deploys (primary daemon sits outside Alloy scrape —
#                  06_03 §2.9(б)). Host resolves PRODUCTION_COAP_HOST →
#                  CANOPY_COAP_HOST; skips cleanly while both are unset.
#
# This workflow is intentionally NOT triggered on `push` / `pull_request`
# — it would never be able to reach a real Ingress Anchor from a CI
# runner unless one already exists.

on:
  schedule:
    - cron: "17,47 * * * *" # every 30 min, offset from round hours (GH load spikes)
  workflow_dispatch:
    inputs:
      host:
        description: "CoAP host (e.g. api.silkennet.com or canopy.silkennet.com)"
        required: true
        type: string
      port:
        description: "CoAP UDP port"
        required: false
        default: "5683"
        type: string
      timeout_seconds:
        description: "Per-probe timeout (seconds)"
        required: false
        default: "10"
        type: string
      retries:
        description: "Attempts per probe (UDP is lossy)"
        required: false
        default: "3"
        type: string
  workflow_call:
    inputs:
      host:
        description: "CoAP host"
        required: true
        type: string
      port:
        description: "CoAP UDP port"
        required: false
        default: "5683"
        type: string
      timeout_seconds:
        description: "Per-probe timeout (seconds)"
        required: false
        default: "10"
        type: string
      retries:
        description: "Attempts per probe (UDP is lossy)"
        required: false
        default: "3"
        type: string

permissions:
  contents: read

jobs:
  coap-smoke:
    name: CoAP freeze-contract smoke
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # bin/coap_smoke is stdlib-only (socket/optparse) — no bundle install.
      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: false

      - name: Freeze-contract probes
        env:
          # dispatch/call pass inputs; schedule falls back to repo Variables
          # (production first, canopy while production does not exist yet).
          COAP_HOST: ${{ inputs.host || vars.PRODUCTION_COAP_HOST || vars.CANOPY_COAP_HOST }}
          COAP_PORT: ${{ inputs.port || '5683' }}
          COAP_TIMEOUT: ${{ inputs.timeout_seconds || '10' }}
          COAP_RETRIES: ${{ inputs.retries || '3' }}
        run: |
          set -euo pipefail
          if [ -z "${COAP_HOST}" ]; then
            echo "::notice::CoAP liveness probe SKIPPED — neither PRODUCTION_COAP_HOST nor CANOPY_COAP_HOST repo Variable is set (Ingress Anchor not deployed yet). Not silent: this notice is the skip."
            exit 0
          fi
          echo "::group::CoAP smoke target"
          echo "Host: ${COAP_HOST}:${COAP_PORT} (timeout ${COAP_TIMEOUT}s × ${COAP_RETRIES} retries/probe)"
          echo "::endgroup::"

          if ! bin/coap_smoke --host "${COAP_HOST}" --port "${COAP_PORT}" \
              --timeout "${COAP_TIMEOUT}" --retries "${COAP_RETRIES}"; then
            echo "::error::CoAP freeze-contract smoke FAILED (see probe verdicts above)"
            echo "::error::Troubleshooting checklist (06_01 Pre-Flight #6):"
            echo "::error::  (a) GCP firewall: allow UDP 5683 from 0.0.0.0/0"
            echo "::error::  (b) Anchor PRIMARY: systemctl status coap-daemon + docker logs silkennet-coap (/etc/silkennet/coap.env filled?)"
            echo "::error::  (c) fallback path only: coap-relay (socat) up + Akash SDL coap service exposes 5683/udp"
            echo "::error::  (d) wire-граматика: bin/coap_smoke verdicts vs spec/lib/coap_server_pdu_spec.rb"
            exit 1
          fi

          echo "✅ CoAP UDP path serves the FW.56 freeze-contract."
