name: CI · Code

permissions:
  contents: read

# Cancel a superseded run when a new commit is pushed to the SAME PR — only the
# latest revision needs validating. main pushes are NOT cancelled (the group key
# is the ref, and cancel-in-progress is gated to PRs), so every commit that lands
# on main still gets a full, independent CI run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

on:
  # Runs on EVERY PR/push — NO paths-ignore. Once `ci-ok` (below) is a required
  # status check, a docs-only PR must still PRODUCE that status or the merge
  # blocks forever ("Expected — waiting for status"). The `changes` job skips
  # every code job for docs-only diffs, so `ci-ok` still goes green in ~1 min,
  # while the actual SSOT doc gates run in docs.yml.
  pull_request:
  push:
    branches: [ main ]

jobs:
  changes:
    # Per-area change detection so the heavy jobs below run ONLY when relevant:
    # a Ruby-only change skips the 25-min firmware ARM build; a firmware-only
    # change skips the 15-min RSpec suite. A change to ci.yml itself or to the
    # shared composite action flips `ci` true → the whole matrix self-validates
    # (same self-test posture as solidity_audit re-running on its own edits).
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      firmware: ${{ steps.filter.outputs.firmware }}
      ruby: ${{ steps.filter.outputs.ruby }}
      js: ${{ steps.filter.outputs.js }}
      python: ${{ steps.filter.outputs.python }}
      alloy: ${{ steps.filter.outputs.alloy }}
      ci: ${{ steps.filter.outputs.ci }}
      workflows: ${{ steps.filter.outputs.workflows }}
      terraform: ${{ steps.filter.outputs.terraform }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Detect changed areas
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            ci:
              - '.github/workflows/ci.yml'
              - '.github/actions/setup-rails-test/**'
            workflows:
              - '.github/workflows/**'
              - '.github/actions/**'
            firmware:
              - 'firmware/**'
              - 'tools/firmware/**'
              - 'tools/ml/**'
            ruby:
              # 🔴 ЦЕЙ ФІЛЬТР ВУЖЧИЙ ЗА ПЕРИМЕТР, ЯКИЙ СТЕРЕЖЕ ЙОГО Ж ДЖОБА [OPS.28,
              # виміряно 2026-08-30]. `bin/rubocop --list-target-files` дає 1024 файли,
              # з них **55 поза цим переліком**: `scripts/` 47 · `tools/` 7 · `deploy/` 1.
              # Наслідок точний: діф, що чіпає ЛИШЕ `scripts/*.rb` — дім УСІХ SSOT-гейтів —
              # не запускає ані `lint`, ані `test`, тобто **CI не є носієм для власних
              # інструментів**; сьогодні його ловить лише `pre-push`. ⊕ І це розходиться з
              # `spec/quality/brakeman_stance_parity_spec.rb`, яка пінить периметр
              # `app lib scripts config` — два дзеркала не згодні, і обидва «present».
              # ⚖️ Розширення НЕ безкоштовне: додати `scripts/` сюди означає тягнути повну
              # сюїту на КОЖЕН scripts-діф — тож це присуд про ціну, а не очевидний фікс,
              # і він лишається відкритим у `00_07` OPS.28. Клас — §Guard-craft #116
              # (фільтр названо за ОДНИМ концерном, а джоба несе ТРИ).
              - 'app/**'
              - 'lib/**'
              - 'config/**'
              - 'db/**'
              - 'bin/**'
              - 'spec/**'
              # [UI.3] Вендоровані ШРИФТИ — вхід Rails-спеки `font_delivery_spec`,
              # яка живе в джобі `test`. Решта `vendor/assets/**` лишається під `js`
              # свідомо: тягнути повну Rails-сюїту на кожну JS-вендоровану зміну
              # дорожче за користь. 🔴 Без цього рядка гейт був би ДЕКОРАТИВНИЙ рівно
              # на своєму класі: він існує заради «оголошення стоїть, файл зник», а
              # саме видалення woff2 не запускало б джобу, у якій він біжить.
              - 'vendor/assets/fonts/**'
              - 'Gemfile'
              - 'Gemfile.lock'
              - '.ruby-version'
              - 'Rakefile'
              - '.rubocop.yml'
              - '.rubocop_todo.yml'
            js:
              - 'config/importmap.rb'
              - 'app/javascript/**'
              - 'vendor/javascript/**'
              # [TEST.7] Vendored CSS запінених пакетів (Leaflet + його images).
              - 'vendor/assets/**'
            python:
              - '**/*.py'
              - 'ruff.toml'
            alloy:
              - 'deploy/**'
              - 'scripts/deploy_secret_scan.rb'
              # deploy_secret_scan Invariant C guards .dockerignore/Dockerfile —
              # they MUST trigger it, else a PR that removes the credentials.yml.enc
              # exclusion ships secrets into the public image (mirror-ghcr rebuilds
              # on exactly these paths) while the scan sits skipped.
              - '.dockerignore'
              - 'Dockerfile'
              # 🔴 [INF.27] The scan's PRIMARY subjects, missing here until 2026-08-30 —
              # (⚠️ tag corrected 2026-08-31: this read [OPS.37], and that item explains the
              # SUBJECTS — why config/deploy*.yml, .kamal/** and compute.tf became this
              # scan's business after the platform cut — but says nothing about the FILTER
              # or its widening. A reader following it landed on invariants B3/B4 instead.
              # The finding and the fix live in INF.27; OPS.37 remains the cause of the
              # subject set, which is a different sentence.)
              # so a config-only diff (money-quintet placement, canopy `servers:` array
              # form, the COAP_ENV heredoc) skipped the job entirely and `CI passed` went
              # green having judged nothing. Note the shape: the block above reasons
              # carefully about a SECONDARY subject while the four the scan exists for
              # were never listed — "decorative by INPUT" (guard-craft #1). Widening was
              # free: the scan is green on the current tree, so this adds a trigger, not
              # a backlog. Keep this list ≡ the subject set at the top of the script.
              - 'config/deploy.yml'
              - 'config/deploy.canopy.yml'
              - '.kamal/**'
              - 'terraform/compute.tf'
            terraform:
              - 'terraform/**'
            docker:
              # [OPS.13] Image-build inputs. No PR trigger built the image at all
              # (mirror-ghcr fires from main), so a base-image/gem bump that breaks
              # the docker build was false-green on the PR (#463: Dockerfile 4.0.6
              # vs Gemfile hard-pin 4.0.5) and detonated on main after merge.
              - 'Dockerfile'
              - '.dockerignore'
              - 'Gemfile'
              - 'Gemfile.lock'
              - '.ruby-version'
              - 'vendor/**'

  firmware_test:
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Init host-test submodules (monocypher + LoRaWAN MAC + radio.h)
        # Вибірково — CMSIS/mruby цьому job не потрібні (вони живуть у
        # firmware_arm_build з recursive checkout); тримаємо 5-хв бюджет.
        # stm32-mw-lorawan + subghz-phy — для helium_mac_smoke (ARCH.34):
        # справжній MAC-стек лінкується host'ом проти Semtech radio.h.
        run: git submodule update --init firmware/extern/monocypher firmware/extern/stm32-mw-lorawan firmware/extern/subghz-phy

      - name: '[FW.25] Log-mel tables match the contract (stdlib, no conda)'
        # Drift gate: the committed firmware/common/logmel_*.h must equal a fresh
        # regen from the contract (docs/03_03 §3.4). Pure-stdlib — no conda here;
        # the heavy librosa≡stdlib parity runs in ml_smoke.yml.
        run: python3 tools/ml/scripts/check_firmware_tables.py

      - name: '[FW.46] Bytecode mirror stamp matches bio_contract.rb (stdlib)'
        # Light drift gate: sha256(bio_contract.rb) == the stamp inside the
        # committed lorenz_bytecode.h. No mruby build — the deep mrbc regen-diff
        # runs in the firmware_arm_build job. docs/03_01 §12.4.
        run: python3 tools/firmware/check_bytecode.py

      - name: Run firmware host-based tests
        run: make -C firmware/test

      - name: '[TEST.5] Firmware host ASan+UBSan memory-safety lane'
        # Динамічна пара до статичного cppcheck (firmware_lint): уся host-сюїта
        # перебудовується й проганяється під AddressSanitizer + UBSanitizer
        # (heap/stack/global overflow, UAF/UAR, double-free, signed-overflow,
        # OOB-shift, misalign/null-deref) — закриває OpenSSF dynamic_analysis_unsafe
        # для memory-unsafe C. detect_leaks=0: OpenSSL one-time global init = хибний
        # leak, не buffer-баг (04_06 §B.1.1). Той самий re-instrumented-rebuild
        # ідіом, що й coverage-lane.
        run: make -C firmware/test asan

      - name: '[FW.26] Static RAM budget gate (host build placeholder)'
        # Host gcc build size як placeholder gate доки arm-none-eabi
        # cross-compile pipeline не активний. Той самий 50 KB threshold;
        # ловить регресії розмірів у статичних буферах ще до lab build.
        run: make -C firmware/test size-check

      - name: '[TEST.1] Firmware host coverage lane (visibility, non-gating)'
        # gcov-звіт по owned common/queen модулях — видимість дір, БЕЗ порога:
        # host-лейн міряє дзеркала логіки, не main.c (04_06 §B.1.1). ОСТАННІМ
        # кроком: лишає інструментовані -O0 бінарники (coverage-лічильники
        # роздули б .bss → хибний фейл size-check'а, якби йшов перед ним).
        run: make -C firmware/test coverage

  firmware_arm_build:
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' || needs.changes.outputs.ci == 'true' }}
    # [FW.46] Reproducible ARM cross-compile of the owned firmware code + the
    # mruby bytecode pipeline (docs/03_01 §12.4). Compiles logmel.c for
    # Cortex-M4 against vendored CMSIS-DSP, regenerates + diffs the committed
    # bytecode via the pinned mrbc, runs it in a minimal mruby VM, and checks
    # the CMSIS RFFT packing on the host. This is the first time main-line
    # firmware C is actually cross-compiled in CI.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout (with submodules)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          submodules: recursive

      - name: Install ARM toolchain, CMake, Ruby
        # apt's gcc-arm-none-eabi is ONLY the compiler — the newlib C/C++ headers
        # (string.h, stdint.h, …) ship separately as libnewlib-arm-none-eabi +
        # libstdc++-arm-none-eabi-newlib; without them CMSIS-DSP/logmel/mruby fail
        # with "string.h: No such file" (the pinned ARM tarball used locally
        # bundles newlib, so this only bites the apt path). rake+ruby build mruby
        # (ships y.tab.c + bundles lrama → no bison). Toolchain version is apt's
        # (unpinned) — bytecode determinism rides on the pinned mruby submodule.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi libnewlib-arm-none-eabi libstdc++-arm-none-eabi-newlib \
            cmake ninja-build ruby rake qemu-system-arm

      - name: '[FW.46] Bytecode mirror == bio_contract.rb (deep mrbc regen-diff)'
        run: tools/firmware/gen_bytecode.sh --check

      - name: '[FW.46] Minimal mruby VM runs the committed bytecode'
        run: tools/firmware/run_bytecode_vm.sh

      - name: '[FW.46] Cross-compile owned code (logmel.c) + arm-none-eabi-size'
        run: |
          cmake -B firmware/build -S firmware -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/firmware/cmake/arm-none-eabi.cmake" \
            -DCMSISCORE="$PWD/firmware/extern/CMSIS_6/CMSIS/Core"
          cmake --build firmware/build --target size

      - name: '[FW.46] Cross-compile mruby (minimal gembox, double) + footprint'
        run: |
          cd firmware/extern/mruby
          SILKEN_ARM_BUILD=1 MRUBY_CONFIG="$GITHUB_WORKSPACE/firmware/mruby/build_config.rb" rake -j2
          arm-none-eabi-size -t build/arm-none-eabi/lib/libmruby_core.a | tail -1

      - name: '[FW.46] HAL compile-lane — soldier/queen main.c vs vendored WL HAL'
        # Перший справжній компайл обох main.c (ARM, soft-float) проти pinned
        # stm32wlxx-hal-driver/cmsis-device-wl. Реконфіг тут (не в кроці вище),
        # бо hal_check потребує build-generated mruby ARM include з кроку
        # mruby cross-compile. docs/03_01 §12.4.
        # hal_check_ccm = ті самі TU з FW2_CCM_ENABLED=1: гейтований CCM-тракт
        # компілюється проти WL-HAL (клас «API не існує у WL» — FW.2).
        run: |
          cmake -B firmware/build -S firmware -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$PWD/firmware/cmake/arm-none-eabi.cmake" \
            -DCMSISCORE="$PWD/firmware/extern/CMSIS_6/CMSIS/Core" \
            -DSILKEN_WITH_HAL=ON
          cmake --build firmware/build --target hal_check hal_check_ccm

      - name: '[SEC.21] Stack-canary flag gate — -fstack-protector-strong у ARM build-config'
        # Прапор мусить бути реально переданий крос-компілятору (attacker-reachable
        # LoRa-RX / AT-парсери інструментуються canary-prologue). Перевіряємо
        # build-config (Ninja/CMakeCache), а не canary-символ у .o: -strong
        # інструментує лише функції з addressable-locals, тож nm-на-.o дає
        # false-fail; видалення прапора з toolchain-файлу → нема в build-config →
        # gate падає (guard-lens тримається).
        run: |
          grep -rq 'fstack-protector-strong' firmware/build \
            || { echo "❌ SEC.21: -fstack-protector-strong не в ARM build-config"; exit 1; }
          echo "✅ SEC.21: canary-прапор активний у ARM-компіляції"

      - name: '[SEC.21] Fielded-canary gate — власні __stack_chk_fail/__stack_chk_guard в обох TU'
        # Обидва main.c мусять нести власний handler (reset+слід) і guard-сів
        # (HRNG через Canary_Guard_Derive) — інакше лінк тихо відкотився б на
        # newlib: guard = нуль-.bss, fail = abort→hang. Source-gate, не nm:
        # hal-lane компілює OBJECT-lib без лінку, символ у .a не з'явиться.
        run: |
          for f in firmware/soldier/main.c firmware/queen/main.c; do
            grep -q 'void __stack_chk_fail(void)' "$f" \
              || { echo "❌ SEC.21: власний __stack_chk_fail зник з $f"; exit 1; }
            grep -q 'Canary_Guard_Derive' "$f" \
              || { echo "❌ SEC.21: HRNG-сів guard'а зник з $f"; exit 1; }
          done
          echo "✅ SEC.21: fielded-canary (handler + сів) на місці в обох TU"

      - name: '[FW.26] ARM static-RAM gate — реальні .data+.bss обох main.c проти леджера'
        # Перший НЕ-плацхолдерний RAM-гейт: arm-none-eabi-size на hal_check .obj
        # (compile-lane вище). Леджер + стеля tensor arena — 03_03 §6.
        run: firmware/scripts/check_ram_budget.sh --hal-objects firmware/build

      - name: '[FW.55] QEMU-M4 bit-parity — host golden ↔ Cortex-M4 mruby (mps2-an386)'
        # Той самий committed-байткод на реальному M4 код-шляху (software-double
        # __aeabi_*, як на STM32WLE5JC) через qemu-system-arm. Гейт = byte-exact
        # diff зчеплених кейсів. Закриває FW.7/FW.19 ARM↔x86 residual до
        # тонкого silicon-confirm. docs/03_01 §12.7.
        run: REQUIRE_QEMU=1 firmware/scripts/qemu_parity.sh

      - name: '[FW.4] QEMU-M4 log-mel — CMSIS RFFT golden-parity + stack high-water (mps2-an386)'
        # Той самий Compute_LogMel (LOGMEL_USE_CMSIS), що поїде в Солдата, на
        # реальному M4 код-шляху (soft-float = ABI WLE5 без FPU): спільне ядро
        # перевірок із host-ctest + stack-painting навколо чистих викликів.
        # Reuse firmware/build з кроку FW.46 вище. docs/03_01 §12.7.
        run: REQUIRE_QEMU=1 firmware/scripts/qemu_logmel.sh

      - name: '[FW.46] Host CMSIS log-mel packing-parity (no board)'
        run: |
          cmake -B firmware/build-host -S firmware -G Ninja \
            -DSILKEN_HOST_PARITY=ON -DHOST=ON \
            -DCMSISCORE="$PWD/firmware/extern/CMSIS_6/CMSIS/Core"
          cmake --build firmware/build-host --target test_logmel_cmsis
          ctest --test-dir firmware/build-host --output-on-failure

  firmware_lint:
    needs: changes
    if: ${{ needs.changes.outputs.firmware == 'true' || needs.changes.outputs.ci == 'true' }}
    # cppcheck static-analysis gate for the OWNED firmware C (soldier + queen +
    # common) — the "ruff/rubocop for C". Analog of job `lint` (RuboCop) /
    # `python_lint` (ruff). Standalone: cppcheck parses the sources directly, no
    # cross-compile or HAL headers needed (vendored extern/ + .toolchain/ excluded).
    # Single entry point firmware/scripts/cppcheck.sh — the same command devs run
    # locally. cppcheck is pinned by the ubuntu-24.04 image (apt); the gating set
    # is warning+performance+portability+style at --check-level=exhaustive on a
    # custom Cortex-M4 platform (unsigned char). Justified false-positives are
    # documented suppressions in the runner + inline `// cppcheck-suppress`.
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install cppcheck (apt — version fixed by the ubuntu-24.04 image)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends cppcheck

      - name: cppcheck firmware (soldier + queen + common)
        run: firmware/scripts/cppcheck.sh

  scan_ruby:
    needs: changes
    if: ${{ needs.changes.outputs.ruby == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        # --ensure-no-obsolete-ignore-entries [OPS.28]: a brakeman fingerprint is a
        # SHA256 over the expression's own AST, so ANY refactor of a suppressed line
        # invalidates its ignore entry while the RISK is unchanged. Without this flag
        # the breach surfaces as a brand-new warning — the tool names the SYMPTOM, not
        # the subject, and four commits (07-05, 07-10, 08-23, 08-26) were spent
        # re-pinning fingerprints after reading that wrong diagnosis.
        # ⚠️ Keep this invocation byte-identical to the one in `.githooks/pre-push`:
        # two stances of one check drift silently, and the local green is only a
        # statement about this step while the two forms agree.
        run: bin/brakeman --no-pager --ensure-no-obsolete-ignore-entries

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  scan_js:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    needs: changes
    if: ${{ needs.changes.outputs.ruby == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

      # [OPS.33, 2026-08-23] Цей крок був списком із ДЕСЯТИ копів, бо omakase
      # гасив увесь департамент `Lint`. Тепер департамент увімкнено в
      # `.rubocop.yml`, і девʼять із тих десяти покриває крок вище — на ВСЬОМУ
      # дереві, а не на цьому периметрі. Лишається рівно один, і саме тому, що
      # його не можна ввімкнути глобально: `spec/` тримає ~два десятки хітів
      # іншого, низькоставкового роду (невживані фікстурні привʼязки), а гейт,
      # народжений червоним, знімає перший, кому він заважає.
      # ⚠️ Тобто цінність кроку тепер не в НАБОРІ копів, а в ПЕРИМЕТРІ:
      # `app lib scripts config` без `spec/`. Додавати сюди коп можна лише з
      # тією ж підставою — «глобально не можна через spec/».
      # Клас, за який заплачено: видалений call-site лишив осиротілий `payload =`
      # у money-path воркері, і коміт стверджував, що змінна ще потрібна.
      - name: Lint for dead code (perimeter without spec/)
        run: bin/rubocop -f github --only Lint/UselessAssignment app lib scripts config

  python_lint:
    needs: changes
    if: ${{ needs.changes.outputs.python == 'true' || needs.changes.outputs.ci == 'true' }}
    # Ruff-лінт для Python-тулінгу (tools/**) — аналог job `lint` (RuboCop) для Ruby.
    # Standalone, без conda: ruff — самодостатній бінарник. Конфіг — root ruff.toml
    # (RUF001-3 off = кирилиця house-style; E501 off = паритет з omakase).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Lint Python tooling (tools/**)
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89 # v4.1.0
        with:
          version: "0.15.16"
          args: "check --output-format=github"

  workflow_lint:
    needs: changes
    if: ${{ needs.changes.outputs.workflows == 'true' }}
    # actionlint — статичний аналіз GitHub Actions workflow'ів (синтаксис, ${{ }}
    # вирази, типи подій, permissions-скоупи, glob'и) + shellcheck кожного `run:`.
    #
    # 🔒 СТЕЛЯ, названа поіменно [OPS.28]: «кожного `run:`» стосується ЛИШЕ
    # `.github/workflows/**`. Голий `actionlint` (як він і кличеться нижче) сканує
    # тільки їх, а `.github/actions/**/action.yml` не читає ЗОВСІМ — і не може:
    # composite-екшен не є workflow, тож поданий явно він падає «jobs section is
    # missing». Доведено мутацією 2026-08-23: свідомо зламаний shell-рядок у
    # `setup-rails-test/action.yml` лишив прогін EXIT=0. Тобто `run:`-блоки, від
    # яких залежать ОБИДВІ джоби `test`/`feature-test`, стоять поза shellcheck.
    # Клас малий (два блоки в одному екшені), тож ставити сюди окремий інструмент
    # непропорційно — але зелене тут не є твердженням про них.
    #
    # ✅ ПРЕМІСУ ЦІЄЇ СТЕЛІ ПЕРЕМІРЯНО 2026-08-24, І ВОНА ВИСТОЯЛА. Це не педантизм:
    # «composite-екшен не парситься ЗА ПОБУДОВОЮ» є твердженням про ІНСТРУМЕНТ, а такі
    # старіють мовчки — апстрім міг навчитись. Прогін ЗАПІНЕНОЇ версії, якій `action.yml`
    # подано явно, дав ту саму відмову, тож стеля чинна, а не успадкована на віру.
    # 🔁 Перемірювати варто РІВНО при бампі `actionlint`, не за календарем.
    # ✅ І експозицію зміряно ВИЧЕРПНО того ж дня, замість того щоб її припускати:
    # `shellcheck` прогнано РУКАМИ по всіх `run:`-блоках єдиного composite-екшена —
    # нуль знахідок, доведений ПОЗИТИВНИМ КОНТРОЛЕМ (підсаджений unquoted-glob дав RED,
    # тобто інструмент справді дивився). Це не закриває стелю — наступна правка тих
    # блоків так само поза наглядом, — але знімає підозру, що діра вже кровоточить.
    # 🔑 ПУСКАЧ УЗЯТТЯ НАЗВАНО, і саме тому нога не є вічним боргом: побільшає
    # composite-екшенів АБО `shellcheck` заїде в CI з іншої причини — тоді периметр
    # безкоштовний, і клас закривається сам. ⚠️ Фразу «пускач названо» читає
    # `scripts/tracker_report.rb` як класифікатор відкладених ніг — не переписуй її
    # синонімом, інакше нога мовчки повернеться в перелік доступної роботи.
    # Pinned-binary + sha256-verify (OPS.10 supply-chain-стандарт; runner вже має
    # shellcheck → shell-блоки лінтяться автоматично).
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Run actionlint (pinned binary + sha256-verify)
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          curl -fsSL -o actionlint.tar.gz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tar.gz" | sha256sum -c -
          tar xzf actionlint.tar.gz actionlint
          ./actionlint -color

  i18n_check:
    needs: changes
    if: ${{ needs.changes.outputs.ruby == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1
        with:
          bundler-cache: true

      # Hard gate: PR fails if a key exists in one locale but not another,
      # or if any locale YAML file isn't normalized (sorted, consistent
      # indentation, no duplicate keys). `unused` is intentionally NOT
      # gated — dynamic lookups (`t("ui.status.#{status}")`) cannot be
      # statically resolved and would raise false positives.
      #
      # ⚠️ Two axes this job does NOT cover — do not read green as "i18n is fine":
      #  * It compares locales to EACH OTHER, never a locale to a model. An
      #    enum can grow while the YAML stays put and this stays green.
      #    That axis is guarded by spec/i18n/enum_label_parity_spec.rb — the
      #    curated source->scope registry (04_04 §12.14). Its sibling
      #    text_formatter_parity_spec.rb owns a narrower slice (icon map +
      #    "resolves through YAML, not the humanize fallback"), so citing that
      #    one alone points the reader at the smaller net (00_07 I18N.1).
      #  * `raise_on_missing_translations` (test env) is NOT a net for the
      #    Phlex tree: ApplicationComponent#t resolves absolute keys through
      #    bare `I18n.t`, which that setting does not hook.
      - name: Check translations parity (i18n-tasks missing)
        run: bundle exec i18n-tasks missing

      - name: Check interpolation parity across locales
        run: bundle exec i18n-tasks check-consistent-interpolations

      - name: Check locale YAML files are normalized
        # [I18N.4, 2026-08-13] The grep wrapper that stood here is GONE, and the
        # claim it rested on with it: `check-normalized` no longer "always exits
        # 0 (upstream quirk)". Measured on i18n-tasks 1.1.2 — a key out of alpha
        # order exits 1, a broken YAML exits 78 — and the gem says so in source:
        # `:exit1 unless non_normalized.empty?` (command/commands/data.rb).
        #
        # The wrapper was not merely stale, it was DEAD CODE: `run:` executes
        # under `bash -e`, so `output=$(…)` already aborted the step on a
        # non-zero code and the `grep` branch was unreachable. Keeping it taught
        # every reader the opposite — that this exit code is worthless — and it
        # pinned an English sentence of a third-party gem that a Dependabot bump
        # may reword at any time. The local carrier of these same three checks
        # is `.githooks/pre-push` (mutation-verified on all three).
        run: bundle exec i18n-tasks check-normalized
      # NB: docs SSOT gates (docs:check_refs + tracker:check) live SOLELY in docs.yml
      # (2026-06-02) — removed from here to stop the mixed code+docs double-run.

  alloy_config_validate:
    needs: changes
    if: ${{ needs.changes.outputs.alloy == 'true' || needs.changes.outputs.ci == 'true' }}
    # [OBS hardening, 06_03 §2.9] Parse-validate the Grafana Alloy River config so a
    # syntax error is caught HERE, not as a crash-loop of the `alloy` accessory on
    # deploy. `alloy fmt` parses the River AST and exits non-zero on a
    # malformed config; it does NOT evaluate sys.env()/coalesce(), so it needs no
    # secrets and is environment-independent. Image tag matches config/deploy.yml accessories.
    # Also dry-run-validates the Grafana IaC (dashboards + alert rules under
    # deploy/grafana/) — same no-secrets discipline (S2.2).
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Validate Alloy config (River parse — deploy/alloy/config.alloy)
        run: |
          docker run --rm -v "${{ github.workspace }}/deploy/alloy:/cfg" \
            grafana/alloy:v1.16.3 fmt /cfg/config.alloy > /dev/null
          echo "✅ config.alloy parses (River syntax valid)"

      - name: Deploy-secret scan (Kamal chain + anchor env — no literals; quintet job-only)
        # Never-drift secrets gate over config/deploy.yml + canopy + .kamal/secrets-common
        # + the compute.tf COAP_ENV heredoc: no committed key literal, and the money-signing
        # QUINTET stays JOB-ONLY — including out of the global env.secret every role inherits
        # (web3_network_guard enforces presence at runtime; this is the CI gate on PLACEMENT).
        # Pure ruby+yaml, no bundle.
        run: ruby scripts/deploy_secret_scan.rb

      - name: Validate Grafana IaC (dashboards + alerts, no credentials — S2.2)
        # `--dry-run` parses both artifacts (JSON dashboard + YAML alert rules),
        # checks the DS_PROMETHEUS input / datasourceUid placeholders and uid
        # uniqueness, then exits 0 — no GRAFANA_URL/GRAFANA_API_TOKEN needed.
        # Pure stdlib (json/yaml/net/http/uri), no bundle needed.
        run: ruby deploy/grafana/import.rb --dry-run

  terraform_validate:
    needs: changes
    if: ${{ needs.changes.outputs.terraform == 'true' || needs.changes.outputs.ci == 'true' }}
    # [INF.15] Offline validate of the terraform root so a config error (bad reference,
    # type mismatch, missing required arg, undeclared var) is caught HERE, not as a
    # first-`apply` blocker. The deploy-workflow terraform job only runs once secrets are
    # configured (if: verify-secrets.configured == 'true') → pre-first-deploy the tf is never
    # validated in CI, exactly while the config is being polished. `init -backend=false` +
    # `validate` need the provider schema but NO GCP credentials, so this is
    # environment-independent (mirrors alloy_config_validate's no-secrets discipline).
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Setup Terraform
        # 🔒 [OPS.21] Точний пін, не діапазон, і причина не в безпеці, а в тому,
        # ЩО цей крок судить: `fmt -check` порівнює з канонічним форматуванням
        # САМОГО бінарника, тож будь-який мінор 1.x, що зсуне канон, червонить
        # merge-required смугу `CI passed` при незмінному дереві. `~> 1.5`
        # відкривав для цього десять мінорів. Друга половина — паритет: цю саму
        # версію тепер ставлять `deploy`, `deploy-production` і `terraform_drift`,
        # інакше CI валідує один Terraform, а розгортає інший.
        # ⚠️ Бампера немає (Dependabot читає `uses:`, не `with:`) — підняття
        # ручне, скіл `dependency-update`, і ОДРАЗУ в усіх чотирьох.
        # ⚠️ Друга названа стеля: пін заморожує рівно те, що `~> 1.5` резолвив
        # тут і так, тож зміни поведінки немає — але паритету dev⟷CI він НЕ
        # дає (локальний бінарник відстає на кілька патчів). Сьогодні обидва
        # дають однаковий `fmt`; у день, коли розійдуться, вердикт належить
        # ЦЬОМУ кроку, а лік — підняти локальний, не послабити пін.
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: "1.15.9"
          terraform_wrapper: false # preserve real exit codes (drift-detector lesson, INF.22)

      - name: Format check
        working-directory: terraform
        run: terraform fmt -check -recursive

      - name: Validate root (GCP)
        working-directory: terraform
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

  test:
    needs: changes
    if: ${{ needs.changes.outputs.ruby == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        # Мажор ТУТ мусить дорівнювати продовому (`terraform/database.tf`
        # POSTGRES_17) — інакше CI судить код на СТАРІШОМУ движку, ніж той, що
        # виконає його в проді. Доти було 16 при 17 у dev і в проді, і єдиним
        # наслідком, який хтось помічав, був ручний крок «зняти pg17-only
        # `SET transaction_timeout` із дампу» — тобто симптом, а не причина.
        # Виміряно контейнерами 2026-08-21 [OPS.27]: pg17 вантажить дамп у тому
        # вигляді, як його віддає pg17 (EXIT=0), pg16 на ньому падає
        # (`unrecognized configuration parameter`), pg17 вантажить і поточний
        # стрипнутий дамп. Паритет із продом стереже `structure_sql_pg_portability_spec`.
# 🔒 [OPS.21] Digest поруч із тегом: тег МУТАБЕЛЬНИЙ — апстрим перепушує його
# під тим самим іменем, і тоді начинка merge-required джоби змінюється без
# жодного нашого коміту (клас, яким slither зламав money-path гейт).
# Паритету з продом це не ламає: OPS.27 довів контейнерами, що вирішує МАЖОР,
# а мажор тримає сам тег — digest морозить лише патч.
# ⚠️ Бампера НЕМА: у `dependabot.yml` екосистема `docker` дивиться `/`
# (`Dockerfile`), а `github-actions` не читає `image:` сервіс-контейнерів —
# тож оновлення digest'а є ручним кроком рецепту скіла `dependency-update`.
        image: postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
# 🔒 [OPS.21] Digest поруч із тегом — той самий мутабельно-тегний клас, що й у
# postgis вище; `:8` до того ж плаває через УСІ мінори 8.x. Бампера немає (див.
# там же), тож підняття — ручний крок рецепту `dependency-update`.
        image: valkey/valkey:8@sha256:f0ba225266310efba5fb33383e21c64fbd07907304224786c780606e7ebd7327
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rails test environment
        uses: ./.github/actions/setup-rails-test

      # гіпотетична: файл падав `NameError` із 2026-08-23 і три доби лишався
      # непоміченим, бо його читають ПʼЯТЕРО (`system_parameter_delivery_spec`,
      # `seeded_tree_families_lorenz_alignment_spec`, `spdx_headers_spec`,
      # `governance_bounds_sync.rb`, `offering_lexicon_check.rb`) — усі як ТЕКСТ, і
      # виконує НУЛЬ. Пʼять зелених гейтів на файлі, який неможливо завантажити.
      # ⚠️ Стоїть ПЕРЕД `Run tests` навмисно: наступний крок робить власний
      # `db:test:prepare`, тобто скидає БД, і засіяні рядки не течуть у сюїту.
      - name: Seeds must actually LOAD (db:seed executes, not just parses)
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/silken_net_test
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bin/rails db:seed

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/silken_net_test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          REDIS_URL: redis://localhost:6379/0
        # [TEST.7] `--exclude-pattern` стоїть саме ТУТ, у команді, а НЕ в
        # `.rspec`: у конфізі він діяв би глобально, і тоді `rspec spec/features`
        # у джобі `feature-test` побачив би нуль прикладів — рівно та
        # декоративна зеленість, задля усунення якої той шар і заводили.
        # Мета вужча: не піднімати Chrome двічі за один PR.
        run: >
          bin/rails db:test:prepare &&
          bundle exec rspec --format progress
          --exclude-pattern "features/**/*_spec.rb"
          --format json --out tmp/rspec_results.json

      # [TEST.6] Durable failure-артефакт: невідтворюваний red-run (як
      # batch_payout-фантом — 0 влучань за 90 днів історії) інакше лишає
      # тільки сирий лог на 90 днів; json несе example+seed+message —
      # `--only-failures --seed <n>` = one-command repro.
      - name: Upload RSpec failure details
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: rspec-failure-details
          path: |
            tmp/rspec_results.json
            spec/examples.txt
          retention-days: 90
          if-no-files-found: ignore

      - name: Upload SimpleCov coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: simplecov-coverage
          path: |
            coverage/index.html
            coverage/coverage.json
            coverage/.resultset.json
          retention-days: 30
          if-no-files-found: ignore

  feature-test:
    needs: changes
    # [TEST.7] `js` у переліку не надлишковий: `ruby` ловить `app/javascript/**`
    # лише транзитивно, через `app/**`, а vendored-модулі (`vendor/javascript/**`,
    # `vendor/assets/**` — там живе локальний Leaflet) не покриті НІЯКИМ іншим
    # фільтром. Без цього оновлення запіненого пакета проходило б повз єдину
    # джобу, здатну помітити, що модуль більше не вантажиться.
    if: ${{ needs.changes.outputs.ruby == 'true' || needs.changes.outputs.js == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        # Мажор ТУТ мусить дорівнювати продовому (`terraform/database.tf`
        # POSTGRES_17) — інакше CI судить код на СТАРІШОМУ движку, ніж той, що
        # виконає його в проді. Доти було 16 при 17 у dev і в проді, і єдиним
        # наслідком, який хтось помічав, був ручний крок «зняти pg17-only
        # `SET transaction_timeout` із дампу» — тобто симптом, а не причина.
        # Виміряно контейнерами 2026-08-21 [OPS.27]: pg17 вантажить дамп у тому
        # вигляді, як його віддає pg17 (EXIT=0), pg16 на ньому падає
        # (`unrecognized configuration parameter`), pg17 вантажить і поточний
        # стрипнутий дамп. Паритет із продом стереже `structure_sql_pg_portability_spec`.
        # 🔒 [OPS.21] digest — підстава при першому вжитку в цьому файлі; бамп ручний
        image: postgis/postgis:17-3.4@sha256:d0b5a6ecab18997637f55a83cb4a9467391de5645916cfa1b6f2a8d19eee7be5
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        # 🔒 [OPS.21] digest — підстава при першому вжитку в цьому файлі; бамп ручний
        image: valkey/valkey:8@sha256:f0ba225266310efba5fb33383e21c64fbd07907304224786c780606e7ebd7327
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Rails test environment
        uses: ./.github/actions/setup-rails-test

      - name: Run Feature Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/silken_net_test
          FEATURE_TEST: "1"
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          REDIS_URL: redis://localhost:6379/0
        # [TEST.7] ⚠️ `assets:precompile` тут пробували й ЗНЯЛИ того ж дня —
        # не додавай назад без нового виміру. Мотив був «без зібраного Tailwind
        # `class="hidden"` не ховає, тож видимість розходиться з локальним
        # прогоном», і він ХИБНИЙ: Tailwind тут збирається ДВІЧІ ще до цього
        # рядка — `bin/rails tailwindcss:build` у спільній дії
        # `setup-rails-test`, і вдруге через `db:test:prepare`, який гем
        # enhance-ить тим самим таском. Вимір, що нібито це доводив, насправді
        # міряв наявність `app/assets/builds/tailwind.css`, а не precompile.
        # Ціна ж реальна: манифест перемикає Propshaft на Static-резолвер, тож
        # ця джоба стала б відрізнятись від головної (яка ганяє ті самі
        # `spec/features` під Dynamic), а протухлий дайджест давав би 404 на
        # модуль — тобто «Stimulus мовчки мертвий» під виглядом падіння тесту.
        run: bin/rails db:test:prepare && bundle exec rspec spec/features

      - name: Keep screenshots from failed feature tests
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore

  docker_smoke:
    # [OPS.13] Full production-image build on the PR — push:false, no login, no
    # GHCR side effects. Closes the false-green class where the ONLY docker build
    # (mirror-ghcr.yml) runs post-merge from main: a Dependabot base-image bump
    # (#463) or a gem whose native build needs an apt package the image lacks
    # (the rbsecp256k1/autotools case) turned red only AFTER landing on main.
    # Member of the required ci-ok aggregate, so a red build blocks the merge.
    # cache-from reuses the mode=max layer cache mirror-ghcr writes on main.
    needs: changes
    if: ${{ needs.changes.outputs.docker == 'true' || needs.changes.outputs.ci == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Harden runner (egress audit)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4
      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          push: false
          platforms: linux/amd64
          cache-from: type=gha
          provenance: false
          sbom: false

  ci-ok:
    # Single aggregate status check for branch protection. Because the jobs above
    # are path-gated (skipped when their area didn't change), they can't each be a
    # required check — a skipped required check blocks the merge. This job depends
    # on all of them and fails ONLY if one that actually ran failed/was cancelled;
    # skipped + success are both fine. Make THIS the sole required check on main.
    name: CI passed
    if: ${{ always() }}
    needs:
      - changes
      - firmware_test
      - firmware_arm_build
      - firmware_lint
      - scan_ruby
      - scan_js
      - lint
      - python_lint
      - workflow_lint
      - i18n_check
      - alloy_config_validate
      - terraform_validate
      - test
      - feature-test
      - docker_smoke
    runs-on: ubuntu-latest
    steps:
      # [OPS.23] `changes` carries no `if:`, so `success` is its ONLY legal result,
      # while every job below it is path-gated, where `skipped` IS legal. The guard
      # after this one asks only "did anything FAIL?", so a skipped FILTER reads as an
      # ordinary path-skip — and then every skip beneath it happened for a FALSE
      # reason. That is how this aggregate once reported `success` having run no job
      # at all. Explicit-result form, as in_silico's `smoke` uses on its lock_sync dep.
      - name: Fail if the change-filter itself did not run
        if: ${{ needs.changes.result != 'success' }}
        run: |
          echo "::error::The change-filter job did not succeed (result: ${{ needs.changes.result }}) — every job below it was skipped for a FALSE reason, so a green aggregate would vouch for nothing. Infrastructure failure, not a code failure: re-run this workflow."
          exit 1
      - name: Fail if any required job failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        # [OPS.30] Вердикт мусить називати ЕТАП: `failure` = перевірка виконалась
        # і сказала «ні»; `cancelled` = вона НЕ БІГЛА (стеля `timeout-minutes`
        # або скасування прогону). Один меседж на два світи читається як
        # «впали тести» і жене наступний прохід шукати дефект у власному діфі.
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          failed=$(jq -r 'to_entries|map(select(.value.result=="failure").key)|join(", ")' <<<"$NEEDS_JSON")
          stopped=$(jq -r 'to_entries|map(select(.value.result=="cancelled").key)|join(", ")' <<<"$NEEDS_JSON")
          if [ -n "$failed" ]; then
            echo "::error title=ВПАЛО (вердикт є)::${failed} — A required CI job failed — see the job list above."
          fi
          if [ -n "$stopped" ]; then
            echo "::error title=НЕ БІГЛО (вердикту НЕМАЄ)::${stopped} — скасовано: стеля timeout-minutes або скасування прогону. Це не твердження про код."
          fi
          exit 1
      - name: All clear
        run: echo "All CI jobs that ran passed (path-skipped jobs are OK)."
