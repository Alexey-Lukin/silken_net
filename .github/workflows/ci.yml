name: CI

permissions:
  contents: read

on:
  # Docs-only changes are validated by docs.yml (the SSOT gates) — skip the
  # heavy code CI here (RSpec, CodeQL, Brakeman, firmware, i18n) to save Actions
  # minutes. A mixed code+docs push still matches and runs everything.
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'

jobs:
  firmware_test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Run firmware host-based tests
        run: make -C firmware/test

      - name: '[FW.26] Static RAM budget gate (host build placeholder)'
        # Host gcc build size як placeholder gate доки arm-none-eabi
        # cross-compile pipeline не активний. Той самий 50 KB threshold;
        # ловить регресії розмірів у статичних буферах ще до lab build.
        run: make -C firmware/test size-check

  firmware_ram_budget:
    # [FW.26] RAM budget gate. Installs arm-none-eabi binutils so future cross-
    # compile pipelines (post-FW.4) can be measured. Currently informational —
    # the script exits 0 with a notice when no ELF is present. Once the ARM
    # build pipeline is wired (production firmware Makefile), the same job
    # automatically gates `.bss + .data > 50 KB`.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install arm-none-eabi binutils
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends binutils-arm-none-eabi

      - name: Run RAM budget check
        run: firmware/scripts/check_ram_budget.sh

  scan_ruby:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager
      
      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit
      
  scan_js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Scan for security vulnerabilities in JavaScript dependencies
        run: bin/importmap audit

  lint:
    runs-on: ubuntu-latest
    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v5
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('.ruby-version', '**/.rubocop.yml', '**/.rubocop_todo.yml', 'Gemfile.lock') }}
        with:
          path: ${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  i18n_check:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      # Hard gate: PR fails if a key exists in one locale but not another,
      # or if any locale YAML file isn't normalized (sorted, consistent
      # indentation, no duplicate keys). `unused` is intentionally NOT
      # gated — several components use a private `t_(key)` helper that
      # i18n-tasks cannot statically resolve, which would cause false
      # positives. The runtime safety net is
      # `config.i18n.raise_on_missing_translations = true` in test env
      # (already set) — any spec touching a missing key fails the build.
      - name: Check translations parity (i18n-tasks missing)
        run: bundle exec i18n-tasks missing

      - name: Check interpolation parity across locales
        run: bundle exec i18n-tasks check-consistent-interpolations

      - name: Check locale YAML files are normalized
        # `check-normalized` always exits 0 (upstream quirk). Gate the
        # build by grepping the output — non-empty list of files = failure.
        run: |
          output=$(bundle exec i18n-tasks check-normalized 2>&1)
          echo "$output"
          if echo "$output" | grep -q "requires normalization"; then
            echo "::error::Some locale files are not normalized. Run \`bundle exec i18n-tasks normalize\`."
            exit 1
          fi

      - name: Lint 00_08 tracker (DRY — duplicate IDs, meta-line conformance, canon-ref resolution)
        run: bin/rails tracker:check

      - name: Lint docs cross-references (SSOT anti-drift — every NN_NN doc link resolves)
        run: bin/rails docs:check_refs

  alloy_config_validate:
    # [OBS hardening, 06_03 §2.9] Parse-validate the Grafana Alloy River config so a
    # syntax error is caught HERE, not as a crash-loop of the `alloy` sidecar on Akash
    # deploy (06_02 §debug). `alloy fmt` parses the River AST and exits non-zero on a
    # malformed config; it does NOT evaluate sys.env()/coalesce(), so it needs no
    # secrets and is environment-independent. Image tag matches deploy/akash/deploy.yaml.
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Validate Alloy config (River parse — deploy/akash/config.alloy)
        run: |
          docker run --rm -v "${{ github.workspace }}/deploy/akash:/cfg" \
            grafana/alloy:latest fmt /cfg/config.alloy > /dev/null
          echo "✅ config.alloy parses (River syntax valid)"

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rails test environment
        uses: ./.github/actions/setup-rails-test

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/silken_net_test
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rspec --format progress

      - name: Upload SimpleCov coverage report
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: simplecov-coverage
          path: |
            coverage/index.html
            coverage/coverage.json
            coverage/.resultset.json
          retention-days: 30
          if-no-files-found: ignore

  feature-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=3

      redis:
        image: valkey/valkey:8
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 10s --health-timeout 5s --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rails test environment
        uses: ./.github/actions/setup-rails-test

      - name: Run Feature Tests
        env:
          RAILS_ENV: test
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/silken_net_test
          FEATURE_TEST: "1"
          # RAILS_MASTER_KEY: ${{ secrets.RAILS_MASTER_KEY }}
          REDIS_URL: redis://localhost:6379/0
        run: bin/rails db:test:prepare && bundle exec rspec spec/features

      - name: Keep screenshots from failed feature tests
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: screenshots
          path: ${{ github.workspace }}/tmp/screenshots
          if-no-files-found: ignore
