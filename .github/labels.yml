# SSOT for repository labels — Labels-as-Code.
# Synced by .github/workflows/labels_sync.yml (EndBug/label-sync@v2,
# delete-other-labels: false — bot labels stay).
# Doc reference: docs/00_05_GitHub_Automation_and_IaC.md §4 Label Conventions.
#
# Labels are applied BY HAND. `type:*` is the only family a machine reads
# (ssot_guard.yml bypass); the rest is navigation for human eyes.

# ─────────────────────────────────────────────────────────────────────────
# Priority
# ─────────────────────────────────────────────────────────────────────────
- name: "priority:P0"
  color: "B60205"
  description: "Critical, blocks production or safety"
- name: "priority:P1"
  color: "D93F0B"
  description: "High priority"
- name: "priority:P2"
  color: "FBCA04"
  description: "Medium priority"
- name: "priority:P3"
  color: "0E8A16"
  description: "Low priority / backlog"

# ─────────────────────────────────────────────────────────────────────────
# Complexity
# ─────────────────────────────────────────────────────────────────────────
- name: "complexity:XS"
  color: "C2E0C6"
  description: "<1 hour"
- name: "complexity:S"
  color: "BFD4F2"
  description: "1–4 hours"
- name: "complexity:M"
  color: "FEF2C0"
  description: "4–8 hours"
- name: "complexity:L"
  color: "F9D0C4"
  description: "1–3 days"
- name: "complexity:XL"
  color: "E99695"
  description: ">3 days; reshape mandatory"

# ─────────────────────────────────────────────────────────────────────────
# Agent
# ─────────────────────────────────────────────────────────────────────────
- name: "agent:ai"
  color: "1D76DB"
  description: "AI-completable (Copilot/Cursor)"
- name: "agent:human"
  color: "5319E7"
  description: "Requires human operator"
- name: "agent:ops"
  color: "0E8A16"
  description: "Ops/manual setup task"
- name: "agent:hybrid"
  color: "BFD4F2"
  description: "Mixed AI + human"

# ─────────────────────────────────────────────────────────────────────────
# Change type (SSOT Guard bypass whitelist)
# Doc reference: docs/00_05_GitHub_Automation_and_IaC.md §2.3.
# A PR with ANY of these labels skips the SSOT Guard documentation check —
# the label is a force-function: the author must classify the change as
# genuinely non-architectural. Generic skip-label was rejected (00_07 §2.3
# rationale) because it would be abused without classification.
# ─────────────────────────────────────────────────────────────────────────
- name: "type:bugfix"
  color: "D73A4A"
  description: "Defect fix without architectural/contract change — SSOT bypass"

- name: "type:refactor"
  color: "A2EEEF"
  description: "Refactor (rename, extract, no behavior change) — SSOT bypass"

- name: "type:chore"
  color: "CFCFCF"
  description: "Build/CI/tooling change (Gemfile bump, .github maintenance) — SSOT bypass"

- name: "type:deps"
  color: "0366D6"
  description: "Dependency version bump (Gemfile.lock, package.json) — SSOT bypass"

- name: "type:perf"
  color: "FFAA33"
  description: "Performance optimization without functional change — SSOT bypass"

- name: "type:test"
  color: "0E8A16"
  description: "Test addition/correction without production code change — SSOT bypass"
