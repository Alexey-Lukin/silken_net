# ─────────────────────────────────────────────────────────────────────────
# Change type (SSOT Guard bypass whitelist)
# Doc reference: docs/00_05_GitHub_Projects_and_IaC_Automation.md §2.3.
# A PR with ANY of these labels skips the SSOT Guard documentation check —
# the label is a force-function: the author must classify the change as
# genuinely non-architectural. Generic skip-label was rejected (00_07 §2.3
# rationale) because it would be abused without classification.
# ─────────────────────────────────────────────────────────────────────────
- name: "type:bugfix"
  color: "D73A4A"
  description: "Defect fix without architectural/contract change — SSOT bypass"

- name: "type:refactor"
  color: "A2EEEF"
  description: "Refactor (rename, extract, no behavior change) — SSOT bypass"

- name: "type:chore"
  color: "CFCFCF"
  description: "Build/CI/tooling change (Gemfile bump, .github maintenance) — SSOT bypass"

- name: "type:deps"
  color: "0366D6"
  description: "Dependency version bump (Gemfile.lock, package.json) — SSOT bypass"

- name: "type:perf"
  color: "FFAA33"
  description: "Performance optimization without functional change — SSOT bypass"

- name: "type:test"
  color: "0E8A16"
  description: "Test addition/correction without production code change — SSOT bypass"

