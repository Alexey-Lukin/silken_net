# SSOT for repository labels — Labels-as-Code.
# Synced by .github/workflows/labels_sync.yml (uses EndBug/label-sync@v2 with delete-other-labels: false — OPS.9).
# Doc reference: docs/00_05_GitHub_Projects_and_IaC_Automation.md §4 Label Conventions.

# ─────────────────────────────────────────────────────────────────────────
# Cluster routing (primary, mutually exclusive)
# Each issue/PR has exactly one of these.
# ─────────────────────────────────────────────────────────────────────────
- name: "cluster:A-hardware"
  color: "FF6B35"
  description: "Primary cluster — Hardware/EBFC (atoms, materials, biofuel cell)"

- name: "cluster:B-verification"
  color: "4ECDC4"
  description: "Primary cluster — Verification/Math (proofs, attractor, ZK, Solidity)"

- name: "cluster:C-scaling"
  color: "3D5A80"
  description: "Primary cluster — Scaling/Cloud (Rails, infra, web3 stack)"

- name: "cluster:D-compliance"
  color: "7209B7"
  description: "Primary cluster — Compliance/Legal (KYC, MSA, IP, regulation)"

- name: "cluster:cross-cluster"
  color: "F1E05A"
  description: "Transient triage marker (NOT a resting state) — resolve into exactly one primary cluster:*"

# ─────────────────────────────────────────────────────────────────────────
# Cluster cross-reference (secondary, optional)
# ─────────────────────────────────────────────────────────────────────────
- name: "cluster-ref:A"
  color: "D3D3D3"
  description: "Secondary RACI — Hardware/EBFC consulted"
- name: "cluster-ref:B"
  color: "D3D3D3"
  description: "Secondary RACI — Verification/Math consulted"
- name: "cluster-ref:C"
  color: "D3D3D3"
  description: "Secondary RACI — Scaling/Cloud consulted"
- name: "cluster-ref:D"
  color: "D3D3D3"
  description: "Secondary RACI — Compliance/Legal consulted"

# ─────────────────────────────────────────────────────────────────────────
# Shape Up lifecycle
# ─────────────────────────────────────────────────────────────────────────
- name: "shape:shaping"
  color: "FFE066"
  description: "Shaping document being authored, not yet on Betting Table"
- name: "shape:bet-active"
  color: "06D6A0"
  description: "Active bet in the current cycle"
- name: "shape:building"
  color: "0E8A16"
  description: "Active implementation phase (Week 3-4 of Shape Up cycle)"
- name: "shape:hill-uphill"
  color: "FFB627"
  description: "Hill chart uphill — exploration, risks not resolved"
- name: "shape:hill-downhill"
  color: "06D6A0"
  description: "Hill chart downhill — execution, routine"
- name: "shape:park"
  color: "9C9C9C"
  description: "Parked, review in 6+ weeks"
- name: "shape:drop"
  color: "E63946"
  description: "Dropped; do not resurrect without re-shaping"
- name: "shape:done"
  color: "1D76DB"
  description: "Big Bet completed within the current cycle"

