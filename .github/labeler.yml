# PR Auto-Labeler config (actions/labeler@v6).
# Drives cluster routing per docs/00_05_GitHub_Projects_and_IaC_Automation.md §2.6.

"cluster:A-hardware":
  - changed-files:
      - any-glob-to-any-file:
          - 'firmware/**'
          # [OPS.3] docs/03_* (firmware canon) + tools/** (in-silico/ML/CAD/
          # firmware-моделі) — дзеркало ci.yml firmware-area (tools/ml,
          # tools/firmware ідуть firmware-смугою) + naukova база кластера A.
          - 'docs/03_*'
          - 'tools/**'
          - 'docs/01_*'
          - 'docs/02_*'
          - 'docs/08_*'

"cluster:B-verification":
  - changed-files:
      - any-glob-to-any-file:
          - 'contracts/**'
          - 'app/services/iotex/**'
          - 'app/services/silken_net/attractor*'
          - 'app/services/silken_net/seed_derivation*'
          - 'docs/05_*'

"cluster:C-scaling":
  # `all:` обгортка обов'язкова: без неї матчери під одним `changed-files`
  # дефолтяться в `any:` (OR) — негативна клауза сама матчить будь-який PR поза
  # виключеними піддеревами, і лейбл липне на все. Форма — 00_05 §2.6.
  - all:
      - changed-files:
          - any-glob-to-any-file:
              - 'app/**'
              - 'config/**'
              - 'lib/**'
              - 'db/**'
              - 'spec/**'
              - 'deploy/**'
              - 'terraform/**'
              - 'docs/04_*'
              - 'docs/06_*'
              # [OPS.3] 100%-coverage хвіст (00_05 §4.1): process/CI/deploy-infra
              # та root-файли (Gemfile/Dockerfile/*.md + dot-конфіги) → C.
              - '.github/**'
              - '.claude/**'
              - '.kamal/**'
              - 'bin/**'
              - 'public/**'
              - 'vendor/**'
              - 'docs/00_*'
              - '*'
              - '.*'
      # [OPS.9] Exclude cluster-B and cluster-D subtrees so the broad app/**
      # glob doesn't double-label them (primary-cluster mutual exclusivity, 00_05 §2).
      - changed-files:
          - all-globs-to-all-files:
              - '!app/services/iotex/**'
              - '!app/services/silken_net/attractor*'
              - '!app/services/silken_net/seed_derivation*'
              - '!app/services/polygon/hadron_*'

"cluster:D-compliance":
  - changed-files:
      - any-glob-to-any-file:
          - 'app/services/polygon/hadron_*'
          - 'docs/07_*'

"cluster-ref:B":
  - changed-files:
      - any-glob-to-any-file:
          - 'app/services/blockchain_*'
          - 'app/services/celo/**'
          - 'app/services/solana/**'
          - 'app/services/web3/chainlink_router_version*'

"module:03-firmware":
  - changed-files:
      - any-glob-to-any-file:
          - 'firmware/**'
          - 'docs/03_*'

"module:04-server-core":
  - changed-files:
      - any-glob-to-any-file:
          - 'app/**'
          - 'config/**'
          - 'lib/**'
          - 'db/**'

"module:06-matrix":
  - changed-files:
      - any-glob-to-any-file:
          - 'deploy/**'
          - '.kamal/**'
          - 'terraform/**'
          # ширше за workflows/: actions/, dependabot.yml, labeler.yml — той
          # самий CI/CD-дім (Матриця), 06_07 §1 інвентаризує їх разом.
          - '.github/**'

"module:00-codex":
  - changed-files:
      - any-glob-to-any-file:
          - 'docs/00_*'
