# i18n-tasks SSOT configuration.
# Docs: https://github.com/glebm/i18n-tasks
# Runs in CI via `.github/workflows/ci.yml` → job `i18n_check`.

# Base locale: every key here must exist; other locales are diffed against it.
# We use English as the base because the source code conventions
# (class names, error keys, comments) are all in English — keeping the
# base aligned with the source minimises diff noise.
base_locale: en
# [I18N.3] 🧱 Перелік локалей тут НЕ дублюється — він деривується з єдиного дому,
# `config.i18n.available_locales` у `config/application.rb`. Раніше список стояв
# другим екземпляром, і два доми розійшлись би тихо: локаль, додана в Rails, але
# не вписана сюди, просто випадала б з парності — рівно той клас, через який lv/lt
# колись не перевірялись узагалі [I18N.1].
#
# i18n-tasks проганяє цей файл через Erubi (`I18n::Tasks::Configuration#file_config`),
# тож деривація не потребує буту Rails. **Fail-closed за побудовою:** якщо форма
# рядка в application.rb зміниться, регексп дасть `nil`, `.split` кине NoMethodError
# і CI почервоніє — гейт не може тихо звузити свій периметр. Пін на саму деривацію
# (тут ⟷ `I18n.available_locales`) — `spec/i18n/i18n_tasks_config_spec.rb`.
#
# ⚠️ ПОЛІТИКА ПАРНОСТІ (founder 2026-07-27): цей список = усі НАЛАШТОВАНІ локалі,
# і саме він живить зворотний diff (ключ, доданий лише в одну мову, ловиться).
# Обов'язок ПОВНОТИ лежить окремо — на «завершених» локалях, і звужується прапорцем
# `-l` на боці CI, не тут. Механіку й пастку описує `04_04 §12.10`.
locales: [<%= File.read("config/application.rb")[/available_locales\s*=\s*%i\[([^\]]+)\]/, 1].split.join(", ") %>]

# YAML files live under config/locales/**/*.yml. The pattern below
# matches the sub-directory layout we already use (per-domain folders).
data:
  read:
    - config/locales/%{locale}.yml
    - config/locales/**/%{locale}.yml
  write:
    # Default destination for `i18n-tasks add-missing` — drop missing keys
    # into a generic catch-all so human review can place them properly.
    - config/locales/%{locale}.yml
  yaml:
    write:
      line_width: -1   # Disable line wrapping (keeps long Ukrainian strings on one line)

# Phlex components live under app/views/components/**/*.rb and use a custom
# `ApplicationComponent#t(".key")` that derives scope from the Ruby class name
# (e.g. `AccountSecurity::Show#t(".heading")` → `account_security.show.heading`).
#
# Because file layout mirrors the class namespace (convention over configuration),
# setting `relative_roots` to `app/views/components` makes i18n-tasks resolve
# relative keys using the same path-based scope. `relative_exclude_method_name_paths`
# prevents i18n-tasks from inserting the enclosing method name into the scope —
# our runtime `t` does not use method names, only the class hierarchy.
search:
  paths:
    - app/
    - config/locales/
    - lib/
  relative_roots:
    - app/views/components
  relative_exclude_method_name_paths:
    - app/views/components
  exclude:
    - app/assets
    - app/javascript

# Suppress noise — these are dynamic interpolated lookups that i18n-tasks
# can't statically resolve, but we know they exist.
ignore_missing:
  # locale.available.<locale_code> — динамічний ключ (`t("locale.available.#{locale}")`
  # у LocaleSwitcher + LocalesController), який i18n-tasks не резолвить статично.
  # 🔴 З 2026-07-27 цей рядок НЕСЕ ще одну функцію, і зняти його вже не безкоштовно:
  # ендоніми навмисно живуть ЛИШЕ в базовій локалі (locale-інваріантні дані, `04_04 §12.2`),
  # тож без цього виключення парність репортувала б їх як «missing» в uk/lv/lt —
  # тобто гейт вимагав би назад ті самі N×N копії, які ми щойно прибрали.
  # Вісь стереже `spec/i18n/locale_catalog_invariance_spec.rb`, не цей рядок.
  - 'locale.available.*'
  # Trigger labels are looked up dynamically by Codex::Discoveries::Toast.
  - 'codex.discoveries.toast.triggers.*'

ignore_unused:
  # Cross-cutting flash messages used from outside the static view tree.
  - 'flash.*'
  # Navigation items and section headers are looked up dynamically by key
  # (e.g. `t("navigation.items.#{key}")`) — i18n-tasks cannot statically
  # resolve symbol-keyed iterations, but the keys are exhaustively defined.
  - 'navigation.items.*'
  - 'navigation.sections.*'
  # Alert severity filter chips are built from FILTER_SEVERITIES array
  # (e.g. `t("alerts.index.filter_#{s}")`) — same pattern, fully defined.
  - 'alerts.index.filter_*'

# 🔴 Тут стояла маска `- '*'`, тобто CI-крок `check-consistent-interpolations`
# не міг почервоніти НІКОДИ. Коментар виправдовував її плюральними формами —
# але плюралізація це про набір КЛЮЧІВ (`one`/`few`/`many`), а не про змінні
# `%{}`, тож пояснення описувало іншу проблему, ніж вимикало налаштування.
# Знято 2026-07-26, коли гейт мовчки пропустив реальний баг: в `uk` замість
# `#%{id}` опинилось літеральне `#id` (Ruby зінтерполював `%{id}` ще на етапі
# генерації), і номер страховки не відрендерився б ніколи. Зі знятою маскою
# корпус чистий — мутація-перевірено, що гейт ловить саме цей випадок.
ignore_inconsistent_interpolations: []
