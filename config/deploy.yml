# Name of your application. Used to uniquely configure containers.
service: silken_net

# Name of the container image.
image: silken_net

# Deploy to these servers (Ingress Anchor IP from Terraform: `terraform output ingress_ip`).
# After infrastructure pivot, GCP hosts only the Ingress Anchor (e2-micro) — Rails runs on Akash.
# Kamal is retained for direct GCP deployments (fallback) and deployment tooling.
servers:
  web:
    - 192.168.0.1
  job:
    hosts:
      - 192.168.0.1
    cmd: bundle exec sidekiq -C config/sidekiq.yml

# Kamal proxy configuration.
# SSL auto-certification via Let's Encrypt. Requires config.assume_ssl and config.force_ssl in production.rb.
# proxy:
#   ssl: true
#   host: silken.net

# Proxy boot configuration: publish ports including CoAP UDP.
boot:
  proxy:
    publish:
      - "80:80"
      - "443:443"
      - "5683:5683/udp"

# Google Artifact Registry for Docker images.
# Run `gcloud auth configure-docker <region>-docker.pkg.dev` before first deploy.
registry:
  server: europe-west1-docker.pkg.dev
  username: _json_key_base64
  password:
    - GCP_ARTIFACT_REGISTRY_KEY

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - DATABASE_URL
    - REDIS_URL
    - KREDIS_REDIS_URL
    - SENTRY_DSN
  clear:
    # Puma clustered mode — number of forked worker processes.
    # GCP n2-standard-2 has 2 vCPUs, so 2 workers saturate both cores.
    # Combined with preload_app! + jemalloc, CoW sharing cuts memory ~30-40%.
    WEB_CONCURRENCY: 2

    # Sentry release tracking — set by CI/CD pipeline (git SHA or release tag).
    # Enables Sentry to group errors by deploy and track regressions.
    # See: config/initializers/sentry.rb → config.release
    RELEASE_VERSION: "${RELEASE_VERSION}"

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  canopy-console: app exec --interactive --reuse "bin/rails console" -d canopy
  canopy-logs: app logs -f -d canopy

# Persistent storage volume for Active Storage files.
volumes:
  - "silken_net_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404 on in-flight requests.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# SSH user for connecting to servers
ssh:
  user: deploy
