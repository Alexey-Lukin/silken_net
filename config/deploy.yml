# SPDX-License-Identifier: AGPL-3.0-or-later
# Name of your application. Used to uniquely configure containers.
service: silken_net

# Name of the container image. registry.server (below) is prepended, so the final ref is
# europe-west1-docker.pkg.dev/<GCP_PROJECT_ID>/silken-net/silken_net. Replace <GCP_PROJECT_ID>
# after `terraform apply` (matches `terraform output artifact_registry_url`). [INF.15]
image: silkennet/silken-net/silken_net

# Deploy to these servers (host IP from Terraform). Rails + Sidekiq run here via Kamal on GCP;
# the Ingress Anchor (e2-small) stays a separate machine carrying the PRIMARY CoAP daemon.
# [OPS.37] The host is `google_compute_instance.app` (terraform/compute.tf) since 2026-08-30;
# this IP stays a placeholder until the first `terraform apply` — take the real one from
# `terraform output -raw app_host_ip` (private IP: the Anchor fronts 80/443 and 5683).
servers:
  web:
    hosts:
      - silken-net-app
    # ⚖️ [OPS.37 2026-08-30] Stable scrape address for the alloy accessory: a DNS alias on
    # the shared `kamal` docker network (user-defined → embedded DNS serves aliases). Kamal
    # passes role options verbatim into `docker run` AFTER its hardcoded `--network kamal`
    # (kamal-2.12.0 lib/kamal/commands/app.rb), so every version of this role answers to
    # one name. Unlike a published port, an alias is NOT exclusive: during the rolling
    # window start_new_version and stop_old_version legitimately SHARE it (measured live:
    # DNS returns both IPs, then converges on the survivor) — the mechanism that broke
    # option (a) structurally cannot break this one. The alias dies with its container, so
    # a dead role → NXDOMAIN → scrape fail → `up=0` → sn-alert-scrape-target-down fires as
    # designed. Canopy stays alias-less BY CONSTRUCTION (its array-form `servers:` replaces
    # this hash wholesale — invariant B3), so canopy series can never leak into the
    # production scrape. Named ceiling: within the rolling window (seconds) one scrape may
    # hit either process — counters reset on the flip, which PromQL rate() absorbs.
    options:
      network-alias: silken-web
  job:
    hosts:
      - silken-net-app
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    options:
      # Scrape alias — see the web role note (⚖️ OPS.37 2026-08-30).
      network-alias: silken-job
    env:
      clear:
        # Sidekiq concurrency=15 (config/sidekiq.yml); DB pool must match + headroom.
        # Without this, database.yml falls back to RAILS_MAX_THREADS+2=5 → pool starvation at 15.
        DB_POOL: 17
      secret:
        # Money/signing keys are JOB-ONLY: every signing call site is a Sidekiq
        # worker; web/coap boot keyless (Security::Web3NetworkGuard scopes the
        # presence check via signer_process: Sidekiq.server?). This is the ONLY
        # home of the quintet — scripts/deploy_secret_scan.rb invariant B fails if a
        # member appears in any other role OR in the global env.secret below (which
        # every role inherits, coap included).
        # ORACLE_PRIVATE_KEY (legacy shared fallback) is fully RETIRED (INF.22):
        # no code reads it, and Security::Web3NetworkGuard refuses a value under
        # that name (zombie-config tripwire). Every signer has a dedicated key;
        # aux signers (ORACLE_ETHERISC/PURO/KLIMA_PRIVATE_KEY) are activation-gated
        # lazy keys — injected when their path goes live, never mapped here.
        - ORACLE_CELO_PRIVATE_KEY
        - ORACLE_MINTER_PRIVATE_KEY
        - ORACLE_SLASHER_PRIVATE_KEY
        - ETHEREUM_ANCHOR_PRIVATE_KEY
        - SOLANA_WALLET_KEYPAIR
  # CoAP/UDP telemetry intake daemon (INF.17) — dormant fallback to the anchor systemd daemon.
  # kamal-proxy is HTTP-only, so UDP bypasses it: the container publishes 5683/udp
  # directly on the host (NOT via boot.proxy.publish — that would park the port on
  # the proxy container with no listener behind it).
  coap:
    hosts:
      - silken-net-app
    cmd: bundle exec ruby lib/daemons/coap_listener
    options:
      publish:
        - "5683:5683/udp"
      # Scrape alias — see the web role note (⚖️ OPS.37 2026-08-30).
      network-alias: silken-coap
    # ⚠️ No env: override → this role inherits the GLOBAL env.secret, incl.
    # PROVISIONING_MASTER_KEY which the coap daemon does NOT need (master_key_strength_check
    # $PROGRAM_NAME-skips coap; SEC.22 wants the HKDF fleet-forge root off coap's plaintext env).
    # Kamal has no per-role secret exclude. Accepted: the PRIMARY coap intake is the anchor
    # systemd daemon (compute.tf), which correctly omits it; this Kamal coap role is a dormant
    # fallback. If it ever goes live, move PROVISIONING_MASTER_KEY into per-role
    # (web+job) env.secret so this role stops inheriting it.

# Kamal proxy configuration.
# SSL auto-certification via Let's Encrypt. Requires config.assume_ssl and config.force_ssl in production.rb.
# 🔴 [INF.4] THE ORIGIN MUST PRESENT A CERTIFICATE, and today it cannot — measured 2026-08-30.
#    Cloudflare is set to **Full (strict)** on BOTH zones (read from the live dashboard, not from
#    a doc), and that mode REQUIRES a valid certificate on the origin's :443. Nothing in this
#    stack can present one while this block stays commented: the Ingress Anchor's HAProxy is
#    `mode tcp` on 80 AND 443 (pure passthrough — `terraform/compute.tf`), and kamal-proxy with
#    no `ssl` serves plain HTTP on :80 and nothing usable on :443. Result on the first request
#    through Cloudflare: 521/525. `06_01 §TLS` even lists that symptom in its troubleshooting
#    table — the shipped config is what produces it.
#    ⛔ `ssl: true` (ACME / Let's Encrypt) does NOT fix this here, and the reason is structural:
#    under Full (strict) Cloudflare reaches the origin over HTTPS ONLY, so an HTTP-01 challenge
#    on :80 is never delivered. Grey-clouding the record for the first issuance works exactly
#    ONCE and then renewals fail silently at 90 days — a landmine, not a solution. `ssl: true`
#    stays where INF.4 put it: the CF-LESS TLS-fallback runbook (`06_01 §TLS-fallback`).
#    ✅ The path that works is a Cloudflare **Origin CA** certificate — free, 15 years, and
#    accepted by Full (strict) by definition (CF trusts its own CA). Issue it for
#    `silkennet.app` + `*.silkennet.app` so ONE certificate covers production AND the canopy
#    subdomain. Kamal 2.12 takes both halves as KAMAL SECRET NAMES, not paths
#    (`Kamal::Configuration::Proxy#custom_ssl_certificate?` reads `secrets[...]`).
#    ✅ SHIPPED 2026-08-31 — cert issued from a LOCALLY generated key (CF signed only the CSR,
#    so the private key never reached the vendor; recipe + the modulus-match acceptance check
#    live in `06_01 §Сертифікат НА ORIGIN`), both halves in GitHub Secrets, and the block below
#    is LIVE rather than commented.
#
# 🔴 SPLIT ON PURPOSE — THIS BLOCK CARRIED TWO DIFFERENT TIMINGS AND THEREFORE COULD NOT BE
#    UNCOMMENTED AS A WHOLE, in either direction:
#      · `ssl:` + `host:` are needed from the FIRST deploy — without them Cloudflare's
#        Full (strict) gets nothing on :443 and every request answers 521/525;
#      · `healthcheck: /ready` must be flipped only AFTER a deploy proves `/ready→200` — on a
#        cold start it 503s until DB/Redis are wired, kamal-proxy retries to `deploy_timeout`
#        and ROLLS BACK (INF.10).
#    So whoever uncommented "exactly what was written" got the premature readiness flip — the
#    very trap INF.10 exists to prevent — and whoever, remembering INF.10, left the block
#    commented got 521/525. **Both careful readings produced a failure**, which is the same
#    class INF.10 already named ("a cross-reference cannot be uncommented"), one level up:
#    a block holding two triggers cannot be uncommented as a unit either. Hence: TLS lives,
#    readiness stays commented WITH ITS OWN trigger.
proxy:
  # Origin CA pair — Kamal 2.12 takes SECRET NAMES here, not paths
  # (`Kamal::Configuration::Proxy#custom_ssl_certificate?` reads `secrets[...]`), so both must
  # resolve through `.kamal/secrets-common` AND be injected by both deploy workflows. That chain
  # is enforced, not trusted: `spec/deploy/env_fetch_declaration_spec.rb` reads these two names
  # straight out of this block and fails by name if either link is missing.
  ssl:
    certificate_pem: TLS_ORIGIN_CERT_PEM
    private_key_pem: TLS_ORIGIN_KEY_PEM
  # [INF.25/INF.4] `silkennet.app` = the web host. ⚠️ With a CUSTOM certificate this value is
  #    no longer a certificate NAME (that role belonged to `ssl: true`, where it drove the
  #    Let's Encrypt identity) — it is the host kamal-proxy routes on. The cert identity comes
  #    from the Origin CA blob above, which is why one wildcard cert serves both slots.
  host: silkennet.app
  # ⏸️ INF.10 — readiness-gated cutover, DELIBERATELY still commented. kamal-proxy's default
  #    healthcheck is `/up` (liveness), which is what bring-up needs; `/ready`
  #    (ReadinessController: DB SELECT 1 + Redis PING) holds the cutover until deps are up.
  #    TRIGGER, named: flip ONLY after the first deploy confirms `/ready→200` — earlier, a cold
  #    start 503s and kamal-proxy retries to deploy_timeout → rollback.
  #    Runbook: docs/06_01 §DEPLOY-DAY Фаза 5. Schema verified vs kamal 2.12. Probe: docs/06_05.
  # ⊕ AFTER the flip, `interval: 3` is the BRING-UP value, not the target: `/ready` opens a DB
  #    round-trip plus a Redis PING every tick, so the standing value is 10-15s [INF.22, tune
  #    gated on this same flip]. Three seconds is deliberate while the cutover is new — it makes
  #    a broken readiness path loud within one deploy window — and deliberately wasteful after.
  #    ⚠️ Recorded HERE from 2026-08-31: the number lived only as a tracker leg, so whoever
  #    uncommented this block would have shipped the bring-up cadence as if it were the design.
  # healthcheck:
  #   path: /ready
  #   interval: 3
  #   timeout: 5

# 🔴 `boot.proxy` ЗНЯТО 2026-08-31 — воно робило КОЖНУ команду kamal неможливою, і жоден
#    гейт цього не бачив, бо `kamal config` не біжить у CI ніде. Тут стояв блок
#    `boot: { proxy: { publish: ["80:80","443:443"] } }`; `Kamal::Configuration::Boot`
#    приймає РІВНО `limit` · `wait` · `parallel_roles`, тож будь-який виклик падав
#    `ERROR (Kamal::ConfigurationError): boot: unknown key: proxy` — тобто `kamal deploy`
#    у день деплою не дійшов би навіть до SSH. Відтворено на попередньому коміті, отже
#    дефект наявний, а не привнесений розщепленням `proxy:` вище.
#    ⊕ І він був ЗАЙВИЙ навіть у валідній формі: порти проксі взагалі не є ключем
#    `deploy.yml` — це CLI-опції `kamal proxy boot` (`--http-port`/`--https-port`), чиї
#    дефолти `DEFAULT_HTTP_PORT = 80` / `DEFAULT_HTTPS_PORT = 443` дорівнюють тому, що
#    блок задавав. Легальний спосіб змінити їх із конфіга — `proxy.http_port` /
#    `proxy.https_port` у ТОП-РІВНЕВОМУ `proxy:` вище, а не під `boot:`.
#    (kamal-proxy не говорить UDP; CoAP 5683/udp публікує роль `coap` окремо.)

# Google Artifact Registry for Docker images.
# Run `gcloud auth configure-docker <region>-docker.pkg.dev` before first deploy.
registry:
  # [INF.22] Keyless: oauth2accesstoken + a short-lived WIF access token as the
  # password (GCP_ARTIFACT_REGISTRY_KEY), not a long-lived _json_key_base64. CI mints
  # it via google-github-actions/auth (token_format: access_token); locally use
  # `gcloud auth print-access-token`. Keyless throughout — no static-key exception [INF.22].
  server: europe-west1-docker.pkg.dev
  username: oauth2accesstoken
  password:
    - GCP_ARTIFACT_REGISTRY_KEY

# Inject ENV variables into containers (secrets come from .kamal/secrets-common).
# Drift guard: each entry below MUST also be declared in .kamal/secrets-common — otherwise
# Kamal injects nothing and the container crashes at boot. See docs/06_01 §Kamal Detailed
# and the secrets inventory docs/06_04.
env:
  secret:
    # --- Application core ---
    - RAILS_MASTER_KEY
    - SECRET_KEY_BASE
    # Cloud SQL password (host/user are non-secret → env.clear). Component style: config/database.yml.
    - POSTGRES_PASSWORD
    - REDIS_URL
    # KREDIS_REDIS_URL intentionally absent — Kredis reads REDIS_URL as-is via
    # config/redis/shared.yml (one logical database on Upstash; keys are separated by
    # namespace, not by a DB number [INF.22]). Declaring it here would inject an empty
    # string that overrides that (see .kamal/secrets-common note). Add back ONLY to point
    # Kredis at a SEPARATE Redis instance — which is the deploy-time lever for real
    # memory-pressure isolation, and needs no code change.
    # --- Observability ---
    - SENTRY_DSN
    # --- Hardware provisioning gate (config/initializers/master_key_strength_check.rb) ---
    - PROVISIONING_MASTER_KEY
    # --- AR-Encryption keys gate (active_record_encryption_keys_check.rb) — hardware_keys + identities [SEC.22] ---
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    # --- Mail transport gate (mail_transport_check.rb) [ARCH.60] — the credential half.
    #     Secret-by-default because the "username" IS the credential on several ESPs
    #     (Postmark server token; SES access-key id). MAIL_FROM/SMTP_ADDRESS are clear below. ---
    - SMTP_USER_NAME
    - SMTP_PASSWORD
    # --- Turbo signed-stream key [SEC.25] — власний ключ гема для HMAC імен стрімів.
    #     Runtime-тір: без нього гем деривує ключ із secret_key_base, застосунок працює —
    #     але тоді єдина відповідь на витік імені стріму = ротація secret_key_base, тобто
    #     ВСІ сесії + CSRF + ActiveStorage-URL разом. Заради уникнення саме цього колатералу
    #     важіль і будували (⚖️ 2026-07-30). ⚠️ Заведено сюди 2026-08-29: єдина його
    #     deploy-поверхня жила в SDL знятої платформи й зникла разом із нею [OPS.37].
    - TURBO_SIGNED_STREAM_KEY
    # --- Telegram bot token [ARCH.60] — optional channel: transport no-ops when unset,
    #     and TelegramTransport.configured? rejects the placeholder by token format. ---
    - TELEGRAM_BOT_TOKEN
    # --- Web3 money/signing keys: JOB-ONLY (servers.job env.secret above) —
    #     deliberately NOT global so web/coap containers never carry them ---
    # --- RPC endpoints (SSOT names expected by Web3::RpcConnectionPool) ---
    - ALCHEMY_POLYGON_RPC_URL
    - ALCHEMY_ETHEREUM_RPC_URL
    - SOLANA_RPC_URL
    # Celo rewards (CELO_RPC_URL) — separate from ALCHEMY_*.
    - CELO_RPC_URL
    # --- Solana public identifiers (the signing keypair is job-only) ---
    - SOLANA_FEE_PAYER_PUBKEY
    - SOLANA_FEE_PAYER_TOKEN_ACCOUNT
    - SOLANA_USDC_MINT_ADDRESS
    # --- Webhook HMACs: Chainlink callback (dispatch removed — ARCH.53) + Helium SOS (ARCH.34;
    #     HeliumSosController raises SecurityError per-request under WEB3_STRICT_MODE without it) ---
    - CHAINLINK_HMAC_SECRET
    - HELIUM_WEBHOOK_SECRET
  clear:
    # 🎰 WHICH DEPLOY IS THIS — the only var that discriminates the two slots, because both
    # run RAILS_ENV=production (canopy deliberately: it wants the hardened runtime). Canopy
    # overrides to `canopy` in config/deploy.canopy.yml, exactly like POSTGRES_DATABASE below.
    # ⚠️ The var is NOT new — it was born for the Alloy accessory (`accessories.alloy` at the
    # bottom of this file → `slot` label). What is new [INF.27] is that it now reaches the
    # Rails ROLES too: until it did, Sentry filed canopy exceptions as production, the cache
    # namespace declared a separator it did not provide, and both slots defaulted to the SAME
    # Active Storage bucket. Reader One-Home: `config/deployment_slot.rb`.
    DEPLOYMENT_SLOT: production
    # PostgreSQL connection (component style — config/database.yml; port defaults to 5432).
    # Kamal deploys inside the GCP VPC → connect to the Cloud SQL PRIVATE IP directly
    # (no Auth Proxy needed inside the VPC). Set POSTGRES_HOST to `terraform output
    # database_private_ip` after apply. POSTGRES_PASSWORD is in env.secret above.
    POSTGRES_HOST: 10.160.0.3
    POSTGRES_USER: silken_net
    # Database SET selector (config/database.yml). Production default; Canopy overrides to
    # silken_net_canopy in config/deploy.canopy.yml (same instance, isolated DB names).
    POSTGRES_DATABASE: silken_net_production
    # Mailer link host (config/environments/production.rb action_mailer.default_url_options).
    # This is the host INSIDE the message body — transport and sender are separate, below.
    # = web host (INF.25 Option A, applied 2026-08-30 after both domains were purchased):
    # links in auth mail must land where the web app answers, or host-authorization 403s them.
    APP_HOST: silkennet.app
    # 🛑 BOOT-CRITICAL [ARCH.60]: mail_transport_check.rb refuses to boot without these two.
    # Vendor-agnostic plain SMTP — every ESP speaks it, so switching provider is these
    # values and nothing else. SMTP_PORT / SMTP_DOMAIN / SMTP_AUTHENTICATION are omitted
    # deliberately: their defaults (587 / none / plain) cover the mainstream ESPs, and a
    # declared var with a sane default is one more surface to keep in sync for nothing.
    # Placeholders fail the guard loudly until a real ESP is provisioned (👤 S1.1).
    MAIL_FROM: REQUIRED_SECRET_NOT_SET
    SMTP_ADDRESS: REQUIRED_SECRET_NOT_SET
    # [ARCH.81] CoAP intake address the admin health panel probes over UDP — the
    # same host a Queen dials (firmware `COAP_SERVER_HOST`; A-record → Ingress
    # Anchor, checklist step 1). Unset ⇒ the panel says "not configured"; it never
    # claims the intake is dead just because it could not look.
    COAP_HOST: api.silkennet.com
    # Puma clustered mode — number of forked worker processes.
    # 🔴 [OPS.37] This stopped being a fallback default and became the ONLY value the
    # production web host will boot with — so it is now a SPEC, and it must be set
    # together with the machine it describes when `terraform/` regains the web resource.
    # 2 assumes a 2-vCPU host; raising the tier without raising this wastes the tier.
    # Combined with preload_app! + jemalloc, CoW sharing cuts memory ~30-40%.
    WEB_CONCURRENCY: 2

    # Sentry release tracking — set by CI/CD pipeline (git SHA or release tag).
    # Enables Sentry to group errors by deploy and track regressions.
    # See: config/initializers/sentry.rb → config.release
    RELEASE_VERSION: "${RELEASE_VERSION}"

    # 🔑 TWO AXES, deliberately separate [OPS.37]. `production` used to answer both
    # questions at once, and a staging slot needs the first WITHOUT the second:
    #   WEB3_STRICT_MODE — "hardened runtime": no stubs, fail-closed guards. ON everywhere.
    #   WEB3_CHAIN_ENV   — "which chain may this slot touch": mainnet ⊥ testnet.
    #
    # Web3 fail-closed: Hadron KYC raises on missing creds + oracle-callback HMAC fail-fast (SEC.5), not silent stub (INF.11).
    # ⚠️ This line used to add "they check ONLY this flag, not Rails.env" — false since the
    # INF.11 hardening (2026-07-10) made both read `flag || Rails.env.production?`; it is the
    # belt-and-suspenders form, and a forgotten flag is NOT a fake-KYC mint.
    WEB3_STRICT_MODE: "true"

    # Declared chain family of this slot; absent → mainnet (fail-closed default).
    # NOT a bypass: `Security::Web3NetworkGuard` treats each value as an ASSERTION and
    # refuses to boot on a mismatch in EITHER direction — a mainnet slot wired to a testnet
    # endpoint, and equally a testnet slot wired to a mainnet one. Canon 04_02 §Web3NetworkGuard.
    WEB3_CHAIN_ENV: mainnet

    # --- Web3 contract addresses (post-`forge deploy`; fill before first mint) ---
    # Public on-chain addresses (not secrets) but unknown until contracts deploy → placeholder.
    # Fail-loud on use until provisioned. Canon docs/06_04 §2.1.
    CARBON_COIN_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    FOREST_COIN_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    DAO_TREASURY_ADDRESS: REQUIRED_SECRET_NOT_SET
    ETHEREUM_ANCHOR_CONTRACT: REQUIRED_SECRET_NOT_SET
    PROTOCOL_PARAMETERS_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    CELO_CUSD_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    KLIMA_RETIREMENT_CONTRACT: REQUIRED_SECRET_NOT_SET
    ETHERISC_DIP_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    PURO_EARTH_REGISTRY_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  canopy-console: app exec --interactive --reuse "bin/rails console" -d canopy
  canopy-logs: app logs -f -d canopy

# Grafana Alloy → Grafana Cloud (OBS.1: SaaS, no self-hosted Prometheus). Config SSOT:
# deploy/alloy/config.alloy, parse-gated in CI (`alloy_config_validate`).
#
# ✅ [OPS.37] ЯК Alloy дістає три таргети — ⚖️ РАТИФІКОВАНО 2026-08-30: per-role
# `network-alias` у спільній docker-мережі `kamal` (аліаси — на самих ролях вище;
# `servers.<role>.options` ідуть дослівно в `docker run` ПІСЛЯ хардкодженого `--network kamal`).
# Реєстр Prometheus in-process, тож кожна роль мусить бути власним таргетом (06_03 §2.9).
# 🔴 Цей блок до 2026-08-31 казав «ВІДКРИТЕ питання … accessory лишається БЕЗ пускача і без
# таргетів» — і стояв за СІМНАДЦЯТЬ рядків до аліасів, які це питання закрили, у тому самому
# файлі. Обидві половини були хибні: пускач є (крок «Ensure Alloy accessory is running» в обох
# deploy-воркфлоу), таргети є (три аліаси ⟷ `deploy/alloy/config.alloy`, крос-файловий пін
# `spec/deploy/alloy_scrape_topology_spec.rb`). Ціна прози, що пережила власне рішення, тут не
# косметична: читач або пропускає верифікацію Фази 4 «три process-таргети живі», вважаючи
# телеметрію свідомо мертвою, або йде «закривати питання» опцією (а) нижче — яку цей самий
# абзац описує як ту, що ламає роллінг.
# ⛔ Дві відхилені опції лишаються записаними, бо вони стережуть МАЙБУТНЮ роботу, не описують
# минулу — обидві відхилено ВИМІРОМ, не смаком:
#   (а) `options.publish` метрик-портів на ролях — 🔴 ЛАМАЄ РОЛЛІНГ: `Kamal::Cli::App::Boot#run`
#       робить `start_new_version` ДО `stop_old_version`, тож ДРУГИЙ деплой падає на
#       "port is already allocated", а `web` — gatekeeper, отже `close_barrier` валить ще й
#       job/coap. Спробували 2026-08-29, відкотили того ж дня. (Аліас, на відміну від порту,
#       НЕ ексклюзивний: у роллінг-вікні обидві версії ділять його легально — виміряно живим
#       експериментом, DNS віддає обидві IP і конвергує на вцілілій.)
#   (б) `discovery.docker` по мітках Kamal — вимагає монтування docker-сокета, тобто грант,
#       рівносильний root на хості (і навіть через socket-proxy: haproxy-шаблон гейтить увесь
#       префікс `/containers` ОДНИМ regex, тож inspect із `Config.Env` нероздільний від list —
#       це env-read money-квінтета job-ролі). Рішення про безпеку, не про конфіг.
accessories:
  alloy:
    image: grafana/alloy:v1.16.3
    host: silken-net-app
    files:
      - deploy/alloy/config.alloy:/etc/alloy/config.alloy
    env:
      clear:
        DEPLOYMENT_SLOT: production
      secret:
        - GRAFANA_REMOTE_WRITE_URL
        - GRAFANA_REMOTE_WRITE_USERNAME
        - GRAFANA_REMOTE_WRITE_TOKEN
    cmd: run --server.http.listen-addr=127.0.0.1:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy

# Persistent storage volume for Active Storage files.
volumes:
  - "silken_net_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404 on in-flight requests.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# SSH transport [INF.20]. The app host runs `enable-oslogin = TRUE` (terraform/compute.tf),
# so the deploy SA's login name is `sa_<numeric>`, minted BY `terraform apply`. That value
# landed 2026-08-31 and is now written below — until then this key held a deliberately loud
# `deploy` placeholder, because there was nothing true to write.
# The host also has NO external IP and :22 is open only to Google's IAP frontend range
# (35.235.240.0/20, `allow_iap_ssh`), so a plain TCP connect cannot work either.
#
# ⛔ THE (б) GLUE IS A PRECONDITION OF DEPLOY-DAY Фаза 3, NOT AN OPTION — [OPS.37] made
# kamal the primary path onto a private host. Written out IN FULL here, not as a pointer,
# for the same reason as the testnet block in deploy.canopy.yml: a cross-reference cannot
# be uncommented. FOUR moves, ALL FOUR WIRED 2026-08-31 — (3)+(4) into terraform/, then
# (1)+(2) here once the first `apply` minted their values. ⚠️ Wired ≠ proven: three are
# verified live (IAP SSH to both hosts, and the docker-group entry on the app host), but
# NONE is proven under the SA identity itself — only `kamal deploy` does that:
#   (1) `user:` ← `gcloud compute os-login describe-profile --format='value(posixAccounts[0].username)'`
#       run AS the deploy SA (impersonated), i.e. `sa_<numeric>`;
#   (2) `proxy_command:` — kamal has no IAP notion, so the tunnel is an SSH ProxyCommand:
#         proxy_command: "gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone <zone> --project <project>"
#       (`%h`/`%p` are OpenSSH's host/port tokens; `--listen-on-stdin` is what makes it a
#        stdio proxy rather than a local listener);
#   (3) docker-socket access for THAT identity. `kamal server bootstrap` cannot provide it:
#       it needs `sudo -n usermod -aG docker`, and our deploy SA holds `compute.osLogin`,
#       NOT `osAdminLogin` — sudo is reserved for the human `iap_admin_members`. Docker
#       itself is pre-installed by the startup script for exactly this reason, and the group
#       membership is SHIPPED by that same script: terraform/compute.tf appends
#       `sa_<unique_id>` to the docker line of /etc/group, because the account does not
#       exist until the first OS Login and both usermod and gpasswd refuse an unknown user.
#       ⛔ Raising the SA to `osAdminLogin` was REJECTED by measurement, not taste: it hands
#       CI sudo on the host whose job-role ENV carries the money quintet, and voids the very
#       reason docker is pre-installed;
#   (4) `roles/iap.tunnelResourceAccessor` ON THE DEPLOY SA — SHIPPED 2026-08-31 as
#       `google_project_iam_member.deploy_iap_tunnel` (terraform/iam.tf), the NARROW role:
#       tunnel without a shell, sudo stays with the human `iap_admin_members`.
#       🔑 Keep the WHY, because it is what a 403 will look like: until that resource the
#       role was granted ONLY through `for_each = toset(var.iap_admin_members)`, i.e. to
#       humans, and the SA held `compute.osLogin` with no tunnel role at all — so move (2)
#       returned 403 however correct the command was, and the error names IAP, not kamal,
#       which reads like a gcloud problem. If the tunnel 403s on deploy day, re-check this
#       binding FIRST; do not go rewriting the proxy_command.
ssh:
  # ✅ Ходи (1)+(2) клею INF.20 ЗАДРОТОВАНО 2026-08-31, одразу після першого
  # `terraform apply` — доти дротувати не було чим: обидва значення МІНТИТЬ сам apply.
  # `user` — OS-Login-імʼя deploy-SA. Деривоване як `sa_<unique_id>` (те саме, що робить
  # startup-скрипт `google_compute_instance.app`), бо `os-login describe-profile` через
  # імперсонацію віддав PERMISSION_DENIED: власник не має TokenCreator на цьому SA, і
  # видавати роль заради одного читання дорожче за деривацію. ⚠️ Форма лишається
  # ТВЕРДЖЕННЯМ про найменування Google — звіряється першим успішним SSH, не раніше.
  user: sa_100772929234285228842
  # Тунель: kamal не знає про IAP, тож він приходить SSH-ProxyCommand-ом. `%h`/`%p` —
  # токени OpenSSH, `--listen-on-stdin` робить із нього stdio-проксі, а не локальний
  # слухач. Без цього рядка kamal ФІЗИЧНО не досягає app-хоста: у того немає зовнішньої
  # IP, а :22 відкритий лише діапазону IAP-фронтендів.
  proxy_command: "gcloud compute start-iap-tunnel %h %p --listen-on-stdin --zone europe-west1-d --project silkennet"
