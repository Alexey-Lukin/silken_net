# Name of your application. Used to uniquely configure containers.
service: silken_net

# Name of the container image.
image: silken_net

# Deploy to these servers (Ingress Anchor IP from Terraform: `terraform output ingress_ip`).
# After infrastructure pivot, GCP hosts only the Ingress Anchor (e2-micro) — Rails runs on Akash.
# Kamal is retained for direct GCP deployments (fallback) and deployment tooling.
servers:
  web:
    - 192.168.0.1
  job:
    hosts:
      - 192.168.0.1
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    env:
      clear:
        # Sidekiq concurrency=15 (config/sidekiq.yml); DB pool must match + headroom.
        # Without this, database.yml falls back to RAILS_MAX_THREADS+2=5 → pool starvation at 15.
        DB_POOL: 17

# Kamal proxy configuration.
# SSL auto-certification via Let's Encrypt. Requires config.assume_ssl and config.force_ssl in production.rb.
# proxy:
#   ssl: true
#   host: silken.net
#   # INF.10 — readiness-gated cutover. kamal-proxy default healthcheck = /up (liveness only);
#   # /ready (ReadinessController: DB SELECT 1 + Redis PING) holds the cutover until deps are up.
#   # FLIP path to /ready ONLY AFTER the first deploy confirms /ready→200 — on a cold start /ready
#   # 503s until DB/Redis are wired and kamal-proxy retries to deploy_timeout → rollback.
#   # Runbook: docs/06_01 §Чеклист (step 18). Schema verified vs kamal 2.12. Probe: docs/06_05.
#   healthcheck:
#     path: /ready
#     interval: 3
#     timeout: 5

# Proxy boot configuration: publish ports including CoAP UDP.
boot:
  proxy:
    publish:
      - "80:80"
      - "443:443"
      - "5683:5683/udp"

# Google Artifact Registry for Docker images.
# Run `gcloud auth configure-docker <region>-docker.pkg.dev` before first deploy.
registry:
  server: europe-west1-docker.pkg.dev
  username: _json_key_base64
  password:
    - GCP_ARTIFACT_REGISTRY_KEY

# Inject ENV variables into containers (secrets come from .kamal/secrets).
# Drift guard: each entry below MUST also be declared in .kamal/secrets — otherwise
# Kamal injects nothing and the container crashes at boot. See docs/06_01 §Kamal Detailed
# and docs/00_08 cross-doc audit sweep entry #12.
env:
  secret:
    # --- Application core ---
    - RAILS_MASTER_KEY
    # Cloud SQL password (host/user are non-secret → env.clear). Component style: config/database.yml.
    - POSTGRES_PASSWORD
    - REDIS_URL
    - KREDIS_REDIS_URL
    # --- Observability ---
    - SENTRY_DSN
    # --- Hardware provisioning gate (config/initializers/master_key_strength_check.rb) ---
    - PROVISIONING_MASTER_KEY
    # --- Web3 oracle / minter / slasher (dual-key split, B-02 resolved) ---
    - ORACLE_PRIVATE_KEY
    - ORACLE_MINTER_PRIVATE_KEY
    - ORACLE_SLASHER_PRIVATE_KEY
    - ETHEREUM_ANCHOR_PRIVATE_KEY
    # --- RPC endpoints (SSOT names expected by Web3::RpcConnectionPool) ---
    - ALCHEMY_POLYGON_RPC_URL
    - ALCHEMY_ETHEREUM_RPC_URL
    - SOLANA_RPC_URL
    # --- Solana minting (Solana::MintingService raises without these) ---
    - SOLANA_WALLET_KEYPAIR
    - SOLANA_FEE_PAYER_PUBKEY
    - SOLANA_FEE_PAYER_TOKEN_ACCOUNT
    - SOLANA_USDC_MINT_ADDRESS
    # --- Chainlink Functions Router v1 (Proof of Growth pipeline) ---
    - CHAINLINK_FUNCTIONS_ROUTER
    - CHAINLINK_SUBSCRIPTION_ID
    - CHAINLINK_HMAC_SECRET
    - CHAINLINK_DON_ID
  clear:
    # PostgreSQL connection (component style — config/database.yml; port defaults to 5432).
    # Kamal deploys inside the GCP VPC → connect to the Cloud SQL PRIVATE IP directly
    # (no Auth Proxy — that is Akash-only). Set POSTGRES_HOST to `terraform output
    # database_private_ip` after apply. POSTGRES_PASSWORD is in env.secret above.
    POSTGRES_HOST: <CLOUD_SQL_PRIVATE_IP>
    POSTGRES_USER: silken_net
    # Mailer link host (config/environments/production.rb action_mailer.default_url_options).
    APP_HOST: silkennet.com
    # Puma clustered mode — number of forked worker processes.
    # GCP n2-standard-2 has 2 vCPUs, so 2 workers saturate both cores.
    # Combined with preload_app! + jemalloc, CoW sharing cuts memory ~30-40%.
    WEB_CONCURRENCY: 2

    # Sentry release tracking — set by CI/CD pipeline (git SHA or release tag).
    # Enables Sentry to group errors by deploy and track regressions.
    # See: config/initializers/sentry.rb → config.release
    RELEASE_VERSION: "${RELEASE_VERSION}"

    # Chainlink Functions Router v1 configuration.
    # DATA_VERSION: Functions API version (default: 1).
    # CALLBACK_GAS_LIMIT: gas limit for oracle callback response (default: 300000).
    CHAINLINK_DATA_VERSION: 1
    CHAINLINK_CALLBACK_GAS_LIMIT: 300000

    # Web3 fail-closed: Hadron KYC / Chainlink raise on missing creds, not silent stub (INF.11).
    # Gates HadronComplianceService / OracleDispatchService (they check ONLY this flag, not Rails.env).
    WEB3_STRICT_MODE: "true"

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  canopy-console: app exec --interactive --reuse "bin/rails console" -d canopy
  canopy-logs: app logs -f -d canopy

# Persistent storage volume for Active Storage files.
volumes:
  - "silken_net_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404 on in-flight requests.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# SSH user for connecting to servers
ssh:
  user: deploy
