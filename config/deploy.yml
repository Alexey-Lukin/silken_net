# Name of your application. Used to uniquely configure containers.
service: silken_net

# Name of the container image. registry.server (below) is prepended, so the final ref is
# europe-west1-docker.pkg.dev/<GCP_PROJECT_ID>/silken-net/silken_net. Replace <GCP_PROJECT_ID>
# after `terraform apply` (matches `terraform output artifact_registry_url`). [INF.15]
image: <GCP_PROJECT_ID>/silken-net/silken_net

# Deploy to these servers (Ingress Anchor IP from Terraform: `terraform output ingress_ip`).
# After infrastructure pivot, GCP hosts only the Ingress Anchor (e2-small) — Rails runs on Akash.
# Kamal is retained for direct GCP deployments (fallback) and deployment tooling.
servers:
  web:
    - 192.168.0.1
  job:
    hosts:
      - 192.168.0.1
    cmd: bundle exec sidekiq -C config/sidekiq.yml
    env:
      clear:
        # Sidekiq concurrency=15 (config/sidekiq.yml); DB pool must match + headroom.
        # Without this, database.yml falls back to RAILS_MAX_THREADS+2=5 → pool starvation at 15.
        DB_POOL: 17
      secret:
        # Money/signing keys are JOB-ONLY: every signing call site is a Sidekiq
        # worker; web/coap boot keyless (Security::Web3NetworkGuard scopes the
        # presence check via signer_process: Sidekiq.server?). Mirrors the Akash
        # SDL split (job service carries them, web does not).
        # ORACLE_PRIVATE_KEY (legacy shared fallback) is fully RETIRED (INF.22):
        # no code reads it, and Security::Web3NetworkGuard refuses a value under
        # that name (zombie-config tripwire). Every signer has a dedicated key;
        # aux signers (ORACLE_ETHERISC/PURO/KLIMA_PRIVATE_KEY) are activation-gated
        # lazy keys — injected when their path goes live, never mapped here.
        - ORACLE_CELO_PRIVATE_KEY
        - ORACLE_MINTER_PRIVATE_KEY
        - ORACLE_SLASHER_PRIVATE_KEY
        - ETHEREUM_ANCHOR_PRIVATE_KEY
        - SOLANA_WALLET_KEYPAIR
  # CoAP/UDP telemetry intake daemon (INF.17) — mirrors the Akash `coap` service.
  # kamal-proxy is HTTP-only, so UDP bypasses it: the container publishes 5683/udp
  # directly on the host (NOT via boot.proxy.publish — that would park the port on
  # the proxy container with no listener behind it).
  coap:
    hosts:
      - 192.168.0.1
    cmd: bundle exec ruby lib/daemons/coap_listener
    options:
      publish:
        - "5683:5683/udp"
    # ⚠️ No env: override → this role inherits the GLOBAL env.secret, incl.
    # PROVISIONING_MASTER_KEY which the coap daemon does NOT need (master_key_strength_check
    # $PROGRAM_NAME-skips coap; SEC.22 wants the HKDF fleet-forge root off coap's plaintext env).
    # Kamal has no per-role secret exclude. Accepted: the PRIMARY coap intake is the anchor
    # systemd daemon (compute.tf) + Akash SDL coap — both correctly omit it; this Kamal coap role
    # is a dormant fallback. If it ever goes live, move PROVISIONING_MASTER_KEY into per-role
    # (web+job) env.secret so this role stops inheriting it.

# Kamal proxy configuration.
# SSL auto-certification via Let's Encrypt. Requires config.assume_ssl and config.force_ssl in production.rb.
# proxy:
#   ssl: true
#   host: silken.net
#   # INF.10 — readiness-gated cutover. kamal-proxy default healthcheck = /up (liveness only);
#   # /ready (ReadinessController: DB SELECT 1 + Redis PING) holds the cutover until deps are up.
#   # FLIP path to /ready ONLY AFTER the first deploy confirms /ready→200 — on a cold start /ready
#   # 503s until DB/Redis are wired and kamal-proxy retries to deploy_timeout → rollback.
#   # Runbook: docs/06_01 §Чеклист (step 18). Schema verified vs kamal 2.12. Probe: docs/06_05.
#   healthcheck:
#     path: /ready
#     interval: 3
#     timeout: 5

# Proxy boot configuration (HTTP/HTTPS only — kamal-proxy does not speak UDP;
# CoAP 5683/udp is published directly by the `coap` role above).
boot:
  proxy:
    publish:
      - "80:80"
      - "443:443"

# Google Artifact Registry for Docker images.
# Run `gcloud auth configure-docker <region>-docker.pkg.dev` before first deploy.
registry:
  # [INF.22] Keyless: oauth2accesstoken + a short-lived WIF access token as the
  # password (GCP_ARTIFACT_REGISTRY_KEY), not a long-lived _json_key_base64. CI mints
  # it via google-github-actions/auth (token_format: access_token); locally use
  # `gcloud auth print-access-token`. See docs/06_02 §Security Exception.
  server: europe-west1-docker.pkg.dev
  username: oauth2accesstoken
  password:
    - GCP_ARTIFACT_REGISTRY_KEY

# Inject ENV variables into containers (secrets come from .kamal/secrets-common).
# Drift guard: each entry below MUST also be declared in .kamal/secrets-common — otherwise
# Kamal injects nothing and the container crashes at boot. See docs/06_01 §Kamal Detailed
# and the secrets inventory docs/06_04.
env:
  secret:
    # --- Application core ---
    - RAILS_MASTER_KEY
    # Cloud SQL password (host/user are non-secret → env.clear). Component style: config/database.yml.
    - POSTGRES_PASSWORD
    - REDIS_URL
    # KREDIS_REDIS_URL intentionally absent — Kredis auto-derives it from REDIS_URL (DB 1)
    # via config/redis/shared.yml. Declaring it here would inject an empty string that
    # overrides the derive (see .kamal/secrets-common note). Add back only for a separate instance.
    # --- Observability ---
    - SENTRY_DSN
    # --- Hardware provisioning gate (config/initializers/master_key_strength_check.rb) ---
    - PROVISIONING_MASTER_KEY
    # --- AR-Encryption keys gate (active_record_encryption_keys_check.rb) — hardware_keys + identities [SEC.22] ---
    - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
    - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
    - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
    # --- Mail transport gate (mail_transport_check.rb) [ARCH.60] — the credential half.
    #     Secret-by-default because the "username" IS the credential on several ESPs
    #     (Postmark server token; SES access-key id). MAIL_FROM/SMTP_ADDRESS are clear below. ---
    - SMTP_USER_NAME
    - SMTP_PASSWORD
    # --- Telegram bot token [ARCH.60] — optional channel: transport no-ops when unset,
    #     and TelegramTransport.configured? rejects the placeholder by token format. ---
    - TELEGRAM_BOT_TOKEN
    # --- Web3 money/signing keys: JOB-ONLY (servers.job env.secret above) —
    #     deliberately NOT global so web/coap containers never carry them ---
    # --- RPC endpoints (SSOT names expected by Web3::RpcConnectionPool) ---
    - ALCHEMY_POLYGON_RPC_URL
    - ALCHEMY_ETHEREUM_RPC_URL
    - SOLANA_RPC_URL
    # Celo rewards (CELO_RPC_URL) — separate from ALCHEMY_*.
    - CELO_RPC_URL
    # --- Solana public identifiers (the signing keypair is job-only) ---
    - SOLANA_FEE_PAYER_PUBKEY
    - SOLANA_FEE_PAYER_TOKEN_ACCOUNT
    - SOLANA_USDC_MINT_ADDRESS
    # --- Webhook HMACs: Chainlink callback (dispatch removed — ARCH.53) + Helium SOS (ARCH.34;
    #     HeliumSosController raises SecurityError per-request under WEB3_STRICT_MODE without it) ---
    - CHAINLINK_HMAC_SECRET
    - HELIUM_WEBHOOK_SECRET
  clear:
    # PostgreSQL connection (component style — config/database.yml; port defaults to 5432).
    # Kamal deploys inside the GCP VPC → connect to the Cloud SQL PRIVATE IP directly
    # (no Auth Proxy — that is Akash-only). Set POSTGRES_HOST to `terraform output
    # database_private_ip` after apply. POSTGRES_PASSWORD is in env.secret above.
    POSTGRES_HOST: <CLOUD_SQL_PRIVATE_IP>
    POSTGRES_USER: silken_net
    # Database SET selector (config/database.yml). Production default; Canopy overrides to
    # silken_net_canopy in config/deploy.canopy.yml (same instance, isolated DB names).
    POSTGRES_DATABASE: silken_net_production
    # Mailer link host (config/environments/production.rb action_mailer.default_url_options).
    # This is the host INSIDE the message body — transport and sender are separate, below.
    APP_HOST: silkennet.com
    # 🛑 BOOT-CRITICAL [ARCH.60]: mail_transport_check.rb refuses to boot without these two.
    # Vendor-agnostic plain SMTP — every ESP speaks it, so switching provider is these
    # values and nothing else. SMTP_PORT / SMTP_DOMAIN / SMTP_AUTHENTICATION are omitted
    # deliberately: their defaults (587 / none / plain) cover the mainstream ESPs, and a
    # declared var with a sane default is one more surface to keep in sync for nothing.
    # Placeholders fail the guard loudly until a real ESP is provisioned (👤 S1.1).
    MAIL_FROM: REQUIRED_SECRET_NOT_SET
    SMTP_ADDRESS: REQUIRED_SECRET_NOT_SET
    # [ARCH.81] CoAP intake address the admin health panel probes over UDP — the
    # same host a Queen dials (firmware `COAP_SERVER_HOST`; A-record → Ingress
    # Anchor, checklist step 1). Unset ⇒ the panel says "not configured"; it never
    # claims the intake is dead just because it could not look.
    COAP_HOST: api.silkennet.com
    # Puma clustered mode — number of forked worker processes.
    # Fallback path only (see the `servers:` note above — Rails runs on Akash at
    # WEB_CONCURRENCY=4). 2 is a conservative default for a small 2-vCPU fallback
    # host; it is NOT the spec of a provisioned machine — the only GCP instance is
    # the e2-small Ingress Anchor, which runs no Puma.
    # Combined with preload_app! + jemalloc, CoW sharing cuts memory ~30-40%.
    WEB_CONCURRENCY: 2

    # Sentry release tracking — set by CI/CD pipeline (git SHA or release tag).
    # Enables Sentry to group errors by deploy and track regressions.
    # See: config/initializers/sentry.rb → config.release
    RELEASE_VERSION: "${RELEASE_VERSION}"

    # Web3 fail-closed: Hadron KYC raises on missing creds + oracle-callback HMAC fail-fast (SEC.5), not silent stub (INF.11).
    # Gates HadronComplianceService / OracleCallbacksController (they check ONLY this flag, not Rails.env).
    WEB3_STRICT_MODE: "true"

    # --- Web3 contract addresses (post-`forge deploy`; fill before first mint) ---
    # Public on-chain addresses (not secrets) but unknown until contracts deploy → placeholder.
    # Fail-loud on use until provisioned. Canon docs/06_04 §2.1.
    CARBON_COIN_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    FOREST_COIN_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    DAO_TREASURY_ADDRESS: REQUIRED_SECRET_NOT_SET
    ETHEREUM_ANCHOR_CONTRACT: REQUIRED_SECRET_NOT_SET
    PROTOCOL_PARAMETERS_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    CELO_CUSD_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    KLIMA_RETIREMENT_CONTRACT: REQUIRED_SECRET_NOT_SET
    ETHERISC_DIP_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET
    PURO_EARTH_REGISTRY_CONTRACT_ADDRESS: REQUIRED_SECRET_NOT_SET

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"
  canopy-console: app exec --interactive --reuse "bin/rails console" -d canopy
  canopy-logs: app logs -f -d canopy

# Persistent storage volume for Active Storage files.
volumes:
  - "silken_net_storage:/rails/storage"

# Bridge fingerprinted assets between versions to avoid 404 on in-flight requests.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

# SSH user for connecting to servers
ssh:
  user: deploy
