# =============================================================================
# SILKEN NET — Active Storage Configuration
# Scale context: tens of millions of trees, photos for every repair/installation
#
# PRODUCTION SETUP:
#   Set credentials via environment variables or Rails credentials:
#     bin/rails credentials:edit
#
#   Required credentials structure:
#     aws:
#       access_key_id: ...
#       secret_access_key: ...
#     gcs:
#       (JSON keyfile contents as a hash)
# =============================================================================

# --- TEST ---
test:
  service: Disk
  root: <%= Rails.root.join("tmp/storage") %>

# --- DEVELOPMENT (local disk, mirrors prod structure) ---
local:
  service: Disk
  root: <%= Rails.root.join("storage") %>

# --- PRODUCTION PRIMARY: Amazon S3 (or any S3-compatible: MinIO, DO Spaces, Backblaze B2) ---
# Recommended: separate bucket per environment, enable versioning + lifecycle rules
amazon:
  service: S3
  access_key_id: <%= ENV["AWS_ACCESS_KEY_ID"].presence || Rails.application.credentials.dig(:aws, :access_key_id) %>
  secret_access_key: <%= ENV["AWS_SECRET_ACCESS_KEY"].presence || Rails.application.credentials.dig(:aws, :secret_access_key) %>
  region: <%= ENV.fetch("AWS_REGION", "eu-central-1") %>
  # 🎰 [INF.27] SLOT, not `Rails.env`. Both deploy slots run RAILS_ENV=production, so this
  # default resolved to `silken-net-production` on BOTH — while each slot keeps its OWN
  # `active_storage_blobs` table (POSTGRES_DATABASE). Two databases each believing they own
  # the same keys is not mislabelling: a canopy `purge` deletes a PRODUCTION object and the
  # production row survives pointing at nothing. ⚠️ Latent, not live — AWS_BUCKET is unset on
  # every deploy surface and the credentials below are still `06_04 §2.2` lazy-tier, so
  # nothing writes anywhere yet. Fixed now because the moment costs one line and the day it
  # goes live it costs a restore. One home: `config/deployment_slot.rb`.
  bucket: <%= ENV.fetch("AWS_BUCKET") { "silken-net-#{SilkenNet::DeploymentSlot.current}" } %>
  # Enable server-side encryption at rest
  upload:
    server_side_encryption: "AES256"
  # Use presigned URLs so files are served directly from S3/CDN — bypasses Rails
  public: false

# --- DISASTER RECOVERY MIRROR: Google Cloud Storage ---
# Files are written to both S3 and GCS simultaneously
google:
  service: GCS
  credentials: <%= ENV["GCS_CREDENTIALS_JSON"].presence || Rails.application.credentials.dig(:gcs) %>
  project: <%= ENV.fetch("GCS_PROJECT", "silken-net") %>
  # 🎰 [INF.27] Same split as the S3 bucket above, and here it matters MORE: `production_mirror`
  # writes to both services, so an unsplit name lets canopy pollute the one copy that exists to
  # be trustworthy during a restore.
  bucket: <%= ENV.fetch("GCS_BUCKET") { "silken-net-#{SilkenNet::DeploymentSlot.current}" } %>

# --- PRODUCTION MIRROR SERVICE (primary S3 + mirror GCS) ---
# Reads always come from primary (amazon); writes go to both.
# Switch primary to :google instantly if S3 has an outage.
production_mirror:
  service: Mirror
  primary: amazon
  mirrors:
    - google
