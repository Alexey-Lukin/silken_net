# Canopy destination — deployed automatically from main branch after CI passes.
# The forest canopy is the first layer that meets the sun and rain,
# protecting the forest floor (production) below. 🌿
#
# Canopy = the FIRST deploy of the main Kamal path (DEPLOY-1 Фаза 3), not a fallback.
# Deploy: kamal deploy -d canopy
#
# 🔴 ⚠️ "Same host as production" is a LEFTOVER, not a design — and this comment used to
# state it as one. Provenance (git, 2026-08-29): canopy was born 2026-03-07 with its OWN
# server (e2-medium); the 2026-04-19 platform pivot deleted BOTH VMs because the real
# separation was meant to live on a platform that was itself cut on 2026-08-29 [OPS.37].
# So the cut should have RESTORED two hosts and instead cemented the leftover.
# ✅ [OPS.37 ⚖️ founder 2026-09-03] THE SHARED HOST IS NOW A DECISION, and it is: KEEP IT
# until the first production deploy, then give the NEW machine to PRODUCTION — canopy stays
# where it is. Trigger is named: DEPLOY-1 Фаза 2/5 (first production render), not a date.
# 🔑 Ground, and it is a MEASUREMENT (live billing 2026-09-03, per-SKU): a second
# e2-standard-2 + 30 GiB pd-ssd costs ≈$59/mo — $0.024031/vCPU-h and $0.003224/GiB-h taken
# off the Sep 1–2 invoice, whose SKU split reproduced `compute.tf` INDEPENDENTLY
# (119.43 vCPU-h / 48 h ≈ 2.49 = e2-standard-2 + e2-small; 477.73 GiB-h / 48 ≈ 9.95 = 8+2).
# The want the split serves — "stop canopy without stopping production" — has NOTHING to
# lever against while production does not exist on this host: Фаза ∅ already stops canopy
# alone, because canopy is all that runs here. So splitting now would burn ≈$59/mo for a
# lever with no load, across a stretch the owner expects to be long.
# ⚠️ Price of deferring, said out loud because deferral has no red: production-deploy day
# gains one `terraform apply` plus a re-point of this manifest's host — on the day that is
# already the densest. That cost was accepted knowingly.
# ⛔ Do NOT re-open this as "should canopy get its own VM" — it was measured and answered.
# The live question is the MIRROR: when production arrives, the new machine is PRODUCTION's.
# Whether canopy gets its own keys and a job role is SETTLED (⚖️ founder 2026-09-02 — the
# `servers:` block below): it does, with testnet signers. Shared-host connection budget:
# 362/400 with an unshrunk canopy job role, 311/400 without — the shrunk form below
# (WEB_CONCURRENCY=1, `-c 4`, DB_POOL=6) lands at 266/400, two lines rather than a machine.

# Canopy server IP — `terraform output -raw app_host_ip`, the SAME machine as production.
# 🔴 This line said "use Ingress Anchor IP from: terraform output ingress_ip" until
# 2026-08-31, and the placeholder token still spells `<INGRESS_ANCHOR_IP>` for that reason.
# Both date from 2026-04-19, the pivot that DELETED the app host — back then the anchor was
# the only machine there was. [OPS.37] restored `google_compute_instance.app` on 08-30 and
# this line was not swept, so the manifest disagreed with its own runbook: DEPLOY-DAY Фаза 3
# says "`kamal deploy -d canopy` на app-хост". The anchor is an e2-small (2 GB) already
# carrying the CoAP daemon and HAProxy; it is the DNS address, never the deploy target.
# ⚠️ The token is left unchanged deliberately — Pre-Flight #9 substitutes it by literal, and
# renaming it there and here in one pass is a rename with no gate behind it. Read the value,
# not the name.
# (⚠️ Sharing production's host is the leftover named above — canopy is differentiated only
#  by POSTGRES_DATABASE, not by IP)
#
# 🌿 [OPS.37 ⚖️ founder 2026-09-02] CANOPY HAS ITS OWN `job:` ROLE — the HASH form, and the
# hash is SAFE only because of three things written out below, each with a carrier:
#   (1) `job.env.secret` is DECLARED HERE as its own array. Kamal's destination deep_merge
#       REPLACES arrays and UNIONS hash keys, so an omitted `job:` (or a `job:` without its own
#       `env.secret`) would INHERIT the base role's quintet — whose values are production-
#       environment-scoped (INF.22) and arrive present-empty "" on this slot. Declaring the
#       same five NAMES here makes `.kamal/secrets.canopy` remap each from its `CANOPY_*`
#       twin (invariant B4), so the job container signs with TESTNET keys and nothing else.
#       Carrier: `scripts/deploy_secret_scan.rb` invariant B3 (hash form ⇒ own quintet array).
#   (2) The aliases are DISJOINT from the production ones (`silken-*`) — and since 2026-09-03
#       they are SCRAPED under their own names: `config.alloy` targets `canopy-web:80` and
#       `canopy-job:9394` with `slot = "canopy"` carried ON THE TARGET (a target label wins over
#       the accessory's `external_labels`, so these series land as slot=canopy while every
#       `silken-*` series keeps the accessory's production label — ⚖️ founder 2026-09-03,
#       00_07 OPS.37). The invariant therefore reads: a canopy role never answers to a
#       production alias, and a canopy alias is scraped ONLY with an explicit slot label;
#       carrier: `spec/deploy/alloy_scrape_topology_spec.rb` (judged on the MERGED config — an
#       omitted `hosts:`/`options:` inherits the base value, the raw file shows neither).
#       Before 2026-09-03 canopy was deliberately unscraped (the price was named: no `up`, no
#       DeadSet gauge, no dashboard for the slot) — the canopy dashboard reading «No data»
#       everywhere was what bought the fourth and fifth targets.
#   (3) `coap:` is NEUTRALISED with `hosts: []`. deep_merge cannot delete a role, and the base
#       coap role publishes `5683/udp` on the host — a second publisher on the shared machine
#       would collide with production's dormant fallback the day production deploys. Kamal
#       boots roles per host, so a role with no hosts never runs; carrier: B3 again (a canopy
#       coap WITH hosts is red).
#
# 🔴 HADRON: this role carries NO `HADRON_API_KEY` by construction — the quintet array IS the
# whole of `job.env.secret` (B3 pins the exact set), and that key is Console-injected at
# activation (06_04 §5.7), never a deploy-surface name. Measured 2026-09-02:
# `api.hadron.polygon.technology` has NO DNS record and NO archived snapshot ever (00_07
# ARCH.118), so the hazard this comment used to name — staging submitting personas to a
# vendor's PRODUCTION KYC — has no vendor to reach. A blank key still makes
# `Polygon::HadronComplianceService` RAISE under `Rails.env.production?`: loud. Keep it so.
#
# Connection budget: the two canopy rows and the 266/400 total live in ONE home, 06_01
# §Розрахунок max_connections — not here. `-c 4` and `DB_POOL: 6` are ONE decision (the pool
# must exceed Sidekiq concurrency, 06_05); carrier: `spec/deploy/kamal_config_validity_spec.rb`
# judges the MERGED pair, so dropping the `cmd:` override (→ inherited concurrency 15) goes RED.
servers:
  web:
    hosts:
      - silken-net-app
    options:
      # Disjoint from the scraped `silken-web` — see (2) above.
      network-alias: canopy-web
  job:
    hosts:
      - silken-net-app
    # Concurrency 4 (base: 15) — the shared-host connection budget above.
    cmd: bundle exec sidekiq -C config/sidekiq.yml -c 4
    options:
      # Disjoint from the scraped `silken-job` — see (2) above.
      network-alias: canopy-job
    env:
      clear:
        # pool > concurrency (4) — one decision with the `-c 4` above.
        DB_POOL: 6
      secret:
        # The same five NAMES as the base job role — each resolved by `.kamal/secrets.canopy`
        # from its CANOPY_* twin (testnet keys, repo-level secrets), never from the
        # production-scoped originals. Own array ⇒ nothing inherited (see (1) above).
        - ORACLE_CELO_PRIVATE_KEY
        - ORACLE_MINTER_PRIVATE_KEY
        - ORACLE_SLASHER_PRIVATE_KEY
        - ETHEREUM_ANCHOR_PRIVATE_KEY
        - SOLANA_WALLET_KEYPAIR
  coap:
    # No hosts ⇒ Kamal never boots it on this destination — see (3) above.
    hosts: []

# Kamal 2.12 REFUSES a hostless role by default («No servers specified for the coap role.
# You can ignore this with allow_empty_roles: true» — measured with `kamal config -d canopy`
# 2026-09-02, the parser-executed proof `spec/deploy/kamal_config_validity_spec.rb` runs).
# This flag is scoped to THIS destination by the deep_merge (the base manifest never sets
# it), and it is the whole mechanism behind (3) above: deep_merge cannot delete the base
# `coap` role, so the only way to keep a second 5683/udp publisher off the shared host is
# a role Kamal knows about and boots nowhere. ⚠️ Within the destination it is role-WIDE —
# Kamal 2.12 has no per-role form — so an emptied `job.hosts` would also deploy in silence;
# `scripts/deploy_secret_scan.rb` B3 pins the job role's `hosts:` non-empty for that reason.
allow_empty_roles: true

# 🔴 [OPS.37 ⚖️ HEALTHCHECK, measured 2026-09-03] Kamal waits `deploy_timeout` (default 30 s) for
# kamal-proxy to see the new web container healthy. The canopy entrypoint on an EMPTY slot runs
# create → structure.sql ×3 → the demo seed BEFORE Puma listens — 4.5 min on 2026-09-03 — so the
# proxy killed a container whose seed had already finished (run 33740036520: seed summary printed,
# Puma booted, «target failed to become healthy within configured timeout (30s)»). The old container
# kept serving the freshly seeded DB, i.e. the failure was the VERDICT, not the work. Six minutes
# covers the measured cold path with margin; a genuinely broken container now fails in 6 min
# instead of 30 s — the 45-s uptime probe and /ready remain the judges of what boots.
# ⚖️ 2026-09-03 (delegated, 00_07 OPS.37): a HEALTHCHECK in the image is NOT built. The 45-s uptime
# probe already closes the job window on both workflows and the coap role is dormant, so the
# instruction would run a `curl` every 5 s in every container forever to buy a boot window that is
# already bought. Named trigger: activation of the coap FALLBACK role — until then its Kamal
# verdict is `.State.Status` alone, and that ceiling is declared, not hidden.
# Measured form for the day it IS built: `--interval=5s --start-period=20s --retries=3` in the image
# + `deploy_timeout ≥ 60` in BOTH manifests (Docker defaults — interval 30 s, start-period 0 — would
# let the first probe land after a 30-s deploy_timeout).
deploy_timeout: 360

# Canopy uses an ISOLATED database set on the same Cloud SQL instance: silken_net_canopy
# (+ _cache/_cable — `_queue` зрізано INF.18 2026-07-04, і цей рядок обіцяв її досі). Same host/user/password as production (inherited from
# config/deploy.yml env); only POSTGRES_DATABASE differs. See config/database.yml.
# (Terraform provisioning of the silken_net_canopy* databases is tracked in 00_07.)
env:
  clear:
    # 🎰 [INF.27] Slot label for the Rails roles — same override shape as POSTGRES_DATABASE
    # below, and the same argument the Alloy accessory block already makes further down:
    # RAILS_ENV is `production` on BOTH slots, so without this line canopy does not merely
    # go unlabelled — it labels itself `production`, and a wrong label is worse than none.
    DEPLOYMENT_SLOT: canopy
    POSTGRES_DATABASE: silken_net_canopy
    # [OPS.37] One Puma worker on the shared host — the connection budget in the header
    # (production 185 + canopy web 63 + canopy job 18 = 266/400); base pins 2 for production.
    WEB_CONCURRENCY: 1
    # [ARCH.60] Mail bypass — its GROUND CHANGED 2026-09-02 with the job role. It used to say
    # "canopy has no Sidekiq, so it could not deliver anyway"; now it CAN, and the only thing
    # standing is that no ESP exists yet (00_07 ARCH.60 👤 — MAIL_FROM/SMTP_ADDRESS are still
    # placeholders in the base manifest, and `mail_transport_check.rb` refuses a boot on them).
    # The same token also switches `perform_deliveries` OFF (config/environments/production.rb):
    # a `deliver_later` on this slot renders and returns instead of failing DNS 25 times into a
    # DeadSet nothing scrapes here (review 2026-09-02 — "loud" needs a listener; canopy has none).
    # ⛔ Drop this line the day the ESP lands — for BOTH slots, in the same commit.
    SILKENNET_SKIP_MAIL_TRANSPORT_CHECK: "1"
    # ⚖️ [founder 2026-09-02] Committed HERE, unlike production (operator-set — 06_01 §Kamal):
    # the value IS `proxy.host` below, which is already committed, so a second copy of the
    # same fact is not a leak; and without it the first boot ran with DNS-rebinding
    # protection DISABLED (measured WARN in the 2026-09-02 boot log).
    RAILS_ALLOWED_HOSTS: canopy.silkennet.app
    # ⚖️ [founder 2026-09-02] Staging carries no storage credentials; `production_mirror`
    # (S3 primary) made the AWS SDK fall through to EC2-IMDS on a GCP VM every boot.
    # `local` = Disk inside the container (ephemeral) — config/storage.yml, 06_04 §2.1.
    ACTIVE_STORAGE_SERVICE: local

    # 🔴 [OPS.37 / 00_03 §3.3 / INF.27] TESTNET SLOT — LIVE since 2026-09-02. Canopy runs
    # `RAILS_ENV=production` deliberately (hardened runtime), and until the `production` split
    # it inherited "this is real money" with it — so the guard forbade every testnet endpoint
    # and canopy could only be raised on MAINNET contracts, inverting 00_03 §3.3 (a real
    # testnet pipeline is a precondition of Software TRL 7-8; mainnet is a TRL 9 matter).
    #
    # ⛔ The line below is an ASSERTION about the wiring, not a switch: a testnet claim on a
    # mainnet endpoint refuses the boot as loudly as the reverse. It is TRUE only because four
    # other moves hold it up, and each has a CARRIER — read the carriers, not this comment:
    #   (2) testnet RPC URLs in `.kamal/secrets.canopy` (CANOPY_* twins, loud placeholder,
    #       never a fall-through) — `deploy_secret_scan` invariant B4 judges all four names;
    #   (3) the SAME names exported under BOTH spellings in the `Kamal Deploy to Canopy` step
    #       of `.github/workflows/deploy.yml`, and the four `CANOPY_*` secrets in its
    #       BOOT_CRITICAL set (unset → canopy skips clean, never boots on a placeholder);
    #   (4) the testnet contract addresses right below;
    #   (5) deploy ORDER — contracts BEFORE the slot's first raise (06_01 DEPLOY-DAY Фаза 2t).
    #       Machine witness that it held: `spec/deploy/web3_env_loudness_spec.rb` resolves this
    #       role through Kamal and asserts the web container carries no address placeholder.
    # ⚠️ EVM from `Deploy.s.sol` (Amoy + Sepolia); there is no Solana program in this repo, so
    # the Devnet leg is an SPL mint + fee-payer ATA by hand — its four identifiers ride the
    # `CANOPY_SOLANA_*` twins through `.kamal/secrets.canopy`, job-only. ✅ Canopy's own `job:`
    # role and testnet SIGNER keys are settled (⚖️ founder 2026-09-02, keys first, role second
    # — see the `servers:` block above); this line is what makes those keys legal here.
    WEB3_CHAIN_ENV: testnet
    # [ARCH.114] Testnet twins of the base manifest's keyless fallbacks — EVERY name the base
    # declares must be overridden here (deep_merge = keys-UNION), or canopy inherits a MAINNET
    # fallback and the cascade lands staging on real value one outage later; the boot guard's
    # chain axis (`RPC_FALLBACK_URL_ENVS`) refuses that boot, which is the machine witness.
    # Measured live from the app VM 2026-09-02. Solana: one twin only — no second keyless
    # devnet endpoint answered (dRPC 403, PublicNode 403), so FALLBACK_2 stays ABSENT, never empty.
    POLYGON_RPC_URL_FALLBACK_1: "https://polygon-amoy-bor-rpc.publicnode.com"
    POLYGON_RPC_URL_FALLBACK_2: "https://polygon-amoy.drpc.org"
    CELO_RPC_URL_FALLBACK_1: "https://forno.celo-sepolia.celo-testnet.org"
    CELO_RPC_URL_FALLBACK_2: "https://celo-sepolia.drpc.org"
    SOLANA_RPC_URL_FALLBACK_1: "https://api.devnet.solana.com"
    # [INF.27 move (4)] Polygon Amoy (chainId 80002) — outputs of the `Deploy.s.sol` broadcast
    # of 2026-09-01 (DEPLOY-1 Фаза 2t), verified by bytecode + live calls + the SEC.1 role
    # matrix; EIP-55 exactly as printed, which is what the boot guard checks. Public on-chain
    # addresses, so committable; the full six-address set (Timelock · Governor · Anchor too)
    # lives in docs/06_01 §DEPLOY-DAY Фаза 2t because `contracts/broadcast/` is gitignored.
    CARBON_COIN_CONTRACT_ADDRESS: "0x18a8A50e0DC0103aA94de51b78f352E2d26E1b22"
    FOREST_COIN_CONTRACT_ADDRESS: "0x9366a4CbA0461E150A3409CD2767Ff7b8db6d4b7"
    # StateRootAnchor on Sepolia (chain 11155111), Deploy.s.sol broadcast 2026-09-02 — receipts and
    # the other five addresses live in 06_01 Фаза 2t (contracts/broadcast/ is gitignored). Member of
    # SILENT_ADDRESS_ENVS with `web: true` [INF.27]: the base manifest's placeholder would refuse
    # the web container here, so canopy MUST carry the real address.
    ETHEREUM_ANCHOR_CONTRACT: "0x584906C1Ef7A60b203bEFD743fA55b6bb55A9c36"
    # INPUT of the script, not an output: on testnet the treasury is the operator EOA
    # (`REQUIRE_SAFE_ADMIN` stays false, so the script warned instead of reverting).
    DAO_TREASURY_ADDRESS: "0x6FEa1cAFd4371e159cFF9c1232368339166C365b"
    PROTOCOL_PARAMETERS_CONTRACT_ADDRESS: "0x1F20032142C98BBcfD3DcB115f62Ae1230802Be2"
    # cUSD on Celo Sepolia (chain 11142220) — docs.celo.org/contract-addresses, and accepted
    # on-chain 2026-09-02: `cast call <addr> "symbol()(string)"` via forno.celo-sepolia → "cUSD".
    # Without this line canopy inherited the base placeholder (deep_merge = keys-UNION) and
    # `CeloRewardWorker` raised CheckSumError ×4 into Sentry per healthy cluster per day; the
    # boot guard now refuses an ARMED Celo path with a placeholder here (E.49's sibling).
    CELO_CUSD_CONTRACT_ADDRESS: "0xEF4d55D6dE8e8d73232827Cd1e9b2F2dBb45bC80"
    # ⛔ Never "fill" ETHEREUM_ANCHOR_CONTRACT with the Amoy StateRootAnchor: a well-formed
    # address on the WRONG chain is the silent class INF.27 Q2 names, and it would ride straight
    # into an MRV lineage report (Mrv::LineageReportService reads it from the web container).

# 🔴 CANOPY НЕ ПЕРЕВИЗНАЧАЄ ACCESSORY `alloy` — І ЦЕ ПРИСУД, А НЕ ПРОПУСК [⚖️ founder 2026-08-31].
# Тут стояв override `accessories.alloy.env.clear.DEPLOYMENT_SLOT: canopy`, заведений проти
# хибної мітки — і він її СТВОРЮВАВ, а не лікував. Механізм, звірений із джерелом kamal 2.12:
#   • `Kamal::Configuration::Accessory#service_name` = `"#{config.service}-#{name}"`, а
#     `config.service` НЕ несе destination (`service_and_destination` існує, але вживається
#     лише для каталогу застосунку) ⇒ обидва призначення дають ОДИН контейнер `silken_net-alloy`;
#   • цей override чіпав лише `env.clear`, тож `accessories.alloy.host` лишався базовим ⇒
#     той самий контейнер на тому самому хості;
#   • `kamal accessory boot` ідемпотентний ПРОПУСКОМ («Skipping … a container already exists»,
#     жовтим, exit 0) ⇒ мітку вигравав слот, що встиг ПЕРШИМ. Canopy їде на кожен push у main,
#     production — лише на реліз, тож canopy штампував би `slot="canopy"` на ПРОДОВИХ серіях.
# 🔑 І це була чиста втрата, бо ДО 2026-09-03 canopy не мав жодної цілі скрейпу: `config.alloy` скрейпив три
# `silken-*` `network-alias`-імені, а ролі canopy несуть ВЛАСНІ `canopy-*` аліаси, дизʼюнктні з
# ними (OPS.37 2026-09-02; доти canopy був alias-less через масив-форму `servers:`) — носій
# `alloy_scrape_topology_spec`. Тобто «canopy-Alloy» ніколи не існував як
# сутність — існував один агент, який дивиться на прод, і питання було лише в тому, як його звуть.
# ✅ Лік: `.github/workflows/deploy.yml` кличе `kamal accessory ${{ inputs.alloy || 'boot' }} alloy` БЕЗ `-d canopy`, тож
# мітка збігається з тим, що скрейпиться. Носій обох половин — `spec/deploy/alloy_scrape_topology_spec.rb`.
# ⚠️ ЗАЛИШОК, названий, а не знайдений у день деплою: canopy не може «не оголосити» успадкований
# accessory — deep_merge є keys-UNION, форми видалення в kamal немає. Тож `kamal setup -d canopy`
# (на відміну від `kamal deploy -d canopy`, який accessories НЕ чіпає — `boot_accessories: false`)
# підняв би його з міткою бази. Фаза 3 рунбука свідомо каже `kamal deploy -d canopy`.

# 🟢 [INF.28 ⚖️ founder 2026-09-03] CANOPY'S OWN REDIS — a Kamal accessory on the app host, and the
# ground is a QUOTA, not a preference: Upstash Free = 500 k commands/month, while an EMPTY Sidekiq
# at `-c 4` burns ≈12.7 M (`brpop` / heartbeat / scheduler poll — Sidekiq's own pulse, 06_01
# §Redis Isolation), so the job role above would exhaust the slot's Redis ~1.2 days after its FIRST
# boot and `/ready` would 503 with it. Weighed: (а) this accessory, $0 ⊥ (б) Upstash Fixed $20/mo ⊥
# (в) PAYG ≈$25/mo idle. Production stays Upstash BY CONSTRUCTION (paid tier — S1.1 `REDIS_URL`):
# this block lives ONLY in the canopy destination, the base manifest never grows a Redis, and
# `deploy_workflow_parity_spec` keeps `REDIS_URL ≠ CANOPY_REDIS_URL`.
#   • ONE secret, ONE home: the accessory reads the SAME `REDIS_URL` the overlay remaps from
#     `CANOPY_REDIS_URL` (.kamal/secrets.canopy) and takes its `requirepass` FROM THAT URL in `cmd`,
#     so there is no second secret to rotate out of step. Form: `redis://:<hex>@<app_host_ip>:6379/0`;
#     the password is HEX on purpose (`openssl rand -hex 24`) — a URL-escaped character would reach
#     Redis encoded and the shell extraction raw.
#   • `port: 6379` publishes on the host's ONLY interface (VPC-internal, no external IP exists —
#     06_01 §VPC; the ingress rule admits the subnet CIDR alone), so the anchor's CoAP daemon reaches
#     it across the VPC with the same URL in `coap.env` (canopy slot). The Alloy `options.publish`
#     refusal (06_03 §2.9) was about a ROLLING app role; an accessory never rolls, so that ground
#     does not carry here. `redis://` without TLS is deliberate: the traffic never leaves the VPC.
#   • `directories: data` = AOF on the host disk (CMEK `app-boot`): a staging SPOF accepted with its
#     price named — a host loss loses queued canopy jobs and testnet nonces, nothing of value
#     (06_06 §5.4). The image tag is pinned like Alloy's; no Dependabot lane covers Kamal
#     accessories, so it is bumped by hand.
#   • Booted by the `Kamal Deploy to Canopy` step BEFORE `kamal deploy -d canopy` (idempotent —
#     kamal 2.12 skips an existing container), never by `kamal setup`. Service name is
#     `silken_net-redis`: accessory names carry no destination (the fact that keeps Alloy single),
#     and production has no accessory of that name by construction.
accessories:
  redis:
    image: redis:7.4-alpine
    host: silken-net-app
    port: "6379:6379"
    directories:
      - data:/data
    env:
      secret:
        - REDIS_URL
    # The password is extracted from REDIS_URL and MUST be hex — any other shape (the old
    # Upstash `rediss://default:…`, an unset twin's `…_NOT_SET` marker, an empty value) exits 78
    # and the container restart-loops VISIBLY instead of running with a guessable password on a
    # VPC-reachable port. ⚠️ Runs as root (the `sh -c` wrapper bypasses the image's su-exec drop);
    # accepted for a staging accessory whose data dir is a host mount — named here, not hidden.
    cmd: sh -c 'p="${REDIS_URL#redis://:}"; p="${p%%@*}"; case "$p" in ""|*[!0-9a-f]*) echo "REDIS_URL must be redis://:<hex>@host:port/db (INF.28)" >&2; exit 78;; esac; exec redis-server --appendonly yes --requirepass "$p"'

