# Canopy destination — deployed automatically from main branch after CI passes.
# The forest canopy is the first layer that meets the sun and rain,
# protecting the forest floor (production) below. 🌿
#
# Canopy = the FIRST deploy of the main Kamal path (DEPLOY-1 Фаза 3), not a fallback:
# same app host as production, isolated database set. Deploy: kamal deploy -d canopy

# Canopy server IP — use Ingress Anchor IP from: terraform output ingress_ip
# (same host as production — canopy is differentiated by POSTGRES_DATABASE, not by IP)
#
# WEB-ONLY, enforced STRUCTURALLY: `servers:` uses the ARRAY form, which Kamal's
# destination deep_merge REPLACES wholesale (an array is not a hash) → the base
# `job:`/`coap:` roles do NOT leak in. Merely omitting a `job:` section would NOT
# be enough — deep_merge is a keys-UNION, so an omitted role is INHERITED from
# config/deploy.yml, bringing the money quintet in its env.secret; those secrets
# are production-environment-scoped (INF.22) → they would interpolate present-empty
# "" → Web3NetworkGuard raise on the job container's boot.
# ⚠️ [OPS.37] Canopy therefore has NO background jobs anywhere: they used to ride a
# separate `job` service on the retired platform. Open decision — give canopy its own
# `job:` role, or keep it deliberately worker-less; until then Sidekiq debuts on
# production, and "canopy is green" means the web half only.
servers:
  - <INGRESS_ANCHOR_IP>

# Canopy uses an ISOLATED database set on the same Cloud SQL instance: silken_net_canopy
# (+ _cache/_queue/_cable). Same host/user/password as production (inherited from
# config/deploy.yml env); only POSTGRES_DATABASE differs. See config/database.yml.
# (Terraform provisioning of the silken_net_canopy* databases is tracked in 00_07.)
env:
  clear:
    POSTGRES_DATABASE: silken_net_canopy
    # [ARCH.60] Canopy declares itself mail-less, and this is a statement of fact rather
    # than a workaround: `deliver_later` only ever runs in Sidekiq, and this leg is
    # structurally web-only (see the `servers:` array note above) — it has no background
    # jobs at all. Demanding SMTP here would block the deploy for a
    # capability the container could not exercise anyway. The bypass logs a loud WARN on
    # every boot; drop this line the day canopy gains a job role.
    SILKENNET_SKIP_MAIL_TRANSPORT_CHECK: "1"

# Proxy: no SSL on canopy (HTTP only for developer use).
# proxy:
#   ssl: true
#   host: canopy.silken.net
#   # INF.10 readiness cutover (proxy.healthcheck.path: /ready) — same as config/deploy.yml;
#   # apply on first canopy deploy after /ready→200. Runbook: docs/06_01 §Чеклист (step 18).
