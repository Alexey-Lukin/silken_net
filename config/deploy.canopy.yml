# Canopy destination — deployed automatically from main branch after CI passes.
# The forest canopy is the first layer that meets the sun and rain,
# protecting the forest floor (production) below. 🌿
#
# Canopy = the FIRST deploy of the main Kamal path (DEPLOY-1 Фаза 3), not a fallback.
# Deploy: kamal deploy -d canopy
#
# 🔴 ⚠️ "Same host as production" is a LEFTOVER, not a design — and this comment used to
# state it as one. Provenance (git, 2026-08-29): canopy was born 2026-03-07 with its OWN
# server (e2-medium); the 2026-04-19 platform pivot deleted BOTH VMs because the real
# separation was meant to live on a platform that was itself cut on 2026-08-29 [OPS.37].
# So the cut should have RESTORED two hosts and instead cemented the leftover.
# ⛔ Do not read the shared host as a decision: it is an OPEN ⚖️ (00_07, OPS.37 leg), and
# so is whether canopy gets its own keys. Shared-host connection budget: 362/400 with a
# canopy job role, 311/400 without — and shrinking canopy (WEB_CONCURRENCY=1, DB_POOL=6)
# brings it to 266/400, which is two lines rather than a machine.

# Canopy server IP — `terraform output -raw app_host_ip`, the SAME machine as production.
# 🔴 This line said "use Ingress Anchor IP from: terraform output ingress_ip" until
# 2026-08-31, and the placeholder token still spells `<INGRESS_ANCHOR_IP>` for that reason.
# Both date from 2026-04-19, the pivot that DELETED the app host — back then the anchor was
# the only machine there was. [OPS.37] restored `google_compute_instance.app` on 08-30 and
# this line was not swept, so the manifest disagreed with its own runbook: DEPLOY-DAY Фаза 3
# says "`kamal deploy -d canopy` на app-хост". The anchor is an e2-small (2 GB) already
# carrying the CoAP daemon and HAProxy; it is the DNS address, never the deploy target.
# ⚠️ The token is left unchanged deliberately — Pre-Flight #9 substitutes it by literal, and
# renaming it there and here in one pass is a rename with no gate behind it. Read the value,
# not the name.
# (⚠️ Sharing production's host is the leftover named above — canopy is differentiated only
#  by POSTGRES_DATABASE, not by IP)
#
# WEB-ONLY, enforced STRUCTURALLY: `servers:` uses the ARRAY form, which Kamal's
# destination deep_merge REPLACES wholesale (an array is not a hash) → the base
# `job:`/`coap:` roles do NOT leak in. Merely omitting a `job:` section would NOT
# be enough — deep_merge is a keys-UNION, so an omitted role is INHERITED from
# config/deploy.yml, bringing the money quintet in its env.secret; those secrets
# are production-environment-scoped (INF.22) → they would interpolate present-empty
# "" → Web3NetworkGuard raise on the job container's boot.
# ⚠️ [OPS.37] Canopy therefore has NO background jobs anywhere: they used to ride a
# separate `job` service on the retired platform. Open decision — give canopy its own
# `job:` role, or keep it deliberately worker-less; until then Sidekiq debuts on
# production, and "canopy is green" means the web half only.
servers:
  - <INGRESS_ANCHOR_IP>

# Canopy uses an ISOLATED database set on the same Cloud SQL instance: silken_net_canopy
# (+ _cache/_cable — `_queue` зрізано INF.18 2026-07-04, і цей рядок обіцяв її досі). Same host/user/password as production (inherited from
# config/deploy.yml env); only POSTGRES_DATABASE differs. See config/database.yml.
# (Terraform provisioning of the silken_net_canopy* databases is tracked in 00_07.)
env:
  clear:
    # 🎰 [INF.27] Slot label for the Rails roles — same override shape as POSTGRES_DATABASE
    # below, and the same argument the Alloy accessory block already makes further down:
    # RAILS_ENV is `production` on BOTH slots, so without this line canopy does not merely
    # go unlabelled — it labels itself `production`, and a wrong label is worse than none.
    DEPLOYMENT_SLOT: canopy
    POSTGRES_DATABASE: silken_net_canopy
    # [ARCH.60] Canopy declares itself mail-less, and this is a statement of fact rather
    # than a workaround: `deliver_later` only ever runs in Sidekiq, and this leg is
    # structurally web-only (see the `servers:` array note above) — it has no background
    # jobs at all. Demanding SMTP here would block the deploy for a
    # capability the container could not exercise anyway. The bypass logs a loud WARN on
    # every boot; drop this line the day canopy gains a job role.
    SILKENNET_SKIP_MAIL_TRANSPORT_CHECK: "1"

    # 🔴 [OPS.37 / 00_03 §3.3] TESTNET SLOT — written out IN FULL and commented, for the
    # same reason as the `proxy.healthcheck` block below: a cross-reference cannot be
    # uncommented, and whoever uncomments this must get the WHOLE contract, not a pointer.
    #
    # Canopy runs `RAILS_ENV=production` deliberately (hardened runtime), and until the
    # `production` split it inherited "this is real money" with it — so the guard forbade
    # every testnet endpoint and canopy could only be raised on MAINNET contracts. That
    # inverted 00_03 §3.3, which makes a real testnet pipeline (Amoy / Devnet / Sepolia)
    # a precondition of Software TRL 7-8 and mainnet a TRL 9 matter.
    #
    # ⛔ Uncommenting the ONE line below alone makes canopy REFUSE to boot — by design, not
    # by accident: the declaration is an assertion about the wiring, so a testnet claim on
    # mainnet endpoints is as loud as the reverse. FIVE moves go together, in one change.
    # (This list said "four" on 2026-08-30 and was wrong by one within the hour — the CI
    #  mirror below is in a file neither this block nor the tracker leg was looking at.)
    #   (1) this line;
    #   (2) testnet RPC URLs in `.kamal/secrets.canopy` — same shape as the CANOPY_REDIS_URL
    #       remap there (loud placeholder, NEVER a fall-through to the production value):
    #       ALCHEMY_POLYGON_RPC_URL ← $CANOPY_ALCHEMY_POLYGON_RPC_URL, ALCHEMY_ETHEREUM_RPC_URL,
    #       SOLANA_RPC_URL, and CELO_RPC_URL if the Celo path is ever armed here;
    #   (3) 🔴 the SAME names in `.github/workflows/deploy.yml` (Deploy · Canopy) `env:` —
    #       its own drift-guard comment states the rule: that block MUST mirror the global
    #       `config/deploy.yml env.secret`, and anything missing is injected EMPTY → boot
    #       crash. It maps MAINNET values today, so leaving it is not "unchanged", it is the
    #       staging slot silently keeping production endpoints. Export under BOTH names,
    #       exactly as REDIS_URL/CANOPY_REDIS_URL already do there;
    #   (4) testnet contract addresses in this env.clear block — public, so committable:
    #       CARBON_COIN_CONTRACT_ADDRESS + FOREST_COIN_CONTRACT_ADDRESS (OUTPUTS of a testnet
    #       `forge script Deploy.s.sol`) and DAO_TREASURY_ADDRESS — ⚠️ that third is an INPUT
    #       to the script, not an output: on testnet it is an operator-chosen EOA, and the
    #       script only warns instead of reverting because REQUIRE_SAFE_ADMIN stays false.
    #       The base manifest's placeholders are what stop any container booting today;
    #   (5) the deploy ORDER: testnet contracts BEFORE this slot's first raise — 06_01
    #       DEPLOY-DAY Фаза 2t, which also lists the six ENVs `run()` demands even on a dry-run.
    # ⚠️ EVM ONLY. Amoy + Sepolia come from `Deploy.s.sol`; there is no Solana program in this
    # repo, so the Devnet leg is an SPL mint + fee-payer ATA provisioned by hand, not `forge`.
    # Still open: whether canopy also gets its own `job:` role (and therefore its own testnet
    # signer keys) is the still-open ⚖️ in 00_07 OPS.37 — it is NOT settled by this block.
    # WEB3_CHAIN_ENV: testnet

# 🔴 CANOPY НЕ ПЕРЕВИЗНАЧАЄ ACCESSORY `alloy` — І ЦЕ ПРИСУД, А НЕ ПРОПУСК [⚖️ founder 2026-08-31].
# Тут стояв override `accessories.alloy.env.clear.DEPLOYMENT_SLOT: canopy`, заведений проти
# хибної мітки — і він її СТВОРЮВАВ, а не лікував. Механізм, звірений із джерелом kamal 2.12:
#   • `Kamal::Configuration::Accessory#service_name` = `"#{config.service}-#{name}"`, а
#     `config.service` НЕ несе destination (`service_and_destination` існує, але вживається
#     лише для каталогу застосунку) ⇒ обидва призначення дають ОДИН контейнер `silken_net-alloy`;
#   • цей override чіпав лише `env.clear`, тож `accessories.alloy.host` лишався базовим ⇒
#     той самий контейнер на тому самому хості;
#   • `kamal accessory boot` ідемпотентний ПРОПУСКОМ («Skipping … a container already exists»,
#     жовтим, exit 0) ⇒ мітку вигравав слот, що встиг ПЕРШИМ. Canopy їде на кожен push у main,
#     production — лише на реліз, тож canopy штампував би `slot="canopy"` на ПРОДОВИХ серіях.
# 🔑 І це була чиста втрата, бо canopy не має ЖОДНОЇ цілі скрейпу: `config.alloy` скрейпить три
# `network-alias`-імені, а canopy alias-less ЗА ПОБУДОВОЮ (масив-форма `servers:` заміщає базовий
# хеш — інваріант B3, той самий, що стереже web-only). Тобто «canopy-Alloy» ніколи не існував як
# сутність — існував один агент, який дивиться на прод, і питання було лише в тому, як його звуть.
# ✅ Лік: `.github/workflows/deploy.yml` кличе `kamal accessory boot alloy` БЕЗ `-d canopy`, тож
# мітка збігається з тим, що скрейпиться. Носій обох половин — `spec/deploy/alloy_scrape_topology_spec.rb`.
# ⚠️ ЗАЛИШОК, названий, а не знайдений у день деплою: canopy не може «не оголосити» успадкований
# accessory — deep_merge є keys-UNION, форми видалення в kamal немає. Тож `kamal setup -d canopy`
# (на відміну від `kamal deploy -d canopy`, який accessories НЕ чіпає — `boot_accessories: false`)
# підняв би його з міткою бази. Фаза 3 рунбука свідомо каже `kamal deploy -d canopy`.

# Proxy: the block below is LIVE — canopy routes on its own host and serves TLS from the
# base manifest's Origin-CA pair (inherited; the certificate is a wildcard). Only the
# `healthcheck:` sub-block stays commented, and that one IS a shape-for-later ([INF.10]).
# 🔴 This header read "the block below is COMMENTED, so kamal-proxy boots with its defaults
# today — HTTP only, healthcheck /up. The `ssl: true` inside is the SHAPE for the day it is
# enabled" until 2026-08-31. It was written 08-30 01:30 and became false at 09:37 the next
# morning — by the SAME author, in the SAME file, in the commit that shipped origin TLS
# (`fc4083c5`). Nothing could have reddened: both halves were internally fine, the defect
# lived in the RELATION between prose and config. Two things it got wrong once live: canopy
# is NOT HTTP-only (⚖️ founder 08-30 — it is the first render of the main path, so an HTTP
# canopy would rehearse the deploy while skipping the link most likely to break), and there
# is no `ssl: true` anywhere any more — a custom cert pair replaced it, which is a different
# mechanism, not a different value (ACME is undeliverable under CF Full (strict)).
# (An older revision read "no SSL on canopy (HTTP only for developer use)", describing a
# dev-only slot that [OPS.37] had already superseded — same class, one wave earlier.)
#
# 🔴 [INF.10] The `healthcheck:` sub-block below is written OUT IN FULL on purpose, and
# that is the whole point of this edit. Until 2026-08-30 this block carried only the
# prose "same as config/deploy.yml" — so whoever uncommented exactly what was written got
# `proxy:` WITHOUT a healthcheck and stayed silently on the default `/up` (liveness) while
# believing they were on `/ready` (readiness: DB + Redis + Kredis). Declared parity that
# one side does not carry is not parity; a cross-reference cannot be uncommented.
# 🔴 [INF.4 ⚖️ founder 2026-08-30: «на canopy https ssl повинен бути, не розумію як по іншому»]
#    CANOPY GETS TLS, and the ruling is stronger than the convenience it looks like. Canopy is
#    the FIRST render of the main Kamal path (DEPLOY-1 Фаза 3), so an HTTP canopy rehearses the
#    deploy while SKIPPING the single link most likely to break: origin TLS. It also silently
#    drops `secure:` session and locale cookies (`session_store.rb` / `locales_controller.rb`
#    key off `Rails.env.production?` and never read `DISABLE_SSL`), and the price there is not
#    inconvenience but SILENCE — no error is raised anywhere; login simply does not stick.
#    ⛔ The alternative that used to sit here as a peer option — "let the cookie ride HTTP" —
#    is withdrawn by that ruling, not merely outranked.
#    Mechanism, the measurement behind it and why Let's Encrypt is NOT the answer: the long
#    block above the same `proxy:` key in `config/deploy.yml` (One-Home — do not restate it
#    here, but note the cert covers this host too: ONE Origin CA cert issued for
#    `silkennet.app` + `*.silkennet.app` serves both slots, so move (4) happens ONCE).
# 🔴 THIS OVERRIDE IS NOW LOAD-BEARING, and it became so the moment the base block went LIVE
#    (2026-08-31). Destination config DEEP-MERGES over the base for hashes, so with no `proxy:`
#    here canopy would silently inherit `host: silkennet.app` — the PRODUCTION hostname — and
#    route staging traffic on it. Only `host:` is overridden: `ssl:` is deliberately inherited,
#    because the Origin CA certificate is a WILDCARD (`*.silkennet.app`) and therefore covers
#    this subdomain with the same pair. ⊥ Contrast `servers:` above, which is an ARRAY and
#    therefore REPLACES rather than merges (invariant B3) — the two keys behave differently and
#    the difference is exactly what makes one of them easy to forget.
proxy:
  # [INF.25/INF.4] Canopy rides a subdomain of the PURCHASED web host (silkennet.app, founder
  #    2026-08-30; Option A ratified the same day). Routing host, not cert identity — the
  #    wildcard Origin CA cert carries that. ⚠️ A DNS record for this name must exist and point
  #    at the Ingress Anchor before the first canopy deploy (06_01 §TLS pre-flight).
  host: canopy.silkennet.app
  # ⏸️ `healthcheck:` inherits the base default (`/up`) exactly as intended — the `/ready` flip
  #    is INF.10 and happens after the first deploy proves `/ready→200`, on BOTH slots.
#   # INF.10 readiness cutover — flip on the first canopy deploy AFTER /ready→200
#   # (on a cold start /ready 503s until DB/Redis are wired, and kamal-proxy retries to
#   # deploy_timeout → rollback). Runbook: docs/06_01 §DEPLOY-DAY, Фаза 5.
#   healthcheck:
#     path: /ready
#     interval: 3
#     timeout: 5
