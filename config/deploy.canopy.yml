# Canopy destination — deployed automatically from main branch after CI passes.
# The forest canopy is the first layer that meets the sun and rain,
# protecting the forest floor (production) below. 🌿
#
# Canopy = the FIRST deploy of the main Kamal path (DEPLOY-1 Фаза 3), not a fallback.
# Deploy: kamal deploy -d canopy
#
# 🔴 ⚠️ "Same host as production" is a LEFTOVER, not a design — and this comment used to
# state it as one. Provenance (git, 2026-08-29): canopy was born 2026-03-07 with its OWN
# server (e2-medium); the 2026-04-19 platform pivot deleted BOTH VMs because the real
# separation was meant to live on a platform that was itself cut on 2026-08-29 [OPS.37].
# So the cut should have RESTORED two hosts and instead cemented the leftover.
# ⛔ Do not read the shared host as a decision: it is an OPEN ⚖️ (00_07, OPS.37 leg), and
# so is whether canopy gets its own keys. Shared-host connection budget: 362/400 with a
# canopy job role, 311/400 without — and shrinking canopy (WEB_CONCURRENCY=1, DB_POOL=6)
# brings it to 266/400, which is two lines rather than a machine.

# Canopy server IP — use Ingress Anchor IP from: terraform output ingress_ip
# (⚠️ today the SAME host as production, and that is the leftover named above — canopy is
#  differentiated only by POSTGRES_DATABASE, not by IP)
#
# WEB-ONLY, enforced STRUCTURALLY: `servers:` uses the ARRAY form, which Kamal's
# destination deep_merge REPLACES wholesale (an array is not a hash) → the base
# `job:`/`coap:` roles do NOT leak in. Merely omitting a `job:` section would NOT
# be enough — deep_merge is a keys-UNION, so an omitted role is INHERITED from
# config/deploy.yml, bringing the money quintet in its env.secret; those secrets
# are production-environment-scoped (INF.22) → they would interpolate present-empty
# "" → Web3NetworkGuard raise on the job container's boot.
# ⚠️ [OPS.37] Canopy therefore has NO background jobs anywhere: they used to ride a
# separate `job` service on the retired platform. Open decision — give canopy its own
# `job:` role, or keep it deliberately worker-less; until then Sidekiq debuts on
# production, and "canopy is green" means the web half only.
servers:
  - <INGRESS_ANCHOR_IP>

# Canopy uses an ISOLATED database set on the same Cloud SQL instance: silken_net_canopy
# (+ _cache/_cable — `_queue` зрізано INF.18 2026-07-04, і цей рядок обіцяв її досі). Same host/user/password as production (inherited from
# config/deploy.yml env); only POSTGRES_DATABASE differs. See config/database.yml.
# (Terraform provisioning of the silken_net_canopy* databases is tracked in 00_07.)
env:
  clear:
    POSTGRES_DATABASE: silken_net_canopy
    # [ARCH.60] Canopy declares itself mail-less, and this is a statement of fact rather
    # than a workaround: `deliver_later` only ever runs in Sidekiq, and this leg is
    # structurally web-only (see the `servers:` array note above) — it has no background
    # jobs at all. Demanding SMTP here would block the deploy for a
    # capability the container could not exercise anyway. The bypass logs a loud WARN on
    # every boot; drop this line the day canopy gains a job role.
    SILKENNET_SKIP_MAIL_TRANSPORT_CHECK: "1"

    # 🔴 [OPS.37 / 00_03 §3.3] TESTNET SLOT — written out IN FULL and commented, for the
    # same reason as the `proxy.healthcheck` block below: a cross-reference cannot be
    # uncommented, and whoever uncomments this must get the WHOLE contract, not a pointer.
    #
    # Canopy runs `RAILS_ENV=production` deliberately (hardened runtime), and until the
    # `production` split it inherited "this is real money" with it — so the guard forbade
    # every testnet endpoint and canopy could only be raised on MAINNET contracts. That
    # inverted 00_03 §3.3, which makes a real testnet pipeline (Amoy / Devnet / Sepolia)
    # a precondition of Software TRL 7-8 and mainnet a TRL 9 matter.
    #
    # ⛔ Uncommenting the ONE line below alone makes canopy REFUSE to boot — by design, not
    # by accident: the declaration is an assertion about the wiring, so a testnet claim on
    # mainnet endpoints is as loud as the reverse. FIVE moves go together, in one change.
    # (This list said "four" on 2026-08-30 and was wrong by one within the hour — the CI
    #  mirror below is in a file neither this block nor the tracker leg was looking at.)
    #   (1) this line;
    #   (2) testnet RPC URLs in `.kamal/secrets.canopy` — same shape as the CANOPY_REDIS_URL
    #       remap there (loud placeholder, NEVER a fall-through to the production value):
    #       ALCHEMY_POLYGON_RPC_URL ← $CANOPY_ALCHEMY_POLYGON_RPC_URL, ALCHEMY_ETHEREUM_RPC_URL,
    #       SOLANA_RPC_URL, and CELO_RPC_URL if the Celo path is ever armed here;
    #   (3) 🔴 the SAME names in `.github/workflows/deploy.yml` (Deploy · Canopy) `env:` —
    #       its own drift-guard comment states the rule: that block MUST mirror the global
    #       `config/deploy.yml env.secret`, and anything missing is injected EMPTY → boot
    #       crash. It maps MAINNET values today, so leaving it is not "unchanged", it is the
    #       staging slot silently keeping production endpoints. Export under BOTH names,
    #       exactly as REDIS_URL/CANOPY_REDIS_URL already do there;
    #   (4) testnet contract addresses in this env.clear block — public, so committable:
    #       CARBON_COIN_CONTRACT_ADDRESS + FOREST_COIN_CONTRACT_ADDRESS (OUTPUTS of a testnet
    #       `forge script Deploy.s.sol`) and DAO_TREASURY_ADDRESS — ⚠️ that third is an INPUT
    #       to the script, not an output: on testnet it is an operator-chosen EOA, and the
    #       script only warns instead of reverting because REQUIRE_SAFE_ADMIN stays false.
    #       The base manifest's placeholders are what stop any container booting today;
    #   (5) the deploy ORDER: testnet contracts BEFORE this slot's first raise — 06_01
    #       DEPLOY-DAY Фаза 2t, which also lists the six ENVs `run()` demands even on a dry-run.
    # ⚠️ EVM ONLY. Amoy + Sepolia come from `Deploy.s.sol`; there is no Solana program in this
    # repo, so the Devnet leg is an SPL mint + fee-payer ATA provisioned by hand, not `forge`.
    # Still open: whether canopy also gets its own `job:` role (and therefore its own testnet
    # signer keys) is the still-open ⚖️ in 00_07 OPS.37 — it is NOT settled by this block.
    # WEB3_CHAIN_ENV: testnet

# 🔴 SLOT-АТРИБУЦІЯ — БЕЗ ЦЬОГО ДИСКРИМІНАТОР БРЕШЕ, а не мовчить.
# `config/deploy.yml` задає `accessories.alloy.env.clear.DEPLOYMENT_SLOT: production`
# ЖОРСТКО, а destination deep_merge є keys-UNION — тож без цього override canopy-Alloy
# емітив би `slot="production"` і його серії злилися б із продовими під ПРОДОВОЮ міткою.
# Це гірше за відсутність мітки: порожнє поле видно, хибне — ні.
# ⚠️ Механізм тут доганяє ОБІЦЯНКУ, що вже стояла в `deploy/alloy/config.alloy`
# («"canopy" for a canopy deploy») і не мала за собою жодного рядка конфігу —
# RAILS_ENV для обох слотів `production`, тож `env`-мітка середовища не розводить.
# ⛔ Перевизначаємо ЛИШЕ `env.clear`: `env.secret` — масив, і його переоголошення
# замінило б успадкований набір цілком (та сама пастка, що з `servers:` вище).
accessories:
  alloy:
    env:
      clear:
        DEPLOYMENT_SLOT: canopy

# Proxy: the block below is COMMENTED, so kamal-proxy boots with its defaults today —
# HTTP only, healthcheck /up. The `ssl: true` inside is the SHAPE for the day it is
# enabled, not a statement about now. (This line used to read "no SSL on canopy (HTTP
# only for developer use)", which described a dev-only slot and was superseded by
# [OPS.37]: canopy is the FIRST deploy of the main Kamal path, per the file header.)
#
# 🔴 [INF.10] The `healthcheck:` sub-block below is written OUT IN FULL on purpose, and
# that is the whole point of this edit. Until 2026-08-30 this block carried only the
# prose "same as config/deploy.yml" — so whoever uncommented exactly what was written got
# `proxy:` WITHOUT a healthcheck and stayed silently on the default `/up` (liveness) while
# believing they were on `/ready` (readiness: DB + Redis + Kredis). Declared parity that
# one side does not carry is not parity; a cross-reference cannot be uncommented.
# proxy:
#   ssl: true
#   # [INF.25/INF.4] Canopy rides a subdomain of the PURCHASED web host (silkennet.app,
#   #    founder 2026-08-30; Option A ratified the same day — the tracker leg names the
#   #    canopy value as "canopy-піддомен" of the web host). With `ssl: true` this value
#   #    becomes the Let's Encrypt certificate name. Uncomment only per the fallback
#   #    runbook / INF.10 flip — never ad hoc.
#   host: canopy.silkennet.app
#   # INF.10 readiness cutover — flip on the first canopy deploy AFTER /ready→200
#   # (on a cold start /ready 503s until DB/Redis are wired, and kamal-proxy retries to
#   # deploy_timeout → rollback). Runbook: docs/06_01 §DEPLOY-DAY, Фаза 5.
#   healthcheck:
#     path: /ready
#     interval: 3
#     timeout: 5
