# PostgreSQL connection (all environments) via discrete ENV components — the Rails-8
# default style (no URL parsing in this file; Rails owns it). Production runs 4 logical
# DBs on ONE Cloud SQL instance (primary + Solid Cache/Queue/Cable), reached through the
# Cloud SQL Auth Proxy at 127.0.0.1:5432 (bin/docker-entrypoint). Every DB shares
# host+credentials from &default and overrides only `database:`. Provision
# POSTGRES_HOST / POSTGRES_PORT / POSTGRES_USER / POSTGRES_PASSWORD in deploy (docs/06_04).
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "password") %>
  # Pool size per process per database.
  # ---------------------------------------------------------------------------
  # Every thread that touches the database needs its own connection checkout.
  # With 4 databases (primary, cache, queue, cable), each process opens
  # up to pool × 4 connections to Cloud SQL.
  #
  # Connection consumers inside a Puma worker:
  #   1. Puma request threads ............ RAILS_MAX_THREADS  (default 3)
  #   2. ActionCable / Solid Cable ....... +2 headroom (polling + broadcast)
  #
  # Formula: pool = RAILS_MAX_THREADS + Cable headroom
  #        default: 3 + 2 = 5
  #
  # Total connections per database across all Puma workers:
  #   WEB_CONCURRENCY × pool  (e.g., 2 × 5 = 10 per database on GCP)
  #   4 databases × 10 = 40 connections total (well within Cloud SQL's 400)
  #
  # For Sidekiq workers (separate process), override DB_POOL >= 15
  # in the worker container's environment to match sidekiq.yml :concurrency.
  #
  # Override: set DB_POOL to a fixed value if automatic calculation is unwanted.
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  # ---------------------------------------------------------------------------
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 3).to_i + 2 } %>

development:
  <<: *default
  database: silken_net_development

# The "test" database is erased and re-loaded from schema each run — never point it
# at development or production.
test:
  <<: *default
  database: silken_net_test

# Production: 4 logical DBs on one Cloud SQL instance. primary + the Solid trifecta
# (Cache / Queue / Cable). All inherit host+credentials from &default; each owns only
# its database name + (for the secondaries) its Solid migrations path.
#
# POSTGRES_DATABASE selects the database SET (default: production). Canopy/staging sets
# POSTGRES_DATABASE=silken_net_canopy to get an isolated set (silken_net_canopy +
# _cache/_queue/_cable) on the SAME Cloud SQL instance — same host/user/password, only
# the name differs. The secondaries derive their suffix from it so one var switches all 4.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DATABASE", "silken_net_production") %>
  cache:
    <<: *default
    database: <%= "#{ENV.fetch("POSTGRES_DATABASE", "silken_net_production")}_cache" %>
    migrations_paths: db/cache_migrate
  queue:
    <<: *default
    database: <%= "#{ENV.fetch("POSTGRES_DATABASE", "silken_net_production")}_queue" %>
    migrations_paths: db/queue_migrate
  cable:
    <<: *default
    database: <%= "#{ENV.fetch("POSTGRES_DATABASE", "silken_net_production")}_cable" %>
    migrations_paths: db/cable_migrate
