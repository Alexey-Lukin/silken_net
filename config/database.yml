# PostgreSQL connection (all environments) via discrete ENV components — the Rails-8
# default style (no URL parsing in this file; Rails owns it). Production runs 3 logical
# DBs on ONE Cloud SQL instance (primary + Solid Cache/Cable — Solid Queue pruned,
# INF.18), reached DIRECTLY over the GCP VPC private IP (POSTGRES_HOST) — the Auth Proxy
# left the runtime path with the platform that needed it [OPS.37]; it survives only as a
# break-glass admin route — ⚠️ але вже НЕ з робочої станції: `ipv4_enabled = false` знімає публічний лістенер, тож Auth Proxy треба запускати ВСЕРЕДИНІ VPC (IAP-тунель на Ingress Anchor → proxy/psql там; SSH-модель INF.20). Every DB shares
# host+credentials from &default and overrides
# only `database:`. Provision POSTGRES_HOST / POSTGRES_PORT / POSTGRES_USER /
# POSTGRES_PASSWORD in deploy (docs/06_04).
default: &default
  adapter: postgresql
  encoding: unicode
  host: <%= ENV.fetch("POSTGRES_HOST", "localhost") %>
  port: <%= ENV.fetch("POSTGRES_PORT", 5432) %>
  username: <%= ENV.fetch("POSTGRES_USER", "postgres") %>
  password: <%= ENV.fetch("POSTGRES_PASSWORD", "password") %>
  # Pool size per process per database.
  # ---------------------------------------------------------------------------
  # Every thread that touches the database needs its own connection checkout.
  # With 3 databases (primary, cache, cable — queue pruned, INF.18), each process
  # opens up to pool × 3 connections to Cloud SQL.
  #
  # Connection consumers inside a Puma worker:
  #   1. Puma request threads ............ RAILS_MAX_THREADS   (default 3)
  #   2. IO-bound burst threads .......... PUMA_MAX_IO_THREADS (default 16) —
  #      Puma 8 max_io_threads. ⚠️ [ARCH.80] Позначених шляхів зараз НУЛЬ
  #      (middleware знято 2026-08-14), тож бонус недосяжний — запас лишено
  #      навмисно: io-marked запити біжать ПОНАД max_threads і
  #      still check out DB connections; a pool sized without them starves
  #      under burst (ConnectionTimeoutError). [INF.22]
  #   3. ActionCable / Solid Cable ....... +2 headroom (polling + broadcast)
  #
  # Formula: pool = RAILS_MAX_THREADS + PUMA_MAX_IO_THREADS + Cable headroom
  #        default: 3 + 16 + 2 = 21
  # The pool is a CEILING, not preallocation — connections open on demand and
  # idle ones get reaped, so non-web processes sharing this default don't
  # actually hold 21.
  #
  # Total ceiling per database across all Puma workers:
  #   WEB_CONCURRENCY × pool  (deploy.yml pins WEB_CONCURRENCY=2 → 2 × 21 = 42
  #   per database) [OPS.37 — one target, so this is the ceiling, not a fallback]
  #   3 databases × 42 = 126; + Sidekiq ~51 (DB_POOL=17 × 3) + admin ~8 ≈ 185,
  #   comfortably within Cloud SQL's 400 (canon: 06_01 §max_connections).
  #   ⚠️ Raising WEB_CONCURRENCY with the host tier re-opens this arithmetic —
  #   at 4 it is 3 × 84 + 51 + 8 ≈ 311, still under 400 but no longer comfortable.
  #
  # For Sidekiq workers (separate process), override DB_POOL >= 15
  # in the worker container's environment to match sidekiq.yml :concurrency.
  #
  # Override: set DB_POOL to a fixed value if automatic calculation is unwanted.
  # https://guides.rubyonrails.org/configuring.html#database-pooling
  # ---------------------------------------------------------------------------
  pool: <%= ENV.fetch("DB_POOL") { ENV.fetch("RAILS_MAX_THREADS", 3).to_i + ENV.fetch("PUMA_MAX_IO_THREADS", 16).to_i + 2 } %>

development:
  <<: *default
  database: silken_net_development

# The "test" database is erased and re-loaded from schema each run — never point it
# at development or production.
test:
  <<: *default
  database: silken_net_test

# Production: 3 logical DBs on one Cloud SQL instance. primary + Solid Cache / Cable.
# All inherit host+credentials from &default; each owns only its database name +
# (for the secondaries) its Solid migrations path.
# (Solid Queue pruned 2026-07-04 — Sidekiq is the job backend, INF.18; resurrect from git.)
#
# POSTGRES_DATABASE selects the database SET (default: production). Canopy/staging sets
# POSTGRES_DATABASE=silken_net_canopy to get an isolated set (silken_net_canopy +
# _cache/_cable) on the SAME Cloud SQL instance — same host/user/password, only
# the name differs. The secondaries derive their suffix from it so one var switches all 3.
production:
  primary:
    <<: *default
    database: <%= ENV.fetch("POSTGRES_DATABASE", "silken_net_production") %>
  cache:
    <<: *default
    database: <%= "#{ENV.fetch("POSTGRES_DATABASE", "silken_net_production")}_cache" %>
    migrations_paths: db/cache_migrate
  cable:
    <<: *default
    database: <%= "#{ENV.fetch("POSTGRES_DATABASE", "silken_net_production")}_cable" %>
    migrations_paths: db/cable_migrate
