:concurrency: 15
# Explicit graceful-shutdown window (was the implicit default). On SIGTERM Sidekiq
# re-enqueues jobs still running after this deadline — the orchestrator's grace
# period (Akash/k8s default ~30s) MUST stay ≥ this value or in-flight jobs die by
# SIGKILL instead (money-path then relies on the intent-marker/reconcile crons).
:timeout: 25
:strict: true
:queues:
  # Strict ordering: queues are drained top-to-bottom. No lower-priority job
  # runs while higher-priority work is waiting. Prevents priority inversion
  # WITHIN one process (a lower queue never preempts a higher one).
  #
  # [STRICTLY ISOLATED]: Черги обробляються у строгому порядку пріоритету.
  # Жодна задача з низькопріоритетної черги НЕ буде оброблена, поки є завдання вище.
  # Це гарантує, що нижча черга НІКОЛИ не випередить вищу В МЕЖАХ одного процесу.
  #
  # [ARCH.52 ⚠️] Strict НЕ захищає money-черги (`web3_critical`(6) … `critical`-slash(3))
  # від firehose у ВИЩІЙ `uplink`(1): на planetary-обсязі мільйон telemetry в `uplink`
  # дренажиться ПЕРШИМ → mint/slash/insurance/ConfirmationWorker голодують. Це не
  # «інверсія», а коректний strict — money стоїть нижче за intake. Лік = process-рівнева
  # ізоляція (виділений money-path процес), НЕ перестановка черг → [`06_08 §2.5`].
  #
  # [КРИТИЧНО]: Вхідний потік від Sanctum. Кожна мс на рахунку.
  - uplink    
  # [ОПЕРАТИВНО]: Сповіщення патрульних — Telegram-фан-аут і ЛИСТ про critical
  # (`AlertMailer`, ⚖️ ARCH.60 2026-08-23: довговічний канал несе пріоритет своєї
  # події). SMS тут більше не згадується — канал відкинуто ⚖️ 2026-08-20.
  - alerts
  # [КРИТИЧНО]: Протокол вилучення токенів (Slashing).
  - critical  
  # [КЕРУВАННЯ]: Команди актуаторам (Downlink) та OTA-прошивки.
  - downlink  
  # [СТАНДАРТ]: Звичайні системні задачі + УСІ ActiveJob-джоби (Turbo-броадкасти,
  # ActiveStorage, `PasswordMailer`). ⚠️ Рядок доти казав просто «та листи» — і це
  # був опис ВИПАДКОВОСТІ у формі рішення: жоден мейлер черги не оголошував, тож
  # `ActiveJob::Base.default_queue_name` клав сюди й лист про critical-тривогу.
  # Оголошення тепер живе пер-мейлерно; носій — `spec/quality/activejob_queue_declaration_spec.rb`.
  - default
  # [WEB3 КРИТИЧНИЙ]: Час-чутливі blockchain операції — підтвердження TX, мінтинг,
  # Oracle dispatch, ZK верифікація. Обробляється перед стандартними Web3 задачами.
  - web3_critical
  # [WEB3 СТАНДАРТ]: Стандартні Web3 операції — Celo, Solana, peaq DID.
  - web3      
  # [WEB3 НИЗЬКИЙ]: Некритичні Web3 задачі — L1 anchoring (раз/тиждень), KlimaDAO, Hadron.
  - web3_low
  # [АНАЛІТИКА]: Важка нічна агрегація (InsightGenerator).
  - low       

:scheduler:
  :schedule:
    # --- ЕКОНОМІЧНИЙ ЦИКЛ (The Heartbeat) ---
    # Перевірка балансів дерев та підготовка наказів на емісію SCC.
    tokenomics_evaluation:
      cron: '0 * * * *' # Щогодини
      class: TokenomicsEvaluatorWorker
    
    # --- ЦИКЛ ХРОНОМЕТРИСТА (The Daily Reset) ---
    # Стиснення телеметрії в AiInsight. Має завершитися до початку аудиту.
    # Sidekiq cron schedule keys to server time. The Rails app does not set
    # `config.time_zone`, so Rails 8.1 default = UTC, and so do these crons.
    # Kamal/Akash deployments run with TZ=UTC by Docker default, so the
    # firing wall-clock matches what the docs describe (01:00 UTC).
    daily_telemetry_aggregation:
      cron: '0 1 * * *' # 01:00 UTC щодня
      class: DailyAggregationWorker

    # --- ЦИКЛ АРБІТРАЖУ (The Justice Execution) ---
    # Перевірка NaaS контрактів та запуск Slashing Protocol (BurnCarbonTokens).
    # NOTE: ClusterHealthCheckWorker is ALSO enqueued by
    # `InsightBatchCallbacks#on_success` after the orchestrator batch
    # finishes (≈01:00–02:00 UTC depending on tenant size). This 02:00 cron
    # is a defensive fallback: it runs even if the batch had zero clusters
    # with data and the callback never fired.
    #
    # [ARCH.100] This block used to assert both effects were idempotent under
    # the double-enqueue. For the health recalc that was FALSE and the claim is
    # what kept the question closed: the callback passed the aggregator's UTC
    # date while the cron re-derived a PER-CLUSTER local date, so for any zone
    # west of UTC-2 the two enqueues resolved to different days and the later
    # one clobbered a real measurement with a fabricated one. Both paths now
    # anchor on AiInsight.reporting_date, which is what makes them idempotent.
    # The Celo reward half was and remains true —
    # CommunityRewardService#reward_community! short-circuits via
    # reward_already_sent? (per cluster+date BlockchainTransaction ledger),
    # so a healthy cluster is paid cUSD once per day, not twice.
    cluster_health_arbitration:
      cron: '0 2 * * *' # 02:00 UTC щодня (одразу після агрегації)
      class: ClusterHealthCheckWorker

    # --- ЦИКЛ ПАРТИЦІЙ (The Partition Guardian) ---
    # Автоматичне створення партицій для ВСІХ таблиць із
    # PartitionMaintenanceWorker::PARTITIONED_TABLES — перелік не дублюємо тут
    # (проза, що його переказувала, уже одного разу розійшлась із константою).
    # Гарантує, що партиція на наступний місяць існує задовго до 1-го числа.
    # [A-2 FIX: Wiki 04_02 Audit §14]: Запуск ДО DailyAggregationWorker (01:00 UTC).
    # Якщо партиція не існує на початку нового місяця — INSERT телеметрії падає з
    # "no partition of relation" PostgreSQL помилкою.
    partition_maintenance:
      cron: '30 0 * * *' # О 00:30 UTC щодня, ДО агрегації о 01:00 UTC
      class: PartitionMaintenanceWorker

    # --- ЦИКЛ L1 ЯКОРЯ (The Ethereum Seal) ---
    # Щотижневий запис State Root у смарт-контракт на Ethereum Mainnet.
    # Мінімізація Gas: тільки 1 запис (bytes32) на тиждень.
    ethereum_state_anchor:
      cron: '0 3 * * 1' # Щопонеділка о 03:00 UTC, після завершення всіх нічних циклів
      class: EthereumAnchorWorker

    # --- ЦИКЛ КАЗНАЧЕЙСТВА (The Treasury Guardian) ---
    # Моніторинг балансів Oracle-гаманців на всіх 4 мережах.
    # 15-хвилинний інтервал — баланси змінюються рідко, але критично
    # відслідковувати падіння нижче порогу перед наступним мінтингом.
    treasury_monitor:
      cron: '*/15 * * * *' # Кожні 15 хвилин
      class: TreasuryMonitorWorker

    # --- ЦИКЛ БАТЧ-КОЛЕКТОРА (The Gas Optimizer) ---
    # Збирає pending транзакції та відправляє пакетами через batchMint.
    # Gas savings: batchMint(100) ≈ 30-40% дешевше ніж 100 × mint().
    # Працює паралельно з MintCarbonCoinWorker (oracle-driven immediate minting).
    mint_batch_collector:
      cron: '*/5 * * * *' # Кожні 5 хвилин
      class: MintBatchCollectorWorker

    # --- ЦИКЛ SOLANA BATCH (The Micro-Reward Aggregator) [E.61] ---
    # Виплачує акумульовані Solana мікро-винагороди одним TransferChecked на
    # гаманець (коли поріг > 0; інакше воркер — no-op). Зміщено від :00-піку
    # (tokenomics + mint_batch). Обґрунтування + поріг — канон 05_01 §8.
    solana_batch_payout:
      cron: '20 * * * *' # Щогодини о :20
      class: SolanaBatchPayoutWorker

    # --- ЦИКЛ GOVERNANCE (The DAO Sync) ---
    # Синхронізує on-chain параметри протоколу (ProtocolParameters.sol)
    # з локальною SystemParameter моделлю. 1×/день о 03:30 UTC.
    # Після EthereumAnchor (понеділок 03:00) та перед денним циклом.
    governance_parameter_sync:
      cron: '30 3 * * *' # Щодня о 03:30 UTC
      class: Governance::ParameterSyncWorker

    # --- ЦИКЛ ВІЧНОЇ ПАМ'ЯТІ (The Archive Witness) [E.60] ---
    # Звіряє Filecoin/IPFS-архіви з локальним hash-ланцюгом: свіжі (24h) +
    # випадкова вибірка старших (ex-post підміна можлива будь-коли).
    # Mismatch → ERROR + silkennet_filecoin_verification_failures_total.
    filecoin_verification_sweep:
      cron: '40 4 * * *' # Щодня о 04:40 UTC, після нічних money-циклів
      class: FilecoinVerificationSweepWorker

    # --- REPAIR-половина archive-outbox (INF.22 крок 11) ---
    # Дренажить money/MRV AuditLog'и з виставленим archive_requested_at, застряглі без
    # ipfs_cid (FilecoinArchiveWorker вичерпав retry → Dead Set). Detect→repair суміжність:
    # за 8хв після verification_sweep, у тому ж нічному вікні. Дзеркало ARCH.64/65.
    filecoin_reconcile:
      cron: '48 4 * * *' # Щодня о 04:48 UTC, після sweep; :48 вільна (не колізить)
      class: FilecoinReconcileWorker

    # --- ЦИКЛ ЕНТРОПІЇ (The Pre-Stress Sentinel) [S6.20] ---
    # Погодинний fan-out ClusterEntropyAnalyzerWorker на кожен кластер. Без нього
    # gauge silkennet_cluster_entropy_score мертвий і entropy_anomaly EWS-тривоги
    # не спрацьовують (аналізатор приймає cluster_id, його ніхто не оркеструвало).
    cluster_entropy_sweep:
      cron: '10 * * * *' # Щогодини о :10 (зміщено від :00-піку tokenomics)
      class: ClusterEntropySweepWorker

    # --- ЦИКЛ ВІДНОВЛЕННЯ ВИПЛАТ (The Safety Net) [S6.20] ---
    # Підбирає страховки, що залипли у :triggered (втрачений подієвий enqueue з
    # Dclimate). Первинний тригер — подієвий; це лише сітка. InsurancePayoutWorker
    # ідемпотентний (lock + status guard + double-spend), тож re-enqueue безпечний.
    insurance_payout_recovery:
      cron: '15,45 * * * *' # Кожні 30 хв (:15/:45)
      class: InsurancePayoutRecoveryWorker

    # --- ЦИКЛ ВІДНОВЛЕННЯ ЗАСТРЯГЛИХ TX (The Mempool Limbo Net) [ARCH.55] ---
    # Re-arm BlockchainConfirmationWorker для tx, що застрягли в :sent довше 15 хв
    # (OOM/евікшн контейнера ПІД ЧАС поллінгу — pending-discovery їх не бачить,
    # MintingRollbackService кличеться лише з retries_exhausted). Ідемпотентний
    # (AASM confirm одноразовий; дубль → no-op). Зміщено від :00-піку.
    stuck_sent_sweep:
      cron: '5,35 * * * *' # Кожні 30 хв (:05/:35)
      class: StuckSentTransactionSweeperWorker

    # --- [ARCH.54 Шар 0] DEAD-MAN SWITCH КОРОЛЕВИ (The Silence Watcher) ---
    # Тиша шлюзу = кластер осліп (permanence-сторож NaaS, 06_08 §1.3):
    # offline→faulty + EwsAlert(queen_offline), симетричне recover при
    # поверненні в ефір, attest-lapse спостереження. 5 хв — дрібно проти
    # sleep-інтервалів (≥60с×1.2), дешево для черги alerts.
    gateway_staleness_sweep:
      cron: '*/5 * * * *'
      class: GatewayStalenessSweepWorker

    # --- [SILENCE-1] DEAD-MAN SWITCH СОЛДАТА (The Silent Soldier Watcher) ---
    # Per-tree тиша ≠ cluster-blackout: вкрадене/мертве дерево при живих сусідах
    # бачить ЛИШЕ цей sweeper (06_08 §1.3). Поріг = SystemParameter
    # :tree_silence_threshold_hours, дефолт = Tree::SILENCE_THRESHOLD [transitional,
    # bench-калібрування E.63] — число тут не дублюємо, воно ще зрушить (ARCH.99);
    # носій = per-tree field_audit («слухай, не карай» — 05_05). */5 — дзеркало
    # Queen-sweeper'а: детект-резолюція хвилини при порозі-годинах, прохід дешевий.
    tree_staleness_sweep:
      cron: '*/5 * * * *'
      class: TreeStalenessSweepWorker

    # --- [ARCH.58] СТОРОЖ ЗАГУБЛЕНОГО СЛІДУ (The Lost-Track Watchdog) ---
    # Актуатор числиться active довше за вікно своєї найновішої команди =
    # Rails загубив слід власного наказу (втрачена scheduled-джоба Reset,
    # крах між комітом видачі та perform_in). До цього sweep'а виходи були лише
    # ВИПАДКОВІ: акт ремонту через EcosystemHealingWorker (виїзд у ліс заради
    # бухгалтерської втрати) або наступний EWS-інцидент, чий insert_all минає
    # readiness-гейт. Команда від людини розчаклувати не вміла — гине при
    # створенні. Кожні 30 хв — прагматика: нижньої межі частоти флашу не існує
    # взагалі (таймерний гейтований `cache_count > 0 || ed25519_ready`, тож
    # мовчазна legacy-Королева не флашить ніколи), а на завантаженому кластері
    # частіший прохід доставляв би STOP раніше; :12/:42 вільні від іменованих
    # слотів і не кратні 5 (без колізій з */5).
    actuator_safety_sweep:
      cron: '12,42 * * * *'
      class: ActuatorSafetySweepWorker

    # --- ЦИКЛ CELO-ВІДНОВЛЕННЯ (The Silent Underpay Net) [ARCH.64] ---
    # Celo reward-intent, що застряг у :pending (transient RPC-timeout → dedup-skip
    # на Sidekiq-retry, job "успішний"), не озброює жодного reconcile (CeloConfirmationWorker
    # дивиться лише :sent; evm-sweeper'и Celo не бачать) → тиха недоплата cUSD. Цей sweep
    # ескалює стале :pending → :manual_review (money-safe: tx_hash невідомий → людська звірка).
    celo_reward_reconcile:
      cron: '25,55 * * * *' # Кожні 30 хв (:25/:55, зміщено від stuck_sent :05/:35 та insurance :15/:45)
      class: CeloRewardReconcileWorker

    # --- ЦИКЛ HADRON-KYC ВІДНОВЛЕННЯ (The Stuck-KYC Net) [ARCH.65] ---
    # HadronKycVerificationWorker enqueue'иться разово (after_commit на адресі) без
    # exhausted-hook — API-простій усі 5 retry → KYC "pending" назавжди → mint-скіп
    # тихо (WEB3_STRICT_MODE-гейт живий). Ця сітка періодично доверифіковує застряглі
    # pending — auto-heal, коли Hadron оживе.
    hadron_kyc_reverify:
      cron: '50 * * * *' # Щогодини о :50
      class: HadronKycReverifyWorker

    # --- ЦИКЛ АНКОР-ВІДНОВЛЕННЯ (The L1 Confirmation Net) [ARCH.66] ---
    # Backstop для EthereumAnchorConfirmationWorker: якщо поллер загинув до вичерпання
    # ретраїв (OOM під час ~3год поллінгу), anchor лишається :sent без escalate → re-arm
    # re-poll. Без цього double-anchor guard деградує до тижневого таймера. Anchor-обсяг
    # мізерний (1/тиждень) → hourly достатньо; :40 вільна від інших hourly recovery-кронів
    # (щодобовий filecoin_verification_sweep о 04:40 та */5-крони — інші класи/черги, без спільного lock).
    ethereum_anchor_reconcile:
      cron: '40 * * * *' # Щогодини о :40
      class: StuckSentAnchorSweeperWorker
