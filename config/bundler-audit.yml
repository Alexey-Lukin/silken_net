# SPDX-License-Identifier: AGPL-3.0-or-later
# Audit all gems listed in the Gemfile for known security problems by running bin/bundler-audit.
# CVEs that are not relevant to the application can be enumerated on the ignore list below.

ignore:
  # webrick 1.9.2 — CVE-2026-38969 / GHSA-h4w6-wx8r-p68v (WEBrick re-parses trailer).
  # TRANSITIVE via ferrum → cuprite → capybara (group :test ONLY). NOT in the prod serving
  # path: Puma serves production; webrick backs only the headless-Chrome system-test browser.
  # 1.9.2 is the latest release (no patch as of 2026-07-06); the trailer-reparse surface is
  # unreachable in test-only use. Review + drop this ignore when webrick >1.9.2 ships.
  - CVE-2026-38969
  - GHSA-h4w6-wx8r-p68v

  # rubyzip 2.4.1 — CVE-2026-85396 / GHSA-47m2-wp7j-p9vc (path traversal pre-3.4.0).
  # ⛔ ШЛЯХУ ВГОРУ НЕМАЄ: транзитивний через `rbsecp256k1 6.0.0`, який вимагає
  # `rubyzip (~> 2.3)`, а 6.0.0 — НАЙНОВІШИЙ реліз (перевірено `gem list --remote --all`).
  # Тобто 3.4.0 недосяжний, доки апстрім не послабить обмеження.
  #
  # 🔑 НЕДОСЯЖНІСТЬ ВИМІРЯНА, не припущена — і підстава сильніша за «build-time»:
  #   · `rubyzip` вантажиться РІВНО в одному місці — `ext/rbsecp256k1/extconf.rb`
  #     (`require 'zip'`), тобто у конфізі збірки нативного розширення; у нашому
  #     `app/`/`lib/`/`config/` згадок `Zip::`/`rubyzip` НУЛЬ;
  #   · вразливий патерн там справді є (`File.join(destination, f.name)` без гарда
  #     обходу), АЛЕ єдиний вхід у нього — архів, який `download` спершу проганяє
  #     через `verify_file(sha256: LIBSECP256K1_SHA256)` проти константи, зашитої
  #     в гемі. Тобто path traversal тут вимагає ЗЛАМАТИ SHA-256, а не підмінити
  #     CDN чи мережу. ⚠️ Архів саме ЗАВАНТАЖУЄТЬСЯ, не вендорений — і це важливо
  #     назвати правильно: захищає не «він лежить усередині гема», а контент-пін.
  #
  # ⏳ Тригер зняття: `rbsecp256k1` > 6.0.0 із послабленим `rubyzip`-обмеженням.
  # Дім спостереження — `00_07` OPS.22 (WATCH-рядок), не цей файл.
  - CVE-2026-85396
  - GHSA-47m2-wp7j-p9vc
