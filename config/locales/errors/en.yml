---
en:
  activerecord:
    errors:
      models:
        actuator_command:
          attributes:
            duration_seconds:
              exceeds_actuator_limit: exceeds the actuator safety ceiling (%{limit}s).
            expires_at:
              must_be_future: must be in the future
        bio_contract_firmware:
          attributes:
            bytecode_payload:
              exceeds_size_limit: 'exceeds the maximum payload length in HEX characters: %{count}'
              must_be_even_length_hex: must be a pure even-length HEX string (byte-aligned)
            compatible_hardware_versions:
              must_be_array: must be an array
              version_must_be_non_blank_string: every version must be a non-blank string
        gateway:
          attributes:
            uid:
              must_match_hardware_format: must match the hardware format (SNET-Q-XXXXXXXX)
        maintenance_record:
          attributes:
            photos:
              required_for_action_type: required for 'repair' and 'installation' action types (Trust Protocol)
        naas_contract:
          attributes:
            end_date:
              must_be_after_start: must be after the start date
        tiny_ml_model:
          attributes:
            accuracy_score:
              must_be_in_unit_range: must be in the 0..1 range
              must_be_numeric: must be a valid numeric value
            threshold:
              must_be_in_unit_range: must be in the 0..1 range
              must_be_numeric: must be a valid numeric value
        tree:
          attributes:
            did:
              must_match_hardware_format: must match the hardware format (SNET-XXXXXXXX)
  errors:
    api:
      bad_request: The request was missing something the Citadel needs. Go back and try again.
      bad_request_title: Malformed Request
      forbidden: Insufficient privileges for this evolution.
      forbidden_title: Access Denied
      internal: Core fault in the Ocean. Notify the Architect.
      internal_title: Core Fault
      missing_parameter: 'Missing required parameter: %{param}'
      no_organization: No organization assigned to this account.
      no_organization_title: Access Denied
      not_found: "%{model} not found in the forest matrix."
      not_found_title: Not Found
      unauthorized: Authentication required. The Gate is closed.
      validation_failed: The Citadel rejected these values. Return to the form and correct them.
      validation_failed_title: Validation Failed
    messages:
      invalid_eip55_checksum: has an invalid EIP-55 checksum (check the letter case)
      invalid_eth_address: must be a valid 0x address
    no_organization:
      body_1: Your account is not currently linked to any organization in the Forest Matrix. Without a Cluster, the Citadel cannot scope telemetry, wallets, or alerts.
      body_2: Contact your administrator to be onboarded into a cluster.
      body_2_super_admin: You have no home organization. Choose the context you want to act in.
      choose_organization: Choose an organization →
      heading: Quarantine
      sign_out: "← Sign Out"
      sign_out_aria: Sign out
      subtitle: No Organization Assigned
