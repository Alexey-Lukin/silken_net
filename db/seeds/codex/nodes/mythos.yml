  context_md: |
    У синтоїстській традиції — фізичний об'єкт (часто дерево), у
    якому тимчасово оселяється дух (камі); зазвичай маркується
    шіменавою — солом'яним мотузком з паперовими стрічками.
  cyber_meaning_md: |
