  subtitle_uk: Load Balancing
  subtitle_en: Load balancing
  archetype_key: load_balancing
  lifecycle_status: 0
  context_md: |
    Міфічне дерево східного моря у китайській традиції; на ньому
    жило десять сонць, що по черзі вилітали на небо.
  cyber_meaning_md: |
    Алгоритм черговості світіння десяти сонць, який вчить нас не
    спалити ефір колізіями даних.

