- slug: jianmu
  realm: mythos
  codex_uid: CDX-MYT-0001
  title_uk: Цзяньму (Світове дерево)
  title_en: Jianmu (World Tree)
  subtitle_uk: Кіберфізичний міст
  subtitle_en: Cyber-physical bridge
  archetype_key: cyber_physical_bridge
  lifecycle_status: 0
  context_md: |
    У давньокитайській космогонії — священне дерево, що з'єднувало
    Небо і Землю; за легендою, по ньому піднімалися імператори і
    шамани. Згадане у "Шан хай цзін".
  cyber_meaning_md: |
    Відновлення втраченого каналу зв'язку між Небом (аналітикою) та
    Землею (деревом) через наш титан.

- slug: fusang
