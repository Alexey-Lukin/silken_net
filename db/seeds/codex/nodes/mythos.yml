  archetype_key: universe_topology
  lifecycle_status: 0
  context_md: |
    Велетенський ясен у скандинавській міфології; тримає на собі
    дев'ять світів. Корені сягають Асгарду, Йотунхейму, Ніфльхейму.
  cyber_meaning_md: |
    Дерево як каркас реальності, де кожен світ — це окремий сегмент
