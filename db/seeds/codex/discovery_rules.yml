  threshold_value: 1
  active: true
  params: {}

- name: weekly-attunement-streak
  node_slug: protocol-ultrasonic-cavitation
  condition_type: attunement_streak_days
  threshold_value: 7
  active: true
  params: {}

- name: oracle-veteran
  node_slug: cherkasy-bir
  condition_type: oracle_dispatched
  threshold_value: 5
  active: true
  params: {}
