# SPDX-License-Identifier: AGPL-3.0-or-later
# =============================================================================
# Akash Network — SilkenNet Decentralized Deployment (SDL 2.0)
# =============================================================================
#
# This SDL defines a decentralized deployment of the SilkenNet Rails 8.1
# application on Akash Network — a permissionless (⚠️ «censorship-resistant» знято
# 2026-08-29: клас СЛОВО, мітка без вимірювача — 06_02 §5 і 00_07 ARCH.114)
# compute marketplace. It complements the existing Google Cloud (Kamal +
# Terraform) infrastructure by providing a decentralized alternative for
# the web/API layer while the database remains on Cloud SQL.
#
# ┌──────────────────────────────────────────────────────────────────────┐
# │                   Mapping: Kamal → Akash                            │
# │                                                                      │
# │  config/deploy.yml            →  deploy/akash/deploy.yaml           │
# │  servers.web                  →  services.web                       │
# │  boot.proxy.publish (80,443)  →  expose port 80 (global, HTTP)     │
# │  boot.proxy.publish (5683)    →  expose port 5683 (global, UDP)    │
# │  env.secret                   →  env (set before deploy)           │
# │  volumes                      →  persistent storage profile        │
# │  builder.arch: amd64          →  compute profile resources         │
# │  registry (Artifact Registry) →  image reference (GHCR public)        │
# └──────────────────────────────────────────────────────────────────────┘
#
# Usage:
#   # Set environment variables in this file or via Akash Console before deploy.
#   # Deploy with Akash CLI:
#   akash tx deployment create deploy/akash/deploy.yaml --from <wallet> --chain-id akashnet-2
#
#   # Or deploy via Terraform (see terraform/akash/):
#   cd terraform/akash && terraform apply
#
# Prerequisites:
#   - Docker image pushed to a public/accessible registry
#   - Cloud SQL Auth Proxy configured (built into Dockerfile, activated by
#     CLOUD_SQL_INSTANCE_CONNECTION_NAME env var — no public IP or VPN needed)
#   - AKT tokens in Akash wallet for deployment escrow
# =============================================================================

---
version: "2.0"

services:
  # ---------------------------------------------------------------------------
  # Web Service — Rails 8.1 Application (Puma + Thruster)
  # ---------------------------------------------------------------------------
  # Maps to: config/deploy.yml → servers.web
  #
  # Runs the production Docker image built by the same Dockerfile used with
  # Kamal. Thruster provides HTTP/2 reverse proxy; Puma handles Ruby workers.
  # Background jobs are processed by the job service below.
  web:
    image: ghcr.io/alexey-lukin/silken_net:latest
    # ⬆ GHCR (GitHub Container Registry) — publicly accessible to Akash providers.
    # Mirrored automatically by .github/workflows/mirror-ghcr.yml on every
    # push to main (after CI) and on GitHub Release.
    # For production, pin to a specific tag: ghcr.io/alexey-lukin/silken_net:v1.2.3
    # or sha-based: ghcr.io/alexey-lukin/silken_net:sha-abc1234
    # For Terraform-managed deployments, use deploy/akash/deploy.yaml.tpl instead.

    # --- Environment Variables -----------------------------------------------
    # Maps to: config/deploy.yml → env.secret + env.clear
    #
    # IMPORTANT: Replace placeholder values before deploying. In production,
    # use Akash Console UI or `akash tx deployment update` to inject secrets.
    # Never commit real secrets to this file.
    #
    # ⚠️ AKASH SECURITY NOTE: ENV variables are visible to the provider in plaintext
    # (Akash does not encrypt SDL ENV blocks). For long-lived deployments, prefer
    # Web3 keys with minimal on-chain permissions (e.g., MINTER_ROLE without
    # DEFAULT_ADMIN_ROLE), rotate keys on a 90-day cadence, and consider a Vault
    # sidecar for TRL 8+. See docs/06_02 § "Akash ENV plaintext exposure".
    env:
      # ════════════════════════════════════════════════════════════════════════
      # Application core — required for Rails to boot
      # ════════════════════════════════════════════════════════════════════════
      # Rails application port — Thruster listens on this port inside the
      # container. The Dockerfile EXPOSEs port 80 (Thruster default).
      # Maps to: Kamal boot.proxy.publish "80:80"
      - PORT=80

      # Rails production environment.
      - RAILS_ENV=production

      # Rails encrypted credentials master key.
      # Maps to: Kamal env.secret RAILS_MASTER_KEY
      - RAILS_MASTER_KEY=REQUIRED_SECRET_NOT_SET

      # PostgreSQL connection components (Rails-8 component style — config/database.yml).
      # Akash reaches Cloud SQL through the Auth Proxy at 127.0.0.1 (started by
      # bin/docker-entrypoint; tunnels via Google Cloud API — Akash allows outbound HTTPS).
      # host/user are non-secret; only POSTGRES_PASSWORD is injected as a secret. Port → 5432 default.
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_USER=silken_net
      - POSTGRES_PASSWORD=REQUIRED_SECRET_NOT_SET
      # DB SET selector (config/database.yml; defaults to silken_net_production if unset).
      # Explicit here so a canopy-on-Akash SDL just overrides to silken_net_canopy. [INF.16]
      - POSTGRES_DATABASE=silken_net_production

      # Cloud SQL Auth Proxy — connection name for the proxy to target.
      # Format: project-id:region:instance-name
      - CLOUD_SQL_INSTANCE_CONNECTION_NAME=REQUIRED_SECRET_NOT_SET

      # GCP Service Account key (base64-encoded JSON) for Cloud SQL Auth Proxy.
      # Generate: cat gcp-sa-key.json | base64 -w0
      - GCP_SA_KEY_BASE64=REQUIRED_SECRET_NOT_SET

      # Redis URL for Sidekiq background job processing (Upstash, TLS).
      # Format: rediss://default:password@endpoint.upstash.io:6379
      # Maps to: Kamal env.secret REDIS_URL
      - REDIS_URL=REQUIRED_SECRET_NOT_SET

      # KREDIS_REDIS_URL intentionally omitted — Kredis auto-derives it from REDIS_URL (DB 1)
      # via config/redis/shared.yml. A placeholder here ("REQUIRED_SECRET_NOT_SET") is truthy
      # to ENV.fetch and would override the derive → Kredis connects to garbage. [B1]

      # Puma thread count per worker — keep low (3-5) to limit GVL contention.
      - RAILS_MAX_THREADS=3

      # Puma concurrency — adjust based on 4 vCPU allocation.
      - WEB_CONCURRENCY=4
      # Mailer link host (production.rb action_mailer.default_url_options) — the host
      # INSIDE the message body. Transport and sender are separate, below.
      - APP_HOST=silkennet.com
      # --- 🛑 BOOT-CRITICAL: mail_transport_check.rb raises without MAIL_FROM + SMTP_ADDRESS.
      #     Plain SMTP, no vendor SDK — every ESP speaks it, so switching provider is these
      #     values and nothing else. The placeholder is NOT accepted: the guard checks shape
      #     (an address needs "@", a host cannot contain "_"), so it fails closed here. ---
      - MAIL_FROM=REQUIRED_SECRET_NOT_SET
      - SMTP_ADDRESS=REQUIRED_SECRET_NOT_SET
      - SMTP_USER_NAME=REQUIRED_SECRET_NOT_SET
      - SMTP_PASSWORD=REQUIRED_SECRET_NOT_SET
      # Telegram bot token [ARCH.60] — optional: the format check reads this placeholder as "off".
      - TELEGRAM_BOT_TOKEN=REQUIRED_SECRET_NOT_SET
      # [ARCH.81] Address the admin health panel probes over UDP — the SAME one a
      # Queen dials (`COAP_SERVER_HOST` in firmware/queen/main.c, A-record to the
      # Ingress Anchor per 06_01 step 1). The PRIMARY daemon does NOT live in this
      # deployment, so an unset value makes the panel say "not configured" rather
      # than claim the intake is dead.
      - COAP_HOST=api.silkennet.com

      # ════════════════════════════════════════════════════════════════════════
      # 🛑 BOOT-CRITICAL — Rails refuses to boot in production without this
      # ════════════════════════════════════════════════════════════════════════
      # HKDF root key for hardware provisioning. Guard in
      # config/initializers/master_key_strength_check.rb raises SecurityError at
      # `after_initialize` if blank/weak → Puma crashes before accept loop.
      # Maps to: Kamal env.secret PROVISIONING_MASTER_KEY
      - PROVISIONING_MASTER_KEY=REQUIRED_SECRET_NOT_SET

      # 🛑 BOOT-CRITICAL: active_record_encryption_keys_check.rb raises without these.
      # ActiveRecord Encryption keys decrypt hardware_keys + identities columns [SEC.22];
      # from ENV, never credentials.yml.enc. The 23-char placeholder is <32 chars, so the
      # guard fails closed until real >=32-char values are injected (bin/rails db:encryption:init).
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=REQUIRED_SECRET_NOT_SET
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=REQUIRED_SECRET_NOT_SET
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=REQUIRED_SECRET_NOT_SET

      # ════════════════════════════════════════════════════════════════════════
      # Observability
      # ════════════════════════════════════════════════════════════════════════
      # Sentry DSN — without it Sentry is inert and prod errors are silent.
      # Maps to: Kamal env.secret SENTRY_DSN
      - SENTRY_DSN=REQUIRED_SECRET_NOT_SET

      # RELEASE_VERSION deliberately OMITTED: a present-but-empty value feeds
      # Sentry `release=""` and kills its own autodetect (the KREDIS [B1]
      # empty-inject class). Inject the real git SHA / tag at deploy time
      # (Akash Console) to enable release tracking.

      # Basic Auth for /metrics — DELIBERATELY UNSET here: a committed
      # REQUIRED_SECRET_NOT_SET placeholder is NON-empty, so PrometheusCollector
      # would treat it as live credentials with a publicly-known value (B6
      # known-value bypass). Unset ⇒ auth-skip + private-IP allowlist only —
      # honest default. To enable auth, inject real random values via Akash
      # Console into BOTH web and alloy services in the same session:
      #   PROMETHEUS_AUTH_USER=… / PROMETHEUS_AUTH_PASSWORD=…

      # ════════════════════════════════════════════════════════════════════════
      # Web3 money/signing keys — DELIBERATELY ABSENT from the web container.
      # ════════════════════════════════════════════════════════════════════════
      # ORACLE_MINTER_PRIVATE_KEY / ORACLE_SLASHER_PRIVATE_KEY /
      # ORACLE_CELO_PRIVATE_KEY / ETHEREUM_ANCHOR_PRIVATE_KEY /
      # SOLANA_WALLET_KEYPAIR live ONLY in the `job` service: every signing call
      # site is a Sidekiq worker, and Akash SDL ENV is plaintext to the provider —
      # the internet-facing web surface must not carry money keys. Boot
      # presence-check is scoped to the signer process via
      # Security::Web3NetworkGuard (signer_process: Sidekiq.server?).
      # The legacy shared ORACLE_PRIVATE_KEY is RETIRED [INF.22] — the guard
      # refuses a value under that name anywhere.

      # ════════════════════════════════════════════════════════════════════════
      # RPC endpoints (Web3::RpcConnectionPool — required by ENV.fetch)
      # ════════════════════════════════════════════════════════════════════════
      - ALCHEMY_POLYGON_RPC_URL=REQUIRED_SECRET_NOT_SET
      - ALCHEMY_ETHEREUM_RPC_URL=REQUIRED_SECRET_NOT_SET
      - SOLANA_RPC_URL=REQUIRED_SECRET_NOT_SET
      # Separate from ALCHEMY_*: Celo rewards (CELO_RPC_URL).
      - CELO_RPC_URL=REQUIRED_SECRET_NOT_SET

      # ════════════════════════════════════════════════════════════════════════
      # Solana public identifiers (the signing keypair is job-only, see above)
      # ════════════════════════════════════════════════════════════════════════
      - SOLANA_FEE_PAYER_PUBKEY=REQUIRED_SECRET_NOT_SET
      - SOLANA_FEE_PAYER_TOKEN_ACCOUNT=REQUIRED_SECRET_NOT_SET
      - SOLANA_USDC_MINT_ADDRESS=REQUIRED_SECRET_NOT_SET

      # ════════════════════════════════════════════════════════════════════════
      # Webhook HMACs (web-only endpoints)
      # ════════════════════════════════════════════════════════════════════════
      # HMAC-SHA256 for X-Chainlink-Signature callbacks (dispatch removed — ARCH.53).
      - CHAINLINK_HMAC_SECRET=REQUIRED_SECRET_NOT_SET
      # HMAC-SHA256 for X-Helium-Signature on /api/v1/telemetry/helium (Queen SOS,
      # ARCH.34) — under WEB3_STRICT_MODE the controller raises without it.
      - HELIUM_WEBHOOK_SECRET=REQUIRED_SECRET_NOT_SET
      # Web3 fail-closed: Hadron KYC raises on missing creds + callback HMAC fail-fast (INF.11/SEC.5).
      - WEB3_STRICT_MODE=true
      # --- Web3 contract addresses (post-`forge deploy`; fill before first mint) ---
      # Public on-chain addresses (not secrets) but unknown until contracts deploy, so
      # NOT terraform-managed (deploy-order). Placeholder → fail-loud on use. docs/06_04 §2.1.
      - CARBON_COIN_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - FOREST_COIN_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - DAO_TREASURY_ADDRESS=REQUIRED_SECRET_NOT_SET
      - ETHEREUM_ANCHOR_CONTRACT=REQUIRED_SECRET_NOT_SET
      - PROTOCOL_PARAMETERS_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - CELO_CUSD_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - KLIMA_RETIREMENT_CONTRACT=REQUIRED_SECRET_NOT_SET
      - ETHERISC_DIP_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - PURO_EARTH_REGISTRY_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET

    # --- Exposed Ports -------------------------------------------------------
    # Maps to: config/deploy.yml → boot.proxy.publish
    expose:
      # HTTP — Rails web traffic via Thruster (HTTP/2 reverse proxy).
      # `service: alloy` gives the Alloy sidecar an INTERNAL route to
      # /metrics — without it the scrape would go through the public
      # ingress and die on the IP-allowlist 403 (INF.14).
      # Kamal equivalent: "80:80"
      - port: 80
        as: 80
        to:
          - global: true
          - service: alloy

      # HTTPS — TLS-terminated traffic for secure browser/API access.
      # Required for WebSocket (ActionCable) over HTTPS and browser security policies.
      # TLS termination is handled by Akash ingress (*.ingress.akash.pub)
      # or external Cloudflare proxy. Thruster handles HTTP/2 internally.
      # Kamal equivalent: "443:443"
      - port: 443
        as: 443
        to:
          - global: true

      # CoAP UDP 5683 lives on the dedicated `coap` service below (INF.17) —
      # Thruster/Puma never listen on UDP, so exposing it here was a black hole.

    # --- Persistent Storage --------------------------------------------------
    # Maps to: config/deploy.yml → volumes: "silken_net_storage:/rails/storage"
    #
    # WEB-ONLY volume — job/coap are separate containers with NO shared
    # filesystem (Akash has no cross-service volumes). Nothing critical
    # writes here today: Active Storage primary = S3 (+GCS mirror,
    # config/storage.yml), logs go to STDOUT. Any future feature needing
    # cross-process state must use Cloud Storage / Redis, not this path.
    params:
      storage:
        data:
          mount: /rails/storage
          readOnly: false

  # ---------------------------------------------------------------------------
  # Job Service — Sidekiq Background Worker (36+ workers)
  # ---------------------------------------------------------------------------
  # Maps to: config/deploy.yml → servers.job
  #
  # [PLAN 5.8]: Without this service, ALL 36+ Sidekiq workers are offline on
  # Akash: telemetry processing, Web3 minting, slashing, OTA, L1 anchoring,
  # alert notifications — none of them run. This is a critical functional gap.
  #
  # Runs the same Docker image but with Sidekiq as the entrypoint command
  # instead of Puma/Thruster. Uses the 9-queue strict priority configuration
  # from config/sidekiq.yml.
  job:
    image: ghcr.io/alexey-lukin/silken_net:latest
    command:
      - "/rails/bin/docker-entrypoint"
      - "bundle"
      - "exec"
      - "sidekiq"
      - "-C"
      - "config/sidekiq.yml"
    env:
      # REQUIRED: Replace placeholder values before deploying.
      # The `job` service runs Sidekiq workers — Web3 minting/burning/anchoring
      # all live here. Must mirror the `web` env: block (Rails initializers
      # require the same boot-critical guards), plus all Web3/Solana/Chainlink
      # secrets that workers fetch via ENV.fetch.
      # ⚠️ AKASH SECURITY NOTE: ENV vars are plaintext to providers — rotate
      # keys on a 90-day cadence; prefer scoped on-chain roles.

      # --- Application core ---
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=REQUIRED_SECRET_NOT_SET
      # PostgreSQL components (config/database.yml). Auth Proxy → 127.0.0.1; only password is a secret.
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_USER=silken_net
      - POSTGRES_PASSWORD=REQUIRED_SECRET_NOT_SET
      # DB SET selector (config/database.yml; defaults to silken_net_production if unset).
      # Explicit here so a canopy-on-Akash SDL just overrides to silken_net_canopy. [INF.16]
      - POSTGRES_DATABASE=silken_net_production
      - CLOUD_SQL_INSTANCE_CONNECTION_NAME=REQUIRED_SECRET_NOT_SET
      - GCP_SA_KEY_BASE64=REQUIRED_SECRET_NOT_SET
      - REDIS_URL=REQUIRED_SECRET_NOT_SET
      # KREDIS_REDIS_URL omitted — auto-derives from REDIS_URL (config/redis/shared.yml). [B1]
      - RAILS_MAX_THREADS=3
      # Sidekiq concurrency=15 (config/sidekiq.yml) → DB pool must match + headroom (default 5 starves).
      - DB_POOL=17
      # Mailer link host (production.rb) — deliver_later runs in Sidekiq.
      - APP_HOST=silkennet.com
      # --- 🛑 BOOT-CRITICAL: mail_transport_check.rb. This is the service that ACTUALLY
      #     delivers (deliver_later ⇒ Sidekiq); web only enqueues but is gated too, so the
      #     misconfiguration is visible on the surface an operator looks at first. ---
      - MAIL_FROM=REQUIRED_SECRET_NOT_SET
      - SMTP_ADDRESS=REQUIRED_SECRET_NOT_SET
      - SMTP_USER_NAME=REQUIRED_SECRET_NOT_SET
      - SMTP_PASSWORD=REQUIRED_SECRET_NOT_SET
      # Telegram bot token [ARCH.60] — optional: the format check reads this placeholder as "off".
      - TELEGRAM_BOT_TOKEN=REQUIRED_SECRET_NOT_SET

      # --- 🛑 BOOT-CRITICAL: master_key_strength_check.rb raises without this ---
      - PROVISIONING_MASTER_KEY=REQUIRED_SECRET_NOT_SET

      # --- 🛑 BOOT-CRITICAL: active_record_encryption_keys_check.rb raises without these ---
      # AR-Encryption keys (hardware_keys + identities columns) from ENV, not the vault [SEC.22].
      # Placeholder is <32 chars → guard fails closed until real values injected.
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=REQUIRED_SECRET_NOT_SET
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=REQUIRED_SECRET_NOT_SET
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=REQUIRED_SECRET_NOT_SET

      # --- Observability ---
      - SENTRY_DSN=REQUIRED_SECRET_NOT_SET
      # RELEASE_VERSION omitted — present-but-empty kills Sentry autodetect [B1];
      # inject the real value at deploy time.

      # --- Web3 oracle keys (BlockchainMintingService, BlockchainBurningService,
      #     Ethereum::StateAnchorService, Celo). Legacy shared ORACLE_PRIVATE_KEY
      #     RETIRED [INF.22] — never re-add it (guard tripwire refuses it).
      #     Aux signers (ORACLE_ETHERISC/PURO/KLIMA_PRIVATE_KEY) are deliberately
      #     NOT here: activation-gated lazy keys, injected via Akash Console when
      #     their path goes live (a placeholder would trip the guard format-check). ---
      # Dedicated Celo cUSD signer (ARCH.50).
      - ORACLE_CELO_PRIVATE_KEY=REQUIRED_SECRET_NOT_SET
      - ORACLE_MINTER_PRIVATE_KEY=REQUIRED_SECRET_NOT_SET
      - ORACLE_SLASHER_PRIVATE_KEY=REQUIRED_SECRET_NOT_SET
      - ETHEREUM_ANCHOR_PRIVATE_KEY=REQUIRED_SECRET_NOT_SET

      # --- RPC endpoints (Web3::RpcConnectionPool) ---
      - ALCHEMY_POLYGON_RPC_URL=REQUIRED_SECRET_NOT_SET
      - ALCHEMY_ETHEREUM_RPC_URL=REQUIRED_SECRET_NOT_SET
      - SOLANA_RPC_URL=REQUIRED_SECRET_NOT_SET
      # Separate from ALCHEMY_*: Celo rewards (CELO_RPC_URL).
      - CELO_RPC_URL=REQUIRED_SECRET_NOT_SET

      # --- Solana minting (SolanaMicroRewardWorker → Solana::MintingService) ---
      - SOLANA_WALLET_KEYPAIR=REQUIRED_SECRET_NOT_SET
      - SOLANA_FEE_PAYER_PUBKEY=REQUIRED_SECRET_NOT_SET
      - SOLANA_FEE_PAYER_TOKEN_ACCOUNT=REQUIRED_SECRET_NOT_SET
      - SOLANA_USDC_MINT_ADDRESS=REQUIRED_SECRET_NOT_SET

      # CHAINLINK_HMAC_SECRET is WEB-ONLY (oracle_callbacks_controller ingress) —
      # deliberately absent from job: zero worker/service consumers (verified). One
      # fewer money-adjacent secret on the job attack surface.
      # Web3 fail-closed: Hadron KYC raises on missing creds (INF.11/SEC.5).
      - WEB3_STRICT_MODE=true
      # --- Web3 contract addresses (post-`forge deploy`; fill before first mint) ---
      # Public on-chain addresses (not secrets) but unknown until contracts deploy, so
      # NOT terraform-managed (deploy-order). Placeholder → fail-loud on use. docs/06_04 §2.1.
      - CARBON_COIN_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - FOREST_COIN_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - DAO_TREASURY_ADDRESS=REQUIRED_SECRET_NOT_SET
      - ETHEREUM_ANCHOR_CONTRACT=REQUIRED_SECRET_NOT_SET
      - PROTOCOL_PARAMETERS_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - CELO_CUSD_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - KLIMA_RETIREMENT_CONTRACT=REQUIRED_SECRET_NOT_SET
      - ETHERISC_DIP_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET
      - PURO_EARTH_REGISTRY_CONTRACT_ADDRESS=REQUIRED_SECRET_NOT_SET

    # Embedded /metrics exporter (SilkenNet::MetricsExporter, Sidekiq
    # on(:startup) hook) — internal-only route for the Alloy scrape;
    # NOT published globally. See 06_03 §2.9.
    expose:
      - port: 9394
        as: 9394
        to:
          - service: alloy

  # ---------------------------------------------------------------------------
  # CoAP Service — UDP Telemetry Intake Daemon (INF.17)
  # ---------------------------------------------------------------------------
  # Maps to: config/deploy.yml → servers.coap
  #
  # Dedicated process for the CoAP/UDP listener (lib/daemons/coap_listener):
  # Queen gateways → Ingress Anchor (socat UDP relay) → this service → Redis
  # (UnpackTelemetryWorker via Sidekiq). Runs the same image; entrypoint starts
  # the Cloud SQL Auth Proxy, then the daemon. Deliberately NOT a puma thread —
  # UDP inside the web process would couple lifecycles (docs/03_02 §4).
  #
  # The INF.6 smoke gate (coap_smoke.yml) expects byte-exact replies from this
  # listener — without it every probe reads "UDP path dead".
  coap:
    image: ghcr.io/alexey-lukin/silken_net:latest
    command:
      - "/rails/bin/docker-entrypoint"
      - "bundle"
      - "exec"
      - "ruby"
      - "lib/daemons/coap_listener"
    env:
      # Boot-critical subset only: the daemon loads config/environment (all
      # initializers), parses PDUs and enqueues to Redis — no Web3 workers here.
      - RAILS_ENV=production
      - RAILS_MASTER_KEY=REQUIRED_SECRET_NOT_SET
      # PostgreSQL components (config/database.yml). Auth Proxy → 127.0.0.1; only password is a secret.
      - POSTGRES_HOST=127.0.0.1
      - POSTGRES_USER=silken_net
      - POSTGRES_PASSWORD=REQUIRED_SECRET_NOT_SET
      - POSTGRES_DATABASE=silken_net_production
      - CLOUD_SQL_INSTANCE_CONNECTION_NAME=REQUIRED_SECRET_NOT_SET
      - GCP_SA_KEY_BASE64=REQUIRED_SECRET_NOT_SET
      # Sidekiq enqueue target (UnpackTelemetryWorker.perform_async).
      - REDIS_URL=REQUIRED_SECRET_NOT_SET
      # KREDIS_REDIS_URL omitted — auto-derives from REDIS_URL (config/redis/shared.yml). [B1]
      # No PROVISIONING_MASTER_KEY — master_key_strength_check skips coap_listener
      # ($PROGRAM_NAME guard, code-proven): coap only enqueues, never derives keys. Keeping
      # the HKDF fleet-forge root off coap's plaintext /proc/environ [SEC.22]. Web/job carry it; coap must not.
      # 🛑 BOOT-CRITICAL: active_record_encryption_keys_check.rb raises without these.
      # AR-Encryption keys from ENV (SEC.22); placeholder <32 chars → guard fails closed.
      - ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY=REQUIRED_SECRET_NOT_SET
      - ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY=REQUIRED_SECRET_NOT_SET
      - ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT=REQUIRED_SECRET_NOT_SET
      # Crash reports for the daemon.
      - SENTRY_DSN=REQUIRED_SECRET_NOT_SET
      # RELEASE_VERSION omitted — present-but-empty kills Sentry autodetect [B1];
      # inject the real value at deploy time.
      # Consistency with web/job (INF.11) — no Web3 calls run here, but the flag
      # must never differ across surfaces.
      - WEB3_STRICT_MODE=true
    expose:
      # CoAP — UDP uplink for tree sensor telemetry (LoRa mesh → Queen → Akash).
      # Kamal equivalent: servers.coap options.publish "5683:5683/udp".
      # See: docs/03_02 §4 — CoAP binary telemetry.
      - port: 5683
        as: 5683
        proto: udp
        to:
          - global: true
      # Embedded /metrics exporter — internal-only route for the Alloy scrape.
      - port: 9395
        as: 9395
        to:
          - service: alloy

  # ---------------------------------------------------------------------------
  # Alloy Service — Grafana Alloy Metrics Agent (OBS.1)
  # ---------------------------------------------------------------------------
  # Lightweight sidecar that scrapes the Rails /metrics endpoint (web:80)
  # every 15s and pushes metrics to Grafana Cloud via Prometheus remote_write.
  # Resolves observability (Prometheus/Grafana/Alertmanager) from 06_03
  # (OBS.1) by using Grafana Cloud SaaS.
  #
  # Config is injected via base64-encoded env var (decoded at startup).
  # Source: deploy/akash/config.alloy
  alloy:
    image: grafana/alloy:v1.16.3
    env:
      # Deployment slot for the external_labels `slot` (config.alloy):
      # RAILS_ENV is "production" for BOTH slots, so without this a
      # canopy-on-Akash render would merge series with production's.
      # Override to "canopy" in a canopy render.
      - DEPLOYMENT_SLOT=production
      # REQUIRED: Grafana Cloud Prometheus remote_write endpoint.
      # Format: https://prometheus-prod-XX-prod-XX.grafana.net/api/prom/push
      - GRAFANA_REMOTE_WRITE_URL=REQUIRED_SECRET_NOT_SET
      # REQUIRED: Grafana Cloud instance ID (numeric).
      - GRAFANA_REMOTE_WRITE_USERNAME=REQUIRED_SECRET_NOT_SET
      # REQUIRED: Grafana Cloud API token with metrics:write scope.
      - GRAFANA_REMOTE_WRITE_TOKEN=REQUIRED_SECRET_NOT_SET
      # Basic Auth for scraping Rails /metrics — DELIBERATELY UNSET here (mirror
      # of the web-service note: committed placeholder = B6 known-value bypass).
      # Unset ⇒ Alloy scrapes without auth; the collector auth-skips when its own
      # pair is unset. Inject real values into BOTH web and alloy together.
      # Base64-encoded config.alloy (generated by Terraform or manually).
      - ALLOY_CONFIG_BASE64=REQUIRED_SECRET_NOT_SET
    command:
      - "/bin/sh"
      - "-c"
    args:
      - "mkdir -p /etc/alloy && echo $ALLOY_CONFIG_BASE64 | base64 -d > /etc/alloy/config.alloy && alloy run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy"

profiles:
  # ---------------------------------------------------------------------------
  # Compute Profile — Resource Allocation
  # ---------------------------------------------------------------------------
  # Akash IS the production Rails host — there is no GCP web machine to map to.
  # terraform/compute.tf provisions exactly one instance, the e2-small Ingress
  # Anchor (CoAP daemon + HAProxy); web/money-path stay decentralized by design.
  #
  # Akash allocation is 4 vCPU, 8 GB RAM, 50 GB ephemeral + 10 GB persistent —
  # CPU is set high to absorb variable provider performance on a decentralized
  # network, not to match some GCP baseline.
  compute:
    web:
      resources:
        cpu:
          units: 4
        memory:
          size: 8Gi
        storage:
          # Ephemeral storage for the application, gems, assets, and tmp files.
          # Maps to: Terraform web_disk_size_gb = 30 (expanded for container overhead)
          - size: 50Gi
          # Persistent storage for Active Storage uploads and Rails logs.
          # Survives container restarts. Equivalent to Kamal Docker volume.
          # Maps to: config/deploy.yml → volumes: "silken_net_storage:/rails/storage"
          - name: data
            size: 10Gi
            attributes:
              persistent: true
              class: beta3
    # [PLAN 5.8] Sidekiq worker — lower CPU but more memory for 15 threads × 31+ workers.
    job:
      resources:
        cpu:
          units: 2
        memory:
          size: 4Gi
        storage:
          - size: 20Gi
    # [INF.17] CoAP daemon — IO-bound single-threaded UDP listener with a full
    # Rails environment loaded. RAM dominated by the Rails boot (~0.5 GB);
    # storage fits the application image + logs. Scale ceiling ~10k nodes (E.5).
    coap:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 1Gi
        storage:
          - size: 10Gi
    # [OBS.1] Grafana Alloy — lightweight metrics agent. Minimal resources
    # sufficient for scraping /metrics every 15s and pushing to Grafana Cloud.
    alloy:
      resources:
        cpu:
          units: 0.5
        memory:
          size: 512Mi
        storage:
          - size: 1Gi

  # ---------------------------------------------------------------------------
  # Placement Profile — Provider Selection
  # ---------------------------------------------------------------------------
  # Maps to: Terraform region/zone variables (europe-west1-b)
  #
  # Akash does not have traditional "regions" — instead, providers self-report
  # attributes. The placement profile defines requirements and pricing limits.
  placement:
    silken-dcloud:
      # Provider attribute requirements — target reliable, audited providers.
      # Audited providers have been verified by the Akash community for uptime
      # and performance. This is the Akash equivalent of GCP's SLA guarantees.
      attributes:
        host: akash
        # [SEC.19] region: eu-west — data-in-use residency preference, OFF by default.
        # SELF-REPORTED, not audited (signedBy backs only host/tier/organization) → a
        # soft pool-narrowing preference, NOT a residency guarantee. Values mirror
        # 04_01 data_region (eu-west/eu-central). Rendered via tf-var akash_region
        # (empty = omitted) in deploy.yaml.tpl. Tradeoff + 👤 policy → 06_02 §1.3.
      signedBy:
        anyOf:
          # Akash official community auditor address (validated bech32; the prior
          # value was a corrupt 43-char string — INF.24). Confirm the live auditor
          # on-chain at deploy (`akash query audit`); source of truth:
          # https://github.com/akash-network/docs/blob/master/providers/akash-audited-attributes.md
          - akash1365yvmc4s7awdyj3n2sav7xfx76adc6dnmlx63
      pricing:
        web:
          # Maximum price per block (~6 seconds) in uAKT (micro-AKT).
          # 10000 uAKT ≈ 0.01 AKT per block.
          # Monthly cost ≈ 0.01 × 10 × 60 × 24 × 30 ÷ 1000000 ≈ variable.
          # Adjust based on current AKT price and provider market rates.
          # Monitor: https://stats.akash.network/
          denom: uakt
          amount: 10000
        job:
          denom: uakt
          amount: 5000
        coap:
          denom: uakt
          amount: 2000
        alloy:
          denom: uakt
          amount: 1000

deployment:
  # ---------------------------------------------------------------------------
  # Deployment Mapping — Service → Profile → Placement
  # ---------------------------------------------------------------------------
  # Ties the web service to its compute profile and placement constraints.
  # count: 1 = single instance (like Kamal's single web_node_count = 1).
  # Scale horizontally by increasing count (similar to Terraform web_node_count).
  web:
    silken-dcloud:
      profile: web
      count: 1
  job:
    silken-dcloud:
      profile: job
      count: 1
  coap:
    silken-dcloud:
      profile: coap
      count: 1
  alloy:
    silken-dcloud:
      profile: alloy
      count: 1
