# SPDX-License-Identifier: AGPL-3.0-or-later
# =============================================================================
# SilkenNet — Grafana Unified Alerting Rules
# =============================================================================
#
# Формат: Grafana Alerting provisioning YAML (Grafana 9+, Unified Alerting).
# Як застосувати: `ruby deploy/grafana/import.rb` (one-command; README поруч) —
# підставляє ${DATASOURCE_UID} у пам'яті й робить ідемпотентний upsert через
# Alerting Provisioning API. Fallback: UI Alerting → Alert rules → Import.
#
# Notification channel (налаштувати в Grafana Cloud вручну):
#   Alerting → Contact points → New: Slack / PagerDuty / Email
#   Alerting → Notification policies → Default policy → Contact point: <обраний>
#
# Datasource: плейсхолдер ${DATASOURCE_UID} — НЕ правити у цьому файлі;
#   import.rb знаходить UID сам (або env DATASOURCE_UID).
#
# 🔴 ЩО СПРАЦЮЄ НА ПОРОЖНЬОМУ СТЕКУ — читати ПЕРЕД першим імпортом (виміряно 2026-08-29).
# Переважна більшість правил несе `noDataState: OK`, тож на стеку без метрик вони
# мовчать. ЧОТИРИ несуть інше, і всі чотири почнуть сигналити з першої хвилини —
# не через дефект, а тому, що їхнє твердження ЗАРАЗ ПРАВДИВЕ (нічого не задеплоєно):
#   · sn-alert-scrape-target-down     (noData: Alerting) — СВІДОМО: «даних немає» і Є
#     подія («мета-алерт проти сліпоти»). Гасне з першим живим скрейпом.
#   · sn-alert-web3-queue-critical    (noData: NoData) — «не бачу черги».
#   · sn-alert-oracle-balance-critical(noData: NoData) — «не читаю баланс оракула».
#   · sn-alert-mint-stall-depth       (noData: NoData) — «зонд застряглої емісії не біжить».
# ⚠️ Наслідок для ПОРЯДКУ дій, а не для правил: імпорт БЕЗ contact point безпечний
# (правила сідають і мовчать у нікуди), а `ALERT_CONTACT_*` до першого деплою
# перетворює ці чотири на постійний потік — тобто вчить канал бути шумом ще до того,
# як зʼявиться перша справжня подія. Скрипт ІДЕМПОТЕНТНИЙ: контакт-поінт додається
# повторним прогоном тією ж командою, коли деплой відбувся.
#
# ⚖️ ПРИСУД founder 2026-08-30 — ХАЙ КРИЧАТЬ; глушити НЕ будемо. Контакт-поінт уже
# задротований, і ці чотири справді почали слати. Запропоновано Grafana Silence зі
# строком до дня деплою — ВІДХИЛЕНО. ⛔ Не перевідкривати: підстава в тому, що
# silence тут глушив би не шум, а рівно той сигнал, заради якого механізм
# будували, — «мовчання приладу є інцидентом». Глушник, поставлений ДО того, як
# прилад уперше заговорив, знімається вже після того, як до тиші звикли; а
# безстроковий ще й мовчатиме в день деплою — тобто саме тоді, коли ці чотири
# вперше стануть осмисленими.
# ⚠️ Ціна названа й прийнята свідомо, вона стоїть абзацом вище: канал учиться
# бути шумом до першої справжньої події. Приймаємо, бо альтернатива вчить гірше —
# що гард можна вимкнути, коли він незручний.
# =============================================================================

apiVersion: 1

groups:
  - orgId: 1
    name: silkennet-p0-critical
    folder: SilkenNet
    interval: 1m
    rules:
      
      # -----------------------------------------------------------------------
      # P0: CCM MIC verification failure (FW.2) — метрика роками НОСИЛА заяву
      # «any nonzero rate in production is a security signal worth paging on»
      # у власному докстрінгу й не мала жодного споживача, тоді як сусід
      # `w3bstream_signature_fallback_total` алертився. Асиметрію названо
      # поіменно в INF.26; закривається дротуванням споживача, не ремонтом.
      # Ненульовий rate = чужий ключ, підмінений ciphertext, покалічений AAD
      # або хибна пара DID/FrameCounter — жоден не лікується retry.
      # Поріг `gt 0` не шумить ЗА ПОБУДОВОЮ: CCM-шлях gated (TELEMETRY_CCM_ENABLED
      # default off), тож база нульова й перша ж подія справжня.
      # -----------------------------------------------------------------------
      - uid: sn-alert-ccm-mic-fail
        title: "🔴 CCM MIC verification failed (tamper / wrong key)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_telemetry_ccm_mic_fail_total[5m])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "CCM MIC не проходить перевірку ({{ $values.A.Value }}/s) — можливий tamper або розʼїхані ключі."
          description: "FW.2 CCM-кадр не пройшов MIC: чужий ключ, підмінений ciphertext, покалічений AAD або хибна пара DID/FrameCounter. Retry не лікує ЖОДНОЇ з причин. Звір ротацію session KEYL (FW.17) і Dual-Key Grace на пристрої; сплеск по одному DID = кандидат на tamper, по багатьох = розʼїхана ротація. 03_05 §3.1 / FW.2."
          runbook_url: "docs/03_05_Hardware_Symmetric_Crypto_and_Security.md"
        labels:
          severity: critical
          component: telemetry
          team: ops

      # -----------------------------------------------------------------------
      # P0: PartitionMaintenanceWorker failure — silent monthly PG-crash guard
      # (06_03 §2.8 / S2.5). Without a new-month partition, the first INSERT on
      # day-1 crashes with `no partition of relation` for all 3 RANGE tables.
      # -----------------------------------------------------------------------
      - uid: sn-alert-partition-maintenance-failed
        title: "🔴 Partition maintenance failed (day-1 INSERT crash risk)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "increase(silkennet_partition_maintenance_failures_total[24h])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "PartitionMaintenanceWorker провалився ({{ $values.A.Value }}× за 24h) — партиція наступного місяця може бути відсутня."
          description: "Без партиції на новий місяць перший INSERT 1-го числа впаде з `no partition of relation` (telemetry_logs / gateway_telemetry_logs / blockchain_transactions). Sidekiq retry:3 + Sentry активні. Перевірити DDL-права оракула / disk / cron. 06_03 §2.8 (S2.5)."
        labels:
          severity: critical
          component: database
          team: ops

      # -----------------------------------------------------------------------
      # P0: web3_critical queue overflow — мінтинг SCC заблокований
      # -----------------------------------------------------------------------
      - uid: sn-alert-web3-queue-critical
        title: "🔴 web3_critical queue overflow (SCC minting blocked)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              # max: Redis-global gauge — guard against duplicate series if a
              # second scrape target ever samples it (06_03 §2.9).
              expr: max by (slot) (silkennet_sidekiq_queue_size{queue="web3_critical"})
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [100], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "web3_critical queue = {{ $values.A.Value }} jobs (>100). SCC minting pipeline заблокований."
          description: "Черга web3_critical переповнена. Chainlink/IoTeX workers не встигають дренувати. Перевір: Sidekiq workers running, Web3 RPC healthy, no poison pill job."
          runbook_url: "docs/04_02_Business_Logic_and_Services.md#blockchainmintingservice"
        labels:
          severity: critical
          component: sidekiq
          team: backend

      # -----------------------------------------------------------------------
      # P0: Fraud detected — атака або hardware tamper
      # -----------------------------------------------------------------------
      - uid: sn-alert-fraud-detected
        title: "🔴 Telemetry fraud detected"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_telemetry_fraud_detected_total[5m])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Fraud rate = {{ $values.A.Value | printf \"%.4f\" }}/s. Можлива атака або hardware tamper."
          description: "TelemetryUnpackerService відхилив пакети: sensor noise, unknown DID, DCI mismatch (Lorenz Z divergence) або invalid AES decrypt. Перевір: чи це відомий новий Soldier (треба provisioning), чи mass replay attack."
          runbook_url: "docs/05_02_Proof_of_Growth_Pipeline.md"
        labels:
          severity: critical
          component: telemetry
          team: security

      # -----------------------------------------------------------------------
      # P0: Oracle balance ratio критично низький
      # -----------------------------------------------------------------------
      - uid: sn-alert-oracle-balance-critical
        title: "🔴 Oracle wallet balance critically low"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: silkennet_oracle_balance_ratio
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0.2], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Oracle balance ratio = {{ $values.A.Value | printf \"%.2f\" }} на {{ $labels.network }}/{{ $labels.signer }} (поріг: 1.0, критично: < 0.2)."
          description: "Oracle-підписант ({{ $labels.signer }}) вичерпує кошти. Його web3-шлях заблокується при 0. Поповни wallet через multisig: docs/05_03_Tokenomics_SCC_and_SFC.md"
          runbook_url: "docs/05_03_Tokenomics_SCC_and_SFC.md#-потік-мінтингу-поточний-стан"
        labels:
          severity: critical
          component: web3
          team: ops

      # -----------------------------------------------------------------------
      # P0: Insurance reserve-gate HOLD [INS.2/ARCH.82]
      #
      # ⚖️ founder 2026-08-14: цей рід алертів має ОДИН канал, і це Grafana — HOLD
      # означає «емісія зупинена казначейською політикою», тобто читач тут оператор,
      # а не орендар. Причина, чому канал потрібен окремо: сам `EwsAlert` пишеться БЕЗ
      # кластера, а `Organization has_many :ews_alerts, through: :clusters` — це INNER
      # JOIN, тож на орг-поверхнях рядок не існує; а `manual_review`-gauge, куди HOLD
      # теж потрапляє, не розрізняє його від double-spend-лімбо (ARCH.45), і відповіді
      # на ці два стани протилежні.
      #
      # ⚠️ Тракт інертний до калібрування порогів INS.2 (обидва `SystemParameter`
      # default 0 → gate завжди :ok), тож правило штатно мовчить. Заведене НАПЕРЕД
      # навмисно: інакше перший же HOLD у деплой-день SEC.1 став би невидимим і
      # незакриваним одночасно.
      # -----------------------------------------------------------------------
      - uid: sn-alert-insurance-reserve-hold
        title: "🔴 Insurance payout held by the reserve gate"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: increase(silkennet_insurance_reserve_hold_total[1h])
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "{{ $values.A.Value | printf \"%.0f\" }} страхових виплат зупинено reserve-gate за годину (причина: {{ $labels.reason }})."
          description: "Internal-mode виплата мінтить НОВИЙ SCC, тож gate спинив емісію: aggregate 24h correlated stop-loss або reserve-adequacy проти DAO_TREASURY. Заявки лежать у manual_review — звір подію ПЕРЕД ручним резолвом; це не збій, а спрацювання політики. Поріг transient-RPC (:eval_error) сюди НЕ потрапляє — той шлях іде в Sidekiq-retry."
          runbook_url: "docs/00_04_Nature_as_a_Service_Contracts.md#-7-параметричне-страхування-insurance-layer"
        labels:
          severity: critical
          component: web3
          team: ops

      # -----------------------------------------------------------------------
      # P0: Panic replay attack spike
      # -----------------------------------------------------------------------
      - uid: sn-alert-panic-replay
        title: "🔴 Panic packet replay attack detected"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_panic_replay_rejected_total[5m])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0.1], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Panic replay rate = {{ $values.A.Value | printf \"%.4f\" }}/s. Можливий forged panic packet injection."
          description: "SEC.10 Frame Counter SETNX nonce відхиляє дублікати. Різкий стрибок означає або attacker (replay forged panic = false fire alert) або LoRa mesh duplicate storm. Перевір DID pattern."
          runbook_url: "docs/03_05_Hardware_Symmetric_Crypto_and_Security.md#21-soldier--queen-lora-uplink-aes-128-ecb-transitional--aes-128-ccm-target"
        labels:
          severity: critical
          component: security
          team: security

      # -----------------------------------------------------------------------
      # P0: Scrape target down — метрики «осліпли» (S2.4 / 06_03 §2.9).
      # Таргетів ТРИ (silken-web:80 / silken-job:9394 / silken-coap:9395 — DNS-аліаси ролей
      # у docker-мережі kamal, ⚖️ OPS.37 2026-08-30) — min by (process) називає
      # КОТРИЙ саме впав; job=0 значить money-path SLO-лічильники більше не
      # надходять (алерти нижче тихо гаснуть — це мета-алерт проти сліпоти).
      # coap-таргет = ДОРМАНТНА Kamal-роль `coap` (fallback до systemd-демона на
      # анкорі, який і є PRIMARY і лежить поза scrape — 06_03 §2.9(б)); його up=0
      # сигналить падіння fallback-ролі, НЕ втрату інтейку телеметрії.
      # -----------------------------------------------------------------------
      - uid: sn-alert-scrape-target-down
        title: "🔴 Metrics scrape target down (observability blind)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: 'min by (slot, process) (up{job="silken_net_scraper"})'
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "Scrape-таргет {{ $labels.process }} down ≥5m — його метрики в Grafana заморожені."
          description: "Alloy не може зняти /metrics з процесу {{ $labels.process }}. job=0 → money-path/telemetry-лічильники осліпли (P0-алерти на них тихо гаснуть). Перевір роль (`kamal app details`), embedded-експортер (MetricsExporter), network-alias ролі в config/deploy.yml (silken-web/-job/-coap) і чи біжить accessory (`kamal accessory details alloy`). 06_03 §2.9. NoData → Alerting: зникнення УСІХ up-серій = сам Alloy впав."
        labels:
          severity: critical
          component: observability
          team: ops

      # -----------------------------------------------------------------------
      # P0: Queen offline — dead-man switch спрацював (ARCH.54 Шар 0).
      # Кластер без uplink: телеметрія дерев не надходить, permanence-нагляд
      # NaaS провис. Джерело: GatewayStalenessSweepWorker (06_08 §1.3).
      # (Перенесено з p2-info групи 2026-07-04 — P0-правило жило в info-фолдері.)
      # -----------------------------------------------------------------------
      - uid: sn-alert-gateway-faulty
        title: "🔴 Queen offline (gateway faulty — cluster blind)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: silkennet_gateways_faulty
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $values.A.Value }} Королев(а) у faulty — кластер(и) без uplink."
          description: "GatewayStalenessSweepWorker перевів шлюз(и) у faulty (last_seen_at прострочив sleep-інтервал ×1.2) і створив EwsAlert(queen_offline). Деталі — стрічка EWS кластера; відновлення автоматичне (recover) при поверненні в ефір. 06_08 §1.3 / ARCH.54."
        labels:
          severity: critical
          component: gateway
          team: ops

      # -----------------------------------------------------------------------
      # P0: db↔on-chain SCC drift [G2]. ChainAuditService |Σmints−Σburns − totalSupply|.
      # Ненульова дельта = ledger-баг або несанкціонований on-chain mint/burn.
      # -----------------------------------------------------------------------
      - uid: sn-alert-chain-audit-drift
        title: "🔴 SCC ledger drift (DB total ≠ on-chain totalSupply)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: max by (slot) (silkennet_chain_audit_delta)
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0.0001], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "SCC drift = {{ $values.A.Value | printf \"%.4f\" }} (DB mints−burns vs on-chain totalSupply)."
          description: "ChainAuditService виявив розбіжність DB-обліку SCC і on-chain totalSupply понад поріг. Можливий ledger-баг, пропущений confirm/fail, або несанкціонований on-chain mint/burn. Звір ChainAuditService.call, останні confirmed mint/slash tx. 05_02 / 05_03."
          runbook_url: "docs/05_03_Tokenomics_SCC_and_SFC.md"
        labels:
          severity: critical
          component: web3
          team: ops

  # ---------------------------------------------------------------------------
  - orgId: 1
    name: silkennet-p1-warning
    folder: SilkenNet
    interval: 1m
    rules:
      
      # -----------------------------------------------------------------------
      # P1: партиційний промах у lookup'ах — ОБИДВА носії класу (INF.26).
      # Обидві метрики носили ГОТОВЕ Grafana-правило у власному коментарі
      # ініціалізатора, якого ніхто не переніс у yaml; вирази взято ЗВІДТИ
      # дослівно, щоб yaml не міг розійтися з кодом-джерелом.
      # ⚠️ Стеля названа: у telemetry-виразі фільтр `caller` уже несе присуд
      # «cold paths acceptable, hot paths page», а money-двійник фільтра НЕ
