# =============================================================================
# SilkenNet — Grafana Unified Alerting Rules
# =============================================================================
#
# Формат: Grafana Alerting provisioning YAML (Grafana 9+, Unified Alerting).
# Як застосувати: `ruby deploy/grafana/import.rb` (one-command; README поруч) —
# підставляє ${DATASOURCE_UID} у пам'яті й робить ідемпотентний upsert через
# Alerting Provisioning API. Fallback: UI Alerting → Alert rules → Import.
#
# Notification channel (налаштувати в Grafana Cloud вручну):
#   Alerting → Contact points → New: Slack / PagerDuty / Email
#   Alerting → Notification policies → Default policy → Contact point: <обраний>
#
# Datasource: плейсхолдер ${DATASOURCE_UID} — НЕ правити у цьому файлі;
#   import.rb знаходить UID сам (або env DATASOURCE_UID).
# =============================================================================

apiVersion: 1

groups:
  - orgId: 1
    name: silkennet-p0-critical
    folder: SilkenNet
    interval: 1m
    rules:

      # -----------------------------------------------------------------------
      # P0: PartitionMaintenanceWorker failure — silent monthly PG-crash guard
      # (06_03 §2.8 / S2.5). Without a new-month partition, the first INSERT on
      # day-1 crashes with `no partition of relation` for all 4 RANGE tables.
      # -----------------------------------------------------------------------
      - uid: sn-alert-partition-maintenance-failed
        title: "🔴 Partition maintenance failed (day-1 INSERT crash risk)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "increase(silkennet_partition_maintenance_failures_total[24h])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "PartitionMaintenanceWorker провалився ({{ $values.A.Value }}× за 24h) — партиція наступного місяця може бути відсутня."
          description: "Без партиції на новий місяць перший INSERT 1-го числа впаде з `no partition of relation` (telemetry_logs / gateway_telemetry_logs / blockchain_transactions / codex_matches). Sidekiq retry:3 + Sentry активні. Перевірити DDL-права оракула / disk / cron. 06_03 §2.8 (S2.5)."
        labels:
          severity: critical
          component: database
          team: ops

      # -----------------------------------------------------------------------
      # P0: web3_critical queue overflow — мінтинг SCC заблокований
      # -----------------------------------------------------------------------
      - uid: sn-alert-web3-queue-critical
        title: "🔴 web3_critical queue overflow (SCC minting blocked)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              # max: Redis-global gauge — guard against duplicate series if a
              # second scrape target ever samples it (06_03 §2.9).
              expr: max(silkennet_sidekiq_queue_size{queue="web3_critical"})
              intervalMs: 1000
              maxDataPoints: 43200
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [100], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "web3_critical queue = {{ $values.A.Value }} jobs (>100). SCC minting pipeline заблокований."
          description: "Черга web3_critical переповнена. Chainlink/IoTeX workers не встигають дренувати. Перевір: Sidekiq workers running, Web3 RPC healthy, no poison pill job."
          runbook_url: "docs/04_02_Business_Logic_and_Services.md#BlockchainMintingService"
        labels:
          severity: critical
          component: sidekiq
          team: backend

      # -----------------------------------------------------------------------
      # P0: Fraud detected — атака або hardware tamper
      # -----------------------------------------------------------------------
      - uid: sn-alert-fraud-detected
        title: "🔴 Telemetry fraud detected"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_telemetry_fraud_detected_total[5m])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Fraud rate = {{ $values.A.Value | printf \"%.4f\" }}/s. Можлива атака або hardware tamper."
          description: "TelemetryUnpackerService відхилив пакети: sensor noise, unknown DID, DCI mismatch (Lorenz Z divergence) або invalid AES decrypt. Перевір: чи це відомий новий Soldier (треба provisioning), чи mass replay attack."
          runbook_url: "docs/05_02_Proof_of_Growth_Pipeline.md"
        labels:
          severity: critical
          component: telemetry
          team: security

      # -----------------------------------------------------------------------
      # P0: Oracle balance ratio критично низький
      # -----------------------------------------------------------------------
      - uid: sn-alert-oracle-balance-critical
        title: "🔴 Oracle wallet balance critically low"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: silkennet_oracle_balance_ratio
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0.2], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          summary: "Oracle balance ratio = {{ $values.A.Value | printf \"%.2f\" }} на мережі {{ $labels.network }} (поріг: 1.0, критично: < 0.2)."
          description: "Oracle wallet вичерпує кошти. Мінтинг SCC заблокується при 0. Поповни wallet через multisig: docs/05_03_Smart_Contracts_and_Tokenomics.md"
          runbook_url: "docs/05_03_Smart_Contracts_and_Tokenomics.md#OracleBalance"
        labels:
          severity: critical
          component: web3
          team: ops

      # -----------------------------------------------------------------------
      # P0: Panic replay attack spike
      # -----------------------------------------------------------------------
      - uid: sn-alert-panic-replay
        title: "🔴 Panic packet replay attack detected"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_panic_replay_rejected_total[5m])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0.1], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Panic replay rate = {{ $values.A.Value | printf \"%.4f\" }}/s. Можливий forged panic packet injection."
          description: "SEC.10 Frame Counter SETNX nonce відхиляє дублікати. Різкий стрибок означає або attacker (replay forged panic = false fire alert) або LoRa mesh duplicate storm. Перевір DID pattern."
          runbook_url: "docs/03_05_Hardware_AES256_and_Security.md#SEC10"
        labels:
          severity: critical
          component: security
          team: security

      # -----------------------------------------------------------------------
      # P0: Scrape target down — метрики «осліпли» (S2.4 / 06_03 §2.9).
      # Таргетів ТРИ (web:80 / job:9394 / coap:9395) — min by (process) називає
      # КОТРИЙ саме впав; job=0 значить money-path SLO-лічильники більше не
      # надходять (алерти нижче тихо гаснуть — це мета-алерт проти сліпоти).
      # coap-таргет = Akash-fallback-сервіс (primary-демон на анкорі поза
      # scrape — 06_03 §2.9(б)); його up=0 сигналить падіння fallback-сервісу.
      # -----------------------------------------------------------------------
      - uid: sn-alert-scrape-target-down
        title: "🔴 Metrics scrape target down (observability blind)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: 'min by (process) (up{job="silken_net_scraper"})'
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [1], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: Alerting
        execErrState: Error
        for: 5m
        annotations:
          summary: "Scrape-таргет {{ $labels.process }} down ≥5m — його метрики в Grafana заморожені."
          description: "Alloy не може зняти /metrics з процесу {{ $labels.process }}. job=0 → money-path/telemetry-лічильники осліпли (P0-алерти на них тихо гаснуть). Перевір lease сервісу, embedded-експортер (MetricsExporter), service-scope route to: alloy. 06_03 §2.9. NoData → Alerting: зникнення УСІХ up-серій = сам Alloy впав."
        labels:
          severity: critical
          component: observability
          team: ops

      # -----------------------------------------------------------------------
      # P0: Queen offline — dead-man switch спрацював (ARCH.54 Шар 0).
      # Кластер без uplink: телеметрія дерев не надходить, permanence-нагляд
      # NaaS провис. Джерело: GatewayStalenessSweepWorker (06_08 §1.3).
      # (Перенесено з p2-info групи 2026-07-04 — P0-правило жило в info-фолдері.)
      # -----------------------------------------------------------------------
      - uid: sn-alert-gateway-faulty
        title: "🔴 Queen offline (gateway faulty — cluster blind)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: silkennet_gateways_faulty
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "{{ $values.A.Value }} Королев(а) у faulty — кластер(и) без uplink."
          description: "GatewayStalenessSweepWorker перевів шлюз(и) у faulty (last_seen_at прострочив sleep-інтервал ×1.2) і створив EwsAlert(queen_offline). Деталі — стрічка EWS кластера; відновлення автоматичне (recover) при поверненні в ефір. 06_08 §1.3 / ARCH.54."
        labels:
          severity: critical
          component: gateway
          team: ops

  # ---------------------------------------------------------------------------
  - orgId: 1
    name: silkennet-p1-warning
    folder: SilkenNet
    interval: 1m
    rules:

      # -----------------------------------------------------------------------
      # P1: RPC errors spike
      # -----------------------------------------------------------------------
      - uid: sn-alert-rpc-errors
        title: "⚠️ Web3 RPC error spike"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_rpc_errors_total[5m]) * 60"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [10], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "RPC errors = {{ $values.A.Value | printf \"%.1f\" }}/хв на {{ $labels.network }} / {{ $labels.error_type }}."
          description: "RPC провайдер деградує. Перевір: Alchemy status page, circuit breaker state (silkennet_rpc_circuit_breaker_open). При відкритому circuit breaker — fallback RPC може бути також нестабільний."
        labels:
          severity: warning
          component: web3
          team: backend

      # -----------------------------------------------------------------------
      # P1: Sidekiq queue latency > 5 min
      # -----------------------------------------------------------------------
      - uid: sn-alert-sidekiq-latency
        title: "⚠️ Sidekiq queue latency high (oldest job > 5 min)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              # max by (queue): Redis-global gauge — duplicate-series guard (06_03 §2.9).
              expr: max by (queue) (silkennet_sidekiq_queue_latency_seconds)
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [300], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Sidekiq queue {{ $labels.queue }} latency = {{ $values.A.Value | printf \"%.0f\" }}s (> 5 хв)."
          description: "Найстаріша задача в черзі {{ $labels.queue }} не виконується > 5 хвилин. Можливі причини: Sidekiq worker crashed, poison pill job, RPC timeout loop."
        labels:
          severity: warning
          component: sidekiq
          team: backend

      # -----------------------------------------------------------------------
      # P1: Sidekiq DeadSet non-empty — job exhausted all retries [ARCH.45].
      # Money-path job (mint/slash/Solana payout/insurance) у DeadSet = stranded
      # funds/tx без авто-відновлення (in-flight guard не діє — job уже не в черзі)
      # → потребує ручної звірки. 06_03 §2.8 money-path SLO.
      # -----------------------------------------------------------------------
      - uid: sn-alert-sidekiq-deadset
        title: "⚠️ Sidekiq DeadSet non-empty (job exhausted retries)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              # max: Redis-global gauge — duplicate-series guard (06_03 §2.9).
              expr: max(silkennet_sidekiq_dead_set_size)
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Sidekiq DeadSet = {{ $values.A.Value | printf \"%.0f\" }} job(s) вичерпали retry."
          description: "Job(и) вичерпали всі retry і осіли в DeadSet. Money-path (mint/slash/Solana payout/insurance) тут = можливі stranded funds/tx без авто-відновлення (in-flight guard не діє — job не в черзі). Перевір Sidekiq Web UI → Dead, звір money-path tx у :pending/:sent. ARCH.45 / 06_03 §2.8."
          runbook_url: "docs/05_02_Proof_of_Growth_Pipeline.md"
        labels:
          severity: warning
          component: sidekiq
          team: ops

      # -----------------------------------------------------------------------
      # P1: RPC Circuit Breaker Open
      # -----------------------------------------------------------------------
      - uid: sn-alert-circuit-breaker
        title: "⚠️ RPC circuit breaker open"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: silkennet_rpc_circuit_breaker_open
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                # gauge = 1.0 when breaker open (resilient_client set_circuit_breaker_gauge); gt 0 fires, gt 1 never would
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "Circuit breaker OPEN для провайдера {{ $labels.provider }}. Fallback RPC активний."
          description: "Web3::ResilientClient вимкнув провайдер {{ $labels.provider }} після 3 consecutive failures. Fallback URL активний. Перевір provider status page та відновлення."
        labels:
          severity: warning
          component: web3
          team: backend

      # -----------------------------------------------------------------------
      # P1: Cluster entropy pre-stress signal
      # -----------------------------------------------------------------------
      - uid: sn-alert-cluster-entropy
        title: "⚠️ Forest cluster pre-stress (low entropy)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: silkennet_cluster_entropy_score
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0.65], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 30m
        annotations:
          summary: "Кластер {{ $labels.cluster_id }} — ентропія {{ $values.A.Value | printf \"%.3f\" }} (< 0.65 = передстресовий сигнал)."
          description: "Shannon entropy Z-розподілу кластера низька. Можливі причини: drought, pest epidemic, synchronized stress event. Ліс потребує перевірки форестером. EwsAlert може бути відправлений незабаром."
        labels:
          severity: warning
          component: forest
          team: ops

      # -----------------------------------------------------------------------
      # P1: Acoustic overflow (firmware data loss)
      # -----------------------------------------------------------------------
      - uid: sn-alert-acoustic-overflow
        title: "⚠️ Acoustic sensor overflow (firmware data loss)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_telemetry_acoustic_overflow_total[5m])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Acoustic overflow rate = {{ $values.A.Value | printf \"%.4f\" }}/s. Firmware uint8 saturated at 255."
          description: "Дерева фіксують > 255 акустичних подій між TX-циклами (uint8 cap). Реальна кількість chainsaw/cavitation подій вища — дані втрачені. Можлива chainsaw activity. FW.22 saturating counter активний."
        labels:
          severity: warning
          component: firmware
          team: backend

      # -----------------------------------------------------------------------
      # P1: TinyML OTA-threshold rejections (FW.18b — corrupted RTC / malicious OTA)
      # -----------------------------------------------------------------------
      - uid: sn-alert-tinyml-threshold-invalid
        title: "⚠️ TinyML OTA thresholds rejected (corrupted RTC / malicious OTA)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_tinyml_threshold_invalid_reports_total[15m])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Soldier(и) звітують відкинуті OTA-пороги TinyML (rate = {{ $values.A.Value | printf \"%.4f\" }}/s)."
          description: "TinyML_Validate_Threshold відкинув OTA-пороги (NaN / out-of-range / інверсія WARNING≥CRITICAL) → застосовано default, інваріант SILENCE<WARNING<CRITICAL збережено. Ненульовий лічильник = десь у лісі корумпований RTC або зловмисний OTA-payload. Конкретний DID і значення лічильника — у warn-лозі бекенда (TelemetryUnpackerService, патерн FW.22)."
          runbook_url: "docs/03_03_TinyML_Acoustic_Inference.md"
        labels:
          severity: warning
          component: firmware
          team: security

      # -----------------------------------------------------------------------
      # P1: Mint SLO breach — «≥80% mint success during a single chain outage»
      # (канонічна ціль 06_08 §2.4; вимірювання = success/attempts за 1h вікно).
      # PromQL-guard `and (attempts > 0)`: без спроб вираз порожній → NoData →
      # OK (тихий ліс без мінтів ≠ SLO-порушення). Slash/payout/insurance
      # ratios канонічної цілі ще не мають — пороги калібруються з перших
      # live-вікон (00_07 S2.4), тут свідомо не вигадуються.
      # -----------------------------------------------------------------------
      - uid: sn-alert-mint-slo-breach
        title: "🟠 Mint SLO breach (<80% success over 1h)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: '(sum(increase(silkennet_mint_success_total[1h])) / sum(increase(silkennet_mint_attempts_total[1h]))) and (sum(increase(silkennet_mint_attempts_total[1h])) > 0)'
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0.8], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 10m
        annotations:
          summary: "Mint success-rate за 1h = {{ $values.A.Value | printf \"%.0f%%\" }} (<80% SLO)."
          description: "SLO 06_08 §2.4: ≥80% mint-спроб мають broadcast'итись навіть при відмові одного чейна (Per-Chain Fallback Matrix). Нижче — перевір RPC-здоровʼя (circuit breakers), web3_critical чергу, DeadSet, газ на Oracle-гаманцях."
        labels:
          severity: warning
          component: web3
          team: backend

  # ---------------------------------------------------------------------------
  - orgId: 1
    name: silkennet-p2-info
    folder: SilkenNet
    interval: 5m
    rules:

      # -----------------------------------------------------------------------
      # P2: Oracle balance warning (before critical)
      # -----------------------------------------------------------------------
      - uid: sn-alert-oracle-balance-warning
        title: "ℹ️ Oracle wallet balance low"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: silkennet_oracle_balance_ratio
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [1.0], type: lt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 15m
        annotations:
          summary: "Oracle balance ratio = {{ $values.A.Value | printf \"%.2f\" }} на {{ $labels.network }} (нижче мінімального порогу)."
          description: "Баланс oracle wallet нижче мінімуму. Ще не критично, але потребує поповнення до виснаження."
        labels:
          severity: info
          component: web3
          team: ops

      # -----------------------------------------------------------------------
      # P2: DB pool saturation warning
      # -----------------------------------------------------------------------
      - uid: sn-alert-db-pool-saturation
        title: "ℹ️ Database connection pool saturation"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: silkennet_db_pool_waiting
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [5], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 2m
        annotations:
          summary: "{{ $values.A.Value | printf \"%.0f\" }} threads чекають на DB connection ({{ $labels.database }})."
          description: "Connection pool вичерпаний. Sidekiq concurrency=15 + pessimistic locks можуть спричинити деадлок. Розгляни збільшення pool size або зменшення Sidekiq concurrency для web3_critical."
        labels:
          severity: info
          component: database
          team: backend

      # -----------------------------------------------------------------------
      # P2: W3bstream signature fallback (security degradation)
      # -----------------------------------------------------------------------
      - uid: sn-alert-w3bstream-fallback
        title: "ℹ️ W3bstream using SHA256 fallback (not Ed25519)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 300, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "rate(silkennet_w3bstream_signature_fallback_total[5m])"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "W3bstream підписує SHA256 замість Ed25519 ({{ $labels.reason }})."
          description: "IoTeX W3bstream verification не може використати апаратний Ed25519 ключ. В production (WEB3_STRICT_MODE=true) це raise VerificationError — перевір, чому цей counter ненульовий: або HardwareKey не provisioned, або WEB3_STRICT_MODE=false."
        labels:
          severity: info
          component: web3
          team: security

