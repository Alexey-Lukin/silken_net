          description: "GatewayStalenessSweepWorker зафіксував ≥3 online→faulty переходи за 30 хв — це bounce (recover! + report_fault! наново), не один стабільний збій (той уже покриває sn-alert-gateway-faulty, P0). Ознака нестабільного LoRa/backhaul-зв'язку конкретного кластера. Перевір last_seen_at історію шлюзу, живлення/антену на майданчику. ARCH.54 / 06_08 §1.3."
        labels:
          severity: info
          component: gateway
          team: ops

