          description: "storeStateRoot tx приземлився зі статусом revert. Причини: той самий root уже anchored (rootTimestamps[root]≠0) / <6-денний MIN_ANCHOR_INTERVAL / bad-ABI / недостатній gas_limit. Детермінований revert повторюватиметься щотижня з тим самим root — звір StateRootAnchor контракт + останній EthereumAnchor.error_message. Кошти НЕ в небезпеці (chain_hash кумулятивний → наступний тиждень покриє). ARCH.66 / 05_04."
