      # більше не спрацьовує, доки шлюз лишається faulty (цей випадок уже
      # покриває sn-alert-gateway-faulty, P0). Повторні інкременти в межах вікна
      # означають, що шлюз встиг відновитись (recover!) і впасти знову —
      # ознака нестабільного зв'язку (LoRa/backhaul), не одного збою.
