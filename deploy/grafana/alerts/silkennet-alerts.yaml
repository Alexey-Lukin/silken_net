      # -----------------------------------------------------------------------
      # P2 [ARCH.70]: партиції накопичуються МОНОТОННО — механізму `DETACH`/`DROP
      # PARTITION` у репо нуль. ⚠️ Лічильник листів НЕ дорівнює місяцям історії:
      # серед них завжди DEFAULT, а коли воркер біжить — ще й створена наперед
      # партиція НАСТУПНОГО місяця, тож число більше на 1–2 (дім поправки —
      # 06_03 §2.8). Поріг лишається на листах свідомо: питання алерту — «росте
      # без стелі», і воно від поправки не залежить; місяці для ⚖️ лічать прямо.
      # Сенс алерту той самий, що в E.37-сусіда вище:
      # зробити ⚖️ розвʼязним ДО пожежі. ⚠️ Поріг 24 = операторська стеля, а НЕ
      # канонізоване вікно ретеншну: два роки лежать за межами кожного з трьох
      # незакритих TBD (SLA §3.3 · RoPA/SEC.18 · сам ARCH.70), тож перетин означає
      # «присуд уже прострочено», а не «наближається».
      # -----------------------------------------------------------------------
      - uid: sn-alert-partition-count-unbounded
        title: "ℹ️ RANGE partitions accumulating with no drop mechanism (ARCH.70)"
