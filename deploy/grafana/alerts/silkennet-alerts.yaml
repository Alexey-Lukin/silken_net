      # ⚠️ Severity НИЖЧА за mic-fail СВІДОМО, і різниця не косметична: MIC-fail
      # доброякісної причини НЕ МАЄ, а тут їх дві — replay/інʼєкція (ворожа) і
      # скидання годинника пристрою (FW.50, доброякісна). Тож це не пейдж «tamper»,
      # а «розберись, яка з двох».
      # Поріг `gt 0` не шумить ЗА ПОБУДОВОЮ: CCM-шлях gated (TELEMETRY_CCM_ENABLED
      # default off) — база нульова, і перша ж подія справжня.
      # -----------------------------------------------------------------------
      - uid: sn-alert-ccm-fc-replay
