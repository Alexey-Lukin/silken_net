            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [24], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "Найбільша RANGE-таблиця тримає {{ $values.A.Value | printf \"%.0f\" }} листових партицій (>24), і жодна ще не дропалась. ⚠️ Це НЕ число місяців історії: серед листів завжди DEFAULT і створений наперед наступний місяць, тобто місяців на 1-2 менше."
          description: "Автоматичного дропу партицій у коді немає (`app/`/`lib/` — нуль; рунбук 06_06 §5.5 виконує DETACH вручну), тож ретеншн сирої телеметрії фактично нескінченний. Дія: ухвалити ⚖️ ширини вікна — РАЗОМ із двома сусідніми осями, бо жодна з трьох не бачить інших: retention-періоди PII (SEC.18) і комерційна обіцянка SLA §3.3. ⛔ Перед першим дропом закрити три передумови ARCH.70 (lineage-діагноз · глибина черги `low` під архівний пін · незакритий `oracle_status: dispatched`). 04_01 §3 картка TelemetryLog, дім DOC.8."
          runbook_url: "docs/00_07_Action_Plan_Tracker.md"
        labels:
          severity: info
          component: database
          team: backend

      # -----------------------------------------------------------------------
      # P2 [ARCH.70]: друга вісь того самого росту — ЦІНА, не місяці. Диск межею
