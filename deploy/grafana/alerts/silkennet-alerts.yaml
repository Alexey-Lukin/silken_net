          description: "Викликач із oracle-/Worker-класу звертається до партиційованої `telemetry_logs` без `created_at_iso` (або з невалідним ISO8601) → повний скан замість однієї партиції. Знайди викликача за міткою `caller` і передай ключ через One-Home `TelemetryLog.partition_pruned(iso, metric_caller:)`. CLAUDE.md §6 / 04_01 §0."
