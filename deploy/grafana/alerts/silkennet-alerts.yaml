            model:
              expr: '(sum by (slot) (increase(silkennet_mint_success_total[1h])) / sum by (slot) (increase(silkennet_mint_attempts_total[1h]))) and (sum by (slot) (increase(silkennet_mint_attempts_total[1h])) > 0)'
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0.8], type: lt }
