        for: 1h
        annotations:
          summary: "Семпл росту партицій не оновлювався {{ $values.A.Value | printf \"%.0f\" }} с (>48 год) — обидва ARCH.70-алерти зараз читають ЗАМЕРЗЛЕ значення."
          description: "PartitionMaintenanceWorker (cron `30 0 * * *`, config/sidekiq.yml) або не запускається, або падає до кроку вимірювання. Наслідок тихий: партиції накопичуються далі, а `silkennet_partitions` показує старе число — тобто `sn-alert-partition-count-unbounded` не спрацює. Перевірити cron-планувальник (особливо після зміни платформи деплою) і `sn-alert-partition-maintenance-failed`. 00_07 ARCH.70."
          runbook_url: "docs/00_07_Action_Plan_Tracker.md"
        labels:
          severity: info
          component: database
          team: backend

      # -----------------------------------------------------------------------
      # P1 [ARCH.70]: ЧЕТВЕРТА вісь партицій, і єдина, що НЕ про ріст. DEFAULT-лист
      # мусить лишатись порожнім: щойно в ньому осів рядок місяця N, створення
      # партиції місяця N падає з `PG::CheckViolation` НАЗАВЖДИ (нова партиція
      # звузила б constraint DEFAULT'а, а той уже містить рядок) — і ретраї цього
      # не лікують, бо стан сам не змінюється. Каскад: прохід зупиняється на першій
      # такій таблиці, тож решта не дістає партицій наступного місяця, а семпл
      # гейджів стоїть ПІСЛЯ циклу — три алерти вище замерзають разом.
      # ⚠️ Тому severity вище за сусідів: ті кажуть «пора вирішувати», цей — «уже
      # зламано, потрібна ручна дія». Поріг `gt 0` не шумить за побудовою: 0 є
      # очікуваним значенням, а не рідкісним.
      # -----------------------------------------------------------------------
      - uid: sn-alert-partition-default-occupied
        title: "⚠️ DEFAULT partition holds rows — partition creation is blocked (ARCH.70)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: max by (slot) (silkennet_partition_default_occupied)
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 1h
        annotations:
          summary: "DEFAULT-партиція щонайменше однієї RANGE-таблиці НЕ порожня — створення партиції її місяця вже заблоковано."
          description: "Рядок у DEFAULT-листі назавжди блокує `CREATE ... PARTITION OF` для свого місяця (`PG::CheckViolation`); PartitionMaintenanceWorker падатиме щодня, і ретраї не допоможуть — потрібна ручна дія DETACH → перелити → ATTACH. Дія: рунбук 06_06 §5.5 (точні SQL-кроки, порядок несучий). Яка саме таблиця — за лейблом `table` у `silkennet_partition_default_occupied`."
          runbook_url: "docs/06_06_Disaster_Recovery_and_Backup.md"
        labels:
          severity: warning
          component: database
          team: backend

      # -----------------------------------------------------------------------
      # P2: QATT batch-nonce Redis→DB fallback (L1 QATT) — той самий S6.1-патерн,
      # СВІДОМО окремий counter+алерт: батч-стрім щогодинний (кожна Queen), і
      # змішування з M2M поховало б рідкісний auth-сигнал у батч-шумі
      # (config/initializers/prometheus.rb, коментар QATT_NONCE_FALLBACK_TOTAL).
      # -----------------------------------------------------------------------
      - uid: sn-alert-qatt-nonce-fallback
        title: "ℹ️ QATT batch-nonce on DB fallback (Redis outage)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: sum by (slot) (increase(silkennet_qatt_nonce_fallback_total[1h]))
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "QATT batch-nonce впав на DB fallback ({{ $values.A.Value | printf \"%.0f\" }}× за 1h) — Redis був недоступний під час unpack."
          description: "Replay-захист Queen-attestation батчів працює через Solid Cache (degraded). Той самий Redis-outage клас, що sn-alert-m2m-nonce-fallback, але окремий сигнал: батчі щогодинні, тож тут видно ТРИВАЛІСТЬ outage. Повторюваність → multi-zone Upstash. 03_02 §7 / 04_03 §5.15."
        labels:
          severity: info
          component: redis
          team: security

      # -----------------------------------------------------------------------
      # P0: Rate-limit store failing — the shield is OFF, not degraded [INF.22]
      # -----------------------------------------------------------------------
      - uid: sn-alert-rate-limit-store-errors
        title: "🛑 Rack::Attack store failing — rate limiting NOT enforced"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: sum by (slot) (increase(silkennet_rate_limit_store_errors_total[1h]))
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 5m
        annotations:
          summary: "Rack::Attack cache-store дав {{ $values.A.Value | printf \"%.0f\" }} помилок за 1h — throttle і fail2ban зараз НЕ рахують."
          description: "🔴 Це НЕ деградація, як у двох nonce-fallback правил поруч: там запит завершується, і лічильник каже, ЯКИМ шляхом. Тут фолбеку немає — `ActiveSupport::Cache::RedisCacheStore` ковтає будь-який `Redis::BaseError` своїм failsafe і віддає nil, а nil-читання невідрізненне від «у цього IP нуль страйків». Тобто щит не слабшає, а ЗНИКАЄ: throttle не інкрементується, поріг fail2ban не досягається ніколи, сканери не баняться, і в лог не йде нічого. Виміряно 2026-08-30 на власному інстансі Upstash: write/read/increment віддали nil без жодного винятку. Саме тому store має `error_handler` (`config/initializers/rack_attack.rb`) — цей лічильник і є той голос. ⛔ Ярус НЕ діагностичний і не сміє ним стати: rate limiting є безпековим шляхом, а [INF.26] судить, що там декларація ярусу узаконює діру замість закривати. Дії: перевірити доступність Redis (`REDIS_URL` / `RACK_ATTACK_REDIS_URL`) і чи не адресує конфіг неіснуючу логічну базу — Upstash має рівно одну (`SELECT 1` → `ERR Only 0th database is supported!`)."
        labels:
          severity: critical
          component: redis
          team: security


      # -----------------------------------------------------------------------
      # P2: Governance-параметр відхилено bounds-валідацією [GOV.1]. Ненульове
      # означає, що DAO ПРОГОЛОСУВАВ значення поза safety-межами, sync його не
      # застосував, і чинним лишилось попереднє — тобто голос відбувся, а стан
      # не змінився, і жоден інший канал про це не скаже.
      # ⚠️ Info, не warning, СВІДОМО: захист спрацював як задумано, нічого не
      # зламано — потрібен коригувальний голос, а не втручання серед ночі.
      # Поріг `gt 0` не шумить ЗА ПОБУДОВОЮ: DAO ще не активовано (05_06), тож
      # база нульова.
      # -----------------------------------------------------------------------
      - uid: sn-alert-governance-param-rejected
        title: "ℹ️ Governance-параметр відхилено (голос не набув чинності)"
        condition: C
        data:
          - refId: A
            relativeTimeRange: { from: 86400, to: 0 }
            datasourceUid: ${DATASOURCE_UID}
            model:
              expr: "sum by (slot) (increase(silkennet_governance_param_rejected_total[24h]))"
              refId: A
          - refId: C
            datasourceUid: "__expr__"
            model:
              type: threshold
              refId: C
              expression: A
              conditions:
                - evaluator: { params: [0], type: gt }
                  operator: { type: and }
                  query: { params: [A] }
                  reducer: { params: [], type: last }
        noDataState: OK
        execErrState: Error
        for: 0m
        annotations:
          summary: "{{ $values.A.Value | printf \"%.0f\" }} governance-параметр(ів) відхилено bounds-валідацією за 24h."
          description: "Governance::ParameterSyncWorker відкинув проголосоване значення як позамежне (мис-скейл, нонсенс-голос) — чинним лишилось попереднє. Голос відбувся, стан НЕ змінився: без цього сигналу DAO вважає рішення застосованим. Лік — коригувальний голос у межах, або перегляд самих меж, якщо межа неправильна. Мітка `parameter` називає, який саме. GOV.1 / 05_06 §4."
          runbook_url: "docs/05_06_Governance_and_DAO.md"
        labels:
          severity: info
          component: web3
          team: ops
