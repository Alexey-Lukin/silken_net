          description: "Crash тут НЕ загрожує: `disk_autoresize = true`. Ціна тиха — PD_SSD за ГБ, розмір 30 утримуваних бекапів і час DR-відновлення (06_06). Дія: звірити з ⚖️ ширини вікна дропу (ARCH.70) і з ⚖️ двигуна E.37 — осі різні (cold-history vs hot-OLAP), але ClickHouse потенційно закриває обидві. terraform/variables.tf `db_disk_size_gb`."
          runbook_url: "docs/00_07_Action_Plan_Tracker.md"
        labels:
