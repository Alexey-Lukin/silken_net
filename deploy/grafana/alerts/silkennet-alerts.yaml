      # зловжитий MINTER-ключ). Комплемент до ex-post-clawback (ARCH.53/SLASH-1
      # §3.3): обмежує blast-radius у вікні детекції. Ruby-детектор
      # (Treasury::MonitorService) має власний DAO-tunable поріг + опц.
      # circuit-break; цей Grafana-поріг — НЕЗАЛЕЖНИЙ operator-side ceiling
      # (placeholder ~MAX_SUPPLY, калібрується вниз з перших live-вікон, як
      # mint-slo). gauge = rolling-1h заминчений обсяг per token_type.
