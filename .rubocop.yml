# ── (в) ЗДАТНІСТЬ: коп УВІМКНЕНИЙ, але спрацювати не може ──────────────────
# Третій, найтихіший клас [OPS.33]. Рядків `Enabled: false` тут немає навмисно —
# копи живі, департаменти ввімкнені, прогін зелений. Просто їхнє зелене означає
# «не перевірено», а не «чисто», і без цього блоку наступний прохід прочитає
# його як покриття. Тому кожен несе НОСІЯ, який дивиться туди ж по-справжньому.
#
#   · Rails/UniqueValidationWithoutIndex — читає ВИКЛЮЧНО `db/schema.rb`, а ми на
#     `schema_format = :sql`: файлу не існує, коп мовчки не дивиться нікуди.
#     Носій: `spec/quality/uniqueness_validation_index_spec.rb` (звіряє валідатори
#     через Rails-інтроспекцію проти унікальних індексів `db/structure.sql`).
#   · Rails/DangerousColumnNames — та сама сліпота по `schema.rb`. Носія НЕ
#     будували, і це присуд із підставою: вимір живим API `dangerous_attribute_method?`
#     на 8.1 дав НУЛЬ, а відмова тут коштує мало — колізія такого імені ламає
#     модель ГУЧНО при визначенні атрибутів, тобто клас не тихий (⊥ двом сусідам).
#   · Rails/TransactionExitStatement — вимкнений САМИМ гемом на Rails ≥ 7.2
#     («transactions were restored to their historical behavior» — дослівно в
#     джерелі копа), тож на `TargetRailsVersion: 8.1` він не спрацює ЖОДНОГО разу.
#     ⚠️ Премісу гема спростовано рантайм-пробою з контролем: `return` усередині
#     `transaction do` на 8.1.3.1 КОМІТИТЬ, а `raise ActiveRecord::Rollback`
#     відкочує. Носій: `spec/quality/transaction_exit_after_write_spec.rb`, і він
#     стереже ДЗЕРКАЛЬНУ форму — «запис, а потім вихід», яку не бачив ніхто:
#     наш повсюдний ідіом «гард ПЕРЕД записом» безпечний за побудовою.

# ── Три копи, додані в RuboCop 1.89 — кожен розібрано окремо ───────────────
# Усі три потребують project-index, який вимкнено вище з виміряної причини.
# ⚠️ Лишати їх «увімкненими» було б гірше за вимкнення: без індексу вони віддають
# НУЛЬ, а прогін виходить 0 — тобто зелений читався б як доказ там, де прилад
# не дивиться (доведено позитивним контролем: файл із мертвим private-методом,
# `@deprecated`-посиланням і навмисним одруком не дав жодного хіта).
Lint/UnusedPrivateMethod:           # on-demand лінза — рецепт у шапці `AllCops`
  Enabled: false
Lint/DeprecatedReference:           # `@deprecated`-тегів у дереві нема; оживе разом з індексом
  Enabled: false
# `NameTypo` — окремий випадок: він мовчить НАВІТЬ з індексом. Позитивний
# контроль (`def recieve_paylod`) не дав хіта ні так, ні так, тобто коп у нас
# не падає взагалі. Переоцінити, коли він навчиться падати.
Lint/NameTypo:
  Enabled: false

# --- RSpec cops ---
RSpec/MultipleExpectations:
  Max: 10

RSpec/ExampleLength:
  Max: 30

RSpec/NestedGroups:
  Max: 5

# IoT-телеметрія потребує багато let-хелперів для повного стеку (tree→cluster→org→gateway)
RSpec/MultipleMemoizedHelpers:
  Max: 15

# [OPS.33] ⚖️ Присуд, делегований founder-ом: бланкетний коп НЕ вмикаємо —
# розклад живих сайтів за жанром дав більшість доброякісних глушників межі
# (Turbo-броадкаст · нотифікації · зовнішній HTTP/RPC у файлі, чий предмет
# інший) і меншість несучих, тобто він спрацював би на всій популяції заради
# меншої її частини, а шумний гейт функціонально вимкнений. Оборонний хід
# натомість — реєстр `spec/support/side_effect_silencer.rb`. ⛔ Не перевідкривати
# без НОВОГО заміру. Повний присуд із ціною відмови — `00_07` OPS.33.
RSpec/AnyInstance:
  Enabled: false

# [OPS.33] ⚖️ ЗВУЖЕНО проти дефолту гема (`IgnoreNameless: true`): безіменні
# `double(…)` у нашому дереві стоять за РЕАЛЬНИМИ класами, якими ми володіємо
# (`CoapClient::Response`, `ActionMailer::MessageDelivery`, `ActiveModel::Errors`,
# `Tree`) — тобто дефолт, писаний під throwaway-значення, нашій популяції не
# відповідає. Ціна виміряна ПЕРЕД вмиканням і мала; кожен цільовий клас звірено
# живою пробою `public_method_defined?`, не здогадом. ⚠️ Три сайти лишились
# голими з інлайн-директивою: проксі від `.with(...)` віддає
# `ActionMailer::Parameterized::Mailer`, який mailer-методів не ВИЗНАЧАЄ
# (method_missing), тож verifying double їх не бачить за побудовою.
RSpec/VerifiedDoubles:
  IgnoreNameless: false

# Іменовані let з індексами (tree1, tree2) допустимі для парних порівнянь
RSpec/IndexedLet:
  Enabled: false

# let! в IoT-тестах часто потрібні для створення записів в БД перед перевіркою
# (наприклад, tree повинно існувати до того, як worker його шукає)
RSpec/LetSetup:
  Enabled: false

# Інтеграційні тести описують сценарії, а не конкретні класи
RSpec/DescribeClass:
  Exclude:
    - "spec/integration/**/*"
    - "spec/requests/**/*"

# Initializer specs test config/initializers/ which don't map to app class paths
RSpec/SpecFilePathFormat:
  Exclude:
    - "spec/initializers/**/*"
