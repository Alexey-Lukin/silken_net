# Omakase Ruby styling for Rails
inherit_gem: { rubocop-rails-omakase: rubocop.yml }

plugins:
  - rubocop-rspec

AllCops:
  NewCops: enable
  # [OPS.33] 🔴 Project-index (`rubydex`) стоїть ВИМКНЕНИМ — і це вимір, не
  # обережність. Увімкнення дало **60 хибних позитивів на коректному коді**, бо
  # індекс приписує спільний простір імен тому, що ділить лише файлову систему:
  #   · `Lint/ConstantReassignment` × ~55 — кожен `scripts/*.rb` є ОКРЕМОЮ
  #     програмою (`ruby scripts/x.rb`) зі своїм top-level `ROOT`/`TREES`/`EXEMPT`;
  #     🔴 і найгірший хіт — пара `app/services/silken_net/attractor.rb` ⟷
  #     `firmware/bio_contracts/bio_contract.rb`, тобто НАВМИСНЕ дзеркало
  #     подвійного обчислення [FW.7], на якому стоїть увесь DCI.
  #   · `Lint/DuplicateMethods` × 5 — той самий клас, і він уже стоїть у CI-кроці
  #     «Lint for dead code» по периметру `app lib scripts config`, тож індекс
  #     ЗЛАМАВ БИ наявний гейт.
  # Ціна відмови названа вголос: без індексу мовчать `Lint/UnusedPrivateMethod`
  # і `Lint/DeprecatedReference` (обидва нижче). Обмін вигідний — ті двоє дали
  # 1 хіт, і той свідомий [ARCH.103], а ці двоє живі й безкоштовні.
  # 🔎 Гем лишається в дереві як ON-DEMAND лінза, не як гейт:
  #   printf 'inherit_from: .rubocop.yml\nAllCops:\n  UseProjectIndex: true\nLint/UnusedPrivateMethod:\n  Enabled: true\n' > /tmp/idx.yml
  #   bin/rubocop --config /tmp/idx.yml --only Lint/UnusedPrivateMethod --cache false
  # Ціна прогону виміряна: +1.0 с на 18 с холодного по 995 файлах.
  UseProjectIndex: false
  # Сторонній вендорнутий код (git-сабмодулі: mruby, CMSIS-DSP, CMSIS_6) —
  # не наш стиль, не лінтимо. RuboCop ігнорує vendor/ за замовчуванням, але не firmware/extern.
  Exclude:
    - "firmware/extern/**/*"

Bundler/OrderedGems:
  Enabled: true

# ═══════════════════════════════════════════════════════════════════════════
# [OPS.33] Департаменти, які omakase гасить ЦІЛКОМ
# ═══════════════════════════════════════════════════════════════════════════
# 🔴 Механізм точніший за «omakase все вимикає»: `DisabledByDefault` він НЕ
# ставить — він гасить десять департаментів ПОІМЕННО. Саме тому вцілів `RSpec`
# (гем про нього не знає), тобто вся наша лінт-спроможність трималась на тому,
# чого omakase не побачив: із 914 копів було ввімкнено 150, і 104 з них — RSpec.
# Поза тим департаментом жило 46 із 799.
#
# Вмикаємо ДЕПАРТАМЕНТОМ, а не переліком копів, і це несуче: перелік застигає,
# а департамент разом із `NewCops: enable` впускає нові копи наступних версій
# самі. Ціною цього є явний реєстр нижче — усе, чого ми свідомо НЕ тримаємо.
#
# ⚠️ Ціна периметра зміряна ДО вмикання (`--only` вмикає коп в обхід
# `Enabled: false`, перевірено контролем): кожен коп цих чотирьох департаментів,
# НЕ названий у реєстрі нижче, дає на цьому дереві НУЛЬ хітів. Тобто гейт
# народжується зеленим — а гейт, народжений червоним, знімає перший, кому він
# заважає.
Security:
  Enabled: true
Lint:
  Enabled: true
Rails:
  Enabled: true
Performance:
  Enabled: true

# ── Реєстр НЕ-тримань. Дві різні речі під одним `Enabled: false` ────────────
# (а) СВІДОМА ПРАКТИКА — коп суперечить ратифікованому рішенню, це won't-do;
# (б) БОРГ — коп має рацію, просто не взято сьогодні.
# Різницю тримаємо словами, бо `Enabled: false` її не несе, і без неї наступний
# прохід читає won't-do як недороблене (або навпаки — борг як присуд).

# — (а) свідома практика —
Lint/ConstantResolution:            # вимагає `::` на КОЖНІЙ константі; вимкнений і в самому RuboCop
  Enabled: false
Lint/NumberConversion:              # `Integer(x)` замість `to_i` — не наш стиль
  Enabled: false
Lint/MissingSuper:                  # Phlex-компоненти й сервіси свідомо не кличуть super
  Enabled: false
Lint/ScriptPermission:              # `scripts/*.rb` кличуться через `ruby`, не через shebang
  Enabled: false
Lint/UselessAssignment:             # живі хіти лише у `spec/` (фікстурні привʼязки); в `app lib scripts config` коп уже HARD у CI-кроці «Lint for dead code»
  Enabled: false
Lint/AmbiguousOperatorPrecedence:   # вимагає дужок навколо кожного змішаного виразу
  Enabled: false
Rails/EnvironmentVariableAccess:    # ENV читаємо свідомо — `ENV[..].presence || credentials` [SEC.22]
  Enabled: false
Rails/Output:                       # `scripts/`/`lib/tasks/` друкують звіти за призначенням
  Enabled: false
Rails/SkipsModelValidations:        # `update_column`/`update_all`/`insert_all` на hot-path телеметрії — KENOSIS, свідомий обхід колбеків
  Enabled: false
Performance/OpenStruct:             # тест-фікстури; їх окремо конвертує кампанія TEST.12
  Enabled: false

# — (б) борг: коп має рацію, робота не взята —
# ⛔ Не «вмикати за настроєм»: кожен рядок тут = окремий прохід із власною
# валідацією. Знімати рядок можна лише разом із доведеним нулем хітів.
Lint/AmbiguousBlockAssociation:
  Enabled: false
Lint/ConstantDefinitionInBlock:
  Enabled: false
