type CarbonMintEvent @entity {
  id: ID!
  to: Bytes!
  amount: BigInt!
  treeDidHash: Bytes!
  treeDid: String!
  archiveRoot: Bytes! # [E.60] Merkle-root of the dispatch archive batch; 0x0 = no witness claim
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# [S3.5] SFC ForestMinted event — governance token minting per cluster
type ForestMintEvent @entity {
  id: ID!
  to: Bytes!
  amount: BigInt!
  clusterIdHash: Bytes!
  clusterId: String!
  archiveRoot: Bytes! # [E.60] MRV-witness of the dispatch evidence-set, NOT a carbon claim
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

# [S3.5] SFC GovernanceSlashed event — DAO slashing of voting power
type GovernanceSlashEvent @entity {
  id: ID!
  target: Bytes!
  amount: BigInt!
  contextHash: Bytes! # [CONTRACT.1] bytes32(intent BlockchainTransaction.id); 0x0 = manual DAO slash
  timestamp: BigInt!
  blockNumber: BigInt!
  transactionHash: Bytes!
}

type ProtocolFinancials @entity {
  id: ID!
  totalMinted: BigInt!
  totalBurned: BigInt!
  totalForestMinted: BigInt!
  totalGovernanceSlashed: BigInt!
}

type SlashingEvent @entity {
  id: ID!
  target: Bytes!
  amount: BigInt!
  contextHash: Bytes! # [CONTRACT.1] bytes32(intent BlockchainTransaction.id); 0x0 = manual DAO slash
  timestamp: BigInt!
}
