specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SilkenCarbonCoin
    network: polygon-amoy
    source:
      # ⚠️ BLOCKER [1.7]: Replace with real SilkenCarbonCoin contract address after deployment.
      # After deploying via Foundry:
      #   1. Get address from deployment receipt: `forge script ... --broadcast`
      #   2. Replace this placeholder: `address: "0x<REAL_CONTRACT_ADDRESS>"`
      #   3. Set startBlock to deployment block number from receipt.blockNumber
      #   4. Run: `graph codegen && graph build && graph deploy`
      # Without this change, The Graph will attempt to index from genesis block
      # (extremely slow) and won't find any contract events.
      address: "0x0000000000000000000000000000000000000000"
      abi: SilkenCarbonCoin
      # Set to the block number where SilkenCarbonCoin was deployed.
      # startBlock: 0 indexes from genesis — wastes hours of indexing time.
      # After deployment: startBlock: <receipt.blockNumber>
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CarbonMintEvent
        - ProtocolFinancials
        - SlashingEvent
        - PremiumPaidEvent
      abis:
        - name: SilkenCarbonCoin
          file: ./abis/SilkenCarbonCoin.json
      eventHandlers:
        - event: CarbonMinted(indexed address,uint256,indexed bytes32,string)
          handler: handleCarbonMinted
        - event: TokenSlashed(indexed address,uint256)
          handler: handleTokenSlashed
        - event: PremiumPaid(indexed address,uint256)
          handler: handlePremiumPaid
      file: ./src/mapping.ts

  # [S3.5] SilkenForestCoin (SFC) — Governance & Biodiversity Token
  # Events: ForestMinted (cluster-based minting), GovernanceSlashed (DAO slashing)
  - kind: ethereum
    name: SilkenForestCoin
    network: polygon-amoy
    source:
      # ⚠️ BLOCKER: Replace with real SilkenForestCoin contract address after deployment.
      address: "0x0000000000000000000000000000000000000000"
      abi: SilkenForestCoin
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ForestMintEvent
        - GovernanceSlashEvent
        - ProtocolFinancials
      abis:
        - name: SilkenForestCoin
          file: ./abis/SilkenForestCoin.json
      eventHandlers:
        - event: ForestMinted(indexed address,uint256,indexed bytes32,string)
          handler: handleForestMinted
        - event: GovernanceSlashed(indexed address,uint256)
          handler: handleGovernanceSlashed
      file: ./src/mapping.ts
