#
# 🔭 [ARCH.111] ОГОЛОШЕНА МЕЖА ЦЬОГО ІНДЕКСУ — читай перед тим, як цитувати його
# як «те, що видно про SilkenNet on-chain».
#
# Предмет індексу — ЕМІСІЯ І СПАЛЕННЯ: `CarbonMinted`/`ForestMinted` (з розкладкою
# природи, `MintKind`) і `TokenSlashed`/`GovernanceSlashed`. Це вибір, і його
# зробили МИ — тож він оголошується, а не мається на увазі.
#
# НЕ індексується тут (і це чесна межа, не приховування — події публічні on-chain,
# читаються будь-яким експлорером без нашої участі):
#   · `RoleGranted` / `RoleRevoked` — зміни ролей на токенах, Anchor, Params;
#   · `Paused` / `Unpaused`;
#   · `CallScheduled` / `CallExecuted` / `Cancelled` — увесь Timelock;
#   · увесь Governor (`ProposalCreated` / `VoteCast` / …).
# Реєстр того, ХТО які повноваження тримає й чи складає їх — канон
# `05_03 §Стоячі повноваження після деплою` [ARCH.112], не цей файл.
#
# ⊕ ОДИН виняток із межі вище — `ProtocolParameters.ParameterUpdated`, і він тут
# не заради governance-повноти, а тому що без історії ставки Dynamic Tax поле
# `ProtocolFinancials.totalMintedTax`, яке цей індекс публікує, зовнішньо
# неперевірне: аудитор бачить зібраний податок і не може звірити його з чинною
# на той момент ставкою. Тобто це АРИФМЕТИЧНА ПЕРЕДУМОВА вже наявного числа —
# і саме цей критерій вирішує, що сюди входить, а що ні.
#
# ⛔ Не розширюй набір «за симетрією». Кожна нова подія тут мусить відповісти на
# те саме питання: без якого ВЖЕ ОПУБЛІКОВАНОГО числа цього індексу читач не може
# обійтись? Якщо відповіді немає — подія публічна on-chain і читається експлорером.
specVersion: 1.0.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SilkenCarbonCoin
    network: polygon-amoy
    source:
      # ⚠️ BLOCKER [1.7]: Replace with real SilkenCarbonCoin contract address after deployment.
      # After deploying via Foundry:
      #   1. Get address from deployment receipt: `forge script ... --broadcast`
      #   2. Replace this placeholder: `address: "0x<REAL_CONTRACT_ADDRESS>"`
      #   3. Set startBlock to deployment block number from receipt.blockNumber
      #   4. Run: `graph codegen && graph build && graph deploy`
      # Without this change, The Graph will attempt to index from genesis block
      # (extremely slow) and won't find any contract events.
      address: "0x0000000000000000000000000000000000000000"
      abi: SilkenCarbonCoin
      # Set to the block number where SilkenCarbonCoin was deployed.
      # startBlock: 0 indexes from genesis — wastes hours of indexing time.
      # After deployment: startBlock: <receipt.blockNumber>
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - CarbonMintEvent
        - ProtocolFinancials
        - SlashingEvent
      abis:
        - name: SilkenCarbonCoin
          file: ./abis/SilkenCarbonCoin.json
      eventHandlers:
        - event: CarbonMinted(indexed address,uint256,indexed bytes32,string,indexed bytes32)
          handler: handleCarbonMinted
        - event: TokenSlashed(indexed address,uint256,bytes32)
          handler: handleTokenSlashed
      file: ./src/mapping.ts

  # [S3.5] SilkenForestCoin (SFC) — Governance & Biodiversity Token
  # Events: ForestMinted (cluster-based minting), GovernanceSlashed (DAO slashing)
  - kind: ethereum
    name: SilkenForestCoin
    network: polygon-amoy
    source:
      # ⚠️ BLOCKER: Replace with real SilkenForestCoin contract address after deployment.
      address: "0x0000000000000000000000000000000000000000"
      abi: SilkenForestCoin
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ForestMintEvent
        - GovernanceSlashEvent
        - ProtocolFinancials
      abis:
        - name: SilkenForestCoin
          file: ./abis/SilkenForestCoin.json
      eventHandlers:
        - event: ForestMinted(indexed address,uint256,indexed bytes32,string,indexed bytes32)
          handler: handleForestMinted
        - event: GovernanceSlashed(indexed address,uint256,bytes32)
          handler: handleGovernanceSlashed
      file: ./src/mapping.ts

  # 🔭 [ARCH.111] ProtocolParameters — ЄДИНА governance-подія в цьому індексі, і вона
  # тут не заради повноти, а тому що без неї вже опубліковане
  # `ProtocolFinancials.totalMintedTax` зовнішньо неперевірне: аудитор бачить зібраний
  # податок і не може звірити його з чинною на той момент ставкою.
  # ⛔ Ролі / пауза / Timelock / Governor СВІДОМО не індексуються — див. оголошену межу
  # предмета в шапці цього файла; реєстр повноважень — `05_03 §Стоячі повноваження`.
  - kind: ethereum
    name: ProtocolParameters
    network: polygon-amoy
    source:
      # ⚠️ BLOCKER [S3.5]: замінити на реальну адресу після деплою (як SCC/SFC вище).
      address: "0x0000000000000000000000000000000000000000"
      abi: ProtocolParameters
      startBlock: 0
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.7
      language: wasm/assemblyscript
      entities:
        - ParameterChangeEvent
      abis:
        - name: ProtocolParameters
          file: ./abis/ProtocolParameters.json
      eventHandlers:
        - event: ParameterUpdated(indexed bytes32,uint256,uint256,indexed address)
          handler: handleParameterUpdated
      file: ./src/mapping.ts
