#
# 🔭 [ARCH.111] ОГОЛОШЕНА МЕЖА ЦЬОГО ІНДЕКСУ — читай перед тим, як цитувати його
# як «те, що видно про SilkenNet on-chain».
#
# Предмет індексу — ЕМІСІЯ І СПАЛЕННЯ: `CarbonMinted`/`ForestMinted` (з розкладкою
# природи, `MintKind`) і `TokenSlashed`/`GovernanceSlashed`. Це вибір, і його
# зробили МИ — тож він оголошується, а не мається на увазі.
#
# НЕ індексується тут (і це чесна межа, не приховування — події публічні on-chain,
# читаються будь-яким експлорером без нашої участі):
#   · `RoleGranted` / `RoleRevoked` — зміни ролей на токенах, Anchor, Params;
#   · `Paused` / `Unpaused`;
#   · `CallScheduled` / `CallExecuted` / `Cancelled` — увесь Timelock;
#   · увесь Governor (`ProposalCreated` / `VoteCast` / …);
#   · 🔴 `StateRootAnchor.StateRootStored` — і це ЄДИНИЙ виняток, що не є
#     успадкованою подією, тобто перелік вище доти називав лише чужі. Це ШОСТА
#     ВЛАСНА подія системи (тижневий SHA-256 state-root на L1), і не входить вона
#     з причини СТРУКТУРНОЇ, не редакційної: якір живе в Ethereum L1, а цей
#     маніфест — `polygon-amoy`, тож індексувати його означало б завести ДРУГИЙ
#     маніфест на іншу мережу. Названо тут [OPS.36], бо аудитор, який читає лише
#     субграф (а `package.json` позиціонує його саме так), інакше не дізнається
#     про її існування взагалі — і прочитає мовчання як «такої події немає».
# Реєстр того, ХТО які повноваження тримає й чи складає їх — канон
# `05_03 §Стоячі повноваження після деплою` [ARCH.112], не цей файл.
#
# ⊕ ОДИН виняток із межі вище — `ProtocolParameters.ParameterUpdated`, і він тут
# не заради governance-повноти, а тому що без історії ставки Dynamic Tax поле
# `ProtocolFinancials.totalMintedTax`, яке цей індекс публікує, зовнішньо
# неперевірне: аудитор бачить зібраний податок і не може звірити його з чинною
# на той момент ставкою. Тобто це АРИФМЕТИЧНА ПЕРЕДУМОВА вже наявного числа —
# і саме цей критерій вирішує, що сюди входить, а що ні.
#
# 🔇 [OPS.36, ⚖️ 2026-08-30] ЩО ОЗНАЧАЄ МОВЧАННЯ ЦЬОГО ІНДЕКСУ — оголошено, бо
# читача власного мовчання в субграфа немає за побудовою, і кожна з тиш нижче
# інакше читається як «події не було»:
#   (а) ДО першої емісії індекс порожній: три dataSource стоять на Amoy-адресах
#       броадкасту 2026-09-01 (S3.5; доти — 0x0000…/startBlock 0), тож задеплоєний
#       як є він віддає синтаксично здоровий нуль, доки жоден mint/slash не пройшов;
#   (в) порожній ParameterChangeEvent ≠ нульова ставка: до першого governance-сету
#       діє off-chain дефолт бекенда — genesis-ера має ЧИННУ ставку, якої в
#       індексі немає, і саме тому TAX-звірка працює лише від першого сету;
#   (г) відсутність TAX-рядка при мінті ≠ звільнення від податку: вісім
#       детермінованих untaxed-каналів (05_03 §Dynamic Tax) ⊥ повний пул
#       (гістерезис) ⊥ E.46 fail-open ⊥ дефект — чотири причини, один вигляд.
# Тиша (б) — StateRootStored — структурна назавжди (інша мережа, блок вище);
# (а) закривається сама деплоєм; (в)/(г) — властивість genesis-ери й податкової
# механіки, лік = ЦЕ оголошення, не новий механізм (⚖️ founder 2026-08-30).
#
# ⛔ Не розширюй набір «за симетрією». Кожна нова подія тут мусить відповісти на
# те саме питання: без якого ВЖЕ ОПУБЛІКОВАНОГО числа цього індексу читач не може
# обійтись? Якщо відповіді немає — подія публічна on-chain і читається експлорером.
# [OPS.36, 2026-08-28] `specVersion` 1.0.0→1.3.0 і `apiVersion` 0.0.7→0.0.9 підняті ПІСЛЯ
# того, як зʼявився тест-шар мапінгу — саме він і був названою передумовою. ⚠️ Але покриття
# розведене чесно: тести стережуть `apiVersion` (це API, яким мапінг говорить із рантаймом),
# і НЕ стережуть `specVersion` — той є контрактом МАНІФЕСТА з індексером, якого ми не
# запускали. Підстава для нього інша й зовнішня: `1.3.0` — те, що ГЕНЕРУЄ scaffold нашого ж
# запіненого CLI 0.98.1, тобто дефолт інструмента, а не edge навмання.
#
# 🔴 `prune: auto` — УСПАДКОВАНИЙ дефолт із коміту, яким субграф заводили, і доти його ніхто
# не обирав: класичний тихий дефолт (рішення, ухвалене ВІДСУТНІСТЮ вибору). Оголошуємо, що
# він означає ТУТ, бо поверхня аудиторська: prune зрізає ІСТОРИЧНІ ВЕРСІЇ змінюваних
# сутностей, лишаючи поточну. Отже time-travel-запит «яким був `totalMintedGrowth` на блоці
# N» перестає працювати за межами вікна.
# ✅ Чому це прийнятно САМЕ в нас, і чому підстава не порожня: усі пʼять подієвих сутностей
# оголошені `immutable: true`, тобто версій не мають і prune їх не торкається — а агрегат
# `ProtocolFinancials` є ПОХІДНИМ від них і відтворюється сумуванням. Тобто зрізається
# зручність, не свідчення.
# ⛔ Перегляд обовʼязковий, щойно зʼявиться змінювана сутність, чиє ІСТОРИЧНЕ значення не
# відновлюється з подій — тоді `prune: auto` почне знищувати саме доказ, і мовчки.
specVersion: 1.3.0
indexerHints:
  prune: auto
schema:
  file: ./schema.graphql
dataSources:
  - kind: ethereum
    name: SilkenCarbonCoin
    network: polygon-amoy
    source:
      # ✅ [S3.5] Polygon Amoy (chainId 80002) — output of the `Deploy.s.sol` broadcast of
      # 2026-09-01 (00_07 DEPLOY-1 Фаза 2t; the receipts live in gitignored `contracts/broadcast/`,
      # the six-address set in 06_01 §DEPLOY-DAY). `startBlock` = the deploy block (0x2c50d8b).
      # ⛔ MAINNET cutover is a separate act (00_07 DEPLOY-1 Фаза 2, ex-S3.5): `network: polygon` + the mainnet
      # addresses of DEPLOY-1 Фаза 2 + their deploy block — never "bump" these testnet values.
      # `validate_addresses.sh` refuses the zero address; it does NOT check the chain.
      address: "0x18a8A50e0DC0103aA94de51b78f352E2d26E1b22"
      abi: SilkenCarbonCoin
      # Deploy block of the Amoy broadcast — indexing from genesis would waste hours.
      startBlock: 46468491
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - CarbonMintEvent
        - ProtocolFinancials
        - SlashingEvent
      abis:
        - name: SilkenCarbonCoin
          file: ./abis/SilkenCarbonCoin.json
      eventHandlers:
        - event: CarbonMinted(indexed address,uint256,indexed bytes32,string,indexed bytes32)
          handler: handleCarbonMinted
        - event: TokenSlashed(indexed address,uint256,bytes32)
          handler: handleTokenSlashed
      file: ./src/mapping.ts

  # [S3.5] SilkenForestCoin (SFC) — Governance & Biodiversity Token
  # Events: ForestMinted (cluster-based minting), GovernanceSlashed (DAO slashing)
  - kind: ethereum
    name: SilkenForestCoin
    network: polygon-amoy
    source:
      # ✅ [S3.5] Amoy SFC — same broadcast as SCC above; mainnet cutover pending.
      address: "0x9366a4CbA0461E150A3409CD2767Ff7b8db6d4b7"
      abi: SilkenForestCoin
      startBlock: 46468491
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ForestMintEvent
        - GovernanceSlashEvent
        - ProtocolFinancials
      abis:
        - name: SilkenForestCoin
          file: ./abis/SilkenForestCoin.json
      eventHandlers:
        - event: ForestMinted(indexed address,uint256,indexed bytes32,string,indexed bytes32)
          handler: handleForestMinted
        - event: GovernanceSlashed(indexed address,uint256,bytes32)
          handler: handleGovernanceSlashed
      file: ./src/mapping.ts

  # 🔭 [ARCH.111] ProtocolParameters — ЄДИНА governance-подія в цьому індексі, і вона
  # тут не заради повноти, а тому що без неї вже опубліковане
  # `ProtocolFinancials.totalMintedTax` зовнішньо неперевірне: аудитор бачить зібраний
  # податок і не може звірити його з чинною на той момент ставкою.
  # ⛔ Ролі / пауза / Timelock / Governor СВІДОМО не індексуються — див. оголошену межу
  # предмета в шапці цього файла; реєстр повноважень — `05_03 §Стоячі повноваження`.
  - kind: ethereum
    name: ProtocolParameters
    network: polygon-amoy
    source:
      # ✅ [S3.5] Amoy ProtocolParameters — same broadcast; mainnet cutover pending.
      address: "0x1F20032142C98BBcfD3DcB115f62Ae1230802Be2"
      abi: ProtocolParameters
      startBlock: 46468491
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - ParameterChangeEvent
      abis:
        - name: ProtocolParameters
          file: ./abis/ProtocolParameters.json
      eventHandlers:
        - event: ParameterUpdated(indexed bytes32,uint256,uint256,indexed address)
          handler: handleParameterUpdated
      file: ./src/mapping.ts
