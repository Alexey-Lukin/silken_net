  - conda-forge
dependencies:
  - python=3.12
  # --- MD engine ---
  - openmm>=8.1
  - pdbfixer
  - mdtraj>=1.10
  # --- ligand parameterization (L2 step 2) ---
  - rdkit>=2024.03
  - openff-toolkit>=0.16
