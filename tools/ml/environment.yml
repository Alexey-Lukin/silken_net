# Conda environment for the SilkenNet ML toolkit (`silken_ml`).
#
# Mirrors the `tools/in_silico/environment.yml` pattern (conda-forge, pinned,
# pytest). This is the FULL/heavy path — the canonical librosa log-mel oracle +
# classical-ML + dataset I/O. The fast path (pure-stdlib oracle + C codegen +
# firmware host-tests) needs NONE of this; see tools/ml/README.md.
#
#   micromamba create -f tools/ml/environment.yml   # or: mamba env create -f …
#   micromamba activate silken_ml
#   pip install -e tools/ml
name: silken_ml
channels:
  - conda-forge
dependencies:
  - python=3.12
  # --- DSP + canonical log-mel oracle (parity vs pure-stdlib, tol 1e-6) ---
  # Floors raised to tested-current (2026-06-13 sweep): an older numpy/librosa could
  # silently change the log-mel computation and break the librosa≡stdlib parity contract.
  - numpy>=2.0
  - scipy>=1.13
  - librosa>=0.11        # log-mel oracle; pulls soundfile (audio I/O) transitively
  # --- classical ML (dataset eval / future backend-RF parity) ---
  - scikit-learn>=1.5
  - matplotlib>=3.9
  # --- testing ---
  - pytest>=7.0
  - pytest-cov>=4.0
  - pip
  # --- training + INT8 export (TFLite post-training quantization) ---
  # Landed 2026-06-12 with the baseline-model program (tools/ml/docs/
  # baseline_model_program.md). TF is pip-installed (conda-forge osx-arm64 TF is
  # finicky); provides Keras 3 + tf.lite.TFLiteConverter (INT8 PTQ →
  # silken_net_audio_model.h). Verified: the librosa≡stdlib parity gate stays
  # green alongside TF's numpy 2.x / librosa 0.11.
  # NB: TF 2.21 pins h5py<3.15 → h5py stays 3.14.x (transitive; 3.16 awaits a TF release relaxing it).
  - pip:
      - tensorflow>=2.20
