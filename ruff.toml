# Ruff — лінтер/форматер для Python-тулінгу SilkenNet (`tools/**`).
# Прямий аналог `.rubocop.yml` для Ruby: один конфіг, один стиль.
#
# Сторонній вендорнутий код (ARM toolchain, CMSIS) — не наш стиль, не лінтимо,
# як `Exclude: firmware/extern` у RuboCop.
#
# Встановлення (standalone, поза conda env/lock): `pip install ruff`
# Запуск:  ruff check .            # лінт
#          ruff check . --fix      # + безпечні авто-фікси
target-version = "py310"   # найнижчий заявлений (tools/ml requires-python >=3.10); env = 3.12
line-length = 120          # науковий код із формулами/константами

extend-exclude = [
    "firmware/extern",
    "firmware/.toolchain",
]

# Допомагає isort правильно класифікувати наші пакети як first-party.
src = ["tools/ml/src", "tools/in_silico"]

[lint]
# Строгий, але прагматичний набір (дух omakase-RuboCop):
#   E/W pycodestyle · F pyflakes (справжні баги) · I isort · UP pyupgrade
#   B bugbear · C4 comprehensions · SIM simplify · NPY numpy · RUF ruff-specific
select = ["E", "W", "F", "I", "UP", "B", "C4", "SIM", "NPY", "RUF"]

ignore = [
    # «Ambiguous unicode» спрацьовує на українській кирилиці у рядках/
    # докстрінгах/коментарях — це наш house-style (як .c-коментарі), не помилка.
    "RUF001",
    "RUF002",
    "RUF003",
    # Довжину рядка не форсуємо — паритет з нашим RuboCop omakase (Layout/LineLength
    # disabled). Науковий код має навмисно довгі вирівняні print + markdown-рядки
    # таблиць, де перенос шкодить читабельності. line-length=120 лишається орієнтиром
    # для `ruff format` та як ціль читабельності.
    "E501",
]

[lint.per-file-ignores]
# __init__.py — re-export: «невикористані» імпорти навмисні.
"**/__init__.py" = ["F401"]
# Скрипти ставлять matplotlib backend / sys.path ПЕРЕД імпортами (свідомо).
"tools/in_silico/scripts/*.py" = ["E402"]

[lint.isort]
known-first-party = ["silken_ml", "lib"]
