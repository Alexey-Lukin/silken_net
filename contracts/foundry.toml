[profile.default]
src = "."
out = "out"
libs = ["node_modules"]
solc_version = "0.8.24"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/"
]
gas_reports = ["SilkenCarbonCoin", "SilkenForestCoin", "StateRootAnchor"]

# CI profile: faster builds, no optimizer (for Slither / quick checks)
[profile.ci]
optimizer = false
fuzz.runs = 256

# Production deployment: max optimisation for gas efficiency on-chain
[profile.production]
optimizer = true
optimizer_runs = 1000
via_ir = true
