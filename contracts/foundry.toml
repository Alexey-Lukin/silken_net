[profile.default]
src = "."
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.37"
evm_version = "cancun"
optimizer = true   # stays ON — disabling it makes OZ's P256.sol fail to compile (stack too deep)
optimizer_runs = 200
via_ir = false
# forge ≥ 1.8.0 runs each top-level call as its own tx by default (isolate). Kept OFF so
# `.gas-snapshot` and its 3 % tolerance measure what they were calibrated on: under isolate
# every call carries ~21k intrinsic gas, which dilutes the regression gate 2–3×. Switching
# is its own decision with a tolerance re-calibration (00_07 OPS.22), not a version bump.
isolate = false
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/"
]
gas_reports = ["SilkenCarbonCoin", "SilkenForestCoin", "StateRootAnchor", "SilkenGovernor", "SilkenTimelock", "ProtocolParameters"]

# Fuzz testing defaults
[fuzz]
runs = 512
# "SilkenNet" in ASCII hex, zero-padded to 32 bytes
seed = "0x53696c6b656e4e6574000000000000000000000000000000000000000000dead"

# Invariant testing
[invariant]
runs = 128
depth = 64

# Production deployment: max optimisation for gas efficiency on-chain
[profile.production]
optimizer = true
optimizer_runs = 1000
via_ir = true
