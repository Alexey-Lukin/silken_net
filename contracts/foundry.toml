[profile.default]
src = "."
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
# OZ 5.6 P256.sol has a complex assembly block that hits "stack too deep"
# when viaIR is disabled (which coverage mode does by default).
# coverage_via_ir enables --ir-minimum for coverage runs only.
coverage_via_ir = true
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/"
]
gas_reports = ["SilkenCarbonCoin", "SilkenForestCoin", "StateRootAnchor", "SilkenGovernor", "SilkenTimelock", "ProtocolParameters"]

# Fuzz testing defaults
[fuzz]
runs = 512
# "Gaia2.0" in ASCII hex, zero-padded to 32 bytes
seed = "0x47616961322e300000000000000000000000000000000000000000000000dead"

# Invariant testing
[invariant]
runs = 128
depth = 64

# CI profile: faster builds, reduced fuzz for speed
[profile.ci]
optimizer = false
fuzz.runs = 256

# Production deployment: max optimisation for gas efficiency on-chain
[profile.production]
optimizer = true
optimizer_runs = 1000
via_ir = true
