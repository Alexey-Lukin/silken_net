[profile.default]
src = "."
test = "test"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.28"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/"
]
gas_reports = ["SilkenCarbonCoin", "SilkenForestCoin", "StateRootAnchor", "SilkenGovernor", "SilkenTimelock", "ProtocolParameters"]

# Fuzz testing defaults
[fuzz]
runs = 512
seed = "0x47616961322e300000000000000000000000000000000000000000000000dead"

# Invariant testing
[invariant]
runs = 128
depth = 64

# CI profile: faster builds, reduced fuzz for speed
[profile.ci]
optimizer = false
fuzz.runs = 256

# Production deployment: max optimisation for gas efficiency on-chain
[profile.production]
optimizer = true
optimizer_runs = 1000
via_ir = true
