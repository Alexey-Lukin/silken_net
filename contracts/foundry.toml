[profile.default]
src = "."
test = "test"
script = "script"
out = "out"
libs = ["node_modules"]
solc_version = "0.8.35"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = false
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "forge-std/=node_modules/forge-std/src/"
]
gas_reports = ["SilkenCarbonCoin", "SilkenForestCoin", "StateRootAnchor", "SilkenGovernor", "SilkenTimelock", "ProtocolParameters"]

# Fuzz testing defaults
[fuzz]
runs = 512
# "Gaia2.0" in ASCII hex, zero-padded to 32 bytes
seed = "0x47616961322e300000000000000000000000000000000000000000000000dead"

# Invariant testing
[invariant]
runs = 128
depth = 64

# CI profile: reduced fuzz for speed. Optimizer stays ON — disabling it makes
# OZ's P256.sol fail to compile (stack too deep).
[profile.ci]
optimizer = true
optimizer_runs = 200
fuzz.runs = 256

# Production deployment: max optimisation for gas efficiency on-chain
[profile.production]
optimizer = true
optimizer_runs = 1000
via_ir = true
