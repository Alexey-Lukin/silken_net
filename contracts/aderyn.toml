# Aderyn (Cyfrin) — 2nd static-analysis pass alongside Slither.
# Foundry-native: reads foundry.toml for solc 0.8.35 / evm cancun / remappings.
# Scope mirrors slither.config.json (audit only deployable contracts, not deps/tests).
# Canon: docs/05_03 §Smart Contract Audit Roadmap.
version = 1

root = "."
src = "."

exclude = ["node_modules", "test", "lib"]

# Low-severity detectors that are by-design / false-positive for our OZ AccessControl +
# Governor + batch architecture — each reviewed and confirmed non-actionable (contracts are
# Slither-clean, Foundry-tested, Hacken-bound). Excluded so the GitHub Security tab surfaces
# only actionable findings; the high-severity detectors (the CI gate) stay active.
# (The two genuinely-fixable notes — the magic-256 literal and the nonReentrant modifier
# order — were FIXED in code, not excluded.) Rationale → docs/00_05 §2.7.
[detectors]
exclude = [
  "centralization-risk",      # fires on every onlyRole/governance fn — the DAO admin design IS "centralized" (SEC.1)
  "costly-loop",              # intentional gas-batch loops (batchMint / setParameters), bounded by MAX_BATCH_SIZE
  "require-revert-in-loop",   # per-item batch validation inside the bounded batch loops — intentional
  "large-numeric-literal",    # MAX_SUPPLY = 1_000_000_000 * 1e18 (underscored, named constant) — readability note
  "unchecked-return",         # _grantRole() return in constructors (always true on a fresh grant) — OZ pattern
  "local-variable-shadowing", # underscore ctor params passed to OZ base ctor (e.g. GovernorVotes(_token)) — OZ pattern
]
