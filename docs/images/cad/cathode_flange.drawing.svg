<text x='20' y='357' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>NOTES:</text>
<text x='20' y='373' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. Cathode catalytic = side/perimeter (O₂ under radome); pogo = top face (02_02 §1.2)</text>
<text x='20' y='387' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: Ti-6Al-4V (Grade 5)</text>
<text x='20' y='401' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: SLM/DMLS or EBM (flat flange — precision less critical, roughness = ECSA advantage, 01_02 1.7)</text>
<text x='20' y='415' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Post-process: selective Hard-Gold ENIG on central GND pad + outer pogo ring (02_02 1.2, Ti-Au galvanic-trap fix); build tip-down (01_02 1.6)</text>
<text x='20' y='429' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Coating: ZnO-Ta / HAp / RGD FORBIDDEN on the cathode catalytic side/perimeter active surface (01_02 3.6)</text>
<text x='20' y='443' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Central GND pad O4-5 (Hard Gold ENIG &gt;=0.76 um Au / 1.27 um Ni) — galvanic-trap fix (02_02 1.2)</text>
<text x='20' y='457' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. PEEK isolation ring &gt;=1.5 mm centre&lt;-&gt;outer (short-circuit guard)</text>
<text x='20' y='471' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Shank O9 + thickness 3 = HW.8 placeholders — this drawing forces the reconcile</text>
<text x='20' y='485' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Cathode catalytic = side/perimeter (Laccase/ZIF + PTFE-GDL); pogo = top face</text>
