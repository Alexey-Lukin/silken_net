<text x='20' y='357' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>NOTES:</text>
<text x='20' y='373' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. Cathode catalytic = side/perimeter (O₂ under radome); pogo = top face (02_02 §1.2)</text>
<text x='20' y='387' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: Ti-6Al-4V (Grade 5)</text>
<text x='20' y='401' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: SLM/DMLS or EBM. The 'precision less critical' allowance of 01_02 1.7 applies to the FLANGE DISC only (flat O25 face, roughness = ECSA</text>
<text x='20' y='415' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   advantage) — it does NOT extend to the bus channel, which is the part's primary datum and is machined after printing (see post-process). Reading it</text>
<text x='20' y='429' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   part-wide licenses an as-printed bore and contradicts note 5.</text>
<text x='20' y='443' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Surface: PER-SURFACE, not one finish for the whole part (01_02 1.3): catalytic side/perimeter = EAAE dual-scale micro Sa 0.5-5 um + nano Sv 50-500 nm</text>
<text x='20' y='457' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   (Step 4, Laccase/ZIF ECSA) - NO PEP and NO H2O2 passivation on that face (Steps 6-7); outer jacket = PEP smoothing to Ra 0.4 um max (Step 7) before</text>
<text x='20' y='471' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   ZnO-Ta PEO; pogo top face = MASKED during EAAE, then SELECTIVE Hard-Gold ENIG on the central GND pad + outer pogo ring only, PEEK isolation ring between</text>
<text x='20' y='485' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   them left bare (02_02 1.2). Sand-blasting is admissible on THIS part (Zone 3, line-of-sight geometry, Step 3), unlike the Zone-1 gyroid.</text>
<text x='20' y='499' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Post-process: selective Hard-Gold ENIG on central GND pad + outer pogo ring (02_02 1.2, Ti-Au galvanic-trap fix); build tip-down (01_02 1.6) | bus</text>
<text x='20' y='513' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   channel O1.3: MACHINE after printing to the tolerance block (primary datum, 0.05 concentricity/runout) - NOT as-printed; nominal dia unchanged; must</text>
<text x='20' y='527' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   accept the 0.15 mm structural liner (01_01 1.4)</text>
<text x='20' y='541' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Coating: Catalytic face (Laccase + ZIF-nanozyme + PTFE-GDL): ZnO-Ta, self-healing 8-HQ and biomimetic (Zn-HAp/chitosan) ALL FORBIDDEN - bare Ti only,</text>
<text x='20' y='555' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   any dielectric blocks DET. Outer jacket: ZnO-Ta + 8-HQ allowed. NOT on PEEK. (01_02 3.6)</text>
<text x='20' y='569' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. Lattice: NOT SPECIFIED IN CEM</text>
<text x='20' y='583' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Inspect: NOT SPECIFIED IN CEM</text>
<text x='20' y='597' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Central GND pad O4-5 (Hard Gold ENIG &gt;=0.76 um Au / 1.27 um Ni) — galvanic-trap fix (02_02 1.2)</text>
<text x='20' y='611' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>10. PEEK isolation ring &gt;=1.5 mm centre&lt;-&gt;outer (short-circuit guard)</text>
<text x='20' y='625' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>11. Shank O9 + thickness 3 = HW.8 placeholders — this drawing forces the reconcile</text>
<text x='20' y='639' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>12. Cathode catalytic = side/perimeter (Laccase/ZIF + PTFE-GDL); pogo = top face</text>
<text x='20' y='665' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>TOLERANCES / GD&amp;T:</text>
<text x='20' y='681' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Fit: H7/s6 (nominal class only)</text>
<text x='20' y='695' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>shank_dia: NOT SPECIFIED IN CEM / NOT SPECIFIED IN CEM mm</text>
<text x='20' y='709' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Datum A: bore axis</text>
<text x='20' y='723' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Datum B: flange face</text>
<text x='20' y='737' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Concentricity: ⌀0.05 (A)</text>
<text x='20' y='751' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Runout: 0.05 (A)</text>
