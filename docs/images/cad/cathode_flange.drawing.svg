<text x='20' y='357' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>NOTES:</text>
<text x='20' y='373' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. Cathode catalytic = side/perimeter (O₂ under radome); pogo = top face (02_02 §1.2)</text>
<text x='20' y='387' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: Ti-6Al-4V (Grade 5)</text>
<text x='20' y='401' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: SLM/DMLS or EBM. The 'precision less critical' allowance of 01_02 1.7 applies to the FLANGE DISC only (flat O25 face, roughness = ECSA</text>
<text x='20' y='415' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   advantage) — it does NOT extend to the bus channel, which is the part's primary datum and is machined after printing (see post-process). Reading it</text>
<text x='20' y='429' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   part-wide licenses an as-printed bore and contradicts note 5.</text>
<text x='20' y='443' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Surface: PER-SURFACE, not one finish for the whole part (01_02 1.3): catalytic side/perimeter = EAAE dual-scale micro Sa 0.5-5 um + nano Sv 50-500 nm</text>
<text x='20' y='457' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   (Step 4, Laccase/ZIF ECSA) - NO PEP and NO H2O2 passivation on that face (Steps 6-7); outer jacket = PEP smoothing to Ra 0.4 um max (Step 7) before</text>
<text x='20' y='471' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   ZnO-Ta PEO; pogo top face = MASKED during EAAE, then SELECTIVE Hard-Gold ENIG on the central GND pad + outer pogo ring only, PEEK isolation ring between</text>
<text x='20' y='485' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   them left bare (02_02 1.2). Sand-blasting is admissible on THIS part (Zone 3, line-of-sight geometry, Step 3), unlike the Zone-1 gyroid.</text>
<text x='20' y='499' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Post-process: selective Hard-Gold ENIG on central GND pad + outer pogo ring (02_02 1.2, Ti-Au galvanic-trap fix); build tip-down (01_02 1.6) | bus</text>
<text x='20' y='513' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   channel O1.35: MACHINE after printing to the tolerance block (primary datum, 0.05 concentricity/runout) - NOT as-printed. The nominal was OPENED 1.30 -&gt;</text>
<text x='20' y='527' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   1.35 by verdict (00_07 HW.34, 2026-09-11) so the rod+liner stack (1.0 + 2x0.15 = 1.30) enters with a real 50 um diametral clearance instead of the zero</text>
<text x='20' y='541' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   the arithmetic used to allow; the change rides this EXISTING machining operation, it does not add one. ATTENTION - the DIAMETRAL TOLERANCE BAND on this</text>
<text x='20' y='555' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   bore is NOT SPECIFIED anywhere in canon and is not derivable: 50 um may fall inside the tolerance of the extruded PEEK tube itself, whose supplier holds</text>
<text x='20' y='569' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   ID/OD and not the wall we froze. It is a question to the vendor (00_07 HW.34), so quote your achievable band rather than reading a default into the</text>
<text x='20' y='583' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   blank</text>
<text x='20' y='597' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Coating: Catalytic face (Laccase + ZIF-nanozyme + PTFE-GDL): ZnO-Ta, self-healing 8-HQ and biomimetic (Zn-HAp/chitosan) ALL FORBIDDEN - bare Ti only,</text>
<text x='20' y='611' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   any dielectric blocks DET. Outer jacket: ZnO-Ta + 8-HQ allowed. NOT on PEEK. (01_02 3.6)</text>
<text x='20' y='625' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. Lattice: Not applicable - solid flange disc with a central bus channel, no lattice. (The lattice lives in the Zone-1 anode this part mates to,</text>
<text x='20' y='639' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   cem/anchor_zone1.*.json)</text>
<text x='20' y='653' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Inspect: SEM of the catalytic face BEFORE shipment (01_02 1.5, factory obligation): x5,000 for micro-roughness (report the AREAL Sa of the 01_02 1.2</text>
<text x='20' y='667' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   acceptance row, not a profile Ra) and x50,000 for nano-pores Sv - if nano-pores are not visible at x50,000 the etch is insufficient and EAAE (01_02 1.3</text>
<text x='20' y='681' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   Step 4) is repeated; the x500 frame of 01_02 1.5 is for gyroid macro-pores and has no subject on this part. Bus channel: MACHINED after printing to the</text>
<text x='20' y='695' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   tolerance block (primary datum, 0.05 concentricity/runout) and it must accept the 0.15 mm structural liner (01_01 1.4) - an as-printed bore fails this</text>
<text x='20' y='709' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   part. Its own diametral band is listed as bore_dia with BOTH limits NOT SPECIFIED: that blank is the open vendor question of 00_07 HW.34, not a licence</text>
<text x='20' y='723' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   to accept any bore that passes concentricity. PEP is confined to the outer jacket: measure Ra &lt;= 0.4 um THERE and nowhere else, because PEP on the</text>
<text x='20' y='737' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   catalytic face would cut away exactly the ECSA Step 4 just created (01_02 1.3 Step 7). Selective Hard-Gold ENIG on the central GND pad and outer pogo</text>
<text x='20' y='751' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   ring only, PEEK isolation ring left bare (02_02 1.2). ATTENTION: the batch-level SEM ACCEPTANCE CRITERION - what morphology passes, as opposed to which</text>
<text x='20' y='765' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   frames to shoot - does not exist in canon yet and is an open leg (00_07 HW.1); do not read its absence as a pass</text>
<text x='20' y='779' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Central GND pad O4-5 (Hard Gold ENIG &gt;=0.76 um Au / 1.27 um Ni) — galvanic-trap fix (02_02 1.2)</text>
<text x='20' y='793' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>10. PEEK isolation ring &gt;=1.5 mm centre&lt;-&gt;outer (short-circuit guard)</text>
<text x='20' y='807' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>11. Shank O9 + thickness 3 = HW.8 placeholders — this drawing forces the reconcile</text>
<text x='20' y='821' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>12. Cathode catalytic = side/perimeter (Laccase/ZIF + PTFE-GDL); pogo = top face</text>
<text x='20' y='847' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>TOLERANCES / GD&amp;T:</text>
<text x='20' y='863' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Fit: H7/s6 (nominal class only)</text>
<text x='20' y='877' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>shank_dia: NOT SPECIFIED IN CEM / NOT SPECIFIED IN CEM mm</text>
<text x='20' y='891' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>bore_dia: NOT SPECIFIED IN CEM / NOT SPECIFIED IN CEM mm</text>
<text x='20' y='905' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Datum A: bore axis</text>
<text x='20' y='919' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Datum B: flange face</text>
<text x='20' y='933' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Concentricity: ⌀0.05 (A)</text>
<text x='20' y='947' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Runout: 0.05 (A)</text>
