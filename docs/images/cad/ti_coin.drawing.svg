<text x='20' y='300' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>NOTES:</text>
<text x='20' y='316' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. Active electrode area ≈ 2.01 cm² (1 face; j = I/A projected, 01_03 §3.5)</text>
<text x='20' y='330' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: Ti-6Al-4V (Grade 5)</text>
<text x='20' y='344' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: SLM/DMLS (flat coupon — minutes/pennies to print)</text>
<text x='20' y='358' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Surface: EAAE dual-scale on the active face: micro Sa 0.5-5 um + nano Sv 50-500 nm (01_02 1.2) — raises ECSA for enzyme immobilisation</text>
<text x='20' y='372' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Inspect: CV / EIS biochem, Stage-2 (01_01 6); j on PROJECTED area (01_02 1.4); ICP-MS V+Al release (toxic baseline, 01_02 2.5)</text>
<text x='20' y='386' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Active electrode area = 1 face ~= 2.01 cm2 (O16, 01_03 3.5)</text>
<text x='20' y='400' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. Alloy bake-off CONTROL: Ti-6Al-4V baseline; bare V-release ~1.12 ug/cm2/yr = 56x over target (01_02 2.5)</text>
<text x='20' y='414' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Disc not square: RDE-ready, uniform radial j, no corner edge-effects</text>
<text x='20' y='428' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Optional O-ring / lacquer window fixes exactly 2 cm2 inside the coupon</text>
<text x='20' y='452' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>TOLERANCES / GD&amp;T:</text>
<text x='20' y='468' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>disc_dia: 0.1/-0.1 mm</text>
