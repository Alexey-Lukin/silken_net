<text x='20' y='300' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>NOTES:</text>
<text x='20' y='316' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. Active electrode area ≈ 2.01 cm² (1 face; j = I/A projected, 01_03 §3.5)</text>
<text x='20' y='330' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: Ti-6Al-4V Grade 5 per ASTM F2924 (Additive Manufacturing, powder bed fusion) - the ONE alloy of this bake-off that has an AM</text>
<text x='20' y='344' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   material spec. NOT F136: that is the wrought ELI (Grade 23) spec and this coupon is the Grade-5 print reference</text>
<text x='20' y='358' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: SLM/DMLS + HIP + dehydrogenation bake (01_02 1.3); flat coupon — minutes/pennies to print</text>
<text x='20' y='372' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Surface: EAAE dual-scale on the active face: micro Sa 0.5-5 um + nano Sv 50-500 nm (01_02 1.2) — raises ECSA for enzyme immobilisation</text>
<text x='20' y='386' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Post-process: dehydrogenation bake 250C/10-3 mbar/3h, within 2h of rinse (01_02 1.3 Step 5b) - MANDATORY after EAAE</text>
<text x='20' y='400' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Coating: Active face (EBFC Gen 2.0 stack): ZnO-Ta, self-healing 8-HQ and biomimetic (Zn-HAp/chitosan) ALL FORBIDDEN - bare metal only,</text>
<text x='20' y='414' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   any dielectric blocks DET (01_02 3.6; RFQ 4.B)</text>
<text x='20' y='428' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. Lattice: Not applicable - flat disc coupon, no lattice. (The lattice lives in the Zone-1 anode this coupon stands in for,</text>
<text x='20' y='442' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   cem/anchor_zone1.*.json)</text>
<text x='20' y='456' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Inspect: SEM of the active face BEFORE shipment (01_02 1.5, factory obligation): x5,000 for micro-roughness (report the AREAL Sa of the</text>
<text x='20' y='470' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   01_02 1.2 acceptance row, not a profile Ra) and x50,000 for nano-pores Sv - if nano-pores are not visible at x50,000 the etch is</text>
<text x='20' y='484' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   insufficient and EAAE (01_02 1.3 Step 4) is repeated; 01_02 1.5 also names x500 for gyroid macro-pores, which a flat coupon does not</text>
<text x='20' y='498' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   have, so that frame does not apply here. CV / EIS biochem, Stage-2 (01_01 6); j on PROJECTED area (01_02 1.4); ICP-MS V+Al release (toxic</text>
<text x='20' y='512' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   baseline, 01_02 2.5); LECO RH404 H&lt;100 ppm per batch or rejected (01_02 1.3a-C)</text>
<text x='20' y='526' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Active electrode area = 1 face ~= 2.01 cm2 (O16, 01_03 3.5)</text>
<text x='20' y='540' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>10. Alloy bake-off CONTROL: Ti-6Al-4V baseline; bare V-release ~1.12 ug/cm2/yr = 56x over target (01_02 2.5)</text>
<text x='20' y='554' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>11. Tree-first down-select: CV/EIS + ion-release in synthetic xylem sap, not PBS (01_04 4.2) - this is the CONTROL, so running it in a</text>
<text x='20' y='568' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   different electrolyte than the five alloy SKUs voids the whole comparison</text>
<text x='20' y='582' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>12. Disc not square: RDE-ready, uniform radial j, no corner edge-effects</text>
<text x='20' y='596' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>13. Optional O-ring / lacquer window fixes exactly 2 cm2 inside the coupon</text>
<text x='20' y='622' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>TOLERANCES / GD&amp;T:</text>
<text x='20' y='638' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>disc_dia: +0.1 / --0.1 mm</text>
