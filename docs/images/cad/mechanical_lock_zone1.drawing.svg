<text x='20' y='265' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>NOTES:</text>
<text x='20' y='281' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. DIN-471 groove 1.1×0.25 mm at z=15 (§4.3 B); barb base≈0.59 mm (derived h·(cotα+cotβ), §4.3 A)</text>
<text x='20' y='295' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: V-free Ti alloy - same body as the Zone-1 gyroid anode (01_02 2.5, founder 2026-06-21): alloy NOT SELECTED until the Stage-2</text>
<text x='20' y='309' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   coin bake-off (00_07 HW.24); Ti-6Al-4V is the price baseline only, NOT the material of this part</text>
<text x='20' y='323' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: SLM/DMLS, same build cycle as the Zone-1 gyroid anode (01_01 §3 step 1); build tip-down, leading-ramp-down (01_02 §1.6) — barb</text>
<text x='20' y='337' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   downface ≈60° from horizontal self-supports (Ti64 LPBF, Sa≈15 µm)</text>
<text x='20' y='351' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Surface: As-printed, NOT etched — and that follows from the mandatory production ORDER, not from a finish spec: 01_02 1.3 fixes print+HIP</text>
<text x='20' y='365' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   -&gt; hot press-fit assembly Ti/PEEK/Ti -&gt; EAAE -&gt; dehydrogenation bake -&gt; functionalisation, so this surface is already inside the PEEK</text>
<text x='20' y='379' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   joint when the anchor is etched. The dual-scale Sa/Sv requirement of 01_02 1.2 is for the gyroid wall and does NOT apply here. Barb</text>
<text x='20' y='393' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   downface is self-supporting at about 60 deg from horizontal, Sa about 15 um as-printed - that figure is 01_01 4.3, which cites 01_02 1.6</text>
<text x='20' y='407' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   only for the tip-down orientation that makes it hold. (The consequence is ours; the ORDER is canon.) ATTENTION - this is a CONSEQUENCE,</text>
<text x='20' y='421' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   not an instruction, and canon protects every other un-etched surface by an EXPLICIT MASKING line instead (01_02 1.3 Step 7 masks two</text>
<text x='20' y='435' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   faces; 02_02 1.2 masks the whole anchor bar the bus terminus), while 01_02 1.3 Step 4 claims the etch reaches the WHOLE surface</text>
<text x='20' y='449' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   uniformly. So if this part is etched BEFORE assembly, or if the joint is not a reliable mask, a masking line is needed and none exists</text>
<text x='20' y='463' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   yet (00_07 HW.1).</text>
<text x='20' y='477' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Post-process: HIP (01_02 §1.7); DIN-471 retaining-ring groove — CNC post-DMLS (§4.3 B, +15 min/anchor)</text>
<text x='20' y='491' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Coating: NOT SPECIFIED, and deliberately so: the 01_02 3.6 map has a row for the Zone-1 gyroid wall and a row for the callus-contact</text>
<text x='20' y='505' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   periphery, and this press-fit shank is on NEITHER. Apply nothing without a verdict. The reason is not DET here but FIT: any coating of</text>
<text x='20' y='519' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   thickness t adds 2t of DIAMETRAL interference; 01_01 4.2 gives the class and defers the numbers, and the band itself is the Lame-computed</text>
<text x='20' y='533' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   5-34 um in tools/in_silico/lib/constants.py</text>
<text x='20' y='547' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. Lattice: Not applicable - solid shank, no lattice. (Printed as one body with the Zone-1 gyroid anode, whose lattice spec lives in</text>
<text x='20' y='561' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   cem/anchor_zone1.*.json)</text>
<text x='20' y='575' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Inspect: Barb tooth geometry MEASURED against 01_01 4.3: height h and the DERIVED base (a triangle has two free parameters, so alpha/beta</text>
<text x='20' y='589' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   + h are specified and base is computed, acceptance 0.40-0.60 mm). DIN-471 groove to the real standard dimensions for this shaft diameter,</text>
<text x='20' y='603' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   CNC after printing. Pull-out retention 3-5x over friction and the PEEK 150 C click-fit are FEA (00_07 HW.3.IS) + bench - NOT asserted by</text>
<text x='20' y='617' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   this generator and NOT a drawing acceptance line</text>
<text x='20' y='631' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Self-contained demo shank (Zone-1 Ø11 real, HW.33) — not yet integrated into the gyroid rod (separate session, 00_07 HW.26)</text>
<text x='20' y='645' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>10. Barb pull-out (3–5× vs friction) and PEEK 150°C click-fit retention are FEA + bench (HW.3.IS), NOT asserted by this generator</text>
