<text x='20' y='281' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. DIN-471 groove 1.1×0.25 mm at z=15 (§4.3 B); barb base≈0.59 mm (derived h·(cotα+cotβ), §4.3 A)</text>
<text x='20' y='295' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: Ti-6Al-4V (Grade 5)</text>
<text x='20' y='309' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: SLM/DMLS, same build cycle as the Zone-1 gyroid anode (01_01 §3 step 1); build tip-down, leading-ramp-down (01_02 §1.6) — barb</text>
<text x='20' y='323' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   downface ≈60° from horizontal self-supports (Ti64 LPBF, Sa≈15 µm)</text>
<text x='20' y='337' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Surface: NOT SPECIFIED IN CEM</text>
<text x='20' y='351' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Post-process: HIP (01_02 §1.7); DIN-471 retaining-ring groove — CNC post-DMLS (§4.3 B, +15 min/anchor)</text>
<text x='20' y='365' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Coating: NOT SPECIFIED IN CEM</text>
<text x='20' y='379' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. Lattice: NOT SPECIFIED IN CEM</text>
<text x='20' y='393' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Inspect: NOT SPECIFIED IN CEM</text>
<text x='20' y='407' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Self-contained demo shank (Zone-1 Ø11 real, HW.33) — not yet integrated into the gyroid rod (separate session, 00_07 HW.26)</text>
<text x='20' y='421' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>10. Barb pull-out (3–5× vs friction) and PEEK 150°C click-fit retention are FEA + bench (HW.3.IS), NOT asserted by this generator</text>
