<text x='630' y='153' font-family='monospace' font-size='10' text-anchor='start' fill='#1166cc' font-weight='normal'>Ø15</text>
<text x='20' y='277' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>NOTES:</text>
<text x='20' y='293' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. Wall 2 mm ⇒ OD Ø15 (derived: bore + 2×wall). That OD is the WOUND diameter in the tree, not a cosmetic dim — growing it raises the DBH</text>
<text x='20' y='307' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   threshold at which a tree may be instrumented (01_01 §1: wound &lt;25 mm ⇒ DBH ≥38 cm).</text>
<text x='20' y='321' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: PEEK 450G (Victrex or equiv.)</text>
<text x='20' y='335' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: CNC from rod; anneal 200-250 C before final micromachining (else internal stress drifts the um tolerances)</text>
<text x='20' y='349' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Surface: smooth round bore (hex anti-rotation 4.3 C, &lt;=0.05 mm, is bench-gated -&gt; deferred)</text>
<text x='20' y='363' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Post-process: None after final micromachining. The one thermal step is the 200-250 C anneal, and it belongs BEFORE that cut, not after -</text>
<text x='20' y='377' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   see process and inspection: reversing the order is the failure, not omitting a step</text>
<text x='20' y='391' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Coating: Nothing is applied to this part - 01_02 3.6 excludes ZnO-Ta, self-healing 8-HQ and biomimetic layers from PEEK surfaces</text>
<text x='20' y='405' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   outright, and the Zone-2 row of that map is not blank - it carries three explicit refusals. The bore is a press-fit surface specified in</text>
<text x='20' y='419' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   micrometres (01_01 4.2), so a coating of thickness t would also eat 2t of the interference band</text>
<text x='20' y='433' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. Lattice: Not applicable - solid PEEK tube</text>
<text x='20' y='447' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Inspect: Bore diameter and concentricity to the tolerance block on this manifest (bore axis is the primary datum). Verify the 200-250 C</text>
<text x='20' y='461' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   anneal was done BEFORE final micromachining - the order is the requirement, because internal stress released afterwards drifts exactly</text>
<text x='20' y='475' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   the micrometre-level fit this part exists to hold. OD is the WOUND diameter in the tree (01_01 1: wound 15 &lt; 25 mm keeps CODIT tolerable,</text>
<text x='20' y='489' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   hence DBH &gt;= 38 cm), i.e. a tree-facing dimension, not a cosmetic one: growing it raises the DBH threshold at which a tree may be</text>
<text x='20' y='503' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   instrumented</text>
<text x='20' y='517' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Press-fit Lame-computed (HW.3.IS script 50, frozen O11/2mm, E_PEEK 4.0 GPa): contact P_c 0.49-3.32 MPa -&gt; 0.32-2.16 at 20yr; at MIN H7/s6</text>
<text x='20' y='531' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   fit the relaxed P_c &lt;= sap -&gt; the O-ring is the essential seal (PEEK backup marginal)</text>
<text x='20' y='545' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>10. OD O15 = wound in tree (CODIT &lt;25 -&gt; DBH &gt;=38); wall 2.0 = robust default, NOT CTE-limited (unified Lame 4.2: combined SF 5.6x,</text>
<text x='20' y='559' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   thermal-only 14.6x)</text>
<text x='20' y='573' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>11. Mechanical retention (barbs + DIN-471) is on the Ti ends, not this PEEK bore (4.3)</text>
<text x='20' y='599' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>TOLERANCES / GD&amp;T:</text>
<text x='20' y='615' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Fit: H7/s6 (ISO 286, O11): 5-34 um diametral interference</text>
<text x='20' y='629' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Interference: 5–34 µm diametral</text>
<text x='20' y='643' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Clearance: ≤0.05 mm</text>
<text x='20' y='657' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>bore: NOT SPECIFIED IN CEM / NOT SPECIFIED IN CEM mm</text>
<text x='20' y='671' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Datum A: bore axis</text>
<text x='20' y='685' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>Concentricity: ⌀0.05 (A)</text>
