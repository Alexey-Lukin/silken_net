<text x='394' y='153' font-family='monospace' font-size='10' text-anchor='start' fill='#1166cc' font-weight='normal'>Ø9</text>
<text x='20' y='259' font-family='monospace' font-size='10' text-anchor='start' fill='#111' font-weight='bold'>NOTES:</text>
<text x='20' y='275' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>1. DIN-471 groove 1×0.3 mm at z=12 (§4.3 B); barb base≈0.59 mm (derived h·(cotα+cotβ), §4.3 A)</text>
<text x='20' y='289' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>2. Material: Ti-6Al-4V Grade 5. ATTENTION: the V-free direction of 01_02 2.5 was chosen for ZONE 1; whether its perimeter also covers this</text>
<text x='20' y='303' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   Zone-3 part is an OPEN verdict (00_07 HW.3), so 4V here is the standing baseline, not a settled choice. The material SPECIFICATION</text>
<text x='20' y='317' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   follows the process route below and is therefore not fixed here: printed -&gt; ASTM F2924 (AM powder bed fusion); machined from wrought bar</text>
<text x='20' y='331' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   -&gt; a wrought Grade-5 spec, to be NAMED when the route is fixed rather than guessed now (00_06 0 Validation Gate)</text>
<text x='20' y='345' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>3. Process: SLM/DMLS or CNC (01_01 §3 step 3 — flat/simple shank, roughness less critical here than the catalytic face); build tip-down,</text>
<text x='20' y='359' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   leading-ramp-down (01_02 §1.6) if SLM</text>
<text x='20' y='373' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>4. Surface: As-printed or as-machined, NOT etched - the mandatory production ORDER of 01_02 1.3 (print+HIP -&gt; hot press-fit assembly</text>
<text x='20' y='387' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   Ti/PEEK/Ti -&gt; EAAE -&gt; dehydrogenation bake) puts this surface inside the PEEK joint before the anchor is etched. The catalytic-face</text>
<text x='20' y='401' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   finish of the flange (01_02 1.2, EAAE dual-scale) belongs to cem/cathode_flange.json and does NOT extend to this shank. (The consequence</text>
<text x='20' y='415' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   is ours; the ORDER is canon.) ATTENTION - this is a CONSEQUENCE, not an instruction, and canon protects every other un-etched surface by</text>
<text x='20' y='429' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   an EXPLICIT MASKING line instead (01_02 1.3 Step 7 masks two faces; 02_02 1.2 masks the whole anchor bar the bus terminus), while 01_02</text>
<text x='20' y='443' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   1.3 Step 4 claims the etch reaches the WHOLE surface uniformly. So if this part is etched BEFORE assembly, or if the joint is not a</text>
<text x='20' y='457' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   reliable mask, a masking line is needed and none exists yet (00_07 HW.1).</text>
<text x='20' y='471' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>5. Post-process: DIN-471 retaining-ring groove — CNC post-DMLS (§4.3 B, +15 min/anchor)</text>
<text x='20' y='485' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>6. Coating: NOT SPECIFIED, and deliberately so: the 01_02 3.6 map covers the flange catalytic face, the outer jacket and the pogo pad - this</text>
<text x='20' y='499' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   press-fit shank is on none of those rows. Apply nothing without a verdict; the constraint here is FIT, not DET (any coating of thickness</text>
<text x='20' y='513' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   t adds 2t of DIAMETRAL interference to a band specified in micrometres - 01_01 4.2 gives the nominal CLASS (H7/s6); the band is 5-34 um</text>
<text x='20' y='527' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   diametral from tools/in_silico/lib/constants.py. ATTENTION on its PROVENANCE, corrected 2026-09-11 (00_07 HW.3): that is a plain ISO 286</text>
<text x='20' y='541' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   table read (H7 0/+18 + s6 +23/+34 on O11), NOT a Lame result - Lame CONSUMES the band to get a contact pressure. 01_01 4.2 requires the</text>
<text x='20' y='555' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   drawing's micrometres to come from the Lame interference window and REJECTS a blind ISO 286 lookup, so calling the band Lame-computed</text>
<text x='20' y='569' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   dresses the rejected source in the required source's name. Re-deriving it is an open engineering verdict). The selective Hard-Gold ENIG</text>
<text x='20' y='583' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   of 02_02 1.2 belongs to the flange pogo face, NOT to this part</text>
<text x='20' y='597' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>7. Lattice: Not applicable - solid shank with a central bus channel, no lattice</text>
<text x='20' y='611' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>8. Inspect: Barb tooth geometry MEASURED against 01_01 4.3 (alpha/beta + h specified, base DERIVED, acceptance 0.40-0.60 mm); shallow alpha</text>
<text x='20' y='625' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   ramp toward the shank tip (the end that enters the PEEK first), steep beta face toward the flange - the two ends look opposite only in</text>
<text x='20' y='639' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   the assembled view. DIN-471 groove to the real standard dimensions for this shaft diameter, CNC after printing. Bus channel diameter must</text>
<text x='20' y='653' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   accept the structural liner (01_01 1.4). ATTENTION: shank diameter is an HW.8 PLACEHOLDER, not canon - do not treat it as a frozen</text>
<text x='20' y='667' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   acceptance dimension. Pull-out retention and the PEEK 150 C click-fit are FEA + bench (00_07 HW.3.IS), NOT drawing acceptance lines</text>
<text x='20' y='681' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>9. Self-contained demo of the Zone-3 lock (Ø9 = HW.8 placeholder; shallow ramp toward the shank tip, §4.3 A). The cathode flange part</text>
<text x='20' y='695' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   already carries this shank: cem/cathode_flange.json holds its own copy of these shank fields, and the same generator builds the flange's</text>
<text x='20' y='709' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>   shank from them</text>
<text x='20' y='723' font-family='monospace' font-size='9' text-anchor='start' fill='#333' font-weight='normal'>10. Barb pull-out (3–5× vs friction) and PEEK 150°C click-fit retention are FEA + bench (HW.3.IS), NOT asserted by this generator</text>
