<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Silken Net // Core Fault</title>
    <link rel="icon" href="/icon.png" type="image/png">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <!--
      Статична сторінка 500. Її віддає сам Rails — `ActionDispatch::PublicExceptions` для збою,
      що оминув усі `rescue_from` (зовні CSP-middleware, тож інлайн-скрипт живий), — тут немає ні asset-пайплайна,
      ні I18n, ні layout'у: кольори й тексти стоять ЛІТЕРАЛАМИ. Доми значень — `app/assets/tailwind/application.css`
      і `config/locales/errors/*.yml`; свідок рівності — `spec/quality/public_error_pages_spec.rb`.
      Жива сестра цієї сторінки — `Errors::Page`.
    -->
    <style>
      :root {
        color-scheme: light dark;
        --gaia-surface-base: #fafafa;
        --gaia-text-strong: #0f172a;
        --gaia-text-muted: #52525b;
        --gaia-primary: #10b981;
        --gaia-primary-strong: #047857;
        --gaia-primary-soft: #d1fae5;
        --status-danger-accent: #dc2626;
      }

      @media screen and (prefers-color-scheme: dark) {
        :root {
          --gaia-surface-base: #050607;
          --gaia-text-strong: #e6fff4;
          --gaia-text-muted: #6ee7b7;
          --gaia-primary: #10b981;
          --gaia-primary-strong: #10b981;
          --gaia-primary-soft: rgba(16, 185, 129, 0.12);
          --status-danger-accent: #ef4444;
        }
      }

      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 1rem;
        position: relative;
        overflow-x: hidden;
        background: var(--gaia-surface-base);
        color: var(--gaia-text-strong);
        font-family: "JetBrains Mono", "Fira Code", "SF Mono", "Cascadia Code", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        -webkit-font-smoothing: antialiased;
        -webkit-text-size-adjust: 100%;
      }

      /* Точкова сітка з `Sessions::New` / `Errors::Page` — декор, не сигнал. */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        opacity: 0.1;
        pointer-events: none;
        background-image: radial-gradient(var(--gaia-primary) 1px, transparent 1px);
        background-size: 20px 20px;
      }

      main {
        position: relative;
        width: 100%;
        max-width: 28rem;
        text-align: center;
      }

      /* Ромб = СИГНАЛ ваги помилки (WCAG 1.4.11, 3:1), тому насичений `-accent`, не пастельний фон. */
      .glyph {
        display: inline-block;
        position: relative;
        width: 3rem;
        height: 3rem;
        border: 1px solid var(--status-danger-accent);
        transform: rotate(45deg);
      }

      .glyph::after {
        content: "";
        position: absolute;
        inset: 0.25rem;
        background: var(--status-danger-accent);
        animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
      }

      @keyframes pulse {
        50% { opacity: 0.5; }
      }

      @media (prefers-reduced-motion: reduce) {
        .glyph::after { animation: none; }
      }

      /* `padding-left` = трекінг: розрядка додає простір ПІСЛЯ останньої літери й зсуває центр. */
      h1 {
        margin-top: 1.75rem;
        padding-left: 0.3em;
        font-size: clamp(1.25rem, 7vw, 1.875rem);
        line-height: 1.2;
        font-weight: 200;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        overflow-wrap: anywhere;
      }

      .code {
        margin-top: 0.5rem;
        padding-left: 0.5em;
        font-size: 0.625rem;
        letter-spacing: 0.5em;
        text-transform: uppercase;
        color: var(--gaia-text-muted);
      }

      .message {
        margin-top: 1.5rem;
        font-size: 0.6875rem;
        line-height: 1.625;
        color: var(--gaia-text-muted);
      }

      .action {
        display: inline-flex;
        align-items: center;
        min-height: 2.75rem;
        margin-top: 2.5rem;
        padding: 0 1.5rem 0 calc(1.5rem + 0.3em);
        border: 1px solid var(--gaia-primary-strong);
        color: var(--gaia-primary-strong);
        font-size: 0.625rem;
        font-weight: 700;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        text-decoration: none;
      }

      .action:hover {
        background: var(--gaia-primary-soft);
      }

      .action:focus-visible {
        outline: 2px solid var(--gaia-primary-strong);
        outline-offset: 2px;
      }
    </style>
  </head>

  <body>
    <main>
      <div class="glyph" aria-hidden="true"></div>
      <h1 data-i18n="heading">Core Fault</h1>
      <p class="code" data-i18n="code">Error 500</p>
      <p class="message" data-i18n="message">Core fault in the Ocean. Notify the Architect.</p>
      <a class="action" href="/" data-i18n="action">Return to the Citadel</a>
    </main>

    <script type="application/json" id="translations">
      {
        "uk": {
          "heading": "Збій ядра",
          "code": "Помилка 500",
          "message": "Збій у ядрі Океану. Повідомте Архітектора.",
          "action": "Повернутися до Цитаделі"
        },
        "lv": {
          "heading": "Kodola kļūme",
          "code": "Kļūda 500",
          "message": "Kodola kļūme Okeānā. Paziņojiet Arhitektam.",
          "action": "Atgriezties Citadelē"
        },
        "lt": {
          "heading": "Branduolio triktis",
          "code": "Klaida 500",
          "message": "Branduolio gedimas Vandenyne. Pranešte Architektui.",
          "action": "Grįžti į Citadelę"
        }
      }
    </script>
    <script>
      // Мова: перший збіг `navigator.languages` із локалями застосунку, інакше лишається
      // розмітка мовою `lang` (= `default_locale`). Серверний `set_locale` сюди не доходить,
      // а cookie `locale` — httponly. ES5 свідомо: сторінку 406 відкриває саме старий браузер.
      (function () {
        var fallback = document.documentElement.lang;
        var translations = JSON.parse(document.getElementById("translations").textContent);
        var preferred = navigator.languages || [navigator.language || ""];
        for (var i = 0; i < preferred.length; i++) {
          var locale = String(preferred[i]).toLowerCase().split("-")[0];
          if (locale === fallback) return;
          var strings = translations[locale];
          if (!strings) continue;
          var nodes = document.querySelectorAll("[data-i18n]");
          for (var j = 0; j < nodes.length; j++) {
            nodes[j].textContent = strings[nodes[j].getAttribute("data-i18n")];
          }
          document.documentElement.lang = locale;
          document.title = "Silken Net // " + strings.heading;
          return;
        }
      })();
    </script>
  </body>
</html>
